  #side .box b { display: block; margin-bottom: 4px; font-size: 13px; }

  #view { position: fixed; left: 290px; top: 60px; right: 0; bottom: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  #board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  /* While the board moves it stays one composited layer (no re-raster per
     frame); once it settles the class goes and the text is sharp again. */
  #board.moving { will-change: transform; }
  .hero { position: absolute; white-space: nowrap; }
  .hero .t { font-size: 60px; font-weight: 800; letter-spacing: -.02em; }
  .hero .s { font-size: 21px; color: var(--muted); margin-top: 6px; }
  .tiles { position: absolute; display: flex; gap: 18px; }

  .tile .v { font-size: 34px; font-weight: 750; margin-top: 2px; }

  .tile .r { font-size: 15px; margin-top: 6px; }

  .tile .m { font-size: 13px; color: var(--muted); margin-top: 6px; white-space: normal; max-width: 420px; }
  .sec-bg { position: absolute; border-radius: 30px; background: rgba(255,255,255,.55); border: 1px solid rgba(0,0,0,.05); }
  .sec-h { position: absolute; }
  .sec-h .t { font-size: 34px; font-weight: 780; letter-spacing: -.01em; white-space: nowrap; }
  .sec-h .t .c { font-size: 17px; font-weight: 500; color: var(--muted); margin-left: 12px; }
  .sec-h .note { font-size: 16px; color: var(--muted); margin-top: 6px; max-width: 1500px; height: 44px; overflow: hidden; }
  .sec-h .bar { display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 10px; vertical-align: 4px; }
  .row-l { position: absolute; width: 230px; }
  .row-l .t { font-size: 18px; font-weight: 720; line-height: 1.2; }
  .row-l .c { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .row-l .c .f { color: var(--fail); font-weight: 650; } .row-l .c .w { color: var(--note); font-weight: 650; } .row-l .c .p { color: var(--pass); }

const CW = 300, GAP = 26, LABEL_W = 250, CAP = 2.8, CAT_CAP = 3.1, TXT_H = 236, CAP_H = 58, PER_LINE = 10;
const SIDE = { parent: 'Родитель', child: 'Ребёнок' };
const COLOR = { parent: 'var(--parent)', child: 'var(--child)', security: 'var(--sec)', catalog: 'var(--cat)', charts: 'var(--cat)' };
const VERDICT = { pass: ['pass', '✅ работает'], note: ['note', '⚠️ на заметку'], fail: ['fail', '❌ ошибка'] };
const LOCALE = { ru: 'русский', en: 'английский', kk: 'казахский', uz: 'узбекский', az: 'азербайджанский', ar: 'арабский' };
const board = document.getElementById('board'), view = document.getElementById('view');
document.documentElement.style.setProperty('--txt-h', TXT_H + 'px');
document.documentElement.style.setProperty('--cap-h', CAP_H + 'px');
let z = 0.5, tx = 30, ty = 30;
const pos = {}, rowsOf = {}, allCards = [];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const trim = (s, n) => { s = String(s ?? '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
function el(tag, cls, html, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; (parent || board).appendChild(e); return e; }
function count(cards) { const t = { pass: 0, note: 0, fail: 0 }; cards.forEach(c => { if (c.verdict) t[c.verdict]++; }); return t; }
function countLine(t) {
  return `<span class="p">✅ ${t.pass}</span> · <span class="w">⚠️ ${t.note}</span> · <span class="f">❌ ${t.fail}</span>`;
}

function summary() {
  const s = document.getElementById('sums');
  for (const side of ['parent', 'child']) {
    const m = META[side]; if (!m.count) continue;
    s.innerHTML += `<span class="sum" title="${esc(m.run)}"><b>${SIDE[side]}</b> ${m.count} · ${countLine(m.totals)} · ${esc(m.version.replace(/^.* (v.*)$/, '$1'))}</span>`;
  }
}

function didLine(card) {
  const parts = card.steps.map(st => {
    const cards = st.cards && st.cards.length ? ' → ' + st.cards.join('; ') : (st.text.startsWith('Сервер') ? '' : ' → без карточек');
    return (st.text ? '«' + trim(st.text, 110) + '»' : '') + cards;
  });
  return parts.join(' ⏎ ');
}

function caseCard(card, x, y) {
  const ratio = card.h && card.w ? card.h / card.w : 2.17;
  const shown = Math.min(ratio, CAP), ih = Math.round(CW * shown);
  const e = el('div', `case v-${card.verdict}`);
  e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.width = CW + 'px'; e.style.height = (ih + TXT_H) + 'px';
  const [vc, vl] = VERDICT[card.verdict] || VERDICT.note;
  const said = card.steps.map(s => '«' + trim(s.said, 90) + '»').join(' → ');
  const warn = card.steps.flatMap(s => s.warn || []);
  const tap = card.tap ? (card.tap.ok ? 'сработало — ' : 'не так, как ждали — ') + trim(card.tap.detail || card.tap.what, 160) : 'не нажимали';
  e.innerHTML = `<div class="shot" style="height:${ih}px">` +
    (card.key ? `<img src="img/${card.key}_t.webp" alt="">` : '<div class="none">Рендера нет</div>') +
    (ratio > CAP + 0.05 ? '<span class="tall">↕ длинный разговор</span>' : '') + `</div>` +
    `<div class="txt"><div class="hd"><span class="id">${esc(card.id)}</span>${esc(card.title)}</div>` +
    `<div class="l say"><b>${card.side === 'parent' ? 'Родитель' : 'Ребёнок'}${card.voice ? ' (голосом)' : ''}:</b> ${esc(said)}</div>` +
    `<div class="l did"><b>Фоксик:</b> ${esc(didLine(card))}</div>` +
    `<div class="l tap"><b>Нажатие:</b> ${esc(tap)}</div>` +
    (warn.length ? `<div class="l warn">${esc(warn.join('; '))}</div>` : '') +
    `<div class="foot"><span class="chip ${vc}">${vl}</span>` +
    (card.locale && card.locale !== 'ru' ? `<span class="tag">${LOCALE[card.locale] || card.locale}</span>` : '') +
    (card.child ? `<span class="tag">${esc(card.child)}</span>` : '') + `</div></div>`;
  e.dataset.text = [card.id, card.title, card.group, said, didLine(card), tap, card.notes].join(' ').toLowerCase();
  e.dataset.verdict = card.verdict;
  return [e, ih + TXT_H];
}

function catCard(card, x, y) {
  const ratio = card.h / card.w, shown = Math.min(ratio, CAT_CAP), ih = Math.round(CW * shown);
  const e = el('div', 'cat');
  e.style.left = x + 'px'; e.style.top = y + 'px'; e.style.width = CW + 'px'; e.style.height = (ih + CAP_H) + 'px';
  e.innerHTML = `<div class="shot" style="height:${ih}px"><img src="img/${card.key}_t.webp" alt="">` +
    (ratio > CAT_CAP + 0.05 ? '<span class="tall">↕ длинный кадр</span>' : '') + `</div><div class="cap">${esc(card.title)}</div>`;
  e.dataset.text = (card.id + ' ' + card.title).toLowerCase();
  e.dataset.verdict = 'catalog';
  return [e, ih + CAP_H];
}

function layout() {
  let y = 0, maxX = 0;
  const hero = el('div', 'hero', `<div class="t">Фоксик: все случаи чата</div><div class="s">` +
    `Каждый кейс прогнан вживую на DEV; картинка — тот самый ответ сервера, нарисованный настоящим экраном приложения. ` +
    `Собрано ${esc(META.built)} · ветка ${esc(META.branch)} (${esc(META.commit)})</div>`);
  hero.style.left = '0px'; hero.style.top = '0px';
  const tiles = el('div', 'tiles');
  tiles.style.left = '0px'; tiles.style.top = '120px';
  for (const side of ['parent', 'child']) {
    const m = META[side];
    tiles.innerHTML += `<div class="tile"><div class="k">${SIDE[side]} — ${side === 'parent' ? 'Foksik AI' : 'Фоксик'}</div>` +
      `<div class="v">${m.count}<small>случаев</small></div><div class="r">${countLine(m.totals)}</div>` +
      `<div class="m">${esc(m.run)}</div></div>`;
  }
  tiles.innerHTML += `<div class="tile"><div class="k">Безопасность и фрод</div><div class="v">${META.security}<small>случаев</small></div>` +
    `<div class="m">чужие дети и семьи, подделки, кризис, лимиты</div></div>` +
    `<div class="tile"><div class="k">Каталог карточек</div><div class="v">${META.catalog}<small>кадров</small></div>` +
    `<div class="m">все карточки во всех состояниях, арабский, узкий телефон</div></div>` +
    (META.charts ? `<div class="tile"><div class="k">Графики и аналитика</div><div class="v">${META.charts}<small>кадров</small></div>` +
      `<div class="m">неделя, монеты, рост, цель — у родителя и ребёнка</div></div>` : '');
  // Parent and child side by side; safety and the catalogue below, full width.
  const top0 = 330;
  let colX = 0, colBottom = top0, y2 = top0;
  const placeSection = (s, x0, y0) => {
    let y = y0;
    const bg = el('div', 'sec-bg');
    const n = s.rows.reduce((a, r) => a + r.cards.length, 0);
    const hd = el('div', 'sec-h', `<div class="t"><span class="bar" style="background:${COLOR[s.id]}"></span>${esc(s.title)}` +
      `<span class="c">${n} ${s.id === 'catalog' || s.id === 'charts' ? 'кадров' : 'случаев'}</span></div><div class="note">${esc(s.note)}</div>`);
    hd.style.left = (x0 + 36) + 'px'; hd.style.top = (y + 28) + 'px';
    pos[s.id] = { x: x0, y: y0 };
    y += 132;
    let secW = 0;
    for (const r of s.rows) {
      const isCat = r.kind === 'catalog';
      const t = count(r.cards);
      const lab = el('div', 'row-l', `<div class="t">${esc(r.title)}</div><div class="c">${r.cards.length} ${isCat ? 'кадров' : 'случаев'}` +
        (isCat ? '' : `<br>${countLine(t)}`) + `</div>`);
      lab.style.left = (x0 + 36) + 'px'; lab.style.top = (y + 6) + 'px';
      pos[r.id] = { x: x0, y: y - 30 };
      // A long row wraps after PER_LINE cards.
      let x = x0 + 36 + LABEL_W, rowH = 80;
      r.cards.forEach((c, i) => {
        if (i > 0 && i % PER_LINE === 0) { y += rowH + 30; x = x0 + 36 + LABEL_W; rowH = 80; }
        const [e, h] = isCat ? catCard(c, x, y) : caseCard(c, x, y);
        e.addEventListener('click', () => { if (!moved) openLb(r, i); });
        allCards.push(e);
        rowH = Math.max(rowH, h);
        x += CW + GAP;
        secW = Math.max(secW, x - x0);
      });
      rowsOf[r.id] = r;
      y += rowH + 44;
    }
    y += 10;
    // The header wraps inside the section, which is at least wide enough
    // for its title and a readable note.
    const w = Math.max(secW + 20, 1180);
    hd.style.width = (w - 72) + 'px';
    bg.style.left = x0 + 'px'; bg.style.top = y0 + 'px'; bg.style.width = w + 'px'; bg.style.height = (y - y0) + 'px';
    return { w, bottom: y };
  };
  // Two columns: the parent and, under it, safety; the child and, under
  // it, the catalogue.
  for (const ids of [['parent', 'security'], ['child', 'catalog', 'charts']]) {
    let y = top0, w = 0;
    for (const s of SECTIONS.filter(s => ids.includes(s.id))) {
      const r = placeSection(s, colX, y);
      y = r.bottom + 80; w = Math.max(w, r.w);
    }
    if (!w) continue;
    colX += w + 80; colBottom = Math.max(colBottom, y);
    maxX = Math.max(maxX, colX);
  }
  y2 = colBottom;
  board.style.width = Math.max(maxX, 1500) + 'px'; board.style.height = y2 + 'px';
}

// Moves are coalesced into one write per frame, and the board is a
// composited layer while it moves.
let frame = 0, settle = 0;
const Z_MIN = 0.03, Z_MAX = 3, FAR = 0.3;
const zslider = document.getElementById('zslider');
// The slider is logarithmic: equal steps feel equal at every zoom.
const toSlider = v => Math.round(1000 * Math.log(v / Z_MIN) / Math.log(Z_MAX / Z_MIN));
const fromSlider = n => Z_MIN * Math.pow(Z_MAX / Z_MIN, n / 1000);
function apply() {
  board.classList.add('moving');
  clearTimeout(settle);
  settle = setTimeout(() => board.classList.remove('moving'), 180);
  if (frame) return;
  frame = requestAnimationFrame(() => {
    frame = 0;
    board.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
    board.classList.toggle('far', z < FAR);
    document.getElementById('zoomv').textContent = Math.round(z * 100) + '%';
    if (document.activeElement !== zslider) zslider.value = toSlider(z);
  });
}
const clampZ = v => Math.min(Z_MAX, Math.max(Z_MIN, v));
function zoomAt(f, cx, cy) { const nz = clampZ(z * f); tx = cx - (cx - tx) * (nz / z); ty = cy - (cy - ty) * (nz / z); z = nz; apply(); }
// Every zoom input moves one target; the board eases toward it (about a
// tenth of a second), anchored where the zoom was asked. A pinch keeps
// feeding the target, so it follows the fingers without jumps.
let zTarget = null, zAnchor = [0, 0], zLoop = 0;
function zoomTo(target, cx, cy) {
  zTarget = clampZ(target); zAnchor = [cx, cy];
  if (zLoop) return;
  const step = () => {
    const d = zTarget / z;
    if (Math.abs(d - 1) < 0.002) { zoomAt(d, zAnchor[0], zAnchor[1]); zTarget = null; zLoop = 0; return; }
    zoomAt(Math.pow(d, 0.35), zAnchor[0], zAnchor[1]);
    zLoop = requestAnimationFrame(step);
  };
  zLoop = requestAnimationFrame(step);
}
function zoomBy(f, cx, cy) { zoomTo((zTarget ?? z) * f, cx, cy); }
function zoomGlide(f, cx, cy) { zoomBy(f, cx, cy); }
const center = () => [view.clientWidth / 2, view.clientHeight / 2];
function stopZoom() { cancelAnimationFrame(zLoop); zLoop = 0; zTarget = null; }
function fitAll() {
  stopZoom();
  const w = board.offsetWidth, h = board.offsetHeight, vw = view.clientWidth, vh = view.clientHeight;
  z = Math.min(1, (vw - 40) / w, (vh - 40) / h); tx = 20; ty = 20; apply();
}
function fitWidth() { stopZoom(); const w = board.offsetWidth, vw = view.clientWidth; z = Math.min(1, (vw - 40) / w); tx = 20; ty = 20; apply(); }
function goTo(id, zoom) {
  const p = pos[id]; if (!p) return;
  stopZoom();
  if (zoom) z = zoom; else if (z < 0.35) z = 0.5;
  tx = 24 - p.x * z; ty = 20 - p.y * z; apply();
}

let dragging = false, moved = false, sx = 0, sy = 0, stx = 0, sty = 0;
view.addEventListener('pointerdown', e => { dragging = true; moved = false; sx = e.clientX; sy = e.clientY; stx = tx; sty = ty; });
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (!moved && Math.hypot(dx, dy) > 4) { moved = true; view.classList.add('drag'); }
  if (moved) { tx = stx + dx; ty = sty + dy; apply(); }
});
window.addEventListener('pointerup', () => { dragging = false; view.classList.remove('drag'); setTimeout(() => moved = false, 0); });
// Wheel: a pinch (ctrl+wheel from the trackpad) and ⌘/Ctrl + wheel zoom
// at the cursor — small deltas (a pinch) follow the fingers one to one,
// a mouse notch (a big delta) steps ×1.25 and eases; a plain wheel or a
// two-finger scroll pans, as in Figma.
let gesturing = false;
view.addEventListener('wheel', e => {
  e.preventDefault();
  if (gesturing) return; // Safari reports its own pinch as gesture events.
  const r = view.getBoundingClientRect(), cx = e.clientX - r.left, cy = e.clientY - r.top;
  const unit = e.deltaMode === 1 ? 33 : e.deltaMode === 2 ? view.clientHeight : 1;
  const dy = e.deltaY * unit, dx = e.deltaX * unit;
  if (e.ctrlKey || e.metaKey) {
    if (Math.abs(dy) >= 50) zoomBy(dy < 0 ? 1.25 : 1 / 1.25, cx, cy);
    else zoomBy(Math.exp(-dy * 0.01), cx, cy);
  } else if (e.shiftKey && !dx) { tx -= dy; apply(); }
  else { tx -= dx; ty -= dy; apply(); }
}, { passive: false });
// Safari's own pinch: the fingers' scale, one to one.
let gz = 1;
view.addEventListener('gesturestart', e => { e.preventDefault(); gesturing = true; gz = 1; });
view.addEventListener('gesturechange', e => {
  e.preventDefault();
  const r = view.getBoundingClientRect();
  zoomAt(e.scale / gz, e.clientX - r.left, e.clientY - r.top);
  gz = e.scale;
});
view.addEventListener('gestureend', e => { e.preventDefault(); gesturing = false; });
view.addEventListener('dblclick', e => {
  // A card opens on click; only the board around the cards zooms.
  if (e.target.closest('.case, .cat')) return;
  const r = view.getBoundingClientRect();
  zoomBy(e.altKey ? 0.5 : 2, e.clientX - r.left, e.clientY - r.top);
});
document.getElementById('zIn').onclick = () => zoomBy(1.5, ...center());
document.getElementById('zOut').onclick = () => zoomBy(1 / 1.5, ...center());
document.getElementById('zoomv').onclick = () => zoomTo(1, ...center());
zslider.addEventListener('input', () => zoomTo(fromSlider(+zslider.value), ...center()));
document.getElementById('fit').onclick = fitAll;

let verdictFilter = 'all';
function filter() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  for (const e of allCards) {
    const okText = !q || e.dataset.text.includes(q);
    const okVerdict = verdictFilter === 'all' || e.dataset.verdict === verdictFilter;
    e.classList.toggle('dim', !(okText && okVerdict));
  }
}
document.getElementById('q').oninput = filter;
for (const [id, v] of [['fAll', 'all'], ['fFail', 'fail'], ['fNote', 'note']]) {
  document.getElementById(id).onclick = () => {
    verdictFilter = v;
    for (const b of ['fAll', 'fFail', 'fNote']) document.getElementById(b).classList.toggle('on', b === id);
    filter();
  };
}

function sideList() {
  const side = document.getElementById('side');
  let h = `<div class="box"><b>Как читать</b><p>Каждая карточка — один разговор: фраза родителя или ребёнка, что ответил Фоксик ` +
    `(слова и карточки, которые показало приложение), что вышло при нажатии, и вердикт: ✅ работает, ⚠️ на заметку, ❌ ошибка. ` +
    `Клик — крупно, со всеми проверками.</p><p>Картинка — ответ сервера с DEV, пропущенный через тот же код приложения, что на телефоне, ` +
    `до нажатий; что вышло при нажатии, написано под картинкой. Время в пузырях — время отрисовки, не прогона.</p></div>`;
  if (META.sample) h += `<div class="box warn"><b>Образец</b><p>Это пробные данные, написанные вручную. Живой прогон заменит их.</p></div>`;
  h += `<div class="box"><b>Прогоны</b><p>Родитель: ${esc(META.parent.run)}</p><p>Ребёнок: ${esc(META.child.run)}</p></div>`;
  for (const s of SECTIONS) {
    const n = s.rows.reduce((a, r) => a + r.cards.length, 0);
    h += `<h2>${esc(s.title)}</h2><a href="#" class="sec" data-id="${s.id}"><span>Весь раздел</span><span class="n">${n}</span></a>`;
    for (const r of s.rows) {
      const t = count(r.cards);
      const bad = r.kind === 'catalog' ? '' : (t.fail ? ` <span class="f">❌${t.fail}</span>` : '') + (t.note ? ` <span class="w">⚠️${t.note}</span>` : '');
      h += `<a href="#" class="row" data-id="${r.id}"><span>${esc(r.title)}</span><span class="n">${r.cards.length}${bad}</span></a>`;
    }
  }
  side.innerHTML = h;
  side.querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); goTo(a.dataset.id); });
}

const lb = document.getElementById('lb');
let cur = null;
function openLb(row, i) { cur = { row, i }; lb.classList.add('on'); showLb(); }
function showLb() {
  const { row, i } = cur, c = row.cards[i];
  const isCat = row.kind === 'catalog';
  document.getElementById('lbT').textContent = isCat ? c.title : `${c.id} · ${c.title}`;
  document.getElementById('lbS').textContent = `${row.title} · ${i + 1} из ${row.cards.length}` + (c.w ? ` · ${c.w}×${c.h}` : '');
  const img = document.getElementById('lbImg');
  img.src = c.key ? `img/${c.key}.webp` : '';
  img.style.display = c.key ? '' : 'none';
  const info = document.getElementById('info');
  if (isCat) { info.innerHTML = `<h3>Кадр каталога</h3><div class="p">${esc(c.title)}</div>`; return; }
  const [vc, vl] = VERDICT[c.verdict] || VERDICT.note;
  let h = `<span class="chip ${vc}">${vl}</span> <span class="tag">${SIDE[c.side]}</span> <span class="tag">${esc(c.group)}</span>` +
    (c.child ? ` <span class="tag">${esc(c.child)}</span>` : '') + ` <span class="tag">${LOCALE[c.locale] || c.locale}</span>` +
    (c.voice ? ' <span class="tag">голосом</span>' : '') + (c.teen ? ' <span class="tag">подросток</span>' : '');
  const failed = (c.checks || []).filter(x => !x.ok);
  if (failed.length) {
    h += `<h3>${c.verdict === 'fail' ? 'Что не так' : 'На что посмотреть'}</h3><ul class="checks">` +
      failed.map(x => `<li><span class="bad">✗</span> ${esc(x.name)}` + (x.detail ? `<span class="d">${esc(x.detail)}</span>` : '') + `</li>`).join('') + `</ul>`;
  }
  if (c.expect) h += `<h3>Что должно быть</h3><div class="p">${esc(c.expect)}</div>`;
  h += `<h3>Разговор</h3>`;
  c.steps.forEach((st, k) => {
    h += `<div class="step"><div class="who">${c.side === 'parent' ? 'Родитель' : 'Ребёнок'}${st.voice ? ' — голосом' : ''}, ход ${k + 1}</div>` +
      `<div class="said">«${esc(st.said)}»</div><div class="who">Фоксик</div><div class="words">${esc(st.text || '—')}</div>` +
      (st.cards && st.cards.length ? `<ul>${st.cards.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '') +
      ((st.warn || []).length ? `<div class="w">${esc(st.warn.join('; '))}</div>` : '') + `</div>`;
  });
  h += `<h3>Нажатие</h3><div class="p">${c.tap ? (c.tap.ok ? '<span class="ok">✓ сработало</span> — ' : '<span class="bad">✗ не так, как ждали</span> — ') + esc(c.tap.detail || c.tap.what) : 'Не нажимали'}</div>` +
    `<div class="p" style="color:var(--muted);font-size:12.5px;margin-top:6px">Картинка показывает ответы так, как они пришли, до нажатий: после нажатия карточка в приложении сменилась бы на итог (см. «Каталог карточек»).</div>`;
  if (c.checks && c.checks.length) {
    h += `<h3>Все проверки (${c.checks.filter(x => x.ok).length} из ${c.checks.length} пройдены)</h3><ul class="checks">` +
      [...c.checks.filter(x => !x.ok), ...c.checks.filter(x => x.ok)].map(x => `<li><span class="${x.ok ? 'ok' : 'bad'}">${x.ok ? '✓' : '✗'}</span> ${esc(x.name)}` +
        (x.detail ? `<span class="d">${esc(x.detail)}</span>` : '') + `</li>`).join('') + `</ul>`;
  }
  if (c.notes) h += `<h3>Заметки</h3><div class="p">${esc(c.notes)}</div>`;
  info.innerHTML = h;
  info.scrollTop = 0;
}
function step(d) { if (!cur) return; const n = cur.row.cards.length; cur.i = (cur.i + d + n) % n; showLb(); }
document.getElementById('lbPrev').onclick = () => step(-1);
document.getElementById('lbNext').onclick = () => step(1);
document.getElementById('lbX').onclick = () => lb.classList.remove('on');
document.getElementById('lbFit').onclick = () => {
  const on = document.getElementById('pic').classList.toggle('fit');
  document.getElementById('lbFit').textContent = on ? 'Крупно' : 'Целиком';
};
window.addEventListener('keydown', e => {
  if (lb.classList.contains('on')) {
    if (e.key === 'Escape') lb.classList.remove('on');
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
    return;
  }
  const zoomKey = e.key === '+' || e.key === '=' || e.key === '-' || e.key === '_' || e.key === '0';
  if (zoomKey && (e.metaKey || e.ctrlKey)) e.preventDefault();
  else if (e.target.tagName === 'INPUT') return;
  if (e.key === '+' || e.key === '=') zoomBy(1.5, ...center());
  if (e.key === '-' || e.key === '_') zoomBy(1 / 1.5, ...center());
  if (e.key === '0') fitAll();
});

summary(); layout(); sideList(); fitWidth();
window.__ready = true;
</script>
</body>
</html>
