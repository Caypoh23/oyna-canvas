<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OYNA — все экраны: родитель и ребёнок (Figma ↔ приложение)</title>
<style>
  :root {
    --bg: #e9e9ec; --ink: #16181d; --muted: #6b7078; --line: #d5d6db;
    --figma: #7b61ff; --app: #ff8a1f; --motion: #e0457b; --device: #1fa463; --card: #fff;
    --live: #1f8a4c; --fix: #c77700; --new: #2f6fde; --side-w: 272px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); overscroll-behavior: none;
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; color: var(--ink); touch-action: pan-x pan-y; }
  #top { position: fixed; inset: 0 0 auto 0; height: 58px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 0 14px; z-index: 20; overflow-x: auto; scrollbar-width: none; }
  #top::-webkit-scrollbar { display: none; }
  #top h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  .tabs { display: flex; gap: 2px; background: #f1f1f4; border-radius: 10px; padding: 3px; flex: none; }
  .tabs a { text-decoration: none; color: var(--ink); font-size: 13px; padding: 6px 11px; border-radius: 8px; white-space: nowrap; }
  .tabs a.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .tabs a:not(.on):hover { background: #e6e6ea; }
  #top .grow { flex: 1; min-width: 12px; }
  #top .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #fit .short { display: none; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; height: 32px; min-width: 32px; padding: 0 10px;
    cursor: pointer; font: inherit; font-size: 13px; color: var(--ink); white-space: nowrap; flex: none; }
  .btn:hover { background: #f4f4f6; }
  .zoom { display: flex; align-items: center; gap: 4px; flex: none; }
  #zoomv { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
  .tog { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; white-space: nowrap; flex: none; }
  .tog.an { padding: 5px 10px 5px 8px; border-radius: 99px; border: 1px solid var(--line); background: #fff; font-weight: 600; }
  .tog.an:has(input:checked) { background: #16181d; color: #fff; border-color: #16181d; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  #q { height: 32px; border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; width: 190px; font: inherit; flex: none; }
  #menu { display: none; }
  #side { position: fixed; left: 0; top: 58px; bottom: 0; width: var(--side-w); background: #fff; border-right: 1px solid var(--line);
    overflow: auto; z-index: 15; padding: 10px 0 30px; overscroll-behavior: contain; }
  #side h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 16px 6px; }
  #side a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 16px; color: var(--ink); text-decoration: none; font-size: 13px; border-left: 3px solid transparent; }
  #side a:hover { background: #f4f4f6; }
  #side a.on { background: #f1f1f4; border-left-color: #16181d; font-weight: 600; }
  #side a .n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; font-weight: 400; }
  #side .notes { margin: 8px 12px 0; padding: 10px 12px; border-radius: 10px; background: #fff7ee; border: 1px solid #ffd8b0; font-size: 12.5px; }
  #side .notes b { display: block; margin-bottom: 4px; }
  #side .notes ul { margin: 4px 0 0 16px; padding: 0; }
  #side .notes li { margin: 3px 0; }
  #side .anbox { display: none; margin: 10px 12px 4px; padding: 10px 12px; border-radius: 10px; background: #f1f5ff; border: 1px solid #cfdcff; font-size: 12.5px; }
  body.an #side .anbox { display: block; }
  #side .anbox b { display: block; margin-bottom: 6px; }
  #side .anbox .lg { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #side .anbox a { display: inline; padding: 0; border: 0; color: #2f6fde; font-weight: 600; }
  #view { position: fixed; left: var(--side-w); top: 58px; right: 0; bottom: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  #board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #board.moving { will-change: transform; }
  .side-h { position: absolute; font-size: 64px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; transform-origin: 0 0; }
  .side-h small { display: block; font-size: 22px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 6px; }
  .sec-h { position: absolute; white-space: nowrap; }
  .sec-h .t { font-size: 30px; font-weight: 750; letter-spacing: -.01em; transform-origin: 0 0; display: inline-block; }
  .sec-h .t .c { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 10px; }
  .sec-h .note { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .sec-h .dev { font-size: 15px; color: #5a45d6; margin-top: 6px; white-space: normal; max-width: 1500px; }
  .sec-bg { position: absolute; border-radius: 28px; background: rgba(255,255,255,.55); border: 1px solid rgba(0,0,0,.05); }
  .row-l { position: absolute; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .row-l .dot { width: 12px; height: 12px; }
  .row-empty { position: absolute; font-size: 15px; color: var(--muted); font-style: italic; }
  .card { position: absolute; background: #f3f3f5 center top / cover no-repeat; border-radius: 18px; overflow: hidden; cursor: zoom-in;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 22px rgba(0,0,0,.08); }
  .card:hover { box-shadow: 0 0 0 3px var(--hl, #333), 0 10px 28px rgba(0,0,0,.14); }
  .card img.pic { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .card.figma { --hl: var(--figma); } .card.app { --hl: var(--app); } .card.motion { --hl: var(--motion); } .card.device { --hl: var(--device); }
  .card .tall { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.66); color: #fff; font-size: 12px;
    padding: 3px 8px; border-radius: 99px; z-index: 1; }
  .card .play { position: absolute; left: 8px; top: 8px; background: var(--motion); color: #fff; font: 600 11px/1 -apple-system, system-ui, sans-serif; padding: 5px 8px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.25); z-index: 1; }
  .cap { position: absolute; font-size: 14px; line-height: 1.25; color: var(--ink); overflow: hidden; }
  .cap .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  /* Far out: plain tinted blocks, no captions, big section names. */
  #board.lod0 .card { box-shadow: none; background-image: none !important; }
  #board.lod0 .card.figma { background-color: #d9d1ff; } #board.lod0 .card.app { background-color: #ffd9b3; }
  #board.lod0 .card.motion { background-color: #f6c3d6; } #board.lod0 .card.device { background-color: #bfe8d0; }
  #board.lod0 .card > * { display: none; }
  #board.far .cap, #board.far .row-l, #board.far .row-empty, #board.far .sec-h .note, #board.far .sec-h .dev { visibility: hidden; }
  #board.far .card { box-shadow: none; }
  #board.far .sec-h .t { background: rgba(255,255,255,.92); border-radius: 12px; padding: 2px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #board.far .side-h small { visibility: hidden; }
  .dim { opacity: .12; }
  body.hide-figma .r-figma, body.hide-app .r-app, body.hide-motion .r-motion, body.hide-device .r-device { display: none; }
  /* Analytics layer */
  .an-tag { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 8px 8px; display: none; flex-wrap: wrap; gap: 5px;
    background: linear-gradient(to top, rgba(14,16,22,.92) 70%, rgba(14,16,22,0)); z-index: 2; cursor: default; }
  body.an .an-tag { display: flex; }
  body.an .card:not(.has-an) { opacity: .45; }
  body.an #board.lod0 .card.has-an { background-color: #c9d8ff; }
  /* Event chips (plan_ui.js) on the dark strip under a screen and in the viewer. */
  .an-tag .chip, #lbAn .chip { background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); font-size: 12px; padding: 4px 7px; }
  .an-tag .chip:hover, #lbAn .chip:hover { background: rgba(255,255,255,.25); }
  .an-tag .chip.scr, #lbAn .chip.scr { color: #d7dbe4; font-weight: 500; }
  #lb { position: fixed; inset: 0; background: rgba(12,13,16,.975); z-index: 50; display: none; flex-direction: column; }
  #lb.on { display: flex; }
  #lb .bar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; color: #fff; }
  #lb .bar .ttl { flex: 1; min-width: 0; }
  #lb .bar .ttl b { font-size: 16px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #lb .bar .ttl div { color: #aab; font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lb .bar .btn { background: #26282e; color: #fff; border-color: #3a3d45; }
  #lb .panes { flex: 1; display: flex; gap: 18px; padding: 0 18px 12px; min-height: 0; }
  #lb .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; min-height: 0; }
  #lb .pane .lab { color: #ccd; font-size: 13px; margin-bottom: 8px; display: flex; gap: 6px; align-items: center; }
  #lb .pane .sc { flex: 1; min-height: 0; width: 100%; overflow: auto; display: flex; justify-content: center; }
  #lb .pane img { max-width: 100%; height: auto; align-self: flex-start; border-radius: 14px; }
  #lb .pane.fit img { max-height: 100%; width: auto; }
  #lb .strip { display: none; gap: 8px; padding: 8px 18px 14px; overflow-x: auto; }
  #lb.cmp .strip { display: flex; }
  #lb .strip img { height: 92px; border-radius: 8px; cursor: pointer; opacity: .55; border: 2px solid transparent; }
  #lb .strip img.on { opacity: 1; border-color: var(--figma); }
  #lb:not(.cmp) #pR { display: none; }
  #lb .anl { display: none; gap: 6px; flex-wrap: wrap; padding: 0 18px 10px; }
  body.an #lb .anl { display: flex; }
  #help { position: fixed; left: calc(var(--side-w) + 12px); bottom: 12px; background: rgba(255,255,255,.94); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 11px; font-size: 12px; color: var(--muted); z-index: 18; max-width: calc(100vw - var(--side-w) - 220px); }
  #help b { color: var(--ink); font-weight: 600; }
  #help #helpX { float: right; border: 0; background: none; color: var(--muted); cursor: pointer; margin: -2px -4px 0 8px; font-size: 13px; }
  body.nohelp #help { display: none; }
  #help .touch { display: none; }
  @media (pointer: coarse) { #help .desk { display: none; } #help .touch { display: inline; } }
  .layers { position: relative; flex: none; }
  .layers summary { list-style: none; display: inline-flex; align-items: center; }
  .layers summary::-webkit-details-marker { display: none; }
  .layers .pop { position: fixed; top: 52px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 9px; box-shadow: 0 8px 28px rgba(0,0,0,.14); z-index: 30; }
  @media (max-width: 760px) {
    :root { --side-w: 0px; }
    #menu { display: inline-block; }
    #side { width: 84vw; max-width: 320px; transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.2); }
    body.side-open #side { transform: none; }
    #q, .layers, #top .sub, .tog.an .long { display: none; }
    #top { gap: 8px; padding: 0 8px; } .tabs a { padding: 6px 8px; }
    /* Zoom lives bottom-right, where a thumb reaches it. */
    .zoom { position: fixed; right: 12px; bottom: 16px; flex-direction: column; gap: 6px; z-index: 21; }
    .zoom .btn { width: 44px; height: 44px; box-shadow: 0 2px 10px rgba(0,0,0,.15); font-size: 18px; }
    #zoomv, #fit .long { display: none; } #fit .short { display: inline; }
    #help { display: block; left: 12px; right: 70px; max-width: none; bottom: 16px; }
    #lb .bar { flex-wrap: wrap; gap: 8px; padding: 10px 12px; } #lb .bar .ttl { flex-basis: 100%; }
  }
</style>
</head>
<body>
<div id="top">

<div id="help"><button id="helpX" title="Больше не показывать">✕</button><span class="desk"><b>Двигать:</b> тащить мышью, колесо, два пальца, стрелки, PgUp/PgDn · <b>Масштаб:</b> щипок, ⌘/Ctrl + колесо, + −, двойной клик · <b>0</b> — всё, <b>1</b> — 100 % · клик по экрану — открыть</span><span class="touch"><b>Двигать</b> — пальцем, <b>масштаб</b> — двумя пальцами или + −, двойной тап — ближе. Тап по экрану — открыть.</span></div>

    <div class="pane fit" id="pR"><div class="lab"><span class="dot" style="background:var(--figma)"></span><span id="pRl"></span></div><div class="sc"><img id="imgR" alt=""></div></div>
  </div>
  <div class="strip" id="strip"></div>

<script>
/* OYNA canvas engine — one way to move around every canvas page.
 *
 * Mouse and trackpad: drag or scroll to move (Shift + wheel moves sideways),
 * pinch or ⌘/Ctrl + wheel to zoom at the cursor, double-click to zoom in
 * (Alt — out). Phone/tablet: one finger moves (with a glide), two fingers
 * pinch and move, double tap zooms in. Keys: arrows, PgUp/PgDn/Space,
 * Home/End, + − (also with ⌘), 0 fits the board, 1 is 100 %.
 *
 * The board can't be thrown away: at least half the view (or the whole
 * board when it is smaller) always stays on it. While the board moves it is
 * one composited layer; once it settles the page gets a "settle" call so it
 * can swap pictures for the zoom (level of detail) and the URL keeps the
 * place (#@x,y,z — a link opens the same spot).
 */
(function (global) {
  'use strict';

  const CSS = `
  .cv-map { position: fixed; right: 12px; bottom: 46px; z-index: 18; background: rgba(255,255,255,.9); transition: background .15s;
    border: 1px solid #d5d6db; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.08); padding: 8px;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  .cv-map .cv-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font: 600 11px/1 -apple-system, system-ui, sans-serif; color: #6b7078; letter-spacing: .06em;
    text-transform: uppercase; margin: 0 0 6px; }
  .cv-map .cv-head button { border: 0; background: none; color: #6b7078; cursor: pointer; font: inherit; padding: 2px 4px; }
  .cv-map.min .cv-body { display: none; } .cv-map.min .cv-head { margin: 0; }
  .cv-body { position: relative; display: flex; gap: 6px; cursor: pointer; }
  .cv-map:hover { background: rgba(255,255,255,.98); }
  .cv-labels { position: relative; width: 96px; flex: none; }
  .cv-labels div { position: absolute; right: 0; max-width: 96px; font: 500 10px/1.15 -apple-system, system-ui, sans-serif; cursor: pointer;
    color: #3b3f46; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform: translateY(-50%); }
  .cv-labels div.on { color: #000; font-weight: 700; }
  .cv-mapbox { position: relative; flex: none; background: #f1f1f4; border-radius: 6px; overflow: hidden; }
  .cv-mapbox i { position: absolute; display: block; border-radius: 2px; opacity: .85; }
  .cv-vp { position: absolute; border: 2px solid #16181d; border-radius: 3px; background: rgba(22,24,29,.08);
    box-shadow: 0 0 0 9999px rgba(255,255,255,.0); pointer-events: none; }
  @media (max-width: 760px) { .cv-map { display: none; } }
  .cv-view img { -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }
  .cv-pad { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
  `;

  function createCanvas(opts) {
    const view = opts.view, board = opts.board;
    const Z_MAX = opts.zMax || 3;
    const zMinFixed = opts.zMin || 0;
    let z = 1, tx = 0, ty = 0, W = 1, H = 1;
    let frame = 0, settleTimer = 0;
    let moved = false;
    const on = { change: [], settle: [] };

    if (!document.getElementById('cv-style')) {
      const st = document.createElement('style'); st.id = 'cv-style'; st.textContent = CSS; document.head.appendChild(st);
    }

    // The view scrolls only for the browser's own reasons (a find-in-page
    // hit, focus moving to a link): it rests at PAD, the board sits at PAD,
    // so such a scroll may go up and left too, and becomes a camera move.
    const PAD = 1e6;
    view.classList.add('cv-view');
    const pad = document.createElement('div'); pad.className = 'cv-pad';
    pad.style.width = pad.style.height = (2 * PAD) + 'px';
    view.prepend(pad);
    board.style.left = board.style.top = PAD + 'px';
    const rest = () => { view.scrollLeft = PAD; view.scrollTop = PAD; };
    rest();
    // A picture dragged away would cancel the pointer and stop the move.
    view.addEventListener('dragstart', e => e.preventDefault());

    const vw = () => view.clientWidth, vh = () => view.clientHeight;
    function measure() { W = Math.max(1, board.offsetWidth); H = Math.max(1, board.offsetHeight); }
    function fitZoom() { return Math.min((vw() - 48) / W, (vh() - 48) / H); }
    function zMin() { return zMinFixed || Math.min(0.1, fitZoom() * 0.9); }
    const clampZ = v => Math.min(Z_MAX, Math.max(zMin(), v));

    // Half the view (or the whole board, when it is smaller) stays on the board.
    function clampXY() {
      const bw = W * z, bh = H * z, w = vw(), h = vh();
      const kx = Math.min(bw, w * 0.5), ky = Math.min(bh, h * 0.5);
      tx = Math.min(Math.max(tx, kx - bw), w - kx);
      ty = Math.min(Math.max(ty, ky - bh), h - ky);
    }

    function render() {
      clampXY();
      board.classList.add('moving');
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => { board.classList.remove('moving'); emit('settle'); saveHash(); }, 170);
      if (!frame) frame = requestAnimationFrame(flush);
    }
    function flush() {
      frame = 0;
      board.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
      emit('change');
    }
    function state() {
      const w = vw(), h = vh();
      return { z, tx, ty, w, h, W, H, left: -tx / z, top: -ty / z, right: (w - tx) / z, bottom: (h - ty) / z };
    }
    function emit(kind) { const s = state(); on[kind].forEach(fn => fn(s)); }

    // ── Zoom ────────────────────────────────────────────────────────────
    function zoomAt(f, cx, cy) {
      const nz = clampZ(z * f);
      tx = cx - (cx - tx) * (nz / z); ty = cy - (cy - ty) * (nz / z); z = nz; render();
    }
    // Wheel notches, buttons and keys ease toward one target (≈ 0.15 s); a
    // pinch feeds zoomAt directly so the board follows the fingers.
    let zTarget = null, zAnchor = [0, 0], zLoop = 0;
    function zoomSmooth(f, cx, cy) { zoomSmoothTo((zTarget ?? z) * f, cx, cy); }
    // Eases to the zoom [nz] itself, wherever a running ease was heading.

  .pd code { font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; background: #f4f4f6; border-radius: 5px; padding: 1px 5px; word-break: break-all; }
  .pd .shots { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .pd .shot { flex: none; width: 92px; text-align: center; font-size: 11.5px; color: #3b3f46; text-decoration: none; }
  .pd .shot img { width: 92px; height: 170px; object-fit: cover; object-position: top; border-radius: 10px; display: block; background: #f1f1f4; margin-bottom: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .pd .shotcap { font-size: 12.5px; color: #5f646d; margin-top: 2px; }
  .pd .lnk { display: block; color: #2f6fde; text-decoration: none; margin: 4px 0; font-weight: 600; }
  .pd .lnk:hover { text-decoration: underline; }
  .pd .evs { display: flex; flex-wrap: wrap; gap: 6px; }
  .pd .muted { color: #6b7078; font-size: 13px; }
  .stlegend { display: grid; gap: 6px; font-size: 13.5px; }
  .stlegend div { display: flex; align-items: center; gap: 8px; }
  .stlegend .chip { flex: none; }
  `;

  const SIDE = { parent: 'родитель', child: 'ребёнок', both: 'родитель и ребёнок', system: 'присылает PostHog', store: 'магазин приложений' };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // An event or screen name that may wrap only between its words:
  // quest|Approved, parent_|child_|invite.
  const breakable = name => esc(name).replace(/([a-z])(?=[A-Z])|_/g, m => m + '<wbr>');
  const show = v => String(v);   // true / false as PostHog stores them
  // A sample value for a property from its documented values, when the plan
  // gives none: the first allowed value, a number, true, an id. Unknown —
  // no row rather than a made-up one.
  const IDS = { quest_id: '5b1e…', child_id: '8f2c…', reward_id: 'c47a…', family_id: '71d0…', user_id: '3fa9…' };
  const guess = (t, name) => {
    t = String(t || '');
    if (t.includes('|')) return t.split('|')[0].trim();
    if (/true \/ false/.test(t)) return true;
    if (/числ|1–5/.test(t)) return 42;
    if (/uuid/.test(t)) return IDS[name] || '9d3b…';
    return undefined;
  };

  function create(plan, opts) {
    opts = opts || {};
    const imgBase = opts.imgBase || 'img/';
    const canvasBase = opts.canvasBase || './';
    const analyticsBase = opts.analyticsBase || 'analytics/';
    const STATUS = plan.statuses || {};
    const evByName = {}, scrById = {};
    (plan.events || []).forEach(e => {
      evByName[e.name] = e;
      for (const alias of [...(e.legacy_names || []), e.previous_name].filter(Boolean)) evByName[alias] = e;
    });
    (plan.screens || []).forEach(s => { scrById[s.id] = s; });
    const domains = {};
    (plan.domains || []).forEach(d => { domains[d.id] = d; });
    const funnelsOf = name => (plan.funnels || []).filter(f => f.steps.some(st => st.event === name || (st.alt || []).includes(name)));
    const screensOf = name => (plan.screens || []).filter(s => (s.events || []).includes(name));
    const st = name => STATUS[name] || { icon: '?', label: name, text: '' };
    // Who sends it, in words: RevenueCat's server events are no one's phone.
    const whoOf = e => e.source === 'revenuecat' ? 'служебное · RevenueCat' : e.source === 'posthog' ? 'служебное · PostHog' : SIDE[e.side] || e.side;

    if (!document.getElementById('pd-style')) {
      const style = document.createElement('style'); style.id = 'pd-style'; style.textContent = CSS; document.head.appendChild(style);
    }
    const scrim = document.createElement('div'); scrim.className = 'pd-scrim';
    const pd = document.createElement('aside'); pd.className = 'pd'; pd.setAttribute('aria-hidden', 'true');
    pd.setAttribute('role', 'dialog'); pd.setAttribute('aria-modal', 'true'); pd.setAttribute('aria-label', 'Описание события или экрана');
    pd.innerHTML = '<div class="pd-h"><div class="pd-hd"></div><button class="x" title="Закрыть (Esc)" aria-label="Закрыть описание">✕</button></div><div class="pd-b"></div>';
    document.body.append(scrim, pd);
    const hd = pd.querySelector('.pd-hd'), body = pd.querySelector('.pd-b');
    let returnFocus;
    const close = () => { pd.classList.remove('on'); scrim.classList.remove('on'); pd.setAttribute('aria-hidden', 'true'); if (returnFocus?.isConnected) returnFocus.focus({ preventScroll: true }); };
    pd.querySelector('.x').onclick = close; scrim.onclick = close;
    // Capture: one Esc closes the panel and nothing behind it.
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && pd.classList.contains('on')) { e.stopImmediatePropagation(); e.preventDefault(); close(); }
      if (e.key === 'Tab' && pd.classList.contains('on')) {
        const focusable = [...pd.querySelectorAll('button, a[href], [tabindex="0"]')].filter(el => el.getClientRects().length);
        const first = focusable[0], last = focusable.at(-1);
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
      }
    }, true);
    body.addEventListener('click', e => {
      const go = e.target.closest('[data-go]');
      if (go && opts.onGo) { e.preventDefault(); close(); opts.onGo(go.dataset.go); return; }
      const chip = e.target.closest('[data-ev],[data-scr]');
      if (chip) { e.preventDefault(); openFromChip(chip); }
    });

    function statusLabel(name) { const s = st(name); return `${s.icon} ${s.label}`; }
    // The status in words; [short] for tight spots (a funnel step, a story card).
    function statusWord(name, short) {
      const e = evByName[name];
      if (!e) return '';
      const s = st(e.status);
      return `<span class="stw st-${e.status}" title="${esc(s.label)}">${esc(s.icon)} ${esc(short && s.short ? s.short : s.label)}</span>`;
    }
    function chip(name) {
      const e = evByName[name];
      const status = e ? e.status : 'new';
      name = e ? e.name : name;
      return `<span class="chip st-${status}" data-ev="${esc(name)}" role="button" tabindex="0" title="${esc((e ? e.title + ' — ' : '') + statusLabel(status))}"><i class="si">${esc(st(status).icon)}</i><span>${breakable(name)}</span></span>`;
    }
    function scrChip(id) {
      const s = scrById[id];
      const icon = s && s.sheet ? '▤' : s && s.untracked ? '○' : '👁';
      const what = s && s.sheet ? 'Лист поверх экрана — без просмотра' : s && s.untracked ? 'Не приходит (до согласия)' : 'Просмотр экрана: $screen';
      return `<span class="chip scr" data-scr="${esc(id)}" role="button" tabindex="0" title="${esc(what)}: ${esc(s ? s.title : id)}">${icon} <span>${breakable(id)}</span></span>`;
    }
    function chipsHtml(screens, events) {
      return (screens || []).map(scrChip).join('') + (events || []).map(chip).join('');
    }
    function legendHtml() {
      return `<div class="stlegend">${Object.entries(STATUS).map(([k, s]) =>
        `<div><span class="chip st-${k}" style="cursor:default"><i class="si">${esc(s.icon)}</i>event</span><span>${esc(s.label)}</span></div>`).join('')}</div>`;
    }
    function shots(keys) {
      return `<div class="shots">` + keys.slice(0, 8).map(k =>
        `<a class="shot" href="${canvasBase}?an=1#${esc(k.replace(/-(figma|app|motion|device)-\d+$/, ''))}" title="Открыть на холсте «Экраны»"><img loading="lazy" src="${imgBase}${esc(k)}_t.webp" alt=""></a>`).join('') +
        `</div><div class="shotcap">Клик по картинке — этот раздел на холсте «Экраны» ↗</div>`;
    }
    function present() { if (!pd.classList.contains('on')) returnFocus = document.activeElement; pd.classList.add('on'); scrim.classList.add('on'); pd.setAttribute('aria-hidden', 'false'); body.scrollTop = 0; pd.querySelector('.x').focus({ preventScroll: true }); }

    // One line as PostHog lists it, with example values: the event's own
    // properties, then (grey) the ones every event of the app carries.
    function sampleRow(e) {
      const ex = e.example || {}, rows = [];
      (e.props || []).forEach(p => String(p.n).split(/,\s*|\s+\/\s+/).forEach(n => {
        n = n.trim();
        if (!/^[$a-z_][a-z0-9_]*$/i.test(n) || rows.some(r => r[0] === n)) return;
        const v = n in ex ? ex[n] : guess(p.t, n);
        if (v !== undefined) rows.push([n, v]);
      }));
      Object.keys(ex).forEach(k => { if (!rows.some(r => r[0] === k)) rows.push([k, ex[k]]); });
      const own = new Set(rows.map(r => r[0]));
      let who, common = [];
      if (e.status === 'server') who = 'присылает сервер RevenueCat · покупатель — семья 71d0…';
      else if (e.side === 'system') {
        who = 'присылает сам PostHog · родитель 3fa9…';
        common = [['$app_version', '1.0.8']];
      } else {
        who = e.side === 'child' ? 'ребёнок child_8f2c…' : 'родитель 3fa9…';
        const where = (screensOf(e.name)[0] || {}).id || 'parent_home';
        common = [['$app_namespace', 'com.oynaplatform.app'], ['environment', 'prod'], ['role', e.side === 'child' ? 'child' : 'parent'],
          ['tier', 'free'], ['country', 'UZ'], ['language', 'ru'], ['coppa_strict', e.side === 'child'], ['$screen_name', where]];
      }
      common = common.filter(([k]) => !own.has(k));
      return `<div class="pd-sample"><div class="h"><span class="ex">ПРИМЕР</span><b>${esc(e.name)}</b><span>День 2, 18:34 · ${who}</span></div>
        <table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(show(v))}</td></tr>`).join('')}
        ${common.map(([k, v]) => `<tr class="common"><td>${esc(k)}</td><td>${esc(show(v))}</td></tr>`).join('')}</table>
        <div class="note">Значения выдуманы, это не запись из PostHog. ${common.length ? 'Серые строки показывают ожидаемый контекст; наличие каждого поля нужно проверить на конкретной сборке. coppa_strict — технический режим приватности, а не способ определить возраст или роль. ' : ''}Да и нет хранятся как true и false.</div></div>`;
    }

    function openEvent(name) {
      const e = evByName[name];
      if (!e) return;
      name = e.name;
      const s = st(e.status);
      const dom = domains[e.domain];
      hd.innerHTML = `<div class="pd-pills"><span class="pd-pill ${esc(e.side)}">${esc(whoOf(e))}</span>${dom ? `<span class="pd-pill">${esc(dom.title)}</span>` : ''}${e.prio ? `<span class="pd-pill" title="Очередь работ: P0 — нужно для главных воронок, P1 — следующий шаг, P2 — потом">${esc(e.prio)}</span>` : ''}</div>
        <div class="pd-big">${esc(e.title)}</div><div class="pd-nameline">${e.source === 'oyna' ? 'единое имя OYNA (snake_case)' : 'служебное имя интеграции'}: <span class="pd-name">${breakable(e.name)}</span></div>`;
      const find = e.name === '$screen' ? 'Activity → Live events → событие «$screen», свойство $screen_name — имя экрана.'
        : e.status === 'server' ? 'Activity → Live events → поиск «rc_» (если интеграция RevenueCat включена).'
        : `Activity → Live events → поиск «${esc((e.current_names || [])[0] || e.name)}».`;
      let h = `<div class="pd-now st-${esc(e.status)}"><b>Состояние реализации: ${esc(s.icon)} ${esc(s.label)}</b>${esc(s.text)} Получение события в рабочем PostHog не проверено.</div>`;
      if (e.name === 'analytics_consent_enabled') h += '<h4>Простыми словами</h4><p>В приложении включился разрешающий флаг для аналитики. Новое имя analytics_consent_enabled описывает именно этот технический факт. В старом имени COPPA — сокращение названия американского закона о защите детских данных: <a href="https://www.ftc.gov/legal-library/browse/statutes/childrens-online-privacy-protection-act" target="_blank" rel="noopener noreferrer">Children’s Online Privacy Protection Act</a>. Событие фиксирует технический флаг; само по себе оно не доказывает юридическую достаточность согласия.</p>';
      if (e.source === 'oyna') {
        const history = e.legacy_names || [];
        h += `<div class="pd-now st-ready"><b>${history.length ? 'Новое имя — после выпуска приложения' : 'Единый формат: snake_case'}</b>${history.length
          ? `Прежние имена из кода или плана: <code>${history.map(breakable).join(', ')}</code>. Наличие в списке не доказывает, что они выпускались или получались. Новое имя: <code>${breakable(e.name)}</code>. Для истории объединяйте подтверждённые варианты в одну Action: ${(e.report_names || []).map(n => `<code>${breakable(n)}</code>`).join(' ИЛИ ')}. Приложение отправляет только одно новое имя.`
          : e.previous_name ? `Раньше в плане: <code>${breakable(e.previous_name)}</code>. В новой сборке отправляться будет <code>${breakable(e.name)}</code>.` : 'Это имя уже соответствует правилу и остаётся прежним.'}</div>`;
      } else h += `<p class="pd-find">Имя задаёт ${e.source === 'revenuecat' ? 'RevenueCat' : 'PostHog'}; приложение OYNA его не переименовывает.</p>`;
      if (s.today !== false) h += `<div class="pd-find">Как найти: ${find}</div>`;
      h += `<h4>Когда отправляется</h4><p>${esc(e.when)}</p>`;
      h += `<h4>Пример по единому плану (после обновления)</h4>${sampleRow(e)}`;
      if (e.why) h += `<h4>Зачем</h4><p>${esc(e.why)}</p>`;
      if (e.fix) h += `<h4>${e.status === 'improved' ? 'Что исправлено' : e.status === 'fix' ? 'Недочёт — как читать' : 'Важно'}</h4><p class="fixbox">${esc(e.fix)}</p>`;
      if ((e.props || []).length) {
        h += `<h4>Свойства — подробности события</h4><table class="props">` + e.props.map(p =>
          `<tr><td>${esc(p.n)}</td><td><div>${esc(p.d)}</div>${p.t ? `<div class="ty">${esc(p.t)}</div>` : ''}</td></tr>`).join('') + `</table>`;
      }
      if (e.side !== 'system' && e.status !== 'server') h += `<p class="muted" style="margin-top:8px">Плюс общие свойства на каждом событии: приложение и сборка, роль, семья, тариф семьи, страна, язык, версия.</p>`;
      const scr = screensOf(name);
      if (scr.length) {
        h += `<h4>Где в приложении</h4><div class="evs">${scr.map(x => scrChip(x.id)).join('')}</div>`;
        const keys = [...new Set(scr.flatMap(x => x.cards || []))];
        if (keys.length) h += shots(keys);
      }
      const fs = funnelsOf(name);
      if (fs.length) h += `<h4>В воронках</h4>` + fs.map(f => `<a class="lnk" href="${analyticsBase}#${esc(f.id)}" data-go="${esc(f.id)}">${esc(f.title)} →</a>`).join('');
      if (e.note) h += `<h4>Заметка</h4><p>${esc(e.note)}</p>`;
      if (dom && dom.note) h += `<p class="muted">${esc(dom.note)}</p>`;
      if (e.code) h += `<h4>Для разработчиков</h4><p><code>${esc(e.code)}</code></p>`;
      body.innerHTML = h; present();
    }
    function openScreen(id) {
      const s = scrById[id];
      if (!s) return;
      hd.innerHTML = `<div class="pd-pills"><span class="pd-pill">${s.sheet ? 'лист поверх экрана' : s.untracked ? 'не приходит' : 'просмотр экрана'}</span><span class="pd-pill ${esc(s.side)}">${esc(SIDE[s.side] || 'все')}</span></div>
        <div class="pd-big">${esc(s.title)}</div><div class="pd-nameline">${s.sheet || s.untracked ? 'имя в плане' : 'имя экрана в PostHog ($screen_name)'}: <span class="pd-name">${esc(s.id)}</span></div>`;
      let h = s.sheet ? `<h4>Как приходит</h4><p>Это лист поверх другого экрана, а не отдельный экран: просмотра нет, его открытие видно по событиям ниже.</p>`
        : s.untracked ? `<h4>Как приходит</h4><p>Трекер аналитики ещё не запущен; просмотр этого экрана не предусмотрен до включения флага согласия.</p>`
        : `<h4>Как приходит</h4><p>Событие <code>$screen</code> со свойством <code>$screen_name = ${esc(s.id)}</code> — отправляется само, когда экран открылся (маршрут <code>${esc(s.route || '')}</code>). ${statusWord('$screen')}</p>`;
      if (s.note) h += `<p>${esc(s.note)}</p>`;
      if ((s.events || []).length) h += `<h4>События на этом экране</h4><div class="evs">${s.events.map(chip).join('')}</div>`;
      if ((s.cards || []).length) h += `<h4>Как выглядит</h4>` + shots(s.cards);
      body.innerHTML = h; present();
    }
    function openFromChip(el) {
      if (el.dataset.ev) openEvent(el.dataset.ev); else if (el.dataset.scr) openScreen(el.dataset.scr);
    }
    return { chip, scrChip, chipsHtml, legendHtml, statusLabel, statusWord, whoOf, openEvent, openScreen, openFromChip, close,
      isOpen: () => pd.classList.contains('on'), evByName, scrById };
  }

  global.OynaPlanUi = { create };
})(window);

</script>

"go": "f-core"}]}, {"title": "Продукт: вовлечённость", "sub": "основные действия", "items": [{"name": "Создания заданий на активную семью", "formula": "Число quest_created ÷ активные семьи за тот же период. Создание не равно выполнению.", "events": ["quest_created"]}, {"name": "Отправки на отправлявшего ребёнка", "formula": "Число quest_submitted ÷ уникальные child_id с этим событием в том же периоде. Сдачи из чата покрыты не полностью.", "events": ["quest_submitted"]}, {"name": "Время проверки", "formula": "Медиана непустых time_to_approve_minutes с source=review. Вместе показывать число измеренных одобрений и долю без времени; Фоксик не покрыт.", "events": ["quest_approved"]}, {"name": "Доля решений о доработке", "formula": "Количество quest_returned_for_rework ÷ (quest_approved + quest_returned_for_rework) за тот же период. Это доля решений, не уникальных заданий; одна сдача может возвращаться.", "events": ["quest_returned_for_rework", "quest_approved"]}, {"name": "Одобрения наград на активную семью", "formula": "reward_approved ÷ активные семьи за тот же период. Физическая передача подарка не измеряется.", "events": ["reward_approved"], "go": "f-rewards"}]}, {"title": "Продукт: монетизация", "sub": "покупка и финансовые записи", "items": [{"name": "Конверсия посетителя подписки", "formula": "Уникальные родители с подтверждённой покупкой за 24 часа после просмотра ÷ уникальные родители этой когорты просмотров. Не отношение сырых чисел событий.", "events": ["paywall_viewed", "subscription_purchase_confirmed"], "go": "f-paywall"}, {"name": "Платящие семьи", "formula": "Состояние платной подписки по family_id на выбранную дату: Store в RevenueCat, Paylov в backend/Paylov. Исключить пробные, истёкшие и неоплаченные по подтверждённым статусам.", "events": ["subscription_purchase_confirmed", "rc_initial_purchase_event"]}, {"name": "Выручка, продления и отмены", "formula": "Store — финансовые данные RevenueCat/магазинов; Paylov — его платежные записи. Согласовать валюту, возвраты и период. Цена из события приложения не заменяет выручку.", "events": ["rc_initial_purchase_event"]}]}, {"title": "Продукт: удержание", "sub": "повторная польза", "items": [{"name": "Возврат родителя D1 / D7 / D30", "formula": "Первое family_setup_completed → действие родителя quest_created или quest_approved в конкретный день 1, 7, 30. Открытие приложения — отдельный более слабый сигнал.", "events": ["family_setup_completed", "quest_approved"], "go": "retention"}, {"name": "Ребёнок через 1 и 4 недели", "formula": "Первый log_in с role=child → quest_submitted в неделе 1 или 4; одна детская идентичность и завершённое окно наблюдения.", "events": ["log_in", "quest_submitted"], "go": "retention"}, {"name": "Удержание семьи", "formula": "Первое семейное quest_approved → одобрение той же семьи на последующих календарных неделях; считать family, фиксировать часовой пояс.", "events": ["quest_approved"], "go": "retention"}, {"name": "Возврат к Фоксику ребёнка", "formula": "Первый успешный child_ai_reply_received → успешный child_ai_reply_received на следующей неделе. На общем телефоне нужны детские идентификаторы.", "events": ["child_ai_reply_received"], "go": "retention"}]}]}, "docsBefore": [{"id": "retention", "kicker": "Удержание", "title": "Возвращаются ли после первого результата", "sub": "Отдельные Retention-отчёты. Открыть → написать в один день не означает вернуться через неделю.", "cols": 3, "cards": [{"html": "<h3>Родитель</h3><p>Старт — первое <code>family_setup_completed</code>. Возврат — <code>quest_created</code> или <code>quest_approved</code> с <code>role=parent</code>.</p><p>D1 / D7 / D30 — действие в конкретный день 1, 7 или 30, а не в любой день до него. Один часовой пояс и только завершённые окна наблюдения.</p><p>Application Opened — отдельный показатель открытия аккаунта/устройства: на общем телефоне приложение мог открыть ребёнок.</p>"}, {"html": "<h3>Ребёнок</h3><p>Старт — первый <code>log_in</code>, <code>role=child</code>; возврат — <code>quest_submitted</code> на неделе 1 или 4. Укажите границы недель и часовой пояс.</p><p>Это дети с отдельным входом. На общем телефоне person принадлежит родителю; для детского отчёта нужен child_id, а не число таких person.</p><p>Для Фоксика отдельно: первый <code>child_ai_reply_received</code> → тот же успешный ответ на следующей неделе. Отправка при закрытом экране покрыта не полностью.</p>"}, {"html": "<h3>Семья</h3><p>Первое <code>quest_approved</code> → <code>quest_approved</code> в последующие календарные недели, по группе <code>family</code>.</p><p>Без групп — SQL по family_id с теми же окнами; люди не заменяют семьи. Старые и новые имена объединить в Action для каждого отчёта.</p><p>Платящих определять по подписке в момент старта когорты, сверяя Store и Paylov; текущее tier не годится как исторический статус.</p>"}]}], "docsAfter": [{"id": "status", "kicker": "Статус", "title": "Что проверено и чего пока не хватает", "sub": "Проверен локальный код на 2 октября 2026. Выпуск приложения, приём production-событий и настройки кабинетов не подтверждены.", "cols": 2, "cards": [{"html": "<h3>В локальной доработке</h3><p>Единые snake_case-имена, просмотры маршрутов, environment, отправка заданий/наград у родителя, сигналы оплаты и family_id первых событий.</p><p>Соседние рабочие копии отличаются: исправления нужно объединить без потери актуального интерфейса и проверить в выпущенной сборке.</p>"}, {"html": "<h3>Перед использованием отчётов</h3><ul><li>Проверить получение событий, роли, family_id и дубликаты на действующей сборке.</li><li>Проверить доступность Group analytics; без групп — SQL по семье.</li><li>Настроить исключение реальных тестовых аккаунтов, а не production-приложения.</li><li>В каждом отчёте объединить подтверждённые старые и новые имена.</li><li>Проверить интеграцию RevenueCat → PostHog и её идентификаторы; состояние Meta-интеграции неизвестно.</li></ul>"}, {"html": "<h3>Пробелы измерения</h3><ul><li>Передача приглашения, часть входов по ссылке/QR и режим общего телефона.</li><li>Сдача задания из чата, лимит ребёнка и точный источник подписки из Фоксика.</li><li>Открытие пуша и связь с его целью; маркетинговая кампания → родитель → семья.</li><li>Общие идентификаторы задания/сдачи и запроса награды для точных циклов.</li></ul>"}, {"html": "<h3>Отдельные проверки</h3><ul><li>Store-платежи и Paylov сверять отдельно, затем объединять по семье.</li><li>Убрать свободный текст из всех путей событий, проверить удаление данных после удаления аккаунта.</li><li>Уточнить финансовые статусы, валюты и роль текущего tier; не выдавать его за историю оплаты.</li><li>Собрать отчёты, дать нужный доступ и записать дату проверки. Этот план не утверждает, что кабинеты уже настроены.</li></ul>"}]}, {"id": "rules", "kicker": "Правила", "title": "Как не получить неверные цифры", "sub": "Единица подсчёта, фильтры, история имён и границы данных.", "cols": 3, "cards": [{"html": "<h3>Сборки и тесты</h3><p>В отчёте <b>включаем</b> события <code>$app_namespace = com.oynaplatform.app</code>: это отделяет OYNA Dev, но само по себе не исключает тестировщиков и debug-сборки с тем же именем приложения. После выпуска новой отправки дополнительно включаем <code>environment = prod</code>. <code>dev</code>, <code>debug</code> и <code>qa</code> исключаем. <b>В настройку «Filter out internal and test users» заносят именно тестовые аккаунты и сборки; равенство production-приложению туда ставить нельзя — оно исключит нужных пользователей.</b> Старые события и первые служебные события запуска могут не иметь <code>environment</code>: показывайте их отдельным историческим сегментом с оговоркой, иначе новый фильтр их удалит. События RevenueCat фильтруйте по подтверждённому признаку магазина/sandbox: мобильных свойств у них может не быть.</p>"}, {"html": "<h3>Согласие и детские данные</h3><p><code>analytics_consent_enabled</code> простыми словами — приложение увидело разрешённый флаг согласия в этом запуске. COPPA — название закона США о детских данных; событие само по себе не подтверждает законность согласия.</p><p><code>coppa_strict</code> — технический режим приватности; false не означает обязательно взрослого. Для роли используйте role.</p><p>Требование: не отправлять имена, фото, даты рождения и свободный текст. Полнота ещё не подтверждена: в проверяемой аналитической ветке у quest_submitted остаётся текст задания; в соседней работе есть исправление, которое нужно объединить и проверить.</p><p>SDK аналитики запускаются после разрешённого флага; другие службы приложения имеют свой запуск. Удаление данных PostHog после удаления аккаунта требует отдельной проверки.</p>"}, {"html": "<h3>Имена и история</h3><p>События OYNA: snake_case, например quest_approved. Свойства тоже snake_case. Служебные имена PostHog/RevenueCat сохраняются.</p><p>В каждом отчёте — воронке, Trends и Retention — объедините новое имя и указанные исторические имена одной Action. Новое имя не переименовывает старые записи.</p><p>plan_tier — выбранный или купленный тариф; tier — контекст семьи, который может быть неточным. Не использовать его как финансовый реестр.</p>"}, {"html": "<h3>Люди, дети и семьи</h3><p>Unique users считает идентификаторы PostHog. На отдельном телефоне ребёнок имеет child_…; на общем телефоне остаётся номер родителя.</p><p>Family соединяет родителя и детей. Шаги могут относиться к разным заданиям, детям и наградам; точный цикл одного объекта требует его идентификатора на всех шагах.</p><p>Без групп — SQL по family_id с порядком и окном. Заменять семейную воронку людьми нельзя.</p>"}, {"html": "<h3>Период и готовность</h3><p>Выберите часовой пояс, когорту и полное окно наблюдения. Последние 7 дней и календарная неделя — разные периоды.</p><p>Проверка кода не означает получение в production. Нет события или поля — «нет данных», не 0 %. Указывайте дату проверки и версию сборки.</p>"}, {"html": "<h3>Как проверить отправку</h3><ol><li>В OYNA Dev выполните действие.</li><li>В PostHog Live events отберите DEV-приложение.</li><li>Сверьте имя, свойства, роль и family_id; повторите общий телефон и отдельный детский вход.</li><li>Отдельно проверьте выпущенную production-сборку и сохранённый отчёт.</li></ol>"}]}, {"id": "dashboards", "kicker": "PostHog", "title": "Какие отчёты собрать", "sub": "План отчётов. Они не объявлены созданными или проверенными. Для каждого: источник, фильтры, период, часовой пояс и полнота.", "cols": 3, "cards": [{"html": "<h3>1. Маркетинг</h3><ul><li>Страница и установки — отдельно по магазинам и источникам.</li><li>Расход на связанную установку (CPI).</li><li>UTM → новая семья → покупка: пока недоступно, нужна атрибуция родительского пути.</li></ul>"}, {"html": "<h3>2. Активация</h3><ul><li>Родитель → созданная семья → главная.</li><li>Семья → отдельный вход ребёнка; общий телефон отдельно.</li><li>Первое одобрение в течение 7 дней от создания семьи.</li></ul>"}, {"html": "<h3>3. Основной сценарий</h3><ul><li>Семьи с одобрением за 7 завершённых дней.</li><li>Отправка → одобрение; доля решений о доработке.</li><li>Запрос награды → одобрение; магазин и чат как разные входы.</li></ul>"}, {"html": "<h3>4. Подписка и деньги</h3><ul><li>Просмотр → начало оплаты → подтверждение, по источнику.</li><li>Ошибки, отмены и pending отдельно.</li><li>Store — RevenueCat; Paylov — backend/Paylov; сверка семей и валют.</li></ul>"}, {"html": "<h3>5. Возврат</h3><ul><li>Удержание родителей, детей и семей — отдельные единицы подсчёта.</li><li>Пуш: отправка → открытие, затем открытие → цель; пока нужны события и ключи связи.</li></ul>"}, {"html": "<h3>6. Фоксик и качество данных</h3><ul><li>Открытие → успешный ответ; ошибки и отказы отдельно.</li><li>Полезные действия карточками и советы недели отдельно.</li><li>Возврат через неделю; лимит → атрибутированная покупка пока с пробелом источника.</li><li>Получение событий, дубликаты, пропуски family_id и старые/новые имена.</li></ul>"}]}, {"id": "marketing", "kicker": "Маркетинг", "title": "Какие маркетинговые вопросы уже описаны, а где нужны данные", "sub": "Метки ссылки сами по себе не связывают установку с новой семьёй. Настройки кабинетов здесь не проверены.", "cols": 2, "cards": [{"full": true, "html": "<h3>Источник и граница измерения</h3><table><tr><th>Вопрос</th><th>Источник</th><th>Ограничение</th></tr><tr><td>Кто увидел и установил</td><td>App Store Connect / Play Console</td><td>Разные определения; сравнивать внутри отчёта.</td></tr><tr><td>Создание семьи и действия</td><td>PostHog</td><td>Получение и идентификаторы нужно проверить.</td></tr><tr><td>Цена установки</td><td>Расход канала ÷ связанные установки</td><td>Один канал, период и модель атрибуции.</td></tr><tr><td>Цена новой семьи</td><td>Расход ÷ связанные новые семьи</td><td>Связь кампании с семьёй ещё не подключена.</td></tr><tr><td>Покупки и продления</td><td>Store: RevenueCat; Paylov: backend/Paylov</td><td>Единая сверка по семье, валюте и периоду.</td></tr><tr><td>Возврат по пушу</td><td>Журнал отправок + push_opened + целевое действие</td><td>Событие открытия и связь с целью ещё нужны.</td></tr></table>"}, {"html": "<h3>Шаблоны ссылок кампаний</h3><p>App Store: provider-token выдаётся в кабинете; пример нужно заменить данными кампании.</p><pre>https://apps.apple.com/app/apple-store/id6762140001?pt=&lt;provider-token&gt;&amp;ct=202610_uz_instagram_launch&amp;mt=8</pre><p>Google Play: передать метки в referrer.</p><pre>https://play.google.com/store/apps/details?id=com.oynaplatform.app&amp;referrer=utm_source%3Dinstagram%26utm_medium%3Dpaid_social%26utm_campaign%3D202610_uz_launch</pre><p>Сайт: <code>utm_source=telegram&amp;utm_medium=post&amp;utm_campaign=202610_kz_school</code>. Переходы в магазин должны сохранять метки.</p><p>Чтение Install Referrer для приглашений есть в коде, но перенос маркетинговой кампании в события родителя/семьи не подтверждён.</p>"}, {"html": "<h3>Единые UTM</h3><p><code>utm_source</code> — instagram, telegram, google, school_…; <code>utm_medium</code> — paid_social, organic_social, referral, push; <code>utm_campaign</code> — 202610_uz_launch; <code>utm_content</code> — video_fox_15s.</p><p>Для новых меток — латиница, нижний регистр, подчёркивания; старые значения сохраняем таблицей соответствий.</p><p>До отчёта о цене семьи нужно выбрать first-touch или last-touch, окно атрибуции, правила нескольких устройств и семьи. Сейчас такая сквозная атрибуция не заявлена готовой.</p>"}, {"html": "<h3>Реклама, ссылки и следующие шаги</h3><p>По коду Meta App Events ограничен родительским путём после согласия; реальное получение и интеграция RevenueCat → Meta не проверены.</p><p>Планируемое <code>deep_link_opened</code> может фиксировать разрешённые UTM, но не решает само по себе перенос источника через установку. Детские действия не следует использовать как родительскую рекламную аудиторию.</p><p>Пуши: <code>campaign_id</code> и <code>push_id</code> нужно связать с адресатом, открытием и конкретной целью. Само <code>?source=push</code> сообщает источник экрана, а не причинный эффект рассылки.</p><p>Ответ «Откуда узнали?» может дополнить источники, но не заменяет техническую атрибуцию.</p>"}]}, {"id": "push-truth", "kicker": "Как работают пуши", "title": "Доставка, открытие и результат — три разные проверки", "sub": "Проверено 2 октября 2026: серверные записи — только чтение; маршруты — код и тесты. Полный проход на физическом телефоне не подтверждён.", "cols": 2, "cards": [{"html": "<h3>1. Уведомление отправляется</h3><p>Сервер выбирает получателя и отправляет сообщение в FCM. Есть реальные подтверждения приёма для родителей и детей. Но приём FCM ещё не означает, что телефон показал уведомление.</p><p>Отдельно учитываются отсутствие активного токена, ограничения запросов и отказ FCM. Нельзя сводить эти причины в одну «нет токенов».</p>"}, {"html": "<h3>2. Нажатие открывает экран</h3><p>В приложении используется <b>GoRouter</b>. Адрес из уведомления проходит те же проверки роли, входа и PIN, что обычный переход.</p><p>Локально исправлены потеря адреса во время входа/PIN и открытие каталога вместо заявок на награды. Исправления нужны в следующей сборке. Проверки маршрутов не заменяют проверку доставки на телефон.</p>"}, {"html": "<h3>3. Открытие попадает в журнал</h3><p>Операционная запись <code>opened_at</code> существует и имеет реальные срабатывания. Будущее <code>push_opened</code> — отдельное событие для PostHog. Его отсутствие не означает, что уведомления не открываются.</p><p>Отправки считайте по факту приёма и времени <code>sent_at</code>, открытия — по <code>opened_at</code>. Один текущий статус записи не описывает всю её историю.</p>"}, {"html": "<h3>4. Пользователь выполнил цель</h3><p>Открыть экран и выполнить задание — разные результаты. Для части кампаний цель «открыть/выполнить задание» не связана с отметкой конверсии. Их нулевые значения пока не означают отсутствие результата.</p><p>До отчёта об эффективности нужны проверенные ключи отправки, адресата и нужного действия, окно времени и проверка записи результата. Не объявляйте такую воронку готовой.</p>"}]}], "primer": {"title": "Азбука: три слова и где их смотреть", "sub": "Прочитайте это первым. Дальше на странице — те же вещи на настоящих экранах OYNA.", "cards": [{"icon": "📍", "title": "Событие", "text": "Запись о факте в приложении. После успешного одобрения код отправляет quest_approved; получение сервером проверяют отдельно. Все строчки по порядку — это лента событий.", "feed": [["День 1, 10:02", "Мама", "analytics_consent_enabled", "дала согласие"], ["День 1, 10:05", "Мама", "parent_registration_started", "начала регистрацию"], ["День 1, 18:40", "Алина", "log_in", "вошла по коду"], ["День 2, 18:34", "Мама", "quest_approved", "одобрила задание"]]}, {"icon": "🏷", "title": "Имя события и свойства", "text": "Имя — короткое английское слово: что случилось (quest_approved — «задание одобрено»). Свойства — подробности этой строчки: сколько монет, было ли фото, сколько ждал ребёнок.", "example": ["quest_approved", [["coins", "250", "сколько монет начислено"], ["had_photo", "true", "было ли фото (true — да, false — нет)"], ["time_to_approve_minutes", "42", "сколько ребёнок ждал проверки"]]]}, {"icon": "🔻", "title": "Воронка", "text": "Несколько событий по порядку. Берём всех, кто сделал шаг 1, и смотрим, сколько из них дошли до шага 2, 3, 4. Где следующий шаг встречается реже — там ищем причину: другой путь, ошибка, пробел данных или уход. Пример ниже выдуман, это не показатели OYNA.", "bars": [["Создали задание", 100], ["Ребёнок открыл", 80], ["Ребёнок сделал", 60], ["Родитель одобрил", 45]]}, {"icon": "🔎", "title": "Где это смотреть", "text": "События приложения проверяют в PostHog (us.posthog.com, проект OYNA); статистику магазинов и деньги — в своих источниках.", "where": [["Activity → Live events", "лента событий в реальном времени — проверить, что событие пришло"], ["Product analytics → New insight → Funnels", "построить воронку с этой страницы"], ["Persons / Groups → family", "идентификатор пользователя или семья; общий телефон не разделяет детей по person"], ["Фильтры сборки и тестовых аккаунтов", "выбираем production в отчёте; в исключения добавляем тесты — см. «Правила»"]]}]}, "story": {"title": "История одной семьи: какие события появляются", "sub": "Выдуманный пример недели семьи. Под каждым действием — предусмотренное событие и статус кода, а не доказательство получения в production. Значения свойств — пример.", "steps": [{"t": "День 1, 10:02", "who": "parent", "text": "Мама скачала OYNA и подтвердила согласие", "ev": "analytics_consent_enabled", "card": "start-app-02", "props": {"language": "ru", "source": "first_run"}}, {"t": "10:03", "who": "parent", "text": "Выбрала «Я родитель» — открылся экран региона", "ev": "$screen", "screen": "parent_region", "card": "p-auth-app-00", "props": {"$screen_name": "parent_region"}}, {"t": "10:05", "who": "parent", "text": "Зарегистрировалась по номеру телефона (семьи ещё нет)", "ev": "parent_registration_started", "card": "p-auth-app-03", "props": {"method": "phone"}}, {"t": "10:09", "who": "parent", "text": "Сохранила анкету семьи с Алиной", "ev": "family_setup_completed", "card": "p-auth-app-13", "props": {"skipped": false, "country": "UZ", "language": "ru"}}, {"t": "10:10", "who": "parent", "text": "Открыла приглашение для Алины", "ev": "$screen", "screen": "parent_child_invite", "card": "p-family-app-02", "props": {"$screen_name": "parent_child_invite"}}, {"t": "18:40", "who": "child", "text": "Алина вошла по коду на своём телефоне", "ev": "log_in", "card": "c-onboarding-app-05", "props": {"role": "child", "method": "code"}}, {"t": "День 2, 08:15", "who": "parent", "text": "Мама создала задание из готовых", "ev": "quest_created", "card": "p-tasks-app-04", "props": {"source": "template", "kind": "daily", "coins": 250}}, {"t": "17:30", "who": "child", "text": "Алина открыла задание", "ev": "quest_opened", "card": "c-tasks-app-01", "props": {"review_state": "new", "is_custom": false}}, {"t": "17:52", "who": "child", "text": "Сфотографировала и отправила", "ev": "quest_submitted", "card": "c-tasks-app-05", "props": {"had_photo": true}}, {"t": "18:34", "who": "parent", "text": "Мама одобрила — Алине 250 монет", "ev": "quest_approved", "card": "p-review-app-01", "props": {"coins": 250, "time_to_approve_minutes": 42}}, {"t": "День 5, 16:00", "who": "child", "text": "Алина попросила награду — монеты отложены", "ev": "reward_requested", "card": "c-market-app-01", "props": {"price": 3000, "from": "market"}}, {"t": "16:20", "who": "parent", "text": "Мама одобрила запрос награды", "ev": "reward_approved", "card": "p-requests-app-01", "props": {"price": 3000, "wait_minutes": 20}}, {"t": "День 6, 21:10", "who": "parent", "text": "Хотела добавить второго ребёнка — бесплатно можно одного", "ev": "paywall_viewed", "card": "p-paywall-app-00", "props": {"trigger": "child_limit"}}, {"t": "21:12", "who": "parent", "text": "Приложение подтвердило покупку Premium на год", "ev": "subscription_purchase_confirmed", "card": "p-paywall-app-02", "props": {"plan_tier": "premium", "period": "annual", "method": "store"}}], "after": "После проверки получения по таким событиям строят отчёты: «семья создана в первый день» (шаги 1–4), «ребёнок подключён» (5–6), главная метрика — одобренное задание за неделю (10), подписка и её источник (13–14)."}, "glossary": {"title": "Словарь: слова с этой страницы и из PostHog", "sub": "Наведите на слово с пунктиром на странице — подсказка оттуда же.", "terms": [["Событие (event)", "Одна запись о том, что случилось: «родитель одобрил задание». В PostHog — одна строка ленты."], ["Имя события", "Как событие называется в PostHog, латиницей: quest_approved. По имени ищут и строят графики."], ["Свойство (property)", "Подробность события: coins = 250, had_photo = true. По свойствам фильтруют и делят на группы."], ["true / false", "Да и нет в PostHog: had_photo = true — фото было. Фильтр так и пишут: had_photo = true."], ["Просмотр экрана ($screen)", "Особое событие «открылся экран». Какой — в свойстве $screen_name: parent_home, child_market."], ["Человек (person)", "Идентификатор PostHog, не всегда отдельный человек: родитель и дети на общем телефоне используют номер родителя; на отдельном детском телефоне — child_<номер>."], ["Технический номер (uuid)", "Номер вроде 8f2c41d0-… связывает записи. Он не содержит имя, но может связываться с аккаунтом; это не гарантия анонимности."], ["Семья (группа family)", "Родитель и его дети вместе. Воронки «по семьям» считают шаги мамы и ребёнка как один путь."], ["Воронка (Funnel)", "Шаги в заданном порядке и окне. Меньше событий на следующем шаге может означать уход, другой путь или пробел измерения."], ["Конверсия", "Доля дошедших: 45 из 100 одобрили задание — конверсия 45 %."], ["Сколько ждём (conversion window)", "Сколько времени даём пройти воронку: «7 дней» — шаг через 8 дней уже не засчитается."], ["Разбить по (Breakdown)", "Та же воронка или график, разделённые по свойству: по стране, способу входа, источнику задания."], ["Тренд (Trends)", "График: сколько событий или людей по дням и неделям."], ["Удержание (Retention)", "Возвращаются ли люди: сколько из пришедших на неделе 1 вернулись на неделе 2, 4…"], ["D1 / D7 / D30", "Доля вернувшихся через 1, 7 и 30 дней после первого дня."], ["Когорта", "Группа людей с общим признаком: «пришли в октябре», «платящие семьи»."], ["Главная метрика (North Star)", "Выбранный показатель основного сценария: уникальные семьи с одобрением задания за 7 завершённых дней. Не доказательство всей пользы продукта."], ["Медиана", "Середина: половина быстрее, половина медленнее. Честнее среднего, которое портит одно очень долгое ожидание."], ["trigger", "Откуда человек попал на экран подписки: из профиля, из лимита детей, из пуша…"], ["tier и plan_tier", "Тариф: free, premium, premium_ai. tier — тариф семьи сейчас; plan_tier — тариф, который выбирают или покупают на экране подписки."], ["$app_namespace", "Какое приложение прислало событие: com.oynaplatform.app — магазинное, com.oynaplatform.app.dev — OYNA Dev для тестов."], ["environment", "Какая сборка прислала событие: prod — магазинная, qa — внутренняя для тестов, debug и dev — у разработчиков. Со следующей сборки."], ["UTM, ct=, referrer", "Подписи в рекламной ссылке: по ним видно, откуда пришёл человек (Instagram, блогер, школа)."], ["ASO", "Работа над страницей приложения в магазине: иконка, скриншоты, описание, отзывы."], ["CTR / доля открытий", "Связанные уникальные открытия ÷ соответствующие отправки. Для пушей нужны push_id и одинаковый знаменатель; отправка не означает доставку."], ["P0 / P1 / P2", "Очередь работ: P0 — нужно для главных воронок, P1 — следующий шаг, P2 — потом."], ["COPPA", "Название закона США о конфиденциальности детских данных. В имени события OYNA означает техническое подтверждение флага согласия, а не проверку его юридической достаточности."], ["Фоксик в именах событий", "Фоксик — ИИ-помощник OYNA. parent_ai_… — родитель, child_ai_… — ребёнок. copilot_… и jey_… — прежние варианты для истории."], ["Магазин приложений и function el(tag, cls, parent) { const e = document.createElement(tag); if (cls) e.className = cls; (parent || board).appendChild(e); return e; }

function layout() {
  let y = 0, maxX = 0;
  for (const side of ['motion', 'common', 'parent', 'child']) {
    const h = el('div', 'side-h');

      (side === 'motion' ? `<small>${counts.motion} анимаций, каждая крутится по кругу</small>` : `<small>${counts.figma} кадров Figma · ${counts.app} экранов приложения` + (counts.motion ? ` · ${counts.motion} анимаций` : '') + (counts.device ? ` · ${counts.device} снимков с Android (живые данные DEV)` : '') + '</small>');
    h.style.left = '0px'; h.style.top = y + 'px';
    const head = { el: h, y, h: 0 }; sideHeads.push(head);
    y += 150;
    for (const s of secs) {
      const x0 = 0, top = y;
      const bg = el('div', 'sec-bg');
      const hd = el('div', 'sec-h');
      const n = s.rows.reduce((a, r) => a + r.cards.length, 0);
      hd.innerHTML = `<div class="t">${s.title}<span class="c">${n} ${s.side === 'motion' ? 'анимаций' : 'экранов'}</span></div>` + (s.note ? `<div class="note">${s.note}</div>` : '') +

      hd.style.left = (x0 + 36) + 'px'; hd.style.top = (y + 28) + 'px';
      secPos[s.id] = { x: x0, y: top };
      y += (s.note ? 120 : 96) + (s.dev ? (s.dev.length > 120 ? 58 : 34) : 0);
      let secW = 0;
      for (const r of s.rows) {
        if ((r.kind === 'device' || r.kind === 'motion') && !r.cards.length) continue;
        const lab = el('div', 'row-l r-' + r.kind);
        lab.innerHTML = r.title ? `<span class="dot" style="background:${COLORS[r.kind]}"></span>${r.title}` : '';
        lab.style.left = (x0 + 36) + 'px'; lab.style.top = (y + 8) + 'px';
        let x = x0 + 36 + LABEL_W, rowH = 0;
        if (!r.cards.length) {
          const e = el('div', 'row-empty r-' + r.kind);
          e.textContent = r.kind === 'figma' ? 'Отдельного кадра в Figma нет — экран собран по общему стилю флоу' : 'В приложении нет — будущее';
          e.style.left = x + 'px'; e.style.top = (y + 8) + 'px';
          rowH = 40;
        }
        const list = [];
        r.cards.forEach((c, i) => {
          const ratio = c.h / c.w, shown = Math.min(ratio, MAXR);
          const ch = Math.round(CW * shown);
          const card = el('div', 'card ' + r.kind + ' r-' + r.kind);
          card.style.left = x + 'px'; card.style.top = y + 'px'; card.style.width = CW + 'px'; card.style.height = ch + 'px';
          card.innerHTML = (ratio > MAXR + 0.05 ? '<span class="tall">↕ длинный экран</span>' : '') + (r.kind === 'motion' ? '<span class="play">▶ анимация</span>' : '');
          card.dataset.label = (s.title + ' ' + c.label).toLowerCase();
          const an = CARD_AN[c.key];
          if (an && (r.kind === 'app' || r.kind === 'device')) {
            card.classList.add('has-an');
            const tag = document.createElement('div'); tag.className = 'an-tag';
            tag.innerHTML = planUi.chipsHtml(an.screens, an.events);
            tag.addEventListener('click', ev => { ev.stopPropagation(); const chip = ev.target.closest('[data-ev],[data-scr]'); if (chip && !cam.moved) planUi.openFromChip(chip); });
            card.appendChild(tag);
            card.dataset.label += ' ' + an.events.join(' ').toLowerCase() + ' ' + an.screens.join(' ').toLowerCase();
          }
          const cap = el('div', 'cap r-' + r.kind);
          const freshness = c.capture.kind === 'current_widget_render' ? ' · ' + String(c.capture.captured_at || '').slice(5, 10).split('-').reverse().join('.') : r.kind === 'figma' ? '' : ' · архив';
          cap.innerHTML = `<span class="k" style="background:${COLORS[r.kind]}"></span>${c.label}${freshness}`;
          cap.style.left = x + 'px'; cap.style.top = (y + ch + 8) + 'px'; cap.style.width = CW + 'px'; cap.style.height = CAP_H + 'px';
          card.addEventListener('click', () => { if (!cam.moved) openLb(s, r, i); });
          list.push({ card, cap, c });
          CARDS.push({ el: card, key: c.key, kind: r.kind, x, y, w: CW, h: ch, lod: -1, img: null, want: null });
          rowH = Math.max(rowH, ch + CAP_H + 10);
          x += CW + GAP;
        });
        cardsByRow.push(list);
        secW = Math.max(secW, x - x0);
        y += rowH + 26;
      }
      y += 20;
      bg.style.left = x0 + 'px'; bg.style.top = top + 'px'; bg.style.width = (secW + 20) + 'px'; bg.style.height = (y - top) + 'px';
      secList.push({ id: s.id, side: s.side, title: s.title, x: x0, y: top, w: secW + 20, h: y - top, labelEl: hd.querySelector('.t') });
      maxX = Math.max(maxX, secW + 20);
      y += 60;
    }
    head.h = y - head.y;
    y += 140;
  }
  board.style.width = maxX + 'px'; board.style.height = y + 'px';
}

// ── Pictures by zoom: none far out, still posters, thumbnails, full ─────
// While the camera moves only the light still posters load; the thumbnails
// (a looping animation can weigh 300 KB) and full pictures load once it
// stops, nearest to the centre first, and a load the camera has left behind
// is cancelled — a long flight never queues the pictures it flew past.
const LOD_T = [0.13, 0.38, 1.25];
function lodFor(z) { return z < LOD_T[0] ? 0 : z < LOD_T[1] ? 1 : z < LOD_T[2] ? 2 : 3; }
function cancel(rec) { if (rec.pending) { rec.pending.onload = null; rec.pending.src = ''; rec.pending = null; } }
function want(rec, lod, lite) {
  if (lod <= 0) { cancel(rec); rec.el.style.backgroundImage = ''; if (rec.img) { rec.img.remove(); rec.img = null; } rec.want = null; rec.lod = lod; return; }
  if (rec.lod < 1) rec.el.style.backgroundImage = `url(img/${rec.key}_s.webp)`;
  rec.lod = lod;
  if (lod === 1) { cancel(rec); if (rec.img) { rec.img.remove(); rec.img = null; } rec.want = null; return; }
  const src = lod === 3 ? `img/${rec.key}.webp`
    : lite && rec.kind === 'motion' ? `img/${rec.key}_m.webp` : `img/${rec.key}_t.webp`;
  if (rec.want === src) return;
  cancel(rec);
  rec.want = src;
  const img = new Image();
  img.className = 'pic'; img.decoding = 'async'; img.alt = '';
  img.onload = () => { rec.pending = null; if (rec.want !== src) return; if (rec.img) rec.img.remove(); rec.img = img; rec.el.prepend(img); };
  rec.pending = img;
  img.src = src;
}
// Far out, each section title grows to stay readable (≈16 px on screen) but
// never past three quarters of its own section, so titles don't overlap.
function farLabels(s) {
  const far = s.z < 0.3;
  for (const sec of secList) {
    if (!sec.labelEl) continue;
    if (!far) { sec.labelEl.style.transform = ''; continue; }
    const px = Math.min(17, 0.7 * sec.h * s.z), k = Math.max(1, px / (30 * s.z));
    sec.labelEl.style.transform = `scale(${k.toFixed(3)})`;
  }
  for (const h of sideHeads) h.el.style.transform = far ? `scale(${Math.max(1, Math.min(26, 0.5 * h.h * s.z) / (64 * s.z)).toFixed(3)})` : '';
}
let lastLod = 0;
function updateLod(s, settled) {
  const now = performance.now();
  if (!settled && now - lastLod < 110) return;
  lastLod = now;
  const lod = lodFor(s.z);
  board.classList.toggle('lod0', lod === 0);
  board.classList.toggle('far', s.z < 0.3);
  farLabels(s);
  const mw = (s.right - s.left) * 0.5, mh = (s.bottom - s.top) * 0.6;
  const L = s.left - mw, R = s.right + mw, T = s.top - mh, B = s.bottom + mh;
  const hidden = { figma: document.body.classList.contains('hide-figma'), app: document.body.classList.contains('hide-app'),
    motion: document.body.classList.contains('hide-motion'), device: document.body.classList.contains('hide-device') };
  const near = [];
  for (const rec of CARDS) {
    if (rec.x < R && rec.x + rec.w > L && rec.y < B && rec.y + rec.h > T && !hidden[rec.kind]) near.push(rec);
    else if (rec.lod >= 2 || rec.pending) want(rec, 1);      // left behind: the poster only
  }
  const cx = (s.left + s.right) / 2, cy = (s.top + s.bottom) / 2;
  const d = rec => Math.hypot(rec.x + rec.w / 2 - cx, rec.y + rec.h / 2 - cy);
  near.sort((a, b) => d(a) - d(b));
  // A looping animation is worth its weight only close enough to see it:
  // a still poster far out, the light loop at middle zoom, the full one up close.
  const lite = s.z < 0.9;
  for (const rec of near) {
    const target = rec.kind === 'motion' && lod === 2 && s.z < 0.45 ? 1 : lod;
    // Moving, a card only gets its still poster; what it shows otherwise —
    // a light loop, a thumbnail, the full picture — changes once it settles.
    if (settled) want(rec, target, lite);
    else if (rec.lod < 1) want(rec, 1);
  }
  document.getElementById('zoomv').textContent = Math.round(s.z * 100) + '%';
}
cam.on('change', s => updateLod(s, false));
cam.on('settle', s => { updateLod(s, true); spy(s); });

// ── Minimap and "where am I" ───────────────────────────────────────────
const SIDE_COL = { motion: '#e0457b', common: '#9aa0a8', parent: '#ff8a1f', child: '#2aa7c9' };
cam.minimap(document.getElementById('map'),
  secList.map(s => ({ x: s.x, y: s.y, w: s.w, h: s.h, color: SIDE_COL[s.side] })),
  secList.map(s => ({ x: s.x, y: s.y, h: s.h, title: s.title, onClick: () => goSec(s.id) })));
function spy(s) {
  const cy = (s.top + s.bottom) / 2;

function goSec(id) {

// Lightbox with the Figma comparison.
const lb = document.getElementById('lb');
let cur = null, figIdx = {};
function figmaOf(s) { return (s.rows.find(r => r.kind === 'figma') || { cards: [] }).cards; }
function openLb(s, r, i) { cur = { s, r, i }; lb.classList.add('on'); showLb(); }
function showLb() {
  const { s, r, i } = cur, c = r.cards[i], figs = figmaOf(s);
  document.getElementById('lbT').textContent = `${c.label} — ${s.title}`;
  const capture = c.capture || {}, date = capture.captured_at ? String(capture.captured_at).slice(0, 10) : '';
  const freshness = capture.kind === 'current_widget_render' ? 'Текущий код · тестовые данные' : capture.kind === 'figma_reference' || r.kind === 'figma' ? 'Макет Figma · справочно' : 'Архивный захват · актуальность не подтверждена';
  document.getElementById('lbS').textContent = `${freshness}${date ? ' · ' + date : ''} · ${r.title} · ${i + 1} из ${r.cards.length} · ${c.w}×${c.h}`;
  document.getElementById('imgL').src = `img/${c.key}.webp`;
  document.getElementById('pLl').innerHTML = `<span class="dot" style="background:${COLORS[r.kind]}"></span>${r.title}: ${c.label}`;
  const an = CARD_AN[c.key];
  document.getElementById('lbAn').innerHTML = an ? planUi.chipsHtml(an.screens, an.events) : '<span style="color:#889">Для этого кадра событий нет</span>';
  const canCmp = r.kind !== 'figma' && figs.length > 0;
  document.getElementById('lbCmp').style.display = canCmp ? '' : 'none';
  if (!canCmp) lb.classList.remove('cmp');
  if (canCmp) {
    const k = Math.min(figIdx[s.id] || 0, figs.length - 1);
    document.getElementById('imgR').src = `img/${figs[k].key}.webp`;
    document.getElementById('pRl').textContent = 'Figma: ' + figs[k].label;
    const strip = document.getElementById('strip');
    strip.innerHTML = figs.map((f, j) => `<img src="img/${f.key}_t.webp" data-j="${j}" class="${j === k ? 'on' : ''}" title="${f.label}">`).join('');
    strip.querySelectorAll('img').forEach(im => im.onclick = () => { figIdx[s.id] = +im.dataset.j; showLb(); });
  }
}
document.getElementById('lbAn').addEventListener('click', e => { const chip = e.target.closest('[data-ev],[data-scr]'); if (chip) planUi.openFromChip(chip); });
function step(d) { if (!cur) return; const n = cur.r.cards.length; cur.i = (cur.i + d + n) % n; showLb(); }
document.getElementById('lbPrev').onclick = () => step(-1);
document.getElementById('lbNext').onclick = () => step(1);
document.getElementById('lbX').onclick = () => lb.classList.remove('on');
document.getElementById('lbCmp').onclick = () => { lb.classList.toggle('cmp'); showLb(); };
document.getElementById('lbFit').onclick = () => {
  const on = document.getElementById('pL').classList.toggle('fit');
  document.getElementById('pR').classList.toggle('fit', on);
  document.getElementById('lbFit').textContent = on ? 'Целиком' : 'Вписать';
};
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('panes')) lb.classList.remove('on'); });
window.addEventListener('keydown', e => {
  if (planUi.isOpen()) { if (e.key === 'Escape') planUi.close(); return; }
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') lb.classList.remove('on');
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

sideList();
// A link to a section on this page (#p-tasks) moves the camera there, and
// one from the event panel closes the panel.
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (secPos[id]) { planUi.close(); goSec(id); } else cam.restoreHash();
});
if (new URLSearchParams(location.search).get('an') === '1') setAn(true);
const startSec = location.hash.slice(1);
if (!cam.restoreHash()) {
  if (secPos[startSec]) goSec(startSec);
  else cam.flyTo(0, 0, 0.5, 30, 24);
}
updateLod(cam.state(), true);
spy(cam.state());
</script>
</body>
</html>
