      hd.innerHTML = `<div class="t">${s.title}<span class="c">${n} ${s.side === 'motion' ? 'анимаций' : 'экранов'}</span></div>` + (s.note ? `<div class="note">${s.note}</div>` : '') +
        (s.dev ? `<div class="dev">Отличается от Figma намеренно: ${s.dev}</div>` : '');
      hd.style.left = (x0 + 36) + 'px'; hd.style.top = (y + 28) + 'px';
      secPos[s.id] = { x: x0, y: top };
      y += (s.note ? 120 : 96) + (s.dev ? (s.dev.length > 120 ? 58 : 34) : 0);
      let secW = 0;
      for (const r of s.rows) {
        if ((r.kind === 'device' || r.kind === 'motion') && !r.cards.length) continue;
        const lab = el('div', 'row-l r-' + r.kind);
        lab.innerHTML = r.title ? `<span class="dot" style="background:${COLORS[r.kind]}"></span>${r.title}` : '';
        lab.style.left = (x0 + 36) + 'px'; lab.style.top = (y + 8) + 'px';
        let x = x0 + 36 + LABEL_W, rowH = 0;
        if (!r.cards.length) {
          const e = el('div', 'row-empty r-' + r.kind);
          e.textContent = r.kind === 'figma' ? 'Отдельного кадра в Figma нет — экран собран по общему стилю флоу' : 'В приложении нет — будущее';
          e.style.left = x + 'px'; e.style.top = (y + 8) + 'px';
          rowH = 40;
        }
        const list = [];
        r.cards.forEach((c, i) => {
          const ratio = c.h / c.w, shown = Math.min(ratio, MAXR);
          const ch = Math.round(CW * shown);
          const card = el('div', 'card ' + r.kind + ' r-' + r.kind);
          card.style.left = x + 'px'; card.style.top = y + 'px'; card.style.width = CW + 'px'; card.style.height = ch + 'px';
          card.innerHTML = (ratio > MAXR + 0.05 ? '<span class="tall">↕ длинный экран</span>' : '') + (r.kind === 'motion' ? '<span class="play">▶ анимация</span>' : '');
          card.dataset.label = (s.title + ' ' + c.label).toLowerCase();
          const an = CARD_AN[c.key];
          if (an && (r.kind === 'app' || r.kind === 'device')) {
            card.classList.add('has-an');
            const tag = document.createElement('div'); tag.className = 'an-tag';
            tag.innerHTML = planUi.chipsHtml(an.screens, an.events);
            tag.addEventListener('click', ev => { ev.stopPropagation(); const chip = ev.target.closest('[data-ev],[data-scr]'); if (chip && !cam.moved) planUi.openFromChip(chip); });
            card.appendChild(tag);
            card.dataset.label += ' ' + an.events.join(' ').toLowerCase() + ' ' + an.screens.join(' ').toLowerCase();
          }
          const cap = el('div', 'cap r-' + r.kind);
          cap.innerHTML = `<span class="k" style="background:${COLORS[r.kind]}"></span>${c.label}`;
          cap.style.left = x + 'px'; cap.style.top = (y + ch + 8) + 'px'; cap.style.width = CW + 'px'; cap.style.height = CAP_H + 'px';
          card.addEventListener('click', () => { if (!cam.moved) openLb(s, r, i); });
          list.push({ card, cap, c });
          CARDS.push({ el: card, key: c.key, kind: r.kind, x, y, w: CW, h: ch, lod: -1, img: null, want: null });
          rowH = Math.max(rowH, ch + CAP_H + 10);
          x += CW + GAP;
        });
        cardsByRow.push(list);
        secW = Math.max(secW, x - x0);
        y += rowH + 26;
      }
      y += 20;
      bg.style.left = x0 + 'px'; bg.style.top = top + 'px'; bg.style.width = (secW + 20) + 'px'; bg.style.height = (y - top) + 'px';
      secList.push({ id: s.id, side: s.side, title: s.title, x: x0, y: top, w: secW + 20, h: y - top, labelEl: hd.querySelector('.t') });
      maxX = Math.max(maxX, secW + 20);
      y += 60;
    }
    head.h = y - head.y;
    y += 140;
  }
  board.style.width = maxX + 'px'; board.style.height = y + 'px';
}

layout();
const cam = OynaCanvas.createCanvas({
  view, board, zMax: 3,
  keysBlocked: () => lb.classList.contains('on') || planUi.isOpen(),
  ignoreDblClick: e => !!e.target.closest('.card, .an-tag'),
});

// ── Pictures by zoom: none far out, still posters, thumbnails, full ─────
// While the camera moves only the light still posters load; the thumbnails
// (a looping animation can weigh 300 KB) and full pictures load once it
// stops, nearest to the centre first, and a load the camera has left behind
// is cancelled — a long flight never queues the pictures it flew past.
const LOD_T = [0.13, 0.38, 1.25];
function lodFor(z) { return z < LOD_T[0] ? 0 : z < LOD_T[1] ? 1 : z < LOD_T[2] ? 2 : 3; }
function cancel(rec) { if (rec.pending) { rec.pending.onload = null; rec.pending.src = ''; rec.pending = null; } }
function want(rec, lod, lite) {
  if (lod <= 0) { cancel(rec); rec.el.style.backgroundImage = ''; if (rec.img) { rec.img.remove(); rec.img = null; } rec.want = null; rec.lod = lod; return; }
  if (rec.lod < 1) rec.el.style.backgroundImage = `url(img/${rec.key}_s.webp)`;
  rec.lod = lod;
  if (lod === 1) { cancel(rec); if (rec.img) { rec.img.remove(); rec.img = null; } rec.want = null; return; }
  const src = lod === 3 ? `img/${rec.key}.webp`
    : lite && rec.kind === 'motion' ? `img/${rec.key}_m.webp` : `img/${rec.key}_t.webp`;
  if (rec.want === src) return;
  cancel(rec);
  rec.want = src;
  const img = new Image();
  img.className = 'pic'; img.decoding = 'async'; img.alt = '';
  img.onload = () => { rec.pending = null; if (rec.want !== src) return; if (rec.img) rec.img.remove(); rec.img = img; rec.el.prepend(img); };
  rec.pending = img;
  img.src = src;
}
// Far out, each section title grows to stay readable (≈16 px on screen) but
// never past three quarters of its own section, so titles don't overlap.
function farLabels(s) {
  const far = s.z < 0.3;
  for (const sec of secList) {
    if (!sec.labelEl) continue;
    if (!far) { sec.labelEl.style.transform = ''; continue; }
    const px = Math.min(17, 0.7 * sec.h * s.z), k = Math.max(1, px / (30 * s.z));
    sec.labelEl.style.transform = `scale(${k.toFixed(3)})`;
  }
  for (const h of sideHeads) h.el.style.transform = far ? `scale(${Math.max(1, Math.min(26, 0.5 * h.h * s.z) / (64 * s.z)).toFixed(3)})` : '';
}
let lastLod = 0;
function updateLod(s, settled) {
  const now = performance.now();
  if (!settled && now - lastLod < 110) return;
  lastLod = now;
  const lod = lodFor(s.z);
  board.classList.toggle('lod0', lod === 0);
  board.classList.toggle('far', s.z < 0.3);
  farLabels(s);
  const mw = (s.right - s.left) * 0.5, mh = (s.bottom - s.top) * 0.6;
  const L = s.left - mw, R = s.right + mw, T = s.top - mh, B = s.bottom + mh;
  const hidden = { figma: document.body.classList.contains('hide-figma'), app: document.body.classList.contains('hide-app'),
    motion: document.body.classList.contains('hide-motion'), device: document.body.classList.contains('hide-device') };
  const near = [];
  for (const rec of CARDS) {
    if (rec.x < R && rec.x + rec.w > L && rec.y < B && rec.y + rec.h > T && !hidden[rec.kind]) near.push(rec);
    else if (rec.lod >= 2 || rec.pending) want(rec, 1);      // left behind: the poster only
  }
  const cx = (s.left + s.right) / 2, cy = (s.top + s.bottom) / 2;
  const d = rec => Math.hypot(rec.x + rec.w / 2 - cx, rec.y + rec.h / 2 - cy);
  near.sort((a, b) => d(a) - d(b));
  // A looping animation is worth its weight only close enough to see it:
  // a still poster far out, the light loop at middle zoom, the full one up close.
  const lite = s.z < 0.9;
  for (const rec of near) {
    const target = rec.kind === 'motion' && lod === 2 && s.z < 0.45 ? 1 : lod;
    // Moving, a card only gets its still poster; what it shows otherwise —
    // a light loop, a thumbnail, the full picture — changes once it settles.
    if (settled) want(rec, target, lite);
    else if (rec.lod < 1) want(rec, 1);
  }
  document.getElementById('zoomv').textContent = Math.round(s.z * 100) + '%';
}
cam.on('change', s => updateLod(s, false));
cam.on('settle', s => { updateLod(s, true); spy(s); });

// ── Minimap and "where am I" ───────────────────────────────────────────
const SIDE_COL = { motion: '#e0457b', common: '#9aa0a8', parent: '#ff8a1f', child: '#2aa7c9' };
cam.minimap(document.getElementById('map'),
  secList.map(s => ({ x: s.x, y: s.y, w: s.w, h: s.h, color: SIDE_COL[s.side] })),
  secList.map(s => ({ x: s.x, y: s.y, h: s.h, title: s.title, onClick: () => goSec(s.id) })));
function spy(s) {
  const cy = (s.top + s.bottom) / 2;
  let cur = null;
  for (const sec of secList) if (sec.y <= cy) cur = sec;
  document.querySelectorAll('#side a[data-id]').forEach(a => a.classList.toggle('on', !!cur && a.dataset.id === cur.id));
}
function goSec(id) {
  const p = secPos[id]; if (!p) return;
  cam.goTo(p.x, p.y, Math.max(cam.z, 0.5));
  document.body.classList.remove('side-open');
}

document.getElementById('zIn').onclick = () => cam.zoomBy(1.4);
document.getElementById('zOut').onclick = () => cam.zoomBy(1 / 1.4);
document.getElementById('zoomv').onclick = () => cam.zoomTo(1);
document.getElementById('fit').onclick = () => cam.fit(360);
document.getElementById('menu').onclick = () => document.body.classList.toggle('side-open');
// The controls hint: ✕ hides it for good; otherwise it fades 12 s after the
// reader first moves the board (and only for this visit); «?» brings it back.
if (localStorage.getItem('cv-nohelp')) document.body.classList.add('nohelp');
document.getElementById('helpX').onclick = () => { document.body.classList.add('nohelp'); localStorage.setItem('cv-nohelp', '1'); };
document.getElementById('helpB').onclick = () => { document.body.classList.toggle('nohelp'); if (document.body.classList.contains('nohelp')) localStorage.setItem('cv-nohelp', '1'); else localStorage.removeItem('cv-nohelp'); };
let helpTimer = 0;
const startHelpTimer = () => { if (!helpTimer) helpTimer = setTimeout(() => document.body.classList.add('nohelp'), 12000); };
['pointerdown', 'wheel', 'keydown'].forEach(t => view.addEventListener(t, startHelpTimer, { once: true, passive: true }));
window.addEventListener('keydown', startHelpTimer, { once: true });
document.addEventListener('click', e => { const d = document.querySelector('.layers'); if (d.open && !d.contains(e.target)) d.open = false; });

// Row toggles, the analytics layer and search.
for (const [id, cls] of [['tFigma', 'hide-figma'], ['tApp', 'hide-app'], ['tMotion', 'hide-motion'], ['tDevice', 'hide-device']])
  document.getElementById(id).onchange = e => { document.body.classList.toggle(cls, !e.target.checked); e.target.blur(); updateLod(cam.state(), true); };
const tAn = document.getElementById('tAn');
function setAn(on) {
  tAn.checked = on; document.body.classList.toggle('an', on);
  const u = new URL(location.href); if (on) u.searchParams.set('an', '1'); else u.searchParams.delete('an');
  history.replaceState(null, '', u.pathname + u.search + location.hash);
  if (cur) showLb();
}
tAn.onchange = e => { setAn(e.target.checked); e.target.blur(); };
document.getElementById('q').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  for (const list of cardsByRow) for (const { card, cap } of list) {
    const hit = !q || card.dataset.label.includes(q);
    card.classList.toggle('dim', !hit); cap.classList.toggle('dim', !hit);
  }
};

// Sidebar.
const side = document.getElementById('side');
function sideList() {
  let h = `<div class="anbox"><b>Слой «События на экранах»</b>
    <div style="margin-bottom:8px">Внизу каждого экрана — его просмотр (👁) и события; клик по событию — что оно значит и приходит ли уже. Воронки и словарь — на странице <a href="analytics/">Аналитика</a>.</div>
    ${planUi.legendHtml()}</div>`;
  if (NOTES.title) h += `<div class="notes"><b>${NOTES.title}</b>${NOTES.body || ''}</div>`;
  for (const s of ['motion', 'common', 'parent', 'child']) {
    h += `<h2>${({ motion: 'Анимации', common: 'Общее', parent: 'Родитель', child: 'Ребёнок' })[s]}</h2>`;
    for (const sec of DATA.filter(x => x.side === s)) {
      const n = sec.rows.reduce((a, r) => a + r.cards.length, 0);
      h += `<a href="#${sec.id}" data-id="${sec.id}"><span>${sec.title}</span><span class="n">${n}</span></a>`;
    }
  }
  side.innerHTML = h;
  side.querySelectorAll('a[data-id]').forEach(a => a.onclick = e => { e.preventDefault(); goSec(a.dataset.id); });
}

// Lightbox with the Figma comparison.
const lb = document.getElementById('lb');
let cur = null, figIdx = {};
function figmaOf(s) { return (s.rows.find(r => r.kind === 'figma') || { cards: [] }).cards; }
function openLb(s, r, i) { cur = { s, r, i }; lb.classList.add('on'); showLb(); }
function showLb() {
  const { s, r, i } = cur, c = r.cards[i], figs = figmaOf(s);
  document.getElementById('lbT').textContent = `${c.label} — ${s.title}`;
  document.getElementById('lbS').textContent = `${r.title} · ${i + 1} из ${r.cards.length} · ${c.src} · ${c.w}×${c.h}`;
  document.getElementById('imgL').src = `img/${c.key}.webp`;
  document.getElementById('pLl').innerHTML = `<span class="dot" style="background:${COLORS[r.kind]}"></span>${r.title}: ${c.label}`;
  const an = CARD_AN[c.key];
  document.getElementById('lbAn').innerHTML = an ? planUi.chipsHtml(an.screens, an.events) : '<span style="color:#889">Для этого кадра событий нет</span>';
  const canCmp = r.kind !== 'figma' && figs.length > 0;
  document.getElementById('lbCmp').style.display = canCmp ? '' : 'none';
  if (!canCmp) lb.classList.remove('cmp');
  if (canCmp) {
    const k = Math.min(figIdx[s.id] || 0, figs.length - 1);
    document.getElementById('imgR').src = `img/${figs[k].key}.webp`;
    document.getElementById('pRl').textContent = 'Figma: ' + figs[k].label;
    const strip = document.getElementById('strip');
    strip.innerHTML = figs.map((f, j) => `<img src="img/${f.key}_t.webp" data-j="${j}" class="${j === k ? 'on' : ''}" title="${f.label}">`).join('');
    strip.querySelectorAll('img').forEach(im => im.onclick = () => { figIdx[s.id] = +im.dataset.j; showLb(); });
  }
}
document.getElementById('lbAn').addEventListener('click', e => { const chip = e.target.closest('[data-ev],[data-scr]'); if (chip) planUi.openFromChip(chip); });
function step(d) { if (!cur) return; const n = cur.r.cards.length; cur.i = (cur.i + d + n) % n; showLb(); }
document.getElementById('lbPrev').onclick = () => step(-1);
document.getElementById('lbNext').onclick = () => step(1);
document.getElementById('lbX').onclick = () => lb.classList.remove('on');
document.getElementById('lbCmp').onclick = () => { lb.classList.toggle('cmp'); showLb(); };
document.getElementById('lbFit').onclick = () => {
  const on = document.getElementById('pL').classList.toggle('fit');
  document.getElementById('pR').classList.toggle('fit', on);
  document.getElementById('lbFit').textContent = on ? 'Целиком' : 'Вписать';
};
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('panes')) lb.classList.remove('on'); });
window.addEventListener('keydown', e => {
  if (planUi.isOpen()) { if (e.key === 'Escape') planUi.close(); return; }
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') lb.classList.remove('on');
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

sideList();
// A link to a section on this page (#p-tasks) moves the camera there, and
// one from the event panel closes the panel.
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (secPos[id]) { planUi.close(); goSec(id); } else cam.restoreHash();
});
if (new URLSearchParams(location.search).get('an') === '1') setAn(true);
const startSec = location.hash.slice(1);
if (!cam.restoreHash()) {
  if (secPos[startSec]) goSec(startSec);
  else cam.flyTo(0, 0, 0.5, 30, 24);
}
updateLod(cam.state(), true);
spy(cam.state());
</script>
</body>
</html>
