<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>OYNA — все экраны: родитель и ребёнок (Figma ↔ приложение)</title>
<style>
  :root {
    --bg: #e9e9ec; --ink: #16181d; --muted: #6b7078; --line: #d5d6db;
    --figma: #7b61ff; --app: #ff8a1f; --motion: #e0457b; --device: #1fa463; --card: #fff;
    --live: #1f8a4c; --fix: #c77700; --new: #2f6fde; --side-w: 272px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); overscroll-behavior: none;
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; color: var(--ink); touch-action: pan-x pan-y; }
  #top { position: fixed; inset: 0 0 auto 0; height: 58px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 0 14px; z-index: 20; overflow-x: auto; scrollbar-width: none; }
  #top::-webkit-scrollbar { display: none; }
  #top h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  .tabs { display: flex; gap: 2px; background: #f1f1f4; border-radius: 10px; padding: 3px; flex: none; }
  .tabs a { text-decoration: none; color: var(--ink); font-size: 13px; padding: 6px 11px; border-radius: 8px; white-space: nowrap; }
  .tabs a.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .tabs a:not(.on):hover { background: #e6e6ea; }
  #top .grow { flex: 1; min-width: 12px; }
  #top .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #fit .short { display: none; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; height: 32px; min-width: 32px; padding: 0 10px;
    cursor: pointer; font: inherit; font-size: 13px; color: var(--ink); white-space: nowrap; flex: none; }
  .btn:hover { background: #f4f4f6; }
  .zoom { display: flex; align-items: center; gap: 4px; flex: none; }
  #zoomv { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
  .tog { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; white-space: nowrap; flex: none; }
  .tog.an { padding: 5px 10px 5px 8px; border-radius: 99px; border: 1px solid var(--line); background: #fff; font-weight: 600; }
  .tog.an:has(input:checked) { background: #16181d; color: #fff; border-color: #16181d; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  #q { height: 32px; border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; width: 190px; font: inherit; flex: none; }
  #menu { display: none; }
  #side { position: fixed; left: 0; top: 58px; bottom: 0; width: var(--side-w); background: #fff; border-right: 1px solid var(--line);
    overflow: auto; z-index: 15; padding: 10px 0 30px; overscroll-behavior: contain; }
  #side h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 16px 6px; }
  #side a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 16px; color: var(--ink); text-decoration: none; font-size: 13px; border-left: 3px solid transparent; }
  #side a:hover { background: #f4f4f6; }
  #side a.on { background: #f1f1f4; border-left-color: #16181d; font-weight: 600; }
  #side a .n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; font-weight: 400; }
  #side .notes { margin: 8px 12px 0; padding: 10px 12px; border-radius: 10px; background: #fff7ee; border: 1px solid #ffd8b0; font-size: 12.5px; }
  #side .notes b { display: block; margin-bottom: 4px; }
  #side .notes ul { margin: 4px 0 0 16px; padding: 0; }
  #side .notes li { margin: 3px 0; }
  #side .anbox { display: none; margin: 10px 12px 4px; padding: 10px 12px; border-radius: 10px; background: #f1f5ff; border: 1px solid #cfdcff; font-size: 12.5px; }
  body.an #side .anbox { display: block; }
  #side .anbox b { display: block; margin-bottom: 6px; }
  #side .anbox .lg { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #side .anbox a { display: inline; padding: 0; border: 0; color: #2f6fde; font-weight: 600; }
  #view { position: fixed; left: var(--side-w); top: 58px; right: 0; bottom: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  #board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #board.moving { will-change: transform; }
  .side-h { position: absolute; font-size: 64px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; transform-origin: 0 0; }
  .side-h small { display: block; font-size: 22px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 6px; }
  .sec-h { position: absolute; white-space: nowrap; }
  .sec-h .t { font-size: 30px; font-weight: 750; letter-spacing: -.01em; transform-origin: 0 0; display: inline-block; }
  .sec-h .t .c { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 10px; }
  .sec-h .note { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .sec-h .dev { font-size: 15px; color: #5a45d6; margin-top: 6px; white-space: normal; max-width: 1500px; }
  .sec-bg { position: absolute; border-radius: 28px; background: rgba(255,255,255,.55); border: 1px solid rgba(0,0,0,.05); }
  .row-l { position: absolute; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .row-l .dot { width: 12px; height: 12px; }
  .row-empty { position: absolute; font-size: 15px; color: var(--muted); font-style: italic; }
  .card { position: absolute; background: #f3f3f5 center top / cover no-repeat; border-radius: 18px; overflow: hidden; cursor: zoom-in;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 22px rgba(0,0,0,.08); }
  .card:hover { box-shadow: 0 0 0 3px var(--hl, #333), 0 10px 28px rgba(0,0,0,.14); }
  .card img.pic { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .card.figma { --hl: var(--figma); } .card.app { --hl: var(--app); } .card.motion { --hl: var(--motion); } .card.device { --hl: var(--device); }
  .card .tall { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.66); color: #fff; font-size: 12px;
    padding: 3px 8px; border-radius: 99px; z-index: 1; }
  .card .play { position: absolute; left: 8px; top: 8px; background: var(--motion); color: #fff; font: 600 11px/1 -apple-system, system-ui, sans-serif; padding: 5px 8px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.25); z-index: 1; }
  .cap { position: absolute; font-size: 14px; line-height: 1.25; color: var(--ink); overflow: hidden; }
  .cap .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  /* Far out: plain tinted blocks, no captions, big section names. */
  #board.lod0 .card { box-shadow: none; background-image: none !important; }
  #board.lod0 .card.figma { background-color: #d9d1ff; } #board.lod0 .card.app { background-color: #ffd9b3; }
  #board.lod0 .card.motion { background-color: #f6c3d6; } #board.lod0 .card.device { background-color: #bfe8d0; }
  #board.lod0 .card > * { display: none; }
  #board.far .cap, #board.far .row-l, #board.far .row-empty, #board.far .sec-h .note, #board.far .sec-h .dev { visibility: hidden; }
  #board.far .card { box-shadow: none; }
  #board.far .sec-h .t { background: rgba(255,255,255,.92); border-radius: 12px; padding: 2px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #board.far .side-h small { visibility: hidden; }
  .dim { opacity: .12; }
  body.hide-figma .r-figma, body.hide-app .r-app, body.hide-motion .r-motion, body.hide-device .r-device { display: none; }
  /* Analytics layer */
  .an-tag { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 8px 8px; display: none; flex-wrap: wrap; gap: 5px;
    background: linear-gradient(to top, rgba(14,16,22,.92) 70%, rgba(14,16,22,0)); z-index: 2; cursor: default; }
  body.an .an-tag { display: flex; }
  body.an .card:not(.has-an) { opacity: .45; }
  body.an #board.lod0 .card.has-an { background-color: #c9d8ff; }
  /* Event chips (plan_ui.js) on the dark strip under a screen and in the viewer. */
  .an-tag .chip, #lbAn .chip { background: rgba(255,255,255,.12); box-shadow: inset 0 0 0 1px rgba(255,255,255,.22); font-size: 12px; padding: 4px 7px; }
  .an-tag .chip:hover, #lbAn .chip:hover { background: rgba(255,255,255,.25); }
  .an-tag .chip.scr, #lbAn .chip.scr { color: #d7dbe4; font-weight: 500; }
  #lb { position: fixed; inset: 0; background: rgba(12,13,16,.975); z-index: 50; display: none; flex-direction: column; }
  #lb.on { display: flex; }
  #lb .bar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; color: #fff; }
  #lb .bar .ttl { flex: 1; min-width: 0; }
  #lb .bar .ttl b { font-size: 16px; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } #lb .bar .ttl div { color: #aab; font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lb .bar .btn { background: #26282e; color: #fff; border-color: #3a3d45; }
  #lb .panes { flex: 1; display: flex; gap: 18px; padding: 0 18px 12px; min-height: 0; }
  #lb .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; min-height: 0; }
  #lb .pane .lab { color: #ccd; font-size: 13px; margin-bottom: 8px; display: flex; gap: 6px; align-items: center; }
  #lb .pane .sc { flex: 1; min-height: 0; width: 100%; overflow: auto; display: flex; justify-content: center; }
  #lb .pane img { max-width: 100%; height: auto; align-self: flex-start; border-radius: 14px; }
  #lb .pane.fit img { max-height: 100%; width: auto; }
  #lb .strip { display: none; gap: 8px; padding: 8px 18px 14px; overflow-x: auto; }
  #lb.cmp .strip { display: flex; }
  #lb .strip img { height: 92px; border-radius: 8px; cursor: pointer; opacity: .55; border: 2px solid transparent; }
  #lb .strip img.on { opacity: 1; border-color: var(--figma); }
  #lb:not(.cmp) #pR { display: none; }
  #lb .anl { display: none; gap: 6px; flex-wrap: wrap; padding: 0 18px 10px; }
  body.an #lb .anl { display: flex; }
  #help { position: fixed; left: calc(var(--side-w) + 12px); bottom: 12px; background: rgba(255,255,255,.94); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 11px; font-size: 12px; color: var(--muted); z-index: 18; max-width: calc(100vw - var(--side-w) - 220px); }
  #help b { color: var(--ink); font-weight: 600; }
  #help #helpX { float: right; border: 0; background: none; color: var(--muted); cursor: pointer; margin: -2px -4px 0 8px; font-size: 13px; }
  body.nohelp #help { display: none; }
  #help .touch { display: none; }
  @media (pointer: coarse) { #help .desk { display: none; } #help .touch { display: inline; } }
  .layers { position: relative; flex: none; }
  .layers summary { list-style: none; display: inline-flex; align-items: center; }
  .layers summary::-webkit-details-marker { display: none; }
  .layers .pop { position: fixed; top: 52px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 9px; box-shadow: 0 8px 28px rgba(0,0,0,.14); z-index: 30; }
  @media (max-width: 760px) {
    :root { --side-w: 0px; }
    #menu { display: inline-block; }
    #side { width: 84vw; max-width: 320px; transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.2); }
    body.side-open #side { transform: none; }
    #q, .layers, #top .sub, .tog.an .long { display: none; }
    #top { gap: 8px; padding: 0 8px; } .tabs a { padding: 6px 8px; }
    /* Zoom lives bottom-right, where a thumb reaches it. */
    .zoom { position: fixed; right: 12px; bottom: 16px; flex-direction: column; gap: 6px; z-index: 21; }
    .zoom .btn { width: 44px; height: 44px; box-shadow: 0 2px 10px rgba(0,0,0,.15); font-size: 18px; }
    #zoomv, #fit .long { display: none; } #fit .short { display: inline; }
    #help { display: block; left: 12px; right: 70px; max-width: none; bottom: 16px; }
    #lb .bar { flex-wrap: wrap; gap: 8px; padding: 10px 12px; } #lb .bar .ttl { flex-basis: 100%; }
  }
</style>
</head>
<body>
<div id="top">

  <details class="layers"><summary class="btn">Слои ▾</summary><div class="pop">

<div id="help"><button id="helpX" title="Больше не показывать">✕</button><span class="desk"><b>Двигать:</b> тащить мышью, колесо, два пальца, стрелки, PgUp/PgDn · <b>Масштаб:</b> щипок, ⌘/Ctrl + колесо, + −, двойной клик · <b>0</b> — всё, <b>1</b> — 100 % · клик по экрану — открыть</span><span class="touch"><b>Двигать</b> — пальцем, <b>масштаб</b> — двумя пальцами или + −, двойной тап — ближе. Тап по экрану — открыть.</span></div>

    <div class="pane fit" id="pR"><div class="lab"><span class="dot" style="background:var(--figma)"></span><span id="pRl"></span></div><div class="sc"><img id="imgR" alt=""></div></div>
  </div>
  <div class="strip" id="strip"></div>

<script>
/* OYNA canvas engine — one way to move around every canvas page.
 *
 * Mouse and trackpad: drag or scroll to move (Shift + wheel moves sideways),
 * pinch or ⌘/Ctrl + wheel to zoom at the cursor, double-click to zoom in
 * (Alt — out). Phone/tablet: one finger moves (with a glide), two fingers
 * pinch and move, double tap zooms in. Keys: arrows, PgUp/PgDn/Space,
 * Home/End, + − (also with ⌘), 0 fits the board, 1 is 100 %.
 *
 * The board can't be thrown away: at least half the view (or the whole
 * board when it is smaller) always stays on it. While the board moves it is
 * one composited layer; once it settles the page gets a "settle" call so it
 * can swap pictures for the zoom (level of detail) and the URL keeps the
 * place (#@x,y,z — a link opens the same spot).
 */
(function (global) {
  'use strict';

  const CSS = `
  .cv-map { position: fixed; right: 12px; bottom: 46px; z-index: 18; background: rgba(255,255,255,.9); transition: background .15s;
    border: 1px solid #d5d6db; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.08); padding: 8px;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  .cv-map .cv-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font: 600 11px/1 -apple-system, system-ui, sans-serif; color: #6b7078; letter-spacing: .06em;
    text-transform: uppercase; margin: 0 0 6px; }
  .cv-map .cv-head button { border: 0; background: none; color: #6b7078; cursor: pointer; font: inherit; padding: 2px 4px; }
  .cv-map.min .cv-body { display: none; } .cv-map.min .cv-head { margin: 0; }
  .cv-body { position: relative; display: flex; gap: 6px; cursor: pointer; }
  .cv-map:hover { background: rgba(255,255,255,.98); }
  .cv-labels { position: relative; width: 96px; flex: none; }
  .cv-labels div { position: absolute; right: 0; max-width: 96px; font: 500 10px/1.15 -apple-system, system-ui, sans-serif; cursor: pointer;
    color: #3b3f46; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform: translateY(-50%); }
  .cv-labels div.on { color: #000; font-weight: 700; }
  .cv-mapbox { position: relative; flex: none; background: #f1f1f4; border-radius: 6px; overflow: hidden; }
  .cv-mapbox i { position: absolute; display: block; border-radius: 2px; opacity: .85; }
  .cv-vp { position: absolute; border: 2px solid #16181d; border-radius: 3px; background: rgba(22,24,29,.08);
    box-shadow: 0 0 0 9999px rgba(255,255,255,.0); pointer-events: none; }
  @media (max-width: 760px) { .cv-map { display: none; } }
  .cv-view img { -webkit-user-drag: none; user-select: none; -webkit-user-select: none; }
  .cv-pad { position: absolute; left: 0; top: 0; visibility: hidden; pointer-events: none; }
  `;

  function createCanvas(opts) {
    const view = opts.view, board = opts.board;
    const Z_MAX = opts.zMax || 3;
    const zMinFixed = opts.zMin || 0;
    let z = 1, tx = 0, ty = 0, W = 1, H = 1;
    let frame = 0, settleTimer = 0;
    let moved = false;
    const on = { change: [], settle: [] };

    if (!document.getElementById('cv-style')) {
      const st = document.createElement('style'); st.id = 'cv-style'; st.textContent = CSS; document.head.appendChild(st);
    }

    // The view scrolls only for the browser's own reasons (a find-in-page
    // hit, focus moving to a link): it rests at PAD, the board sits at PAD,
    // so such a scroll may go up and left too, and becomes a camera move.
    const PAD = 1e6;
    view.classList.add('cv-view');
    const pad = document.createElement('div'); pad.className = 'cv-pad';
    pad.style.width = pad.style.height = (2 * PAD) + 'px';
    view.prepend(pad);
    board.style.left = board.style.top = PAD + 'px';
    const rest = () => { view.scrollLeft = PAD; view.scrollTop = PAD; };
    rest();
    // A picture dragged away would cancel the pointer and stop the move.
    view.addEventListener('dragstart', e => e.preventDefault());

    const vw = () => view.clientWidth, vh = () => view.clientHeight;
    function measure() { W = Math.max(1, board.offsetWidth); H = Math.max(1, board.offsetHeight); }
    function fitZoom() { return Math.min((vw() - 48) / W, (vh() - 48) / H); }
    function zMin() { return zMinFixed || Math.min(0.1, fitZoom() * 0.9); }
    const clampZ = v => Math.min(Z_MAX, Math.max(zMin(), v));

    // Half the view (or the whole board, when it is smaller) stays on the board.
    function clampXY() {
      const bw = W * z, bh = H * z, w = vw(), h = vh();
      const kx = Math.min(bw, w * 0.5), ky = Math.min(bh, h * 0.5);
      tx = Math.min(Math.max(tx, kx - bw), w - kx);
      ty = Math.min(Math.max(ty, ky - bh), h - ky);
    }

    function render() {
      clampXY();
      board.classList.add('moving');
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => { board.classList.remove('moving'); emit('settle'); saveHash(); }, 170);
      if (!frame) frame = requestAnimationFrame(flush);
    }
    function flush() {
      frame = 0;
      board.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
      emit('change');
    }
    function state() {
      const w = vw(), h = vh();
      return { z, tx, ty, w, h, W, H, left: -tx / z, top: -ty / z, right: (w - tx) / z, bottom: (h - ty) / z };
    }
    function emit(kind) { const s = state(); on[kind].forEach(fn => fn(s)); }

    // ── Zoom ────────────────────────────────────────────────────────────
    function zoomAt(f, cx, cy) {
      const nz = clampZ(z * f);
      tx = cx - (cx - tx) * (nz / z); ty = cy - (cy - ty) * (nz / z); z = nz; render();
    }
    // Wheel notches, buttons and keys ease toward one target (≈ 0.15 s); a
    // pinch feeds zoomAt directly so the board follows the fingers.
    let zTarget = null, zAnchor = [0, 0], zLoop = 0;
    function zoomSmooth(f, cx, cy) { zoomSmoothTo((zTarget ?? z) * f, cx, cy); }
    // Eases to the zoom [nz] itself, wherever a running ease was heading.
    function zoomSmoothTo(nz, cx, cy) {

  .pd .shots { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .pd .shot { flex: none; width: 92px; text-align: center; font-size: 11.5px; color: #3b3f46; text-decoration: none; }
  .pd .shot img { width: 92px; height: 170px; object-fit: cover; object-position: top; border-radius: 10px; display: block; background: #f1f1f4; margin-bottom: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .pd .shotcap { font-size: 12.5px; color: #5f646d; margin-top: 2px; }
  .pd .lnk { display: block; color: #2f6fde; text-decoration: none; margin: 4px 0; font-weight: 600; }
  .pd .lnk:hover { text-decoration: underline; }
  .pd .evs { display: flex; flex-wrap: wrap; gap: 6px; }
  .pd .muted { color: #6b7078; font-size: 13px; }
  .stlegend { display: grid; gap: 6px; font-size: 13.5px; }
  .stlegend div { display: flex; align-items: center; gap: 8px; }
  .stlegend .chip { flex: none; }
  `;

  const SIDE = { parent: 'родитель', child: 'ребёнок', both: 'родитель и ребёнок', system: 'присылает PostHog', store: 'магазин приложений' };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // An event or screen name that may wrap only between its words:
  // quest|Approved, parent_|child_|invite.
  const breakable = name => esc(name).replace(/([a-z])(?=[A-Z])|_/g, m => m + '<wbr>');
  const show = v => String(v);   // true / false as PostHog stores them
  // A sample value for a property from its documented values, when the plan
  // gives none: the first allowed value, a number, true, an id. Unknown —
  // no row rather than a made-up one.
  const IDS = { quest_id: '5b1e…', child_id: '8f2c…', reward_id: 'c47a…', family_id: '71d0…', user_id: '3fa9…' };
  const guess = (t, name) => {
    t = String(t || '');
    if (t.includes('|')) return t.split('|')[0].trim();
    if (/true \/ false/.test(t)) return true;
    if (/числ|1–5/.test(t)) return 42;
    if (/uuid/.test(t)) return IDS[name] || '9d3b…';
    return undefined;
  };

  function create(plan, opts) {
    opts = opts || {};
    const imgBase = opts.imgBase || 'img/';
    const canvasBase = opts.canvasBase || './';
    const analyticsBase = opts.analyticsBase || 'analytics/';
    const STATUS = plan.statuses || {};
    const evByName = {}, scrById = {};
    (plan.events || []).forEach(e => { evByName[e.name] = e; });
    (plan.screens || []).forEach(s => { scrById[s.id] = s; });
    const domains = {};
    (plan.domains || []).forEach(d => { domains[d.id] = d; });
    const funnelsOf = name => (plan.funnels || []).filter(f => f.steps.some(st => st.event === name || (st.alt || []).includes(name)));
    const screensOf = name => (plan.screens || []).filter(s => (s.events || []).includes(name));
    const st = name => STATUS[name] || { icon: '?', label: name, text: '' };
    // Who sends it, in words: RevenueCat's server events are no one's phone.
    const whoOf = e => e.status === 'server' ? 'присылает RevenueCat' : SIDE[e.side] || e.side;

    if (!document.getElementById('pd-style')) {
      const style = document.createElement('style'); style.id = 'pd-style'; style.textContent = CSS; document.head.appendChild(style);
    }
    const scrim = document.createElement('div'); scrim.className = 'pd-scrim';
    const pd = document.createElement('aside'); pd.className = 'pd'; pd.setAttribute('aria-hidden', 'true');
    pd.innerHTML = '<div class="pd-h"><div class="pd-hd"></div><button class="x" title="Закрыть (Esc)">✕</button></div><div class="pd-b"></div>';
    document.body.append(scrim, pd);
    const hd = pd.querySelector('.pd-hd'), body = pd.querySelector('.pd-b');
    const close = () => { pd.classList.remove('on'); scrim.classList.remove('on'); pd.setAttribute('aria-hidden', 'true'); };
    pd.querySelector('.x').onclick = close; scrim.onclick = close;
    // Capture: one Esc closes the panel and nothing behind it.
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && pd.classList.contains('on')) { e.stopImmediatePropagation(); e.preventDefault(); close(); }
    }, true);
    body.addEventListener('click', e => {
      const go = e.target.closest('[data-go]');
      if (go && opts.onGo) { e.preventDefault(); close(); opts.onGo(go.dataset.go); return; }
      const chip = e.target.closest('[data-ev],[data-scr]');
      if (chip) { e.preventDefault(); openFromChip(chip); }
    });

    function statusLabel(name) { const s = st(name); return `${s.icon} ${s.label}`; }
    // The status in words; [short] for tight spots (a funnel step, a story card).
    function statusWord(name, short) {
      const e = evByName[name];
      if (!e) return '';
      const s = st(e.status);
      return `<span class="stw st-${e.status}" title="${esc(s.label)}">${esc(s.icon)} ${esc(short && s.short ? s.short : s.label)}</span>`;
    }
    function chip(name) {
      const e = evByName[name];
      const status = e ? e.status : 'new';
      return `<span class="chip st-${status}" data-ev="${esc(name)}" role="button" tabindex="0" title="${esc((e ? e.title + ' — ' : '') + statusLabel(status))}"><i class="si">${esc(st(status).icon)}</i><span>${breakable(name)}</span></span>`;
    }
    function scrChip(id) {
      const s = scrById[id];
      const icon = s && s.sheet ? '▤' : s && s.untracked ? '○' : '👁';
      const what = s && s.sheet ? 'Лист поверх экрана — без просмотра' : s && s.untracked ? 'Не приходит (до согласия)' : 'Просмотр экрана: $screen';
      return `<span class="chip scr" data-scr="${esc(id)}" role="button" tabindex="0" title="${esc(what)}: ${esc(s ? s.title : id)}">${icon} <span>${breakable(id)}</span></span>`;
    }
    function chipsHtml(screens, events) {
      return (screens || []).map(scrChip).join('') + (events || []).map(chip).join('');
    }
    function legendHtml() {
      return `<div class="stlegend">${Object.entries(STATUS).map(([k, s]) =>
        `<div><span class="chip st-${k}" style="cursor:default"><i class="si">${esc(s.icon)}</i>event</span><span>${esc(s.label)}</span></div>`).join('')}</div>`;
    }
    function shots(keys) {
      return `<div class="shots">` + keys.slice(0, 8).map(k =>
        `<a class="shot" href="${canvasBase}?an=1#${esc(k.replace(/-(figma|app|motion|device)-\d+$/, ''))}" title="Открыть на холсте «Экраны»"><img loading="lazy" src="${imgBase}${esc(k)}_t.webp" alt=""></a>`).join('') +
        `</div><div class="shotcap">Клик по картинке — этот раздел на холсте «Экраны» ↗</div>`;
    }
    function present() { pd.classList.add('on'); scrim.classList.add('on'); pd.setAttribute('aria-hidden', 'false'); body.scrollTop = 0; }

    // One line as PostHog lists it, with example values: the event's own
    // properties, then (grey) the ones every event of the app carries.
    function sampleRow(e) {
      const ex = e.example || {}, rows = [];
      (e.props || []).forEach(p => String(p.n).split(/,\s*|\s+\/\s+/).forEach(n => {
        n = n.trim();
        if (!/^[$a-z_][a-z0-9_]*$/i.test(n) || rows.some(r => r[0] === n)) return;
        const v = n in ex ? ex[n] : guess(p.t, n);
        if (v !== undefined) rows.push([n, v]);
      }));
      Object.keys(ex).forEach(k => { if (!rows.some(r => r[0] === k)) rows.push([k, ex[k]]); });
      const own = new Set(rows.map(r => r[0]));
      let who, common = [];
      if (e.status === 'server') who = 'присылает сервер RevenueCat · покупатель — семья 71d0…';
      else if (e.side === 'system') {
        who = 'присылает сам PostHog · родитель 3fa9…';
        common = [['$app_version', '1.0.8']];
      } else {
        who = e.side === 'child' ? 'ребёнок child_8f2c…' : 'родитель 3fa9…';
        const where = (screensOf(e.name)[0] || {}).id || 'parent_home';
        common = [['$app_namespace', 'com.oynaplatform.app'], ['environment', 'prod'], ['role', e.side === 'child' ? 'child' : 'parent'],
          ['tier', 'free'], ['country', 'UZ'], ['language', 'ru'], ['coppa_strict', e.side === 'child'], ['$screen_name', where]];
      }
      common = common.filter(([k]) => !own.has(k));
      return `<div class="pd-sample"><div class="h"><span class="ex">ПРИМЕР</span><b>${esc(e.name)}</b><span>День 2, 18:34 · ${who}</span></div>
        <table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(show(v))}</td></tr>`).join('')}
        ${common.map(([k, v]) => `<tr class="common"><td>${esc(k)}</td><td>${esc(show(v))}</td></tr>`).join('')}</table>
        <div class="note">Значения выдуманы. ${common.length ? 'Серые строки приходят с каждым событием сами: какое приложение и сборка, кто, тариф семьи, страна, язык и экран, на котором это случилось. ' : ''}Да и нет хранятся как true и false.</div></div>`;
    }

    function openEvent(name) {
      const e = evByName[name];
      if (!e) return;
      const s = st(e.status);
      const dom = domains[e.domain];
      hd.innerHTML = `<div class="pd-pills"><span class="pd-pill ${esc(e.side)}">${esc(whoOf(e))}</span>${dom ? `<span class="pd-pill">${esc(dom.title)}</span>` : ''}${e.prio ? `<span class="pd-pill" title="Очередь работ: P0 — нужно для главных воронок, P1 — следующий шаг, P2 — потом">${esc(e.prio)}</span>` : ''}</div>
        <div class="pd-big">${esc(e.title)}</div><div class="pd-nameline">имя события в PostHog: <span class="pd-name">${breakable(e.name)}</span></div>`;
      const find = e.name === '$screen' ? 'Activity → Live events → событие «$screen», свойство $screen_name — имя экрана.'
        : e.status === 'server' ? 'Activity → Live events → поиск «rc_» (если интеграция RevenueCat включена).'
        : `Activity → Live events → поиск «${esc(e.name)}».`;
      let h = `<div class="pd-now st-${esc(e.status)}"><b>Сейчас в PostHog: ${esc(s.icon)} ${esc(s.label)}</b>${esc(s.text)}</div>`;
      if (s.today !== false) h += `<div class="pd-find">Как найти: ${find}</div>`;
      h += `<h4>Когда отправляется</h4><p>${esc(e.when)}</p>`;
      h += `<h4>Как это выглядит в PostHog</h4>${sampleRow(e)}`;
      if (e.why) h += `<h4>Зачем</h4><p>${esc(e.why)}</p>`;
      if (e.fix) h += `<h4>${e.status === 'improved' ? 'Что исправлено' : e.status === 'fix' ? 'Недочёт — как читать' : 'Важно'}</h4><p class="fixbox">${esc(e.fix)}</p>`;
      if ((e.props || []).length) {
        h += `<h4>Свойства — подробности события</h4><table class="props">` + e.props.map(p =>
          `<tr><td>${esc(p.n)}</td><td><div>${esc(p.d)}</div>${p.t ? `<div class="ty">${esc(p.t)}</div>` : ''}</td></tr>`).join('') + `</table>`;
      }
      if (e.side !== 'system' && e.status !== 'server') h += `<p class="muted" style="margin-top:8px">Плюс общие свойства на каждом событии: приложение и сборка, роль, семья, тариф семьи, страна, язык, версия.</p>`;
      const scr = screensOf(name);
      if (scr.length) {
        h += `<h4>Где в приложении</h4><div class="evs">${scr.map(x => scrChip(x.id)).join('')}</div>`;
        const keys = [...new Set(scr.flatMap(x => x.cards || []))];
        if (keys.length) h += shots(keys);
      }
      const fs = funnelsOf(name);
      if (fs.length) h += `<h4>В воронках</h4>` + fs.map(f => `<a class="lnk" href="${analyticsBase}#${esc(f.id)}" data-go="${esc(f.id)}">${esc(f.title)} →</a>`).join('');
      if (e.note) h += `<h4>Заметка</h4><p>${esc(e.note)}</p>`;
      if (dom && dom.note) h += `<p class="muted">${esc(dom.note)}</p>`;
      if (e.code) h += `<h4>Для разработчиков</h4><p><code>${esc(e.code)}</code></p>`;
      body.innerHTML = h; present();
    }
    function openScreen(id) {
      const s = scrById[id];
      if (!s) return;
      hd.innerHTML = `<div class="pd-pills"><span class="pd-pill">${s.sheet ? 'лист поверх экрана' : s.untracked ? 'не приходит' : 'просмотр экрана'}</span><span class="pd-pill ${esc(s.side)}">${esc(SIDE[s.side] || 'все')}</span></div>
        <div class="pd-big">${esc(s.title)}</div><div class="pd-nameline">${s.sheet || s.untracked ? 'имя в плане' : 'имя экрана в PostHog ($screen_name)'}: <span class="pd-name">${esc(s.id)}</span></div>`;
      let h = s.sheet ? `<h4>Как приходит</h4><p>Это лист поверх другого экрана, а не отдельный экран: просмотра нет, его открытие видно по событиям ниже.</p>`
        : s.untracked ? `<h4>Как приходит</h4><p>Никак: экран показывается до согласия родителя, а до согласия приложение ничего не отправляет.</p>`
        : `<h4>Как приходит</h4><p>Событие <code>$screen</code> со свойством <code>$screen_name = ${esc(s.id)}</code> — отправляется само, когда экран открылся (маршрут <code>${esc(s.route || '')}</code>). ${statusWord('$screen')}</p>`;
      if (s.note) h += `<p>${esc(s.note)}</p>`;
      if ((s.events || []).length) h += `<h4>События на этом экране</h4><div class="evs">${s.events.map(chip).join('')}</div>`;
      if ((s.cards || []).length) h += `<h4>Как выглядит</h4>` + shots(s.cards);
      body.innerHTML = h; present();
    }
    function openFromChip(el) {
      if (el.dataset.ev) openEvent(el.dataset.ev); else if (el.dataset.scr) openScreen(el.dataset.scr);
    }
    return { chip, scrChip, chipsHtml, legendHtml, statusLabel, statusWord, whoOf, openEvent, openScreen, openFromChip, close,
      isOpen: () => pd.classList.contains('on'), evByName, scrById };
  }

  global.OynaPlanUi = { create };
})(window);

</script>

разбить по channel", "alt": [], "card": "p-family-device-02"}, {"label": "Ребёнок вошёл на своём телефоне", "event": "logIn", "who": "child", "where": "role = child", "hint": "можно разбить по method: код, ссылка, QR", "alt": [], "card": "c-onboarding-app-05"}], "breakdowns": ["способ входа ребёнка (method)", "страна", "платформа ($os)"], "note": "Часть семей живёт на одном телефоне: родитель открывает режим ребёнка (childModeOpened — ещё не сделано). Это не отвал. Неудачные входы — childCodeFailed по reason. Экран ввода кода (child_code) до входа ещё не знает семью — его смотрим отдельной воронкой по людям: $screen child_code → logIn (role = child).", "if_low": "Застревают между приглашением и входом — крупнее QR, кнопка «Отправить в Telegram / WhatsApp», напоминание родителю через сутки. Много childCodeFailed с wrong_code — код плохо читается или путают буквы.", "recipe": null, "color": "#19a3c4"}, {"id": "f-core", "title": "Ядро: задание → проверка → награда", "question": "Проходит ли семья весь цикл, ради которого существует продукт, и где он рвётся? Шаг 4 за неделю — это главная метрика.", "by": "family", "window": "7 дней", "steps": [{"label": "Родитель создал задание", "event": "questCreated", "who": "parent", "where": "", "hint": "можно разбить по source", "alt": [], "card": "p-tasks-app-03"}, {"label": "Ребёнок открыл задание", "event": "questOpened", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-tasks-app-01"}, {"label": "Ребёнок сделал и отправил", "event": "questSubmitted", "who": "child", "where": "", "hint": "можно разбить по had_photo", "alt": [], "card": "c-tasks-app-05"}, {"label": "Родитель одобрил — монеты начислены ★", "event": "questApproved", "who": "parent", "where": "", "hint": "★ главная метрика; медиана time_to_approve_minutes", "alt": [], "card": "p-review-app-01"}, {"label": "Ребёнок попросил награду", "event": "rewardRedeemed", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-market-app-01"}, {"label": "Родитель выдал награду", "event": "rewardApproved", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-requests-app-01"}], "breakdowns": ["источник задания (source)", "сложность (difficulty)", "страна"], "note": "Вместо шага 4 бывает возврат на доработку (questRejected) — смотрим долю и срок. Время проверки важнее конверсии: если родитель отвечает через сутки, ребёнок остывает.", "if_low": "Мало открытий (1→2) — видно ли задание на главной ребёнка. Мало отправок (2→3) — задания сложные или непонятно, что фотографировать: разбить по difficulty. Мало одобрений или долгое time_to_approve_minutes (3→4) — пуш родителю «Алина ждёт проверки». Мало запросов наград (4→5) — пустой магазин наград, см. воронку «Награды».", "recipe": null, "color": "#16181d"}, {"id": "f-child", "title": "Первая сессия ребёнка", "question": "Понимает ли ребёнок, что делать, в первый же день?", "by": "people", "window": "1 день", "steps": [{"label": "Вошёл на своём телефоне", "event": "logIn", "who": "child", "where": "role = child", "hint": "", "alt": [], "card": "c-onboarding-app-05"}, {"label": "Увидел главную", "event": "$screen", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-home-app-00", "screen": "child_home"}, {"label": "Открыл задание", "event": "questOpened", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-tasks-app-01"}, {"label": "Сфотографировал и отправил", "event": "questSubmitted", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-tasks-app-05"}], "breakdowns": ["способ входа (method)", "платформа ($os)"], "note": "Считает только детей со своим телефоном: в режиме ребёнка на телефоне родителя события logIn нет.", "if_low": "Видят главную, но не открывают задание — задание не бросается в глаза. Открывают, но не отправляют — камера, разрешения или задание непонятно.", "recipe": null, "color": "#19a3c4"}, {"id": "f-rewards", "title": "Награды: монеты превращаются в желание", "question": "Есть ли в магазине наград то, что ребёнок хочет, и отвечает ли родитель на запросы?", "by": "family", "window": "14 дней", "steps": [{"label": "Родитель создал награду", "event": "rewardCreated", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-rewards-app-02"}, {"label": "Ребёнок открыл магазин наград", "event": "$screen", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-market-app-00", "screen": "child_market"}, {"label": "Попросил награду (монеты отложены)", "event": "rewardRedeemed", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-market-app-04"}, {"label": "Родитель выдал", "event": "rewardApproved", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-requests-app-01"}], "breakdowns": ["своя или из каталога (is_custom)", "цена (price)", "страна"], "note": "Отказ — rewardDeclined, перенос — rewardPostponed (запрос остаётся, монеты отложены). Долгое ожидание ответа (wait_minutes) убивает мотивацию так же, как отказ.", "if_low": "Открывают магазин наград, но не просят — награды неинтересные или дорогие: разбить по price и is_custom. Просят, но родитель не выдаёт — пуш родителю о запросе, напоминание.", "recipe": null, "color": "#e0457b"}, {"id": "f-paywall", "title": "Подписка", "question": "Откуда люди приходят на экран подписки и сколько из них платят?", "by": "people", "window": "1 день", "steps": [{"label": "Открыл экран подписки", "event": "paywallViewed", "who": "parent", "where": "", "hint": "можно разбить по trigger", "alt": [], "card": "p-paywall-app-00"}, {"label": "Нажал «Оформить»", "event": "paywallCtaTapped", "who": "parent", "where": "", "hint": "можно разбить по plan_tier, period, method", "alt": [], "card": "p-paywall-app-01"}, {"label": "Оплатил", "event": "subscriptionStarted", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-paywall-app-02"}], "breakdowns": ["источник (trigger)", "тариф (plan_tier)", "период (period)", "способ оплаты (method)", "страна"], "note": "Неудачи — purchaseFailed по reason (отмена, сеть, магазин, Paylov). Деньги и продления — в RevenueCat (и в PostHog, если включена интеграция): пробный → платный, отток, выручка.", "if_low": "Открывают, но не нажимают — цена, тарифы или текст экрана: сравнить по trigger. Нажимают, но не платят — purchaseFailed по reason: cancelled — передумали на оплате, network и store — технические сбои, paylov_error — оплата картой.", "recipe": null, "color": "#7444c4"}, {"id": "f-foksik-parent", "title": "Фоксик AI для родителя → Premium + ИИ", "question": "Помогает ли ИИ-помощник родителю и продаёт ли он тариф с ИИ?", "by": "people", "window": "30 дней", "steps": [{"label": "Открыл Фоксика", "event": "$screen", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-assistant-app-00", "screen": "parent_assistant"}, {"label": "Спросил", "event": "copilotChatMessageSent", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-assistant-app-01"}, {"label": "Применил совет из итогов недели", "event": "copilotRecommendationApplied", "who": "parent", "where": "", "hint": "карточки в чате считаются своими событиями с source = foksik_card — см. ниже", "alt": [], "card": "p-assistant-app-03"}, {"label": "Упёрся в лимит", "event": "aiBuddyLimitReached", "who": "parent", "where": "who = parent", "hint": "", "alt": [], "card": "p-assistant-app-04"}, {"label": "Купил Premium + ИИ", "event": "subscriptionStarted", "who": "parent", "where": "plan_tier = premium_ai", "hint": "", "alt": [], "card": "p-paywall-app-04"}], "breakdowns": ["страна", "язык"], "note": "В именах событий Фоксик называется по-старому: copilot… у родителя, aiBuddyLimitReached — лимит. Чтобы считать и советы, и карточки, заведите в PostHog действие (Action) «Фоксик помог»: copilotRecommendationApplied или любое событие с source = foksik_card — и поставьте его шагом 3.", "if_low": "Открывают, но не спрашивают — пустой экран не подсказывает, что спросить. Спрашивают, но не применяют — советы не к месту. Упираются в лимит, но не покупают — экран подписки после лимита не объясняет пользу.", "recipe": null, "color": "#ff8a1f"}, {"id": "f-foksik-child", "title": "Ребёнок и Фоксик", "question": "Возвращается ли ребёнок к Фоксику?", "by": "people", "window": "7 дней", "steps": [{"label": "Открыл чат с Фоксиком", "event": "$screen", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-chat-app-00", "screen": "child_foksik"}, {"label": "Написал или сказал", "event": "jeyMessageSent", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-chat-app-01"}], "breakdowns": ["язык", "платформа ($os)"], "note": "jey… — старое имя Фоксика. Шаг «сделал задание из чата» добавим, когда сдачи заданий из чата начнут отправляться.", "if_low": "Открывают, но не пишут — подсказки-кнопки в пустом чате.", "recipe": null, "color": "#19a3c4"}, {"id": "f-push", "title": "Возврат по пушу", "question": "Сколько людей возвращаются по уведомлению и делают то, ради чего оно пришло?", "by": "people", "window": "1 день", "steps": [{"label": "Пуш отправлен", "event": "push_sent", "who": "system", "where": "", "hint": "", "alt": [], "external": true, "extLabel": "Сервер записывает каждую отправку — число из журнала рассылок"}, {"label": "Открыл пуш", "event": "pushOpened", "who": "parent", "where": "", "hint": "можно разбить по type и campaign_id", "alt": [], "card": "p-feed-app-00"}, {"label": "Сделал то, ради чего пуш", "event": "questApproved", "who": "parent", "where": "", "hint": "действие зависит от вида пуша", "alt": ["rewardApproved", "questCreated"], "card": "p-review-app-01"}], "breakdowns": ["вид пуша (type)", "кампания", "роль"], "note": "Пока нельзя: нет события pushOpened. Число отправленных — из журнала рассылок на сервере, не из PostHog.", "if_low": "Мало открытий — текст и время отправки. Открывают, но не делают — пуш ведёт не на тот экран.", "recipe": null, "color": "#8a8f99"}], "brief": {"title": "Коротко, за 2 минуты", "points": [{"icon": "★", "title": "Главная метрика", "text": "Семьи, где за неделю родитель одобрил хотя бы одно задание ребёнка (событие questApproved). Растёт — продукт работает.", "go": "metrics"}, {"icon": "⏳", "title": "Сейчас она не считается", "status_of": "questApproved", "text": "Событие questApproved сделано в коде и появится со следующей сборкой. До неё график главной метрики — 0.", "go": "metrics"}, {"icon": "👁", "title": "Что видно в PostHog уже сегодня", "counts": true, "text": "Установки и открытия, регистрация и вход родителя, экран подписки, Фоксик у родителя, серии дней. Задания, награды, покупки и просмотры экранов — со следующей сборкой.", "go": "events"}, {"icon": "✋", "title": "Что нужно от владельцев", "text": "Включить группы (семьи) в PostHog, решить с Mixpanel, включить интеграцию RevenueCat → PostHog, завести ссылки кампаний в App Store, решить про вопрос «Откуда вы узнали».", "go": "status"}], "roles": [{"who": "Руководителю", "path": [["Коротко", "top-hero"], ["Главная метрика", "metrics"], ["Что нужно от владельцев", "status"]]}, {"who": "Маркетологу", "path": [["Азбука", "start-here"], ["Воронка «Магазин»", "f-store"], ["Ссылки и UTM", "marketing"]]}, {"who": "Аналитику", "path": [["Правила отбора", "rules"], ["Рецепты в воронках", "f-core"], ["Все события", "events"]]}]}, "architecture": {"title": "Откуда берутся данные", "sub": "Приложение отправляет события в PostHog; деньги — из RevenueCat; установки и источники — из магазинов приложений. Родитель и ребёнок — разные люди, но одна семья: воронки «по семьям» склеивают их действия.", "boxes": [{"id": "ads", "kind": "store", "icon": "📣", "title": "Реклама, блогеры, сайт", "text": "Ссылки с метками кампаний (UTM, ct=).", "small": "Instagram, TikTok, Telegram, Google, блогеры, школы"}, {"id": "stores", "kind": "store", "icon": "🏪", "title": "App Store и Google Play", "text": "Показы, просмотры страницы, установки — по источникам и кампаниям.", "small": "App Store Connect · Play Console"}, {"id": "parent", "kind": "parent", "icon": "👩", "title": "Телефон родителя", "text": "События родителя и режима ребёнка на этом же телефоне.", "small": "в PostHog — номер аккаунта родителя"}, {"id": "child", "kind": "child", "icon": "🧒", "title": "Телефон ребёнка", "text": "События ребёнка: только обезличенный номер, без имени и текстов.", "small": "в PostHog — child_<номер>"}, {"id": "ph", "kind": "tool", "icon": "📊", "title": "PostHog", "text": "Все события, люди и семьи. Воронки, удержание, пути, когорты.", "small": "один проект на все сборки — см. «Только настоящие пользователи»"}, {"id": "rc", "kind": "server", "icon": "💳", "title": "RevenueCat", "text": "Покупки, пробный период, продления, отмены, выручка.", "small": "в PostHog — только если включена интеграция (не проверено)"}, {"id": "meta", "kind": "store", "icon": "🎯", "title": "Meta Ads (только родитель)", "text": "Только «приложение активировано» — для рекламы в Facebook и Instagram.", "small": "после согласия и входа родителя; у ребёнка выключено. Покупки в Meta сейчас не передаются"}, {"id": "db", "kind": "server", "icon": "🗄", "title": "Supabase (база)", "text": "Правда о заданиях, монетах и семьях.", "small": "к PostHog не подключена; можно подключить как склад данных"}], "flows": [{"a": "ads", "b": "stores", "label": "переходы по ссылкам", "solid": true}, {"a": "stores", "b": "parent", "label": "установки", "solid": true}, {"a": "stores", "b": "child", "label": "установки", "solid": true}, {"a": "parent", "b": "ph", "label": "события", "solid": true}, {"a": "child", "b": "ph", "label": "события", "solid": true}, {"a": "parent", "b": "meta", "label": "активация (боевая сборка)", "solid": true}, {"a": "rc", "b": "ph", "label": "покупки — если включено", "solid": false}, {"a": "db", "b": "ph", "label": "склад данных — не подключено", "solid": false}], "identityHtml": "<h3>Кто есть кто в PostHog</h3>\n<table><tr><th>Кто</th><th>Номер в PostHog</th><th>Что ещё знаем</th></tr>\n<tr><td>Родитель</td><td><code>номер аккаунта</code></td><td>role = parent, страна, язык, тариф семьи (tier), семья</td></tr>\n<tr><td>Ребёнок на своём телефоне</td><td><code>child_&lt;номер&gt;</code></td><td>role = child, семья. Никаких имён, дат рождения, фото и текстов</td></tr>\n<tr><td>Ребёнок на телефоне родителя</td><td>номер родителя</td><td>role = child и active_child_id — пока открыт режим ребёнка</td></tr>\n<tr><td>Семья</td><td>группа <code>family</code> = номер семьи</td><td>тариф, страна, число детей. Воронки «по семьям» считают шаги родителя и ребёнка вместе</td></tr>\n<tr><td>Покупки из RevenueCat</td><td>номер семьи</td><td>отдельный «человек», не родитель (пока приложение не передаёт RevenueCat номер PostHog)</td></tr></table>\n<p style=\"margin-top:12px\"><b>До согласия родителя приложение не отправляет ничего.</b> Поэтому заставка и выбор языка в аналитике не видны:\nпервое наше событие — <code>coppaConsentGiven</code> (перед ним только служебное Application Installed от PostHog).</p>\n<p>На каждом нашем событии: <code>coppa_strict</code> (детский режим приватности), <code>$app_namespace</code> (какое приложение), версия\nи — со следующей сборки — <code>environment</code> (какая сборка). После входа к ним добавляются роль, семья, тариф, страна и язык;\nдо входа (согласие, регистрация, ввод кода ребёнком) их ещё нет — поэтому события, которые называют семью, несут её сами (<code>family_id</code>).</p>"}, "metrics": {"title": "Главная метрика и дерево метрик", "sub": "Одна цифра, по которой понятно, жив ли продукт, и пять групп метрик, которые её двигают. Под каждой — события, из которых она считается.", "northStar": {"name": "Семьи с закрытым циклом за неделю", "event": "questApproved", "text": "Сколько семей за последние 7 дней прошли цикл: ребёнок сделал задание → родитель одобрил. Считается как уникальные семьи (группа <b>family</b>) с событием <b>questApproved</b> за неделю. Растёт — продукт работает: родители ставят задания, дети их делают, монеты что-то значат.", "recipe": "PostHog → New insight → <b>Trends</b> → событие <code>questApproved</code> → считать «Unique family» (группы) → интервал «Week». Если группы не включены: SQL (HogQL) — <code>count(distinct properties.family_id)</code> по questApproved за неделю."}, "definitions": [["Активная семья за неделю", "за 7 дней было хотя бы одно questCreated или questSubmitted."], ["Активный ребёнок", "за 7 дней открыл приложение на своём телефоне (Application Opened у child_…) или отправил задание."]], "pillars": [{"title": "Привлечение", "sub": "сколько и откуда приходят", "items": [{"name": "Установки по источникам", "formula": "Загрузки в App Store и Google Play по кампаниям (ct=, utm_*).", "events": [], "ext": "магазины приложений", "go": "marketing"}, {"name": "Конверсия страницы в магазине", "formula": "Установки ÷ просмотры страницы. Рычаги — иконка, скриншоты, отзывы.", "events": [], "ext": "магазины приложений", "go": "f-store"}, {"name": "Новые семьи", "formula": "Уникальные семьи с <b>onboardingCompleted</b> за период.", "events": ["onboardingCompleted"]}, {"name": "Цена семьи", "formula": "Расход на канал (из кабинетов рекламы — в PostHog его нет) ÷ новые семьи из этого канала.", "events": ["onboardingCompleted"], "ext": "кабинеты рекламы"}]}, {"title": "Активация", "sub": "дошли ли до пользы", "items": [{"name": "Семья создана в первый день", "formula": "Воронка «Родитель»: согласие → главная за 1 день.", "events": ["coppaConsentGiven", "$screen"], "go": "f-parent"}, {"name": "Ребёнок подключён за 7 дней", "formula": "Воронка «Подключение ребёнка»: добавлен → вошёл со своего телефона.", "events": ["childAdded", "logIn"], "go": "f-connect"}, {"name": "«Ага-момент»: первое одобрение", "formula": "Доля новых семей с первым <b>questApproved</b> за 7 дней.", "events": ["questApproved"], "go": "f-core"}]}, {"title": "Вовлечённость", "sub": "как часто и глубоко", "items": [{"name": "Задания на семью в неделю", "formula": "questCreated ÷ активные семьи.", "events": ["questCreated"]}, {"name": "Отправки на ребёнка в неделю", "formula": "questSubmitted ÷ активные дети.", "events": ["questSubmitted"]}, {"name": "Время проверки", "formula": "Медиана time_to_approve_minutes — по одобрениям с экрана проверки (у карточек Фоксика времени нет).", "events": ["questApproved"]}, {"name": "Доля возвратов", "formula": "questRejected ÷ (questApproved + questRejected).", "events": ["questRejected", "questApproved"]}, {"name": "Награды на семью", "formula": "rewardApproved ÷ активные семьи.", "events": ["rewardApproved"], "go": "f-rewards"}]}, {"title": "Монетизация", "sub": "кто и за что платит", "items": [{"name": "Конверсия подписки", "formula": "subscriptionStarted ÷ paywallViewed — по trigger, стране, тарифу (plan_tier).", "events": ["paywallViewed", "subscriptionStarted"], "go": "f-paywall"}, {"name": "Платящие семьи", "formula": "Семьи с оплаченной подпиской — по RevenueCat. Свойство tier в PostHog для этого не годится: у оплативших картой Paylov оно пока free.", "events": ["subscriptionStarted", "rc_initial_purchase_event"]}, {"name": "Пробный → платный, выручка, отток", "formula": "Из RevenueCat (кабинет или интеграция с PostHog).", "events": ["rc_initial_purchase_event"]}]}, {"title": "Удержание", "sub": "возвращаются ли", "items": [{"name": "Родитель D1 / D7 / D30", "formula": "Возврат — Application Opened; строже — с действием: questCreated или questApproved.", "events": ["Application Opened", "questApproved"], "go": "retention"}, {"name": "Ребёнок вернулся через 1 и 4 недели", "formula": "Отправил задание через 1 и через 4 недели после первого входа.", "events": ["questSubmitted"], "go": "retention"}, {"name": "Удержание семьи", "formula": "Семьи с questApproved на неделе N и через k недель (по группе family).", "events": ["questApproved"], "go": "retention"}, {"name": "Серии и возвраты", "formula": "streakMilestone; возвраты после 48 ч (паутинка).", "events": ["streakMilestone", "childReturnedAfterBreak"]}]}]}, "docsBefore": [{"id": "retention", "kicker": "Удержание", "title": "Удержание и когорты", "sub": "Не воронка, а «возвращаются ли». В PostHog — тип графика Retention.", "cols": 3, "cards": [{"html": "<h3>Родитель</h3><p><b>Старт:</b> <code>onboardingCompleted</code>. <b>Возврат:</b> <code>Application Opened</code>.</p><p><b>D1, D7, D30</b> — доля вернувшихся через 1, 7 и 30 дней. Строже — возврат с действием: <code>questCreated</code> или <code>questApproved</code>.</p><p><b>Как построить:</b> New insight → Retention → стартовое событие onboardingCompleted → возврат Application Opened → по дням.</p><p>Разбить по: страна, способ входа, тариф.</p>"}, {"html": "<h3>Ребёнок</h3><p><b>Старт:</b> <code>logIn</code> с <code>role = child</code>. <b>Возврат:</b> <code>questSubmitted</code>.</p><p><b>По неделям:</b> 1, 2, 4, 8.</p><p>Возвраты после перерыва 48 ч и дольше — <code>childReturnedAfterBreak</code> (ещё не сделано).</p>"}, {"html": "<h3>Семья (главное)</h3><p><b>Старт и возврат:</b> <code>questApproved</code>, считаем по группе <b>family</b>.</p><p>Это удержание главной метрики: какая доля семей, закрывших цикл на первой неделе, закрывает его и на 4-й.</p><p>Платящие и бесплатные — отдельными когортами.</p>"}]}], "docsAfter": [{"id": "status", "kicker": "Статус", "title": "Что сделано и что нужно от владельцев", "sub": "Аудит кода 2 октября 2026 и доработка в ветке analytics-tracking-plan.", "cols": 2, "cards": [{"html": "<h3>Сделано в коде — появится со следующей сборкой</h3><p>Ветка <code>analytics-tracking-plan</code>:</p><ul><li>Просмотры всех экранов (<code>$screen</code>) и метка сборки <code>environment</code> на каждом событии.</li><li>Согласие родителя — первое наше событие.</li><li>Задания: создано, открыто, одобрено, возвращено — и карточками Фоксика.</li><li>Награды: создана, попросили (в магазине и в чате), выдана, отказ, перенос.</li><li>Подписка: настоящий источник, способ оплаты, покупка, неудачная покупка, тариф в <code>plan_tier</code>.</li><li>Неудачный вход ребёнка по коду; лимит Фоксика у родителя.</li><li>Регистрация и вход ребёнка — в воронках по семьям.</li><li>Тесты на каждое событие; план в репозитории: docs/analytics/TRACKING_PLAN.md.</li></ul>"}, {"html": "<h3>Нужно от владельцев</h3><ul><li><b>PostHog — группы:</b> включить Group analytics (группа family; может быть платной). Без неё воронки «по семьям» не построить; запасной путь — SQL по <code>family_id</code>.</li><li><b>PostHog — фильтр тестовых:</b> один раз настроить «Filter out internal and test users» (см. «Правила»).</li><li><b>PostHog — дашборды:</b> собрать по разделу «Дашборды».</li><li><b>PostHog — доступ:</b> пригласить маркетологов (роль только для чтения).</li><li><b>Mixpanel:</b> отказаться (рекомендация — всё есть в PostHog) или дать токен.</li><li><b>RevenueCat:</b> включить интеграцию с PostHog; интеграция с Meta не настроена.</li><li><b>App Store Connect:</b> завести ссылки кампаний (provider token).</li><li><b>Рассылки:</b> добавить <code>?source=push</code> в ссылки пушей, которые открывают подписку, — тогда trigger = push.</li><li><b>Продукт:</b> решить про вопрос «Откуда вы узнали».</li><li><b>Разрешить доработку обработки пушей</b> — без неё не будет события <code>pushOpened</code>.</li></ul>"}, {"html": "<h3>Дальше</h3><ul><li><b>После соседней работы над Фоксиком и приглашениями:</b> отправка приглашения, вход ребёнка по ссылке и QR, лимит Фоксика у ребёнка, источник подписки из Фоксика, сдача задания из чата.</li><li><b>P1:</b> пуши, PIN, режим ребёнка, лимит детей, выход и удаление аккаунта, оценка, бонусы, голос у Фоксика, событие «Регистрация завершена» для Meta, номер PostHog в RevenueCat.</li><li><b>P1:</b> тариф семьи в PostHog для оплативших картой Paylov (сейчас free), удаление человека из PostHog при удалении аккаунта.</li><li><b>P2:</b> ссылки с UTM, Install Referrer, уровень с сервера, возвраты после перерыва, валюта у subscriptionStarted, свойство возраста (малыш / подросток) для разрезов, мелкие поправки старых событий.</li></ul>"}]}, {"id": "rules", "kicker": "Правила", "title": "Как отбирать данные, приватность и названия", "sub": "Чтобы цифры не врали и данные были законными.", "cols": 3, "cards": [{"html": "<h3>Только настоящие пользователи</h3><p>Тестовые сборки пишут в тот же проект PostHog. <b>Сегодня</b> настоящих пользователей отделяет <code>$app_namespace = com.oynaplatform.app</code> — так называется магазинное приложение (у OYNA Dev — <code>com.oynaplatform.app.dev</code>). <b>Со следующей сборки</b> на событиях будет ещё <code>environment</code>: <code>prod</code> — магазинная сборка, <code>qa</code>, <code>debug</code>, <code>dev</code> — тестовые; тогда добавьте <code>environment = prod</code>. Удобнее всего настроить один раз: Settings → Project → <b>Filter out internal and test users</b> → условие <code>$app_namespace = com.oynaplatform.app</code>, и в каждом графике ставить эту галочку. Первые Application Installed / Opened приходят без <code>environment</code> — для них хватает <code>$app_namespace</code>.</p>"}, {"html": "<h3>Детские данные (COPPA)</h3><ul>\n<li>COPPA — закон США о данных детей. До согласия родителя в аналитику (PostHog, Mixpanel, Meta) не уходит ничего. Службы, без которых приложение не работает, — покупки (RevenueCat), пуши и настройки (Firebase) — запускаются сразу.</li><li>Ребёнок — только <code>child_&lt;номер&gt;</code>; ни имени, ни даты рождения, ни фото.</li>\n<li>Никакого свободного текста: названия заданий и наград, сообщения, комментарии — только признаки (<code>is_custom</code>, <code>has_reason</code>, длина).</li>\n<li>Рекламных SDK у ребёнка нет. У родителя в боевой сборке — только Meta App Events («приложение активировано»): на Android — с рекламным номером устройства, на iPhone — если родитель разрешил отслеживание.</li>\n<li><code>coppa_strict</code> на каждом событии: true — строгий детский режим, false — взрослый (родитель).</li>\n<li>Удалил аккаунт — человека нужно удалить и в PostHog. Сейчас этого нет — задача.</li></ul>"}, {"html": "<h3>Как называем</h3><ul>\n<li>Событие — <b>объект + действие в прошедшем</b>, camelCase: <code>questCreated</code>, <code>rewardApproved</code>.</li>\n<li>Свойства — snake_case: <code>time_to_approve_minutes</code>. Да/нет хранится как <code>true</code>/<code>false</code>.</li>\n<li>Экраны — <code>роль_экран</code>: <code>parent_home</code>, <code>child_market</code>.</li>\n<li>Старые имена не трогаем — на них отчёты: <code>parent_profile_*</code>, <code>jey*</code> и <code>copilot*</code> = Фоксик.</li>\n<li>Один факт — одно событие, после ответа сервера, а не по нажатию. Действия карточками Фоксика — тем же событием с <code>source = foksik_card</code>.</li>\n<li>Тариф, который выбирают или покупают, — <code>plan_tier</code>: на iPhone событие с <code>tier</code> получает тариф семьи вместо выбранного.</li></ul>"}, {"html": "<h3>Как проверить событие</h3><ol style=\"margin:4px 0 8px 20px;padding:0\">\n<li>Сборка OYNA Dev → сделать действие.</li><li>PostHog → Activity → Live events, фильтр <code>$app_namespace = com.oynaplatform.app.dev</code>.</li>\n<li>Сверить имя и свойства с этой страницей (клик по событию).</li><li>В отчётах — «Только настоящие пользователи».</li></ol>"}]}, {"id": "dashboards", "kicker": "PostHog", "title": "Дашборды", "sub": "Что собрать в PostHog — это план, в PostHog их ещё нужно создать. Каждый пункт — один график (insight). Везде — «Только настоящие пользователи» (см. «Правила»).", "cols": 3, "cards": [{"html": "<h3>1. Привлечение и активация</h3><ul><li>Новые семьи по дням (onboardingCompleted, по семьям)</li><li>Воронка «Магазин → согласие» — вместе с отчётами магазинов</li><li>Воронка «Родитель»: по способу входа и стране</li><li>Воронка «Подключение ребёнка»</li><li>Таблица UTM: источник → семьи → оплаты</li></ul>"}, {"html": "<h3>2. Ядро продукта</h3><ul><li><b>Главная метрика:</b> уникальные семьи с questApproved по неделям</li><li>Воронка «Ядро» по семьям</li><li>Медиана времени проверки</li><li>Доля возвратов на доработку</li><li>Задания по источнику: вручную, из готовых, ИИ, Фоксик</li></ul>"}, {"html": "<h3>3. Награды и монеты</h3><ul><li>Воронка «Награды»</li><li>Запросы, выдачи, отказы и переносы по неделям</li><li>Ожидание ответа родителя (wait_minutes)</li><li>Свои награды против каталога</li></ul>"}, {"html": "<h3>4. Деньги</h3><ul><li>Воронка «Подписка» по trigger</li><li>Открытия экрана подписки по источникам</li><li>Неудачные покупки по причинам</li><li>Оплата через App Store / Google Play против Paylov (Узбекистан)</li><li>Выручка, пробный → платный, отток — RevenueCat</li></ul>"}, {"html": "<h3>5. Удержание</h3><ul><li>Родитель D1 / D7 / D30</li><li>Ребёнок по неделям</li><li>Удержание семьи по questApproved</li><li>Дней в неделю с открытием (stickiness)</li></ul>"}, {"html": "<h3>6. Фоксик AI</h3><ul><li>Родители: вопросы, применённые советы, лимиты</li><li>Воронка «Фоксик → Premium + ИИ»</li><li>Дети: открытия чата, сообщения</li><li>Отказы «не по теме»</li></ul>"}, {"html": "<h3>7. Качество</h3><ul><li>Неудачные входы ребёнка по причинам (childCodeFailed)</li><li>Ошибки оплаты (purchaseFailed)</li><li>Экраны, где чаще всего закрывают приложение (пути, Paths)</li></ul>"}]}, {"id": "marketing", "kicker": "Маркетинг", "title": "Ссылки, UTM и что можно измерить", "sub": "Как размечать кампании, где смотреть установки и что в детском приложении измерить нельзя.", "cols": 2, "cards": [{"full": true, "html": "<h3>Что где смотреть</h3><table>\n<tr><th>Вопрос</th><th>Где ответ</th><th>Как</th></tr>\n<tr><td>Сколько установок и откуда</td><td>App Store Connect, Google Play Console</td><td>Источники и кампании по ссылкам с ct= и utm_*</td></tr>\n<tr><td>Что люди делают в приложении</td><td>PostHog</td><td>События, воронки этой страницы, удержание</td></tr>\n<tr><td>Сколько заплатили и продлили</td><td>RevenueCat (и PostHog, если включена интеграция)</td><td>Выручка, пробный → платный, отток</td></tr>\n<tr><td>Сколько стоила установка или семья</td><td>Кабинеты рекламы + магазины + PostHog</td><td>Расход ÷ установки (магазин) ÷ новые семьи (PostHog)</td></tr>\n<tr><td>Работают ли пуши</td><td>PostHog</td><td>Открытия пушей ÷ отправленные — когда появится pushOpened</td></tr></table>"}, {"html": "<h3>Ссылки для кампаний</h3>\n<h4>App Store</h4><pre>https://apps.apple.com/app/apple-store/id6762140001?pt=&lt;provider-token&gt;&amp;ct=202610_uz_instagram_launch&amp;mt=8</pre>\n<p><code>pt</code> выдаёт App Store Connect (App Analytics → Campaigns). Установки по <code>ct</code> видны там же.</p>\n<h4>Google Play</h4><pre>https://play.google.com/store/apps/details?id=com.oynaplatform.app&amp;referrer=utm_source%3Dinstagram%26utm_medium%3Dpaid_social%26utm_campaign%3D202610_uz_launch</pre>\n<p>Play Console показывает установки по кампаниям. Приложение может прочитать эти метки при первом запуске (Install Referrer) и записать родителю — следующий шаг.</p>\n<h4>Сайт</h4><pre>https://oynaplatform.com/?utm_source=telegram&amp;utm_medium=post&amp;utm_campaign=202610_kz_school</pre>\n<p>Кнопки магазинов на сайте должны передавать метки дальше — в <code>ct</code> и <code>referrer</code>.</p>"}, {"html": "<h3>Правила UTM</h3><table>\n<tr><th>Метка</th><th>Значения</th></tr>\n<tr><td><code>utm_source</code></td><td>instagram, tiktok, telegram, facebook, google, youtube, blogger_&lt;имя&gt;, school_&lt;имя&gt;, partner_&lt;имя&gt;</td></tr>\n<tr><td><code>utm_medium</code></td><td>paid_social, organic_social, influencer, cpc, referral, email, push, offline</td></tr>\n<tr><td><code>utm_campaign</code></td><td><code>ГГГГММ_страна_цель</code>: 202610_uz_launch, 202611_kz_school</td></tr>\n<tr><td><code>utm_content</code></td><td>креатив: video_fox_15s, static_market_v2</td></tr></table>\n<p>Только латиница в нижнем регистре и подчёркивания. Без пробелов и кириллицы — иначе одна кампания распадается на несколько строк.</p>"}, {"html": "<h3>Реклама и атрибуция</h3>\n<ul><li><b>Meta (Facebook, Instagram)</b> — в боевой сборке есть Meta App Events, но <b>только у родителя</b>: после согласия и входа родителя. На iPhone приложение спрашивает разрешение на отслеживание; если его не дали, «приложение активировано» всё равно уходит, но без рекламного номера. На Android рекламный номер уходит всегда. В режиме ребёнка и на телефоне ребёнка выключено.</li>\n<li><b>Покупки в Meta сейчас не передаются:</b> интеграция RevenueCat → Meta не настроена.</li>\n<li><b>Следующий шаг для Meta:</b> событие «Регистрация завершена» (семья создана) — чтобы реклама училась на семьях, а не на установках. Только родитель, без данных ребёнка.</li>\n<li><b>Остальные каналы</b> (TikTok, Google, блогеры, Telegram) — ссылки кампаний магазинов, UTM на сайте и Install Referrer Google Play. Других рекламных SDK нет и не ставим: в приложении есть детский режим (правила Apple Kids и Google Families).</li>\n<li><b>Ничего о ребёнке</b> в рекламные системы не уходит; ретаргетинг по действиям ребёнка — нельзя.</li>\n<li><b>Предложение продукту:</b> вопрос «Откуда вы узнали про OYNA?» в конце регистрации — сарафан и Telegram ссылками не измерить.</li></ul>"}, {"html": "<h3>Пуши и ссылки в приложение</h3>\n<ul><li><b>Пуши-рассылки</b> уже несут <code>campaign_id</code> и <code>push_id</code> — нужно событие <code>pushOpened</code> (план, P1), тогда открытия и возвраты по кампании будут в PostHog.</li>\n<li><b>Ссылки в приложение:</b> сейчас открывают приложение <code>oyna://…</code> и приглашения ребёнка. Другие https-ссылки на oynaplatform.com приложение пока не открывают — для кампаний «вернись в приложение» их нужно добавить.</li>\n<li>Метки <code>utm_*</code> в ссылке в приложение — свойства <code>deepLinkOpened</code> (план, P2).</li></ul>"}]}], "primer": {"title": "Азбука: три слова и где их смотреть", "sub": "Прочитайте это первым. Дальше на странице — те же вещи на настоящих экранах OYNA.", "cards": [{"icon": "📍", "title": "Событие", "text": "Запись о том, что случилось в приложении. Мама нажала «Одобрить» — в PostHog появилась одна строчка. Все строчки по порядку — это лента событий.", "feed": [["День 1, 10:02", "Мама", "coppaConsentGiven", "дала согласие"], ["День 1, : "p-auth-app-00", "props": {"$screen_name": "parent_region"}}, {"t": "10:05", "who": "parent", "text": "Зарегистрировалась по номеру телефона (семьи ещё нет)", "ev": "signUp", "card": "p-auth-app-03", "props": {"method": "phone"}}, {"t": "10:09", "who": "parent", "text": "Создала семью и добавила Алину", "ev": "onboardingCompleted", "card": "p-auth-app-13", "props": {"country": "UZ", "language": "ru"}}, {"t": "10:10", "who": "parent", "text": "Открыла приглашение для Алины", "ev": "$screen", "screen": "parent_child_invite", "card": "p-family-app-02", "props": {"$screen_name": "parent_child_invite"}}, {"t": "18:40", "who": "child", "text": "Алина вошла по коду на своём телефоне", "ev": "logIn", "card": "c-onboarding-app-05", "props": {"role": "child", "method": "code"}}, {"t": "День 2, 08:15", "who": "parent", "text": "Мама создала задание из готовых", "ev": "questCreated", "card": "p-tasks-app-04", "props": {"source": "template", "kind": "daily", "coins": 250}}, {"t": "17:30", "who": "child", "text": "Алина открыла задание", "ev": "questOpened", "card": "c-tasks-app-01", "props": {"review_state": "new", "is_custom": false}}, {"t": "17:52", "who": "child", "text": "Сфотографировала и отправила", "ev": "questSubmitted", "card": "c-tasks-app-05", "props": {"had_photo": true}}, {"t": "18:34", "who": "parent", "text": "Мама одобрила — Алине 250 монет", "ev": "questApproved", "card": "p-review-app-01", "props": {"coins": 250, "time_to_approve_minutes": 42}}, {"t": "День 5, 16:00", "who": "child", "text": "Алина попросила награду — монеты отложены", "ev": "rewardRedeemed", "card": "c-market-app-01", "props": {"price": 3000, "from": "market"}}, {"t": "16:20", "who": "parent", "text": "Мама выдала награду", "ev": "rewardApproved", "card": "p-requests-app-01", "props": {"price": 3000, "wait_minutes": 20}}, {"t": "День 6, 21:10", "who": "parent", "text": "Хотела добавить второго ребёнка — бесплатно можно одного", "ev": "paywallViewed", "card": "p-paywall-app-00", "props": {"trigger": "child_limit"}}, {"t": "21:12", "who": "parent", "text": "Оплатила Premium на год", "ev": "subscriptionStarted", "card": "p-paywall-app-02", "props": {"plan_tier": "premium", "period": "annual", "method": "store"}}], "after": "Из этих строчек PostHog и считает всё на этой странице: «семья создана в первый день» (шаги 1–4), «ребёнок подключён» (5–6), главная метрика — одобренное задание за неделю (10), подписка и её источник (13–14)."}, "glossary": {"title": "Словарь: слова с этой страницы и из PostHog", "sub": "Наведите на слово с пунктиром на странице — подсказка оттуда же.", "terms": [["Событие (event)", "Одна запись о том, что случилось: «родитель одобрил задание». В PostHog — одна строка ленты."], ["Имя события", "Как событие называется в PostHog, латиницей: questApproved. По имени ищут и строят графики."], ["Свойство (property)", "Подробность события: coins = 250, had_photo = true. По свойствам фильтруют и делят на группы."], ["true / false", "Да и нет в PostHog: had_photo = true — фото было. Фильтр так и пишут: had_photo = true."], ["Просмотр экрана ($screen)", "Особое событие «открылся экран». Какой — в свойстве $screen_name: parent_home, child_market."], ["Человек (person)", "Тот, кто сделал событие: родитель (номер аккаунта) или ребёнок на своём телефоне (child_<номер>)."], ["Обезличенный номер (uuid)", "Длинный номер вида 8f2c41d0-…: по нему нельзя узнать, кто это, но можно склеить действия одного человека."], ["Семья (группа family)", "Родитель и его дети вместе. Воронки «по семьям» считают шаги мамы и ребёнка как один путь."], ["Воронка (Funnel)", "Шаги по порядку. Показывает, сколько дошли до каждого шага и где уходят."], ["Конверсия", "Доля дошедших: 45 из 100 одобрили задание — конверсия 45 %."], ["Сколько ждём (conversion window)", "Сколько времени даём пройти воронку: «7 дней» — шаг через 8 дней уже не засчитается."], ["Разбить по (Breakdown)", "Та же воронка или график, разделённые по свойству: по стране, способу входа, источнику задания."], ["Тренд (Trends)", "График: сколько событий или людей по дням и неделям."], ["Удержание (Retention)", "Возвращаются ли люди: сколько из пришедших на неделе 1 вернулись на неделе 2, 4…"], ["D1 / D7 / D30", "Доля вернувшихся через 1, 7 и 30 дней после первого дня."], ["Когорта", "Группа людей с общим признаком: «пришли в октябре», «платящие семьи»."], ["Главная метрика (North Star)", "Одна цифра, по которой видно, что продукт работает: семьи, закрывшие цикл за неделю."], ["Медиана", "Середина: половина быстрее, половина медленнее. Честнее среднего, которое портит одно очень долгое ожидание."], ["trigger", "Откуда человек попал на экран подписки: из профиля, из лимита детей, из пуша…"], ["tier и plan_tier", "Тариф: free, premium, premium_ai. tier — тариф семьи сейчас; plan_tier — тариф, который выбирают или покупают на экране подписки."], ["$app_namespace", "Какое приложение прислало событие: com.oynaplatform.app — магазинное, com.oynaplatform.app.dev — OYNA Dev для тестов."], ["environment", "Какая сборка прислала событие: prod — магазинная, qa — внутренняя для тестов, debug и dev — у разработчиков. Со следующей сборки."], ["UTM, ct=, referrer", "Подписи в рекламной ссылке: по ним видно, откуда пришёл человек (Instagram, блогер, школа)."], ["ASO", "Работа над страницей приложения в магазине: иконка, скриншоты, описание, отзывы."], ["CTR", "Доля открывших: 100 пушей отправили, 12 открыли — CTR 12 %."], ["P0 / P1 / P2", "Очередь работ: P0 — нужно для главных воронок, P1 — следующий шаг, P2 — потом."], ["COPPA", "Закон США о данных детей. Отсюда правила: до согласия родителя — ничего, о ребёнке — только обезличенный номер."], ["Фоксик в именах событий", "Фоксик — ИИ-помощник OYNA. В именах событий он по-старому: copilot… у родителя, jey… у ребёнка, aiBuddyLimitReached — лимит."], ["Магазин приложений и магазин наград", "Магазин приложений — App Store и Google Play. Магазин наград — экран в OYNA, где ребёнок тратит монеты."], ["Статусы событий", "✓ уже приходит · ✓ ста
