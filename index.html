<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OYNA — все экраны: родитель и ребёнок (Figma ↔ приложение)</title>
<style>
  :root {
    --bg: #e9e9ec; --ink: #16181d; --muted: #6b7078; --line: #d5d6db;
    --figma: #7b61ff; --app: #ff8a1f; --motion: #e0457b; --device: #1fa463; --card: #fff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg);
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; color: var(--ink); }
  #top { position: fixed; inset: 0 0 auto 0; height: 58px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 14px; padding: 0 16px; z-index: 20; }
  #top h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  #top .sub { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #top .grow { flex: 1; min-width: 0; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; height: 32px; min-width: 32px; padding: 0 10px;
    cursor: pointer; font: inherit; font-size: 13px; color: var(--ink); }
  .btn:hover { background: #f4f4f6; }
  #zoomv { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
  .tog { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; white-space: nowrap; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  #q { height: 32px; border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; width: 200px; font: inherit; }
  #side { position: fixed; left: 0; top: 58px; bottom: 0; width: 272px; background: #fff; border-right: 1px solid var(--line);
    overflow: auto; z-index: 15; padding: 10px 0 30px; }
  #side h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 16px 6px; }
  #side a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 16px; color: var(--ink); text-decoration: none; font-size: 13px; }
  #side a:hover { background: #f4f4f6; }
  #side a .n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; }
  #side .notes { margin: 8px 12px 0; padding: 10px 12px; border-radius: 10px; background: #fff7ee; border: 1px solid #ffd8b0; font-size: 12.5px; }
  #side .notes b { display: block; margin-bottom: 4px; }
  #side .notes ul { margin: 4px 0 0 16px; padding: 0; }
  #side .notes li { margin: 3px 0; }
  #view { position: fixed; left: 272px; top: 58px; right: 0; bottom: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  #board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .side-h { position: absolute; font-size: 64px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; }
  .side-h small { display: block; font-size: 22px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 6px; }
  .sec-h { position: absolute; white-space: nowrap; }
  .sec-h .t { font-size: 30px; font-weight: 750; letter-spacing: -.01em; }
  .sec-h .t .c { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 10px; }
  .sec-h .note { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .sec-h .dev { font-size: 15px; color: #5a45d6; margin-top: 6px; white-space: normal; max-width: 1500px; }
  .sec-bg { position: absolute; border-radius: 28px; background: rgba(255,255,255,.55); border: 1px solid rgba(0,0,0,.05); }
  .row-l { position: absolute; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .row-l .dot { width: 12px; height: 12px; }
  .row-empty { position: absolute; font-size: 15px; color: var(--muted); font-style: italic; }
  .card { position: absolute; background: var(--card); border-radius: 18px; overflow: hidden; cursor: zoom-in;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 22px rgba(0,0,0,.08); transition: box-shadow .12s, opacity .12s; }
  .card:hover { box-shadow: 0 0 0 3px var(--hl, #333), 0 10px 28px rgba(0,0,0,.14); }
  .card img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; background: #fafafa; }
  .card.figma { --hl: var(--figma); } .card.app { --hl: var(--app); } .card.motion { --hl: var(--motion); } .card.device { --hl: var(--device); }
  .card .tall { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.66); color: #fff; font-size: 12px;
    padding: 3px 8px; border-radius: 99px; }
.card .play { position: absolute; left: 8px; top: 8px; background: var(--motion); color: #fff; font: 600 11px/1 -apple-system, system-ui, sans-serif; padding: 5px 8px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.25); }
  .cap { position: absolute; font-size: 14px; line-height: 1.25; color: var(--ink); overflow: hidden; }
  .cap .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  .dim { opacity: .12; }
  body.hide-figma .r-figma, body.hide-app .r-app, body.hide-motion .r-motion, body.hide-device .r-device { display: none; }
  #lb { position: fixed; inset: 0; background: rgba(12,13,16,.975); z-index: 50; display: none; flex-direction: column; }
  #lb.on { display: flex; }
  #lb .bar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; color: #fff; }
  #lb .bar .ttl { flex: 1; min-width: 0; }
  #lb .bar .ttl b { font-size: 16px; } #lb .bar .ttl div { color: #aab; font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lb .bar .btn { background: #26282e; color: #fff; border-color: #3a3d45; }
  #lb .panes { flex: 1; display: flex; gap: 18px; padding: 0 18px 12px; min-height: 0; }
  #lb .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; min-height: 0; }
  #lb .pane .lab { color: #ccd; font-size: 13px; margin-bottom: 8px; display: flex; gap: 6px; align-items: center; }
  #lb .pane .sc { flex: 1; min-height: 0; width: 100%; overflow: auto; display: flex; justify-content: center; }
  #lb .pane img { max-width: 100%; height: auto; align-self: flex-start; border-radius: 14px; }
  #lb .pane.fit img { max-height: 100%; width: auto; }
  #lb .strip { display: none; gap: 8px; padding: 8px 18px 14px; overflow-x: auto; }
  #lb.cmp .strip { display: flex; }
  #lb .strip img { height: 92px; border-radius: 8px; cursor: pointer; opacity: .55; border: 2px solid transparent; }
  #lb .strip img.on { opacity: 1; border-color: var(--figma); }
  #lb:not(.cmp) #pR { display: none; }
  #help { position: fixed; right: 14px; bottom: 12px; background: rgba(255,255,255,.92); border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 12px; font-size: 12px; color: var(--muted); z-index: 18; }
</style>
</head>
<body>
<div id="top">
  <h1>OYNA · все экраны</h1>
  <div class="grow"><div class="sub" id="meta"></div></div>
  <label class="tog"><input type="checkbox" id="tFigma" checked><span class="dot" style="background:var(--figma)"></span>Figma</label>
  <label class="tog"><input type="checkbox" id="tApp" checked><span class="dot" style="background:var(--app)"></span>Приложение</label>
  <label class="tog"><input type="checkbox" id="tMotion" checked><span class="dot" style="background:var(--motion)"></span>Анимация</label>
  <label class="tog"><input type="checkbox" id="tDevice" checked><span class="dot" style="background:var(--device)"></span>Android · DEV</label>
  <input id="q" placeholder="Поиск: «проверка», «маркет»…">
  <button class="btn" id="zOut" title="Отдалить (−)">−</button>
  <button class="btn" id="zoomv" title="Масштаб">100%</button>
  <button class="btn" id="zIn" title="Приблизить (+)">+</button>
  <button class="btn" id="fit" title="Вписать (0)">Вписать</button>
</div>
<nav id="side"></nav>
<div id="view"><div id="board"></div></div>
<div id="help">Тащи — двигать · ⌘/Ctrl + колесо или щипок — масштаб · клик — открыть · ← → листать · Esc — закрыть</div>
<div id="lb">
  <div class="bar">
    <div class="ttl"><b id="lbT"></b><div id="lbS"></div></div>
    <button class="btn" id="lbCmp">Сравнить с Figma</button>
    <button class="btn" id="lbFit">Целиком</button>
    <button class="btn" id="lbPrev">←</button>
    <button class="btn" id="lbNext">→</button>
    <button class="btn" id="lbX">✕</button>
  </div>
  <div class="panes">
    <div class="pane fit" id="pL"><div class="lab" id="pLl"></div><div class="sc"><img id="imgL" alt=""></div></div>
    <div class="pane fit" id="pR"><div class="lab"><span class="dot" style="background:var(--figma)"></span><span id="pRl"></span></div><div class="sc"><img id="imgR" alt=""></div></div>
  </div>
  <div class="strip" id="strip"></div>
</div>

const NOTES = {};
const META = "Родитель — ветка redesign-parent-flow (37f36817) · Ребёнок — redesign-main-screen (1a5d5bb1, OYNA Dev 1.0.8) · Приложение: рендер экранов тестами захвата на тестовых данных, iPhone 393×852 · Android · DEV: реальный прогон на эмуляторе Pixel 8 Pro с данными DEV · 27.09.2026";
const CW = 230, GAP = 30, LABEL_W = 210, MAXR = 2.25, CAP_H = 44;

const board = document.getElementById('board'), view = document.getElementById('view');

let z = 0.55, tx = 40, ty = 40;
const secPos = {};
const cardsByRow = [];

function el(tag, cls, parent) { const e = document.createElement(tag); if (cls) e.className = cls; (parent || board).appendChild(e); return e; }

function layout() {
  let y = 0, maxX = 0;
  for (const side of ['motion', 'common', 'parent', 'child']) {
    const h = el('div', 'side-h');
    const secs = DATA.filter(s => s.side === side);
    const counts = secs.reduce((a, s) => { s.rows.forEach(r => a[r.kind] += r.cards.length); return a; }, { figma: 0, app: 0, motion: 0, device: 0 });
    h.innerHTML = ({ motion: 'АНИМАЦИИ', common: 'ПЕРВЫЙ ЗАПУСК', parent: 'РОДИТЕЛЬ', child: 'РЕБЁНОК' })[side] +
      (side === 'motion' ? `<small>${counts.motion} анимаций, каждая крутится по кругу</small>` : `<small>${counts.figma} кадров Figma · ${counts.app} экранов приложения` + (counts.motion ? ` · ${counts.motion} анимаций` : '') + (counts.device ? ` · ${counts.device} снимков с Android (живые данные DEV)` : '') + '</small>');
    h.style.left = '0px'; h.style.top = y + 'px';
    y += 150;
    for (const s of secs) {
      const x0 = 0, top = y;
      const bg = el('div', 'sec-bg');
      const hd = el('div', 'sec-h');
      const n = s.rows.reduce((a, r) => a + r.cards.length, 0);
      hd.innerHTML = `<div class="t">${s.title}<span class="c">${n} ${s.side === 'motion' ? 'анимаций' : 'экранов'}</span></div>` + (s.note ? `<div class="note">${s.note}</div>` : '') +
        (s.dev ? `<div class="dev">Отличается от Figma намеренно: ${s.dev}</div>` : '');
      hd.style.left = (x0 + 36) + 'px'; hd.style.top = (y + 28) + 'px';
      secPos[s.id] = { x: x0, y: top };
      y += (s.note ? 120 : 96) + (s.dev ? (s.dev.length > 120 ? 58 : 34) : 0);
      let secW = 0;
      for (const r of s.rows) {
        if ((r.kind === 'device' || r.kind === 'motion') && !r.cards.length) continue;
        const rowEls = [];
        const lab = el('div', 'row-l r-' + r.kind);
        lab.innerHTML = r.title ? `<span class="dot" style="background:${COLORS[r.kind]}"></span>${r.title}` : '';
        lab.style.left = (x0 + 36) + 'px'; lab.style.top = (y + 8) + 'px';
        rowEls.push(lab);
        let x = x0 + 36 + LABEL_W, rowH = 0;
        if (!r.cards.length) {
          const e = el('div', 'row-empty r-' + r.kind);
          e.textContent = r.kind === 'figma' ? 'Отдельного кадра в Figma нет — экран собран по общему стилю флоу' : 'В приложении нет — будущее';
          e.style.left = x + 'px'; e.style.top = (y + 8) + 'px';
          rowEls.push(e);
          rowH = 40;
        }
        const list = [];
        r.cards.forEach((c, i) => {
          const ratio = c.h / c.w, shown = Math.min(ratio, MAXR);
          const ch = Math.round(CW * shown);
          const card = el('div', 'card ' + r.kind + ' r-' + r.kind);
          card.style.left = x + 'px'; card.style.top = y + 'px'; card.style.width = CW + 'px'; card.style.height = ch + 'px';
          card.innerHTML = `<img loading="lazy" decoding="async" src="img/${c.key}_t.webp" alt="">` + (ratio > MAXR + 0.05 ? '<span class="tall">↕ длинный экран</span>' : '') + (r.kind === 'motion' ? '<span class="play">▶ анимация</span>' : '');
          card.dataset.label = (s.title + ' ' + c.label).toLowerCase();
          const cap = el('div', 'cap r-' + r.kind);
          cap.innerHTML = `<span class="k" style="background:${COLORS[r.kind]}"></span>${c.label}`;
          cap.style.left = x + 'px'; cap.style.top = (y + ch + 8) + 'px'; cap.style.width = CW + 'px'; cap.style.height = CAP_H + 'px';
          card.addEventListener('click', ev => { if (!moved) openLb(s, r, i); });
          list.push({ card, cap, c });
          rowH = Math.max(rowH, ch + CAP_H + 10);
          x += CW + GAP;
        });
        cardsByRow.push(list);
        secW = Math.max(secW, x - x0);
        y += rowH + 26;
      }
      y += 20;
      bg.style.left = x0 + 'px'; bg.style.top = top + 'px'; bg.style.width = (secW + 20) + 'px'; bg.style.height = (y - top) + 'px';
      maxX = Math.max(maxX, secW + 20);
      y += 60;
    }
    y += 140;
  }
  board.style.width = maxX + 'px'; board.style.height = y + 'px';
}

function apply() {
  board.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
  document.getElementById('zoomv').textContent = Math.round(z * 100) + '%';
}
function zoomAt(f, cx, cy) {
  const nz = Math.min(3, Math.max(0.08, z * f));
  tx = cx - (cx - tx) * (nz / z); ty = cy - (cy - ty) * (nz / z); z = nz; apply();
}
function fitAll() {
  const w = board.offsetWidth, vw = view.clientWidth;
  z = Math.min(1, (vw - 60) / w); tx = 30; ty = 30; apply();
}
function goTo(id) {
  const p = secPos[id]; if (!p) return;
  if (z < 0.35) z = 0.5;
  tx = 30 - p.x * z; ty = 24 - p.y * z; apply();
}

// Pan & zoom.
let dragging = false, moved = false, sx = 0, sy = 0, stx = 0, sty = 0;
view.addEventListener('pointerdown', e => { dragging = true; moved = false; sx = e.clientX; sy = e.clientY; stx = tx; sty = ty; });
window.addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  if (!moved && Math.hypot(dx, dy) > 4) { moved = true; view.classList.add('drag'); }
  if (moved) { tx = stx + dx; ty = sty + dy; apply(); }
});
window.addEventListener('pointerup', () => { dragging = false; view.classList.remove('drag'); setTimeout(() => moved = false, 0); });
view.addEventListener('wheel', e => {
  e.preventDefault();
  const r = view.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * 0.0022), e.clientX - r.left, e.clientY - r.top);
  else { tx -= e.deltaX; ty -= e.deltaY; apply(); }
}, { passive: false });
document.getElementById('zIn').onclick = () => zoomAt(1.25, view.clientWidth / 2, view.clientHeight / 2);
document.getElementById('zOut').onclick = () => zoomAt(0.8, view.clientWidth / 2, view.clientHeight / 2);
document.getElementById('zoomv').onclick = () => zoomAt(1 / z, view.clientWidth / 2, view.clientHeight / 2);
document.getElementById('fit').onclick = fitAll;

// Row toggles and search.
for (const [id, cls] of [['tFigma', 'hide-figma'], ['tApp', 'hide-app'], ['tMotion', 'hide-motion'], ['tDevice', 'hide-device']])
  document.getElementById(id).onchange = e => document.body.classList.toggle(cls, !e.target.checked);
document.getElementById('q').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  for (const list of cardsByRow) for (const { card, cap } of list) {
    const hit = !q || card.dataset.label.includes(q);
    card.classList.toggle('dim', !hit); cap.classList.toggle('dim', !hit);
  }
};

// Sidebar.
const side = document.getElementById('side');
function sideList() {
  let h = '';
  if (NOTES.title) {
    h += `<div class="notes"><b>${NOTES.title}</b>${NOTES.body || ''}</div>`;
  }
  for (const s of ['motion', 'common', 'parent', 'child']) {
    h += `<h2>${({ motion: 'Анимации', common: 'Общее', parent: 'Родитель', child: 'Ребёнок' })[s]}</h2>`;
    for (const sec of DATA.filter(x => x.side === s)) {
      const n = sec.rows.reduce((a, r) => a + r.cards.length, 0);
      h += `<a href="#" data-id="${sec.id}"><span>${sec.title}</span><span class="n">${n}</span></a>`;
    }
  }
  side.innerHTML = h;
  side.querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); goTo(a.dataset.id); });
}

// Lightbox with the Figma comparison.
const lb = document.getElementById('lb');
let cur = null, figIdx = {};
function figmaOf(s) { return (s.rows.find(r => r.kind === 'figma') || { cards: [] }).cards; }
function openLb(s, r, i) { cur = { s, r, i }; lb.classList.add('on'); showLb(); }
function showLb() {
  const { s, r, i } = cur, c = r.cards[i], figs = figmaOf(s);
  document.getElementById('lbT').textContent = `${c.label} — ${s.title}`;
  document.getElementById('lbS').textContent = `${r.title} · ${i + 1} из ${r.cards.length} · ${c.src} · ${c.w}×${c.h}`;
  document.getElementById('imgL').src = `img/${c.key}.webp`;
  document.getElementById('pLl').innerHTML = `<span class="dot" style="background:${COLORS[r.kind]}"></span>${r.title}: ${c.label}`;
  const canCmp = r.kind !== 'figma' && figs.length > 0;
  document.getElementById('lbCmp').style.display = canCmp ? '' : 'none';
  if (!canCmp) lb.classList.remove('cmp');
  if (canCmp) {
    const k = Math.min(figIdx[s.id] || 0, figs.length - 1);
    document.getElementById('imgR').src = `img/${figs[k].key}.webp`;
    document.getElementById('pRl').textContent = 'Figma: ' + figs[k].label;
    const strip = document.getElementById('strip');
    strip.innerHTML = figs.map((f, j) => `<img src="img/${f.key}_t.webp" data-j="${j}" class="${j === k ? 'on' : ''}" title="${f.label}">`).join('');
    strip.querySelectorAll('img').forEach(im => im.onclick = () => { figIdx[s.id] = +im.dataset.j; showLb(); });
  }
}
function step(d) { if (!cur) return; const n = cur.r.cards.length; cur.i = (cur.i + d + n) % n; showLb(); }
document.getElementById('lbPrev').onclick = () => step(-1);
document.getElementById('lbNext').onclick = () => step(1);
document.getElementById('lbX').onclick = () => lb.classList.remove('on');
document.getElementById('lbCmp').onclick = () => { lb.classList.toggle('cmp'); showLb(); };
document.getElementById('lbFit').onclick = () => {
  const on = document.getElementById('pL').classList.toggle('fit');
  document.getElementById('pR').classList.toggle('fit', on);
  document.getElementById('lbFit').textContent = on ? 'Целиком' : 'Вписать';
};
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('panes')) lb.classList.remove('on'); });
window.addEventListener('keydown', e => {
  if (lb.classList.contains('on')) {
    if (e.key === 'Escape') lb.classList.remove('on');
    if (e.key === 'ArrowLeft') step(-1);
    if (e.key === 'ArrowRight') step(1);
    return;
  }
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '+' || e.key === '=') zoomAt(1.25, view.clientWidth / 2, view.clientHeight / 2);
  if (e.key === '-') zoomAt(0.8, view.clientWidth / 2, view.clientHeight / 2);
  if (e.key === '0') fitAll();
});

layout(); sideList(); apply();
</script>
</body>
</html>
