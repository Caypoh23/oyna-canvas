<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OYNA — все экраны: родитель и ребёнок (Figma ↔ приложение)</title>
<style>
  :root {
    --bg: #e9e9ec; --ink: #16181d; --muted: #6b7078; --line: #d5d6db;
    --figma: #7b61ff; --app: #ff8a1f; --motion: #e0457b; --device: #1fa463; --card: #fff;
    --live: #1f8a4c; --fix: #c77700; --new: #2f6fde; --side-w: 272px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); overscroll-behavior: none;
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; color: var(--ink); touch-action: manipulation; }
  #top { position: fixed; inset: 0 0 auto 0; height: 58px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 0 14px; z-index: 20; overflow-x: auto; scrollbar-width: none; }
  #top::-webkit-scrollbar { display: none; }
  #top h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  .tabs { display: flex; gap: 2px; background: #f1f1f4; border-radius: 10px; padding: 3px; flex: none; }
  .tabs a { text-decoration: none; color: var(--ink); font-size: 13px; padding: 6px 11px; border-radius: 8px; white-space: nowrap; }
  .tabs a.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .tabs a:not(.on):hover { background: #e6e6ea; }
  #top .grow { flex: 1; min-width: 12px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; height: 32px; min-width: 32px; padding: 0 10px;
    cursor: pointer; font: inherit; font-size: 13px; color: var(--ink); white-space: nowrap; flex: none; }
  .btn:hover { background: #f4f4f6; }
  .zoom { display: flex; align-items: center; gap: 4px; flex: none; }
  #zoomv { min-width: 58px; text-align: center; font-variant-numeric: tabular-nums; }
  .tog { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; white-space: nowrap; flex: none; }
  .tog.an { padding: 5px 10px 5px 8px; border-radius: 99px; border: 1px solid var(--line); background: #fff; font-weight: 600; }
  .tog.an:has(input:checked) { background: #16181d; color: #fff; border-color: #16181d; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  #q { height: 32px; border: 1px solid var(--line); border-radius: 9px; padding: 0 10px; width: 190px; font: inherit; flex: none; }
  #menu { display: none; }
  #side { position: fixed; left: 0; top: 58px; bottom: 0; width: var(--side-w); background: #fff; border-right: 1px solid var(--line);
    overflow: auto; z-index: 15; padding: 10px 0 30px; overscroll-behavior: contain; }
  #side h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 16px 6px; }
  #side a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 16px; color: var(--ink); text-decoration: none; font-size: 13px; border-left: 3px solid transparent; }
  #side a:hover { background: #f4f4f6; }
  #side a.on { background: #f1f1f4; border-left-color: #16181d; font-weight: 600; }
  #side a .n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; font-size: 12px; font-weight: 400; }
  #side .notes { margin: 8px 12px 0; padding: 10px 12px; border-radius: 10px; background: #fff7ee; border: 1px solid #ffd8b0; font-size: 12.5px; }
  #side .notes b { display: block; margin-bottom: 4px; }
  #side .notes ul { margin: 4px 0 0 16px; padding: 0; }
  #side .notes li { margin: 3px 0; }
  #side .anbox { display: none; margin: 10px 12px 4px; padding: 10px 12px; border-radius: 10px; background: #f1f5ff; border: 1px solid #cfdcff; font-size: 12.5px; }
  body.an #side .anbox { display: block; }
  #side .anbox b { display: block; margin-bottom: 6px; }
  #side .anbox .lg { display: flex; align-items: center; gap: 6px; margin: 3px 0; }
  #side .anbox a { display: inline; padding: 0; border: 0; color: #2f6fde; font-weight: 600; }
  #view { position: fixed; left: var(--side-w); top: 58px; right: 0; bottom: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  #board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #board.moving { will-change: transform; }
  .side-h { position: absolute; font-size: 64px; font-weight: 800; letter-spacing: -.02em; white-space: nowrap; transform-origin: 0 0; }
  .side-h small { display: block; font-size: 22px; font-weight: 500; color: var(--muted); letter-spacing: 0; margin-top: 6px; }
  .sec-h { position: absolute; white-space: nowrap; }
  .sec-h .t { font-size: 30px; font-weight: 750; letter-spacing: -.01em; transform-origin: 0 0; display: inline-block; }
  .sec-h .t .c { font-size: 16px; font-weight: 500; color: var(--muted); margin-left: 10px; }
  .sec-h .note { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .sec-h .dev { font-size: 15px; color: #5a45d6; margin-top: 6px; white-space: normal; max-width: 1500px; }
  .sec-bg { position: absolute; border-radius: 28px; background: rgba(255,255,255,.55); border: 1px solid rgba(0,0,0,.05); }
  .row-l { position: absolute; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .row-l .dot { width: 12px; height: 12px; }
  .row-empty { position: absolute; font-size: 15px; color: var(--muted); font-style: italic; }
  .card { position: absolute; background: #f3f3f5 center top / cover no-repeat; border-radius: 18px; overflow: hidden; cursor: zoom-in;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 22px rgba(0,0,0,.08); }
  .card:hover { box-shadow: 0 0 0 3px var(--hl, #333), 0 10px 28px rgba(0,0,0,.14); }
  .card img.pic { position: absolute; inset: 0; display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .card.figma { --hl: var(--figma); } .card.app { --hl: var(--app); } .card.motion { --hl: var(--motion); } .card.device { --hl: var(--device); }
  .card .tall { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.66); color: #fff; font-size: 12px;
    padding: 3px 8px; border-radius: 99px; z-index: 1; }
  .card .play { position: absolute; left: 8px; top: 8px; background: var(--motion); color: #fff; font: 600 11px/1 -apple-system, system-ui, sans-serif; padding: 5px 8px; border-radius: 999px; box-shadow: 0 1px 4px rgba(0,0,0,.25); z-index: 1; }
  .cap { position: absolute; font-size: 14px; line-height: 1.25; color: var(--ink); overflow: hidden; }
  .cap .k { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  /* Far out: plain tinted blocks, no captions, big section names. */
  #board.lod0 .card { box-shadow: none; background-image: none !important; }
  #board.lod0 .card.figma { background-color: #d9d1ff; } #board.lod0 .card.app { background-color: #ffd9b3; }
  #board.lod0 .card.motion { background-color: #f6c3d6; } #board.lod0 .card.device { background-color: #bfe8d0; }
  #board.lod0 .card > * { display: none; }
  #board.far .cap, #board.far .row-l, #board.far .row-empty, #board.far .sec-h .note, #board.far .sec-h .dev { visibility: hidden; }
  #board.far .card { box-shadow: none; }
  #board.far .sec-h .t { background: rgba(255,255,255,.92); border-radius: 12px; padding: 2px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #board.far .side-h small { visibility: hidden; }
  .dim { opacity: .12; }
  body.hide-figma .r-figma, body.hide-app .r-app, body.hide-motion .r-motion, body.hide-device .r-device { display: none; }
  /* Analytics layer */
  .an-tag { position: absolute; left: 0; right: 0; bottom: 0; padding: 26px 8px 8px; display: none; flex-wrap: wrap; gap: 5px;
    background: linear-gradient(to top, rgba(14,16,22,.92) 70%, rgba(14,16,22,0)); z-index: 2; cursor: default; }
  body.an .an-tag { display: flex; }
  body.an .card:not(.has-an) { opacity: .45; }
  body.an #board.lod0 .card.has-an { background-color: #c9d8ff; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font: 600 12px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #fff;
    background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 7px; padding: 5px 7px; cursor: pointer; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
  .chip:hover { background: rgba(255,255,255,.25); }
  .chip i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .chip.scr { font-family: inherit; font-weight: 500; color: #d7dbe4; }
  .chip.live i { background: #4cd38a; } .chip.ready i { background: #2dd4bf; } .chip.fix i { background: #ffb547; } .chip.new i { background: #7aa7ff; } .chip.server i { background: #c69cff; }
  #lb { position: fixed; inset: 0; background: rgba(12,13,16,.975); z-index: 50; display: none; flex-direction: column; }
  #lb.on { display: flex; }
  #lb .bar { display: flex; align-items: center; gap: 12px; padding: 12px 18px; color: #fff; }
  #lb .bar .ttl { flex: 1; min-width: 0; }
  #lb .bar .ttl b { font-size: 16px; } #lb .bar .ttl div { color: #aab; font-size: 12px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lb .bar .btn { background: #26282e; color: #fff; border-color: #3a3d45; }
  #lb .panes { flex: 1; display: flex; gap: 18px; padding: 0 18px 12px; min-height: 0; }
  #lb .pane { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; min-height: 0; }
  #lb .pane .lab { color: #ccd; font-size: 13px; margin-bottom: 8px; display: flex; gap: 6px; align-items: center; }
  #lb .pane .sc { flex: 1; min-height: 0; width: 100%; overflow: auto; display: flex; justify-content: center; }
  #lb .pane img { max-width: 100%; height: auto; align-self: flex-start; border-radius: 14px; }
  #lb .pane.fit img { max-height: 100%; width: auto; }
  #lb .strip { display: none; gap: 8px; padding: 8px 18px 14px; overflow-x: auto; }
  #lb.cmp .strip { display: flex; }
  #lb .strip img { height: 92px; border-radius: 8px; cursor: pointer; opacity: .55; border: 2px solid transparent; }
  #lb .strip img.on { opacity: 1; border-color: var(--figma); }
  #lb:not(.cmp) #pR { display: none; }
  #lb .anl { display: none; gap: 6px; flex-wrap: wrap; padding: 0 18px 10px; }
  body.an #lb .anl { display: flex; }
  #help { position: fixed; left: calc(var(--side-w) + 12px); bottom: 12px; background: rgba(255,255,255,.94); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 11px; font-size: 12px; color: var(--muted); z-index: 18; max-width: calc(100vw - var(--side-w) - 220px); }
  #help b { color: var(--ink); font-weight: 600; }
  #help #helpX { float: right; border: 0; background: none; color: var(--muted); cursor: pointer; margin: -2px -4px 0 8px; font-size: 13px; }
  body.nohelp #help { display: none; }
  .layers { position: relative; flex: none; }
  .layers summary { list-style: none; display: inline-flex; align-items: center; }
  .layers summary::-webkit-details-marker { display: none; }
  .layers .pop { position: fixed; top: 52px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
    display: flex; flex-direction: column; gap: 9px; box-shadow: 0 8px 28px rgba(0,0,0,.14); z-index: 30; }
  @media (max-width: 760px) {
    :root { --side-w: 0px; }
    #menu { display: inline-block; }
    #side { width: 84vw; max-width: 320px; transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.2); }
    body.side-open #side { transform: none; }
    #q, .layers { display: none; }
    #help { display: none; }
  }
</style>
</head>
<body>
<div id="top">
  <button class="btn" id="menu" title="Разделы">☰</button>
  <nav class="tabs"><a href="./" class="on">Экраны</a><a href="analytics/">Аналитика</a><a href="foksik/">Фоксик</a></nav>
  <label class="tog an" title="Показать на экранах, какие события аналитики они отправляют"><input type="checkbox" id="tAn">События на экранах</label>
  <details class="layers"><summary class="btn">Слои ▾</summary><div class="pop">
    <label class="tog"><input type="checkbox" id="tFigma" checked><span class="dot" style="background:var(--figma)"></span>Figma</label>
    <label class="tog"><input type="checkbox" id="tApp" checked><span class="dot" style="background:var(--app)"></span>Приложение</label>
    <label class="tog"><input type="checkbox" id="tMotion" checked><span class="dot" style="background:var(--motion)"></span>Анимация</label>
    <label class="tog"><input type="checkbox" id="tDevice" checked><span class="dot" style="background:var(--device)"></span>Android · DEV</label>
  </div></details>
  <input id="q" placeholder="Поиск: экран или событие">
  <div class="grow"></div>
  <div class="zoom">
    <button class="btn" id="zOut" title="Отдалить (−)">−</button>
    <button class="btn" id="zoomv" title="Масштаб 100 % (1)">100%</button>
    <button class="btn" id="zIn" title="Приблизить (+)">+</button>
    <button class="btn" id="fit" title="Показать всё (0)">Вписать</button>
    <button class="btn" id="helpB" title="Как двигаться">?</button>
  </div>
</div>
<nav id="side"></nav>
<div id="view"><div id="board"></div></div>
<div id="map"></div>
<div id="help"><button id="helpX" title="Скрыть">✕</button><b>Двигать:</b> тащить мышью, колесо, два пальца, стрелки, PgUp/PgDn · <b>Масштаб:</b> щипок, ⌘/Ctrl + колесо, + −, двойной клик · <b>0</b> — всё, <b>1</b> — 100 % · клик по экрану — открыть</div>
<div id="lb">
  <div class="bar">
    <div class="ttl"><b id="lbT"></b><div id="lbS"></div></div>
    <button class="btn" id="lbCmp">Сравнить с Figma</button>
    <button class="btn" id="lbFit">Целиком</button>
    <button class="btn" id="lbPrev">←</button>
    <button class="btn" id="lbNext">→</button>
    <button class="btn" id="lbX">✕</button>
  </div>
  <div class="anl" id="lbAn"></div>
  <div class="panes">
    <div class="pane fit" id="pL"><div class="lab" id="pLl"></div><div class="sc"><img id="imgL" alt=""></div></div>
    <div class="pane fit" id="pR"><div class="lab"><span class="dot" style="background:var(--figma)"></span><span id="pRl"></span></div><div class="sc"><img id="imgR" alt=""></div></div>
  </div>
  <div class="strip" id="strip"></div>
</div>
<script>
/* OYNA canvas engine — one way to move around every canvas page.
 *
 * Mouse and trackpad: drag or scroll to move (Shift + wheel moves sideways),
 * pinch or ⌘/Ctrl + wheel to zoom at the cursor, double-click to zoom in
 * (Alt — out). Phone/tablet: one finger moves (with a glide), two fingers
 * pinch and move, double tap zooms in. Keys: arrows, PgUp/PgDn/Space,
 * Home/End, + − (also with ⌘), 0 fits the board, 1 is 100 %.
 *
 * The board can't be thrown away: at least half the view (or the whole
 * board when it is smaller) always stays on it. While the board moves it is
 * one composited layer; once it settles the page gets a "settle" call so it
 * can swap pictures for the zoom (level of detail) and the URL keeps the
 * place (#@x,y,z — a link opens the same spot).
 */
(function (global) {
  'use strict';

  const CSS = `
  .cv-map { position: fixed; right: 12px; bottom: 46px; z-index: 18; background: rgba(255,255,255,.9); transition: background .15s;
    border: 1px solid #d5d6db; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.08); padding: 8px;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  .cv-map .cv-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font: 600 11px/1 -apple-system, system-ui, sans-serif; color: #6b7078; letter-spacing: .06em;
    text-transform: uppercase; margin: 0 0 6px; }
  .cv-map .cv-head button { border: 0; background: none; color: #6b7078; cursor: pointer; font: inherit; padding: 2px 4px; }
  .cv-map.min .cv-body { display: none; } .cv-map.min .cv-head { margin: 0; }
  .cv-body { position: relative; display: flex; gap: 6px; cursor: pointer; }
  .cv-map:hover { background: rgba(255,255,255,.98); }
  .cv-labels { position: relative; width: 96px; flex: none; }
  .cv-labels div { position: absolute; right: 0; max-width: 96px; font: 500 10px/1.15 -apple-system, system-ui, sans-serif; cursor: pointer;
    color: #3b3f46; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform: translateY(-50%); }
  .cv-labels div.on { color: #000; font-weight: 700; }
  .cv-mapbox { position: relative; flex: none; background: #f1f1f4; border-radius: 6px; overflow: hidden; }
  .cv-mapbox i { position: absolute; display: block; border-radius: 2px; opacity: .85; }
  .cv-vp { position: absolute; border: 2px solid #16181d; border-radius: 3px; background: rgba(22,24,29,.08);
    box-shadow: 0 0 0 9999px rgba(255,255,255,.0); pointer-events: none; }
  @media (max-width: 760px) { .cv-map { display: none; } }
  `;

  function createCanvas(opts) {
    const view = opts.view, board = opts.board;
    const Z_MAX = opts.zMax || 3;
    const zMinFixed = opts.zMin || 0;
    let z = 1, tx = 0, ty = 0, W = 1, H = 1;
    let frame = 0, settleTimer = 0;
    let moved = false;
    const on = { change: [], settle: [] };

    if (!document.getElementById('cv-style')) {
      const st = document.createElement('style'); st.id = 'cv-style'; st.textContent = CSS; document.head.appendChild(st);
    }

    const vw = () => view.clientWidth, vh = () => view.clientHeight;
    function measure() { W = Math.max(1, board.offsetWidth); H = Math.max(1, board.offsetHeight); }
    function fitZoom() { return Math.min((vw() - 48) / W, (vh() - 48) / H); }
    function zMin() { return zMinFixed || Math.min(0.1, fitZoom() * 0.9); }
    const clampZ = v => Math.min(Z_MAX, Math.max(zMin(), v));

    // Half the view (or the whole board, when it is smaller) stays on the board.
    function clampXY() {
      const bw = W * z, bh = H * z, w = vw(), h = vh();
      const kx = Math.min(bw, w * 0.5), ky = Math.min(bh, h * 0.5);
      tx = Math.min(Math.max(tx, kx - bw), w - kx);
      ty = Math.min(Math.max(ty, ky - bh), h - ky);
    }

    function render() {
      clampXY();
      board.classList.add('moving');
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => { board.classList.remove('moving'); emit('settle'); saveHash(); }, 170);
      if (!frame) frame = requestAnimationFrame(flush);
    }
    function flush() {
      frame = 0;
      board.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
      emit('change');
    }
    function state() {
      const w = vw(), h = vh();
      return { z, tx, ty, w, h, W, H, left: -tx / z, top: -ty / z, right: (w - tx) / z, bottom: (h - ty) / z };
    }
    function emit(kind) { const s = state(); on[kind].forEach(fn => fn(s)); }

    // ── Zoom ────────────────────────────────────────────────────────────
    function zoomAt(f, cx, cy) {
      const nz = clampZ(z * f);
      tx = cx - (cx - tx) * (nz / z); ty = cy - (cy - ty) * (nz / z); z = nz; render();
    }
    // Wheel notches, buttons and keys ease toward one target (≈ 0.15 s); a
    // pinch feeds zoomAt directly so the board follows the fingers.
    let zTarget = null, zAnchor = [0, 0], zLoop = 0;
    function zoomSmooth(f, cx, cy) {
      stopTween();
      zTarget = clampZ((zTarget ?? z) * f); zAnchor = [cx, cy];
      if (zLoop) return;
      const step = () => {
        const d = zTarget / z;
        if (Math.abs(d - 1) < 0.003) { zoomAt(d, zAnchor[0], zAnchor[1]); zTarget = null; zLoop = 0; return; }
        zoomAt(Math.pow(d, 0.33), zAnchor[0], zAnchor[1]);
        zLoop = requestAnimationFrame(step);
      };
      zLoop = requestAnimationFrame(step);
    }
    function stopZoom() { cancelAnimationFrame(zLoop); zLoop = 0; zTarget = null; }

    // ── Tweens (fit, go to a section, page keys) ────────────────────────
    let tween = 0;
    function stopTween() { cancelAnimationFrame(tween); tween = 0; }
    function stopAll() { stopTween(); stopZoom(); stopGlide(); }
    // Moves so the board point (bx, by) sits at the view point (vx, vy) at zoom nz.
    function flyTo(bx, by, nz, vx, vy, ms) {
      stopAll();
      nz = clampZ(nz);
      const w = vw(), h = vh();
      vx = vx ?? w / 2; vy = vy ?? h / 2;
      const c0 = { x: (vx - tx) / z, y: (vy - ty) / z }, z0 = z;
      if (!ms) { z = nz; tx = vx - bx * z; ty = vy - by * z; render(); return; }
      const t0 = performance.now();
      const ease = t => 1 - Math.pow(1 - t, 3);
      const step = now => {
        const t = Math.min(1, (now - t0) / ms), e = ease(t);
        z = Math.exp(Math.log(z0) + (Math.log(nz) - Math.log(z0)) * e);
        const cx = c0.x + (bx - c0.x) * e, cy = c0.y + (by - c0.y) * e;
        tx = vx - cx * z; ty = vy - cy * z; render();
        tween = t < 1 ? requestAnimationFrame(step) : 0;
      };
      tween = requestAnimationFrame(step);
    }
    function panBy(dx, dy, ms) {
      if (!ms) { stopAll(); tx += dx; ty += dy; render(); return; }
      const w = vw(), h = vh();
      flyTo((w / 2 - tx - dx) / z, (h / 2 - ty - dy) / z, z, w / 2, h / 2, ms);
    }
    // Fits a board rectangle (with padding) into the view.
    function fitRect(r, ms, maxZ) {
      measure();
      const pad = 28, w = vw(), h = vh();
      const nz = Math.min(maxZ || 1, (w - pad * 2) / r.w, (h - pad * 2) / r.h);
      flyTo(r.x + r.w / 2, r.y + r.h / 2, nz, w / 2, h / 2, ms);
    }
    function fit(ms) { measure(); fitRect({ x: 0, y: 0, w: W, h: H }, ms, 1); }
    // Shows the top of a board area at a readable zoom, left-aligned.

      nz = clampZ(nz || Math.max(z, 0.45));

    function goTop(ms) { flyTo((vw() / 2 - tx) / z, 0, z, vw() / 2, 20, ms ?? 320); }
    function goBottom(ms) { flyTo((vw() / 2 - tx) / z, H, z, vw() / 2, vh() - 20, ms ?? 320); }

    // ── Pointers: mouse drag, one-finger pan, two-finger pinch ──────────
    const pts = new Map();
    let pan = null, pinch = null;
    let samples = [];
    let glide = 0;
    function stopGlide() { cancelAnimationFrame(glide); glide = 0; }

      const now = performance.now();
      samples = samples.filter(s => now - s.t < 90);

      const a = samples[0], b = samples[samples.length - 1], dt = Math.max(1, b.t - a.t);
      let vx = (b.x - a.x) / dt, vy = (b.y - a.y) / dt;   // px per ms
      if (Math.hypot(vx, vy) < 0.25) return;

        const dt2 = Math.min(40, now2 - last); last = now2;

      };

    }
    function two() { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)) }; }

      const s = two(), r = view.getBoundingClientRect();

    view.addEventListener('gesturechange', e => {
      e.preventDefault();

    });

    document.addEventListener('gesturestart', e => e.preventDefault());

      if (opts.ignoreDblClick && opts.ignoreDblClick(e)) return;

        <div class="cv-body"><div class="cv-labels"></div><div class="cv-mapbox"><div class="cv-vp"></div></div></div>`;
      const box = el.querySelector('.cv-mapbox'), vp = el.querySelector('.cv-vp'), lab = el.querySelector('.cv-labels');
      el.querySelector('.cv-head button').onclick = () => { el.classList.toggle('min'); localStorage.setItem('cv-map-min', el.classList.contains('min') ? '1' : ''); };

        let cur = -1;

    on.change.push(drawMap);

    // ── Place in the URL ────────────────────────────────────────────────
    function saveHash() {

<script>

creen": "child_foksik"}, {"label": "Написал или сказал", "event": "jeyMessageSent", "lane": "child", "filter": "", "alt": [], "card": "c-chat-app-01"}, {"label": "Сделал задание из чата", "event": "questSubmitted", "lane": "child", "filter": "после исправления: сдачи из чата тоже считаются", "alt": [], "card": "c-tasks-app-09"}], "breakdowns": ["возраст: малыш / подросток", "язык"], "note": "", "posthog": "Воронка (Funnel)", "color": "#19a3c4"}, {"id": "f-push", "title": "Возврат по пушу", "question": "Сколько людей возвращаются по уведомлению и делают то, ради чего оно пришло?", "aggregate": "люди", "window": "1 день", "lanes": ["parent", "child"], "steps": [{"label": "Пуш отправлен", "event": "push_sent", "lane": "parent", "filter": "", "alt": [], "external": true, "extLabel": "Сервер: журнал рассылок (push-campaign-runner, send-push)"}, {"label": "Открыл пуш", "event": "pushOpened", "lane": "parent", "filter": "разрез: <code>type</code>, <code>campaign_id</code>", "alt": [], "card": "p-feed-app-00"}, {"label": "Сделал действие из пуша", "event": "questApproved", "lane": "parent", "filter": "действие зависит от типа пуша", "alt": ["rewardApproved", "questCreated"], "card": "p-review-app-01"}], "breakdowns": ["тип пуша", "кампания", "роль"], "note": "", "posthog": "Воронка (Funnel)", "color": "#8a8f99"}], "dictionary": {"title": "Все события", "sub": "Имя события — так оно называется в PostHog. Клик — когда отправляется, свойства, экраны, воронки и где в коде."}, "screensSection": {"title": "Экраны: постоянные имена", "sub": "Просмотр экрана приходит сам событием <code>$screen</code> с этим именем. Листы (поверх экрана) — отдельными событиями."}, "architecture": {"title": "Откуда берутся данные", "sub": "Приложение отправляет события в PostHog; деньги — из RevenueCat; установки и источники — из магазинов. Родитель и ребёнок — разные люди, но одна семья: воронки «по семьям» склеивают их действия.", "boxes": [{"id": "ads", "col": 0, "row": 0, "kind": "store", "icon": "📣", "title": "Реклама, блогеры, сайт", "text": "Ссылки с метками кампаний (UTM, ct=).", "small": "Instagram, TikTok, Telegram, Google, блогеры, школы"}, {"id": "stores", "col": 1, "row": 0, "kind": "store", "icon": "🏪", "title": "App Store и Google Play", "text": "Показы, просмотры страницы, установки — по источникам и кампаниям.", "small": "App Store Connect · Play Console"}, {"id": "parent", "col": 2, "row": 0, "kind": "parent", "icon": "👩", "title": "Телефон родителя", "text": "События родителя + режим ребёнка на этом же телефоне.", "small": "id = аккаунт родителя"}, {"id": "child", "col": 3, "row": 0, "kind": "child", "icon": "🧒", "title": "Телефон ребёнка", "text": "События ребёнка: только обезличенный id, без текста и имени.", "small": "id = child_<uuid>"}, {"id": "meta", "col": 0, "row": 1, "kind": "store", "icon": "🎯", "title": "Meta Ads (только родитель)", "text": "Активация приложения и покупки — для рекламы в Facebook и Instagram.", "small": "Meta App Events: после согласия и разрешения iOS; у ребёнка выключено"}, {"id": "rc", "col": 1, "row": 1, "kind": "server", "icon": "💳", "title": "RevenueCat", "text": "Покупки, пробный период, продления, отмены, выручка.", "small": "интеграция с PostHog — настройка в кабинете"}, {"id": "ph", "col": 2, "row": 1, "kind": "tool", "icon": "📊", "title": "PostHog", "text": "Все события, люди и семьи. Воронки, удержание, пути, когорты.", "small": "один проект; DEV отделяем свойством environment"}, {"id": "db", "col": 3, "row": 1, "kind": "server", "icon": "🗄", "title": "Supabase (база)", "text": "Правда о заданиях, монетах и семьях.", "small": "можно подключить к PostHog как склад данных"}, {"id": "dash", "col": 2, "row": 2, "kind": "tool", "icon": "🧭", "title": "Дашборды и отчёты", "text": "Привлечение, ядро, награды, деньги, удержание, Фоксик.", "small": "список — в разделе «Дашборды»"}], "links": [["ads", "stores", "переходы"], ["stores", "parent", "установки"], ["parent", "ph", "события"], ["child", "ph", "события"], ["rc", "ph", "покупки"], ["rc", "meta", "покупки"], ["db", "ph", "склад"], ["ph", "dash", ""]], "identityHtml": "<h3>Кто есть кто в PostHog</h3>\n<table><tr><th>Кто</th><th>id в PostHog</th><th>Что ещё знаем</th></tr>\n<tr><td>Родитель</td><td><code>uuid аккаунта</code></td><td>role = parent, страна, язык, тариф, семья</td></tr>\n<tr><td>Ребёнок на своём телефоне</td><td><code>child_&lt;uuid&gt;</code></td><td>role = child, семья, уровень. Никаких имён, дат рождения, фото и текстов</td></tr>\n<tr><td>Ребёнок на телефоне родителя</td><td>id родителя</td><td>role = child и active_child_id — пока открыт режим ребёнка</td></tr>\n<tr><td>Семья</td><td>группа <code>family</code> = id семьи</td><td>тариф, страна, число детей. Воронки «по семьям» считают шаги родителя и ребёнка вместе</td></tr></table>\n<p style=\"margin-top:12px\"><b>До согласия родителя приложение не отправляет ничего.</b> Поэтому сплэш и выбор языка в аналитике не видны — первое событие <code>coppaConsentGiven</code>.\nНа каждом событии: <code>environment</code> (dev / prod — DEV-сборки сейчас пишут в тот же проект), <code>coppa_strict</code>, роль, семья, тариф, страна, язык, версия приложения.</p>"}, "metrics": {"title": "Главная метрика и дерево метрик", "sub": "Одна цифра, по которой понятно, жив ли продукт, и пять групп метрик, которые её двигают. Под каждой — события, из которых она считается.", "northStar": {"name": "Семьи с закрытым циклом за неделю", "text": "Сколько семей за последние 7 дней прошли цикл: ребёнок сделал задание → родитель одобрил. Считается как уникальные семьи (группа <b>family</b>) с событием <b>questApproved</b> за неделю. Растёт — продукт работает: родители ставят задания, дети их делают, монеты что-то значат."}, "pillars": [{"title": "Привлечение", "sub": "сколько и откуда приходят", "items": [{"name": "Установки по источникам", "formula": "Загрузки в магазинах по кампаниям (ct=, utm_*).", "events": ["магазины"]}, {"name": "Конверсия страницы магазина", "formula": "Установки ÷ просмотры страницы. Рычаг — иконка, скриншоты, отзывы.", "events": ["магазины"]}, {"name": "Новые семьи", "formula": "Уникальные семьи с <b>onboardingCompleted</b> за период.", "events": ["onboardingCompleted"]}, {"name": "Цена семьи", "formula": "Расход канала ÷ новые семьи из этого канала.", "events": ["onboardingCompleted", "магазины"]}]}, {"title": "Активация", "sub": "дошли ли до ценности", "items": [{"name": "Семья создана в первый день", "formula": "Воронка «Родитель»: согласие → главная за 1 день.", "events": ["coppaConsentGiven", "$screen"]}, {"name": "Ребёнок подключён за 7 дней", "formula": "Воронка «Подключение»: ребёнок добавлен → ребёнок вошёл (или режим ребёнка).", "events": ["childAdded", "logIn", "childModeOpened"]}, {"name": "«Ага-момент»: первое одобрение", "formula": "Доля новых семей с первым <b>questApproved</b> за 7 дней.", "events": ["questApproved"]}]}, {"title": "Вовлечённость", "sub": "как часто и глубоко", "items": [{"name": "Задания на семью в неделю", "formula": "questCreated ÷ активные семьи.", "events": ["questCreated"]}, {"name": "Отправки на ребёнка в неделю", "formula": "questSubmitted ÷ активные дети.", "events": ["questSubmitted"]}, {"name": "Время проверки", "formula": "Медиана time_to_approve_minutes.", "events": ["questApproved"]}, {"name": "Доля возвратов", "formula": "questRejected ÷ (questApproved + questRejected).", "events": ["questRejected"]}, {"name": "Награды на семью", "formula": "rewardApproved ÷ активные семьи.", "events": ["rewardApproved"]}]}, {"title": "Монетизация", "sub": "кто и за что платит", "items": [{"name": "Конверсия подписки", "formula": "subscriptionStarted ÷ paywallViewed, по trigger, стране, тарифу.", "events": ["paywallViewed", "subscriptionStarted"]}, {"name": "Платящие семьи", "formula": "Семьи с тарифом premium / premium_ai.", "events": ["subscriptionStarted", "rc_initial_purchase"]}, {"name": "Пробный → платный, выручка, отток", "formula": "Из RevenueCat (кабинет или интеграция с PostHog).", "events": ["rc_initial_purchase"]}]}, {"title": "Удержание", "sub": "возвращаются ли", "items": [{"name": "Родитель D1 / D7 / D30", "formula": "Возврат: Application Opened; «ключевой» возврат — questApproved или questCreated.", "events": ["Application Opened", "questApproved"]}, {"name": "Ребёнок неделя 1 / 4", "formula": "Отправил задание на 2-й и 5-й неделе после входа.", "events": ["questSubmitted"]}, {"name": "Удержание семьи", "formula": "Семьи с questApproved на неделе N и N+k (по группе family).", "events": ["questApproved"]}, {"name": "Серии и возвраты", "formula": "streakMilestone; возвраты после 48 ч (паутинка).", "events": ["streakMilestone", "childReturnedAfterBreak"]}]}]}, "docsBefore": [{"id": "retention", "kicker": "Удержание", "title": "Удержание и когорты", "sub": "Не воронка, а «возвращаются ли». Строится в PostHog как Retention.", "cols": 3, "cards": [{"html": "<h3>Родитель</h3><p><b>Старт:</b> <code>onboardingCompleted</code>. <b>Возврат:</b> <code>Application Opened</code>.</p><p><b>D1, D7, D30.</b> Строже — возврат с действием: <code>questCreated</code> или <code>questApproved</code>.</p><p>Разрезы: страна, способ входа, тариф, есть ли телефон у ребёнка.</p>"}, {"html": "<h3>Ребёнок</h3><p><b>Старт:</b> <code>logIn</code> (role = child). <b>Возврат:</b> <code>questSubmitted</code>.</p><p><b>По неделям:</b> 1, 2, 4, 8. Разрез: малыш / подросток — у них разные экраны.</p><p>Возвраты после перерыва 48 ч+ — <code>childReturnedAfterBreak</code>.</p>"}, {"html": "<h3>Семья (главное)</h3><p><b>Старт и возврат:</b> <code>questApproved</code>, считаем по группе <b>family</b>.</p><p>Это удержание главной метрики: какая доля семей, закрывших цикл на первой неделе, закрывает его и на 4-й.</p><p>Платящие и бесплатные — отдельными когортами.</p>"}]}], "docsAfter": [{"id": "dashboards", "kicker": "PostHog", "title": "Дашборды", "sub": "Что собрать в PostHog. Каждый пункт — один график (insight). Везде фильтр <code>environment = prod</code>.", "cols": 3, "cards": [{"html": "<h3>1. Привлечение и активация</h3><ul><li>Новые семьи по дням (onboardingCompleted, по семьям)</li><li>Воронка «Магазин → согласие» — вместе с отчётом магазинов</li><li>Воронка «Родитель»: разрез по способу входа и стране</li><li>Воронка «Подключение ребёнка»</li><li>Таблица UTM: источник → семьи → оплаты</li></ul>"}, {"html": "<h3>2. Ядро продукта</h3><ul><li><b>Главная метрика:</b> уникальные семьи с questApproved, по неделям</li><li>Воронка «Ядро» по семьям</li><li>Медиана времени проверки</li><li>Доля возвратов на доработку</li><li>Задания по источнику: вручную, шаблон, ИИ, Фоксик</li></ul>"}, {"html": "<h3>3. Награды и монеты</h3><ul><li>Воронка «Награды»</li><li>Запросы и выдачи по неделям</li><li>Ожидание ответа родителя (wait_minutes)</li><li>Свои награды против каталога</li></ul>"}, {"html": "<h3>4. Деньги</h3><ul><li>Воронка «Подписка» с разрезом trigger</li><li>Открытия подписки по источникам</li><li>Неудачные покупки по причинам</li><li>Магазин против Paylov (Узбекистан)</li><li>Выручка, пробный → платный, отток — RevenueCat</li></ul>"}, {"html": "<h3>5. Удержание</h3><ul><li>Родитель D1/D7/D30</li><li>Ребёнок по неделям, малыш / подросток</li><li>Удержание семьи по questApproved</li><li>Стикинесс: дней в неделю с открытием</li></ul>"}, {"html": "<h3>6. Фоксик AI</h3><ul><li>Родители: вопросы, применённые советы, лимиты</li><li>Воронка «Фоксик → Premium + ИИ»</li><li>Дети: открытия чата, сообщения, лимиты</li><li>Отказы «не по теме»</li></ul>"}, {"html": "<h3>7. Качество</h3><ul><li>Неудачные входы ребёнка по причинам (childCodeFailed)</li><li>Ошибки оплаты (purchaseFailed)</li><li>Открытия пушей по типам</li><li>Экраны, где чаще всего закрывают приложение (пути)</li></ul>"}]}, {"id": "marketing", "kicker": "Маркетинг", "title": "Ссылки, UTM и что можно измерить", "sub": "Как размечать кампании, где смотреть установки и что в детском приложении измерить нельзя.", "cols": 2, "cards": [{"full": true, "html": "<h3>Что где смотреть</h3><table>\n<tr><th>Вопрос</th><th>Где ответ</th><th>Как</th></tr>\n<tr><td>Сколько установок и откуда</td><td>App Store Connect, Google Play Console</td><td>Источники, кампании по ссылкам с ct= / utm_*</td></tr>\n<tr><td>Что люди делают в приложении</td><td>PostHog</td><td>События, воронки этой страницы, удержание</td></tr>\n<tr><td>Сколько заплатили и продлили</td><td>RevenueCat (+ PostHog через интеграцию)</td><td>Выручка, пробный → платный, отток</td></tr>\n<tr><td>Сколько стоила установка / семья</td><td>Кабинеты рекламы + магазины + PostHog</td><td>Расход ÷ установки (магазин) ÷ новые семьи (PostHog)</td></tr>\n<tr><td>Работают ли пуши</td><td>PostHog</td><td>pushOpened ÷ отправлено (журнал рассылок)</td></tr></table>"}, {"html": "<h3>Ссылки для кампаний</h3>\n<h4>App Store</h4><pre>https://apps.apple.com/app/apple-store/id6762140001?pt=&lt;provider-token&gt;&amp;ct=202610_uz_instagram_launch&amp;mt=8</pre>\n<p><code>pt</code> выдаёт App Store Connect (App Analytics → Campaigns). Установки по <code>ct</code> видны там же.</p>\n<h4>Google Play</h4><pre>https://play.google.com/store/apps/details?id=com.oynaplatform.app&amp;referrer=utm_source%3Dinstagram%26utm_medium%3Dpaid_social%26utm_campaign%3D202610_uz_launch</pre>\n<p>Play Console показывает установки по кампаниям. Приложение может прочитать эти метки при первом запуске (Install Referrer) и записать родителю — следующий шаг.</p>\n<h4>Сайт</h4><pre>https://oynaplatform.com/?utm_source=telegram&amp;utm_medium=post&amp;utm_campaign=202610_kz_school</pre>\n<p>Кнопки магазинов на сайте должны передавать метки дальше — в <code>ct</code> и <code>referrer</code>.</p>"}, {"html": "<h3>Правила UTM</h3><table>\n<tr><th>Метка</th><th>Значения</th></tr>\n<tr><td><code>utm_source</code></td><td>instagram, tiktok, telegram, facebook, google, youtube, blogger_&lt;имя&gt;, school_&lt;имя&gt;, partner_&lt;имя&gt;</td></tr>\n<tr><td><code>utm_medium</code></td><td>paid_social, organic_social, influencer, cpc, referral, email, push, offline</td></tr>\n<tr><td><code>utm_campaign</code></td><td><code>ГГГГММ_страна_цель</code>: 202610_uz_launch, 202611_kz_school</td></tr>\n<tr><td><code>utm_content</code></td><td>креатив: video_fox_15s, static_market_v2</td></tr></table>\n<p>Только латиница в нижнем регистре и подчёркивания. Без пробелов и кириллицы — иначе одна кампания распадается на несколько строк.</p>"}, {"html": "<h3>Реклама и атрибуция</h3>\n<ul><li><b>Meta (Facebook, Instagram)</b> — в боевой сборке есть Meta App Events, но <b>только у родителя</b>: после согласия, входа родителя и (на iOS) разрешения на отслеживание. В режиме ребёнка и на телефоне ребёнка выключено. Отправляет только «приложение активировано»; покупки в Meta приходят из RevenueCat.</li>\n<li><b>Следующий шаг для Meta:</b> событие «Регистрация завершена» (= семья создана) — чтобы реклама училась на семьях, а не на установках. Только родитель, без данных ребёнка.</li>\n<li><b>Остальные каналы</b> (TikTok, Google, блогеры, Telegram) — ссылки кампаний магазинов, UTM на сайте и Install Referrer Google Play. Других рекламных SDK нет и не ставим: в приложении есть детский режим (правила Apple Kids и Google Families).</li>\n<li><b>Ничего о ребёнке</b> в рекламные системы не уходит; ретаргетинг по действиям ребёнка — нельзя.</li>\n<li><b>Предложение продукту:</b> вопрос «Откуда вы узнали про OYNA?» в конце регистрации — сарафан и Telegram ссылками не меряются.</li></ul>"}, {"html": "<h3>Пуши и ссылки внутрь приложения</h3>\n<ul><li><b>Пуши-рассылки</b> уже несут <code>campaign_id</code> и <code>push_id</code> — нужно событие <code>pushOpened</code> (план, P1), тогда CTR и возвраты по кампании будут в PostHog.</li>\n<li><b>Ссылки внутрь приложения:</b> сейчас работают <code>oyna://…</code> и приглашения ребёнка. Обычные https-ссылки вида <code>oynaplatform.com/app/…</code> пока не открывают приложение — для кампаний «вернись в приложение» их нужно добавить.</li>\n<li>Метки <code>utm_*</code> в ссылке приложения — свойства <code>deepLinkOpened</code> (план, P2).</li></ul>"}]}, {"id": "rules", "kicker": "Правила", "title": "Приватность, названия и проверка", "sub": "Чтобы данные были законными, понятными и не врали.", "cols": 3, "cards": [{"html": "<h3>Детские данные (COPPA)</h3><ul>\n<li>До согласия родителя — ничего.</li><li>Ребёнок — только <code>child_&lt;uuid&gt;</code>; ни имени, ни даты рождения, ни фото.</li>\n<li>Никакого свободного текста: названия заданий и наград, сообщения, комментарии — только признаки (<code>is_custom</code>, <code>has_reason</code>, длина).</li>\n<li>Возраст — только диапазон (малыш / подросток).</li><li>Никаких рекламных id и рекламных SDK.</li>\n<li><code>coppa_strict</code> на каждом событии.</li><li>Удалил аккаунт — удаляем человека и в PostHog.</li></ul>"}, {"html": "<h3>Как называем</h3><ul>\n<li>Событие: <b>объект + действие в прошедшем</b>, camelCase, как уже в данных: <code>questCreated</code>, <code>rewardApproved</code>.</li>\n<li>Свойства — snake_case: <code>time_to_approve_minutes</code>.</li><li>Экраны — <code>роль_экран</code>: <code>parent_home</code>, <code>child_market</code>.</li>\n<li>Старые имена не трогаем — на них отчёты: <code>parent_profile_*</code> (snake_case), <code>jey*</code> = Фоксик.</li>\n<li>Один факт — одно событие, после успеха на сервере, не по нажатию. Действия через карточки Фоксика — тем же событием с <code>source = foksik_card</code>.</li></ul>"}, {"html": "<h3>Как проверить событие</h3><ol style=\"margin:4px 0 8px 20px;padding:0\">\n<li>Сборка OYNA Dev → сделать действие.</li><li>PostHog → Activity → Live events, фильтр <code>environment = dev</code>.</li>\n<li>Сверить имя и свойства с этой страницей (клик по событию).</li><li>В отчётах всегда <code>environment = prod</code>.</li></ol>\n<p>Старые DEV-события без <code>environment</code> лежат в том же проекте — отсекаем по версии сборки.</p>"}]}, {"id": "status", "kicker": "Статус", "title": "Что работает, что сделано, что нужно от владельцев", "sub": "Аудит кода 02.10.2026 (redesign-parent-flow @6889d1fd) и доработка в ветке analytics-tracking-plan.", "cols": 2, "cards": [{"html": "<h3>Нашли при аудите</h3><ul><li><b>Покупка подписки не отправлялась вообще</b> — метод был, вызова не было. <i>Исправлено.</i></li><li><b>Источник подписки всегда «trial_banner»</b> — такой плашки нет. <i>Исправлено (кроме входов через Фоксика).</i></li><li><b>Ядро «задание → проверка → награда» у родителя не было размечено</b> — ни одного события. <i>Исправлено.</i></li><li><b>DEV-сборки пишут в боевой проект PostHog</b> без пометки. <i>Исправлено: environment.</i></li><li><b>Просмотров экранов не было.</b> <i>Исправлено: $screen с постоянными именами.</i></li><li><b>Mixpanel мёртв:</b> в сборках нет токена.</li><li>У родителя после перезапуска <code>coppa_strict = true</code> (должно быть false).</li><li>Тариф в PostHog у плативших картой Paylov — free; при входе тариф затирается на free.</li><li><code>questSubmitted</code> отправляет название задания (текст родителя) — исправление готовится в соседней работе.</li></ul>"}, {"html": "<h3>Сделано в коде — ждёт сборки</h3><p>Ветка <code>analytics-tracking-plan</code> (от redesign-parent-flow), ещё не закоммичено:</p><ul><li>Просмотры всех экранов (<code>$screen</code>) и метка <code>environment</code> на каждом событии.</li><li>Согласие родителя — первое событие.</li><li>Задания: создано, открыто, одобрено, возвращено — и через карточки Фоксика.</li><li>Награды: создана, попросили (в магазине и в чате), выдана, отказ/перенос.</li><li>Подписка: настоящий источник, способ оплаты, покупка, неудачная покупка, правильное premium_ai.</li><li>Неудачный вход ребёнка по коду; лимит Фоксика у родителя.</li><li>Тесты на каждое событие; план в репозитории: docs/analytics/TRACKING_PLAN.md.</li></ul>"}, {"html": "<h3>Нужно от владельцев</h3><ul><li><b>PostHog:</b> один проект и фильтр <code>environment = prod</code> (так и сделано) — или ключ отдельного DEV-проекта.</li><li><b>Mixpanel:</b> дать токен или отказаться (рекомендация — отказаться, всё есть в PostHog).</li><li><b>RevenueCat:</b> проверить, что включены интеграции с PostHog и Meta.</li><li><b>App Store Connect:</b> завести ссылки кампаний (provider token).</li><li><b>Продукт:</b> решить про вопрос «Откуда узнали».</li><li><b>Замороженная зона:</b> согласие на событие <code>pushOpened</code> в сервисе ссылок.</li></ul>"}, {"html": "<h3>Дальше</h3><ul><li><b>После слияния текущей работы над Фоксиком и приглашениями:</b> отправка приглашения, вход ребёнка по ссылке/QR, лимит Фоксика у ребёнка, источник подписки из Фоксика, сдача задания из чата.</li><li><b>P1:</b> пуши, PIN, режим ребёнка, лимит детей, выход и удаление, оценка, бонусы, голос у Фоксика, событие «Регистрация завершена» для Meta.</li><li><b>P2:</b> ссылки с UTM, Install Referrer, уровень с сервера, возвраты после перерыва, мелкие поправки старых событий.</li></ul>"}]}]};

            const tag = document.createElement('div'); tag.className = 'an-tag';
            tag.innerHTML = planUi.chipsHtml(an.screens, an.events);
            tag.addEventListener('click', ev => { ev.stopPropagation(); const chip = ev.target.closest('[data-ev],[data-scr]'); if (chip && !cam.moved) planUi.openFromChip(chip); });
            card.appendChild(tag);
            card.dataset.label += ' ' + an.events.join(' ').toLowerCase() + ' ' + an.screens.join(' ').toLowerCase();
          }
          const cap = el('div', 'cap r-' + r.kind);
          cap.innerHTML = `<span class="k" style="background:${COLORS[r.kind]}"></span>${c.label}`;
          cap.style.left = x + 'px'; cap.style.top = (y + ch + 8) + 'px'; cap.style.width = CW + 'px'; cap.style.height = CAP_H + 'px';
          card.addEventListener('click', () => { if (!cam.moved) openLb(s, r, i); });
          list.push({ card, cap, c });
          CARDS.push({ el: card, key: c.key, kind: r.kind, x, y, w: CW, h: ch, lod: -1, img: null, want: null });
          rowH = Math.max(rowH, ch + CAP_H + 10);
          x += CW + GAP;
        });
        cardsByRow.push(list);
        secW = Math.max(secW, x - x0);
        y += rowH + 26;
      }
      y += 20;
      bg.style.left = x0 + 'px'; bg.style.top = top + 'px'; bg.style.width = (secW + 20) + 'px'; bg.style.height = (y - top) + 'px';
      secList.push({ id: s.id, side: s.side, title: s.title, x: x0, y: top, w: secW + 20, h: y - top, labelEl: hd.querySelector('.t') });
      maxX = Math.max(maxX, secW + 20);
      y += 60;
    }
    head.h = y - head.y;
    y += 140;
  }
  board.style.width = maxX + 'px'; board.style.height = y + 'px';
}

layout();
const cam = OynaCanvas.createCanvas({
  view, board, zMax: 3,
  keysBlocked: () => lb.classList.contains('on') || planUi.isOpen(),
  ignoreDblClick: e => !!e.target.closest('.card, .an-tag'),
});

// ── Pictures by zoom: none far out, still posters, thumbnails, full ─────
// While the camera moves only the light still posters load; the thumbnails
// (a looping animation can weigh 300 KB) and full pictures load once it
// stops, nearest to the centre first, and a load the camera has left behind
// is cancelled — a long flight never queues the pictures it flew past.
const LOD_T = [0.13, 0.38, 1.25];
function lodFor(z) { return z < LOD_T[0] ? 0 : z < LOD_T[1] ? 1 : z < LOD_T[2] ? 2 : 3; }
function cancel(rec) { if (rec.pending) { rec.pending.onload = null; rec.pending.src = ''; rec.pending = null; } }
function want(rec, lod) {
  if (lod <= 0) { cancel(rec); rec.el.style.backgroundImage = ''; if (rec.img) { rec.img.remove(); rec.img = null; } rec.want = null; rec.lod = lod; return; }
  if (rec.lod < 1) rec.el.style.backgroundImage = `url(img/${rec.key}_s.webp)`;
  rec.lod = lod;
  if (lod === 1) { cancel(rec); if (rec.img) { rec.img.remove(); rec.img = null; } rec.want = null; return; }
  const src = lod === 3 ? `img/${rec.key}.webp` : `img/${rec.key}_t.webp`;
  if (rec.want === src) return;
  cancel(rec);
  rec.want = src;
  const img = new Image();
  img.className = 'pic'; img.decoding = 'async'; img.alt = '';
  img.onload = () => { rec.pending = null; if (rec.want !== src) return; if (rec.img) rec.img.remove(); rec.img = img; rec.el.prepend(img); };
  rec.pending = img;
  img.src = src;
}
// Far out, each section title grows to stay readable (≈16 px on screen) but
// never past three quarters of its own section, so titles don't overlap.
function farLabels(s) {
  const far = s.z < 0.3;
  for (const sec of secList) {
    if (!sec.labelEl) continue;
    if (!far) { sec.labelEl.style.transform = ''; continue; }
    const px = Math.min(17, 0.7 * sec.h * s.z), k = Math.max(1, px / (30 * s.z));
    sec.labelEl.style.transform = `scale(${k.toFixed(3)})`;
  }
  for (const h of sideHeads) h.el.style.transform = far ? `scale(${Math.max(1, Math.min(26, 0.5 * h.h * s.z) / (64 * s.z)).toFixed(3)})` : '';
}
let lastLod = 0;
function updateLod(s, settled) {
  const now = performance.now();
  if (!settled && now - lastLod < 110) return;
  lastLod = now;
  const lod = lodFor(s.z);
  board.classList.toggle('lod0', lod === 0);
  board.classList.toggle('far', s.z < 0.3);
  farLabels(s);
  const mw = (s.right - s.left) * 0.5, mh = (s.bottom - s.top) * 0.6;
  const L = s.left - mw, R = s.right + mw, T = s.top - mh, B = s.bottom + mh;
  const hidden = { figma: document.body.classList.contains('hide-figma'), app: document.body.classList.contains('hide-app'),
    motion: document.body.classList.contains('hide-motion'), device: document.body.classList.contains('hide-device') };
  const near = [];
  for (const rec of CARDS) {
    if (rec.x < R && rec.x + rec.w > L && rec.y < B && rec.y + rec.h > T && !hidden[rec.kind]) near.push(rec);
    else if (rec.lod >= 2 || rec.pending) want(rec, 1);      // left behind: the poster only
  }
  const cx = (s.left + s.right) / 2, cy = (s.top + s.bottom) / 2;
  const d = rec => Math.hypot(rec.x + rec.w / 2 - cx, rec.y + rec.h / 2 - cy);
  near.sort((a, b) => d(a) - d(b));
  for (const rec of near) {
    // A looping animation is worth its weight only close enough to see it.
    const target = rec.kind === 'motion' && lod === 2 && s.z < 0.45 ? 1 : lod;
    want(rec, settled ? target : Math.min(target, Math.max(rec.lod, 1)));
  }
  document.getElementById('zoomv').textContent = Math.round(s.z * 100) + '%';
}
cam.on('change', s => updateLod(s, false));
cam.on('settle', s => { updateLod(s, true); spy(s); });

// ── Minimap and "where am I" ───────────────────────────────────────────
const SIDE_COL = { motion: '#e0457b', common: '#9aa0a8', parent: '#ff8a1f', child: '#2aa7c9' };
cam.minimap(document.getElementById('map'),
  secList.map(s => ({ x: s.x, y: s.y, w: s.w, h: s.h, color: SIDE_COL[s.side] })),
  secList.map(s => ({ x: s.x, y: s.y, h: s.h, title: s.title.split(' — ')[0].split(':')[0], onClick: () => goSec(s.id) })));
function spy(s) {
  const cy = (s.top + s.bottom) / 2;
  let cur = null;
  for (const sec of secList) if (sec.y <= cy) cur = sec;
  document.querySelectorAll('#side a[data-id]').forEach(a => a.classList.toggle('on', !!cur && a.dataset.id === cur.id));
}
function goSec(id) {
  const p = secPos[id]; if (!p) return;
  cam.goTo(p.x, p.y, Math.max(cam.z, 0.5));
  document.body.classList.remove('side-open');
}

document.getElementById('zIn').onclick = () => cam.zoomBy(1.4);
document.getElementById('zOut').onclick = () => cam.zoomBy(1 / 1.4);
document.getElementById('zoomv').onclick = () => cam.zoomTo(1);
document.getElementById('fit').onclick = () => cam.fit(360);
document.getElementById('menu').onclick = () => document.body.classList.toggle('side-open');
// The controls hint hides once the board was moved, and comes back on «?».
if (localStorage.getItem('cv-nohelp')) document.body.classList.add('nohelp');
const hideHelp = () => { document.body.classList.add('nohelp'); localStorage.setItem('cv-nohelp', '1'); };
document.getElementById('helpX').onclick = hideHelp;
document.getElementById('helpB').onclick = () => { document.body.classList.toggle('nohelp'); if (document.body.classList.contains('nohelp')) localStorage.setItem('cv-nohelp', '1'); else localStorage.removeItem('cv-nohelp'); };
let helpTimer = 0;
cam.on('settle', () => { if (!helpTimer && !document.body.classList.contains('nohelp')) helpTimer = setTimeout(hideHelp, 12000); });
document.addEventListener('click', e => { const d = document.querySelector('.layers'); if (d.open && !d.contains(e.target)) d.open = false; });

// Row toggles, the analytics layer and search.
for (const [id, cls] of [['tFigma', 'hide-figma'], ['tApp', 'hide-app'], ['tMotion', 'hide-motion'], ['tDevice', 'hide-device']])
  document.getElementById(id).onchange = e => { document.body.classList.toggle(cls, !e.target.checked); updateLod(cam.state(), true); };
const tAn = document.getElementById('tAn');
function setAn(on) {
  tAn.checked = on; document.body.classList.toggle('an', on);
  const u = new URL(location.href); if (on) u.searchParams.set('an', '1'); else u.searchParams.delete('an');
  history.replaceState(null, '', u.pathname + u.search + location.hash);
  if (cur) showLb();
}
tAn.onchange = e => setAn(e.target.checked);
document.getElementById('q').oninput = e => {
  const q = e.target.value.trim().toLowerCase();
  for (const list of cardsByRow) for (const { card, cap } of list) {
    const hit = !q || card.dataset.label.includes(q);
    card.classList.toggle('dim', !hit); cap.classList.toggle('dim', !hit);
  }
};

// Sidebar.
const side = document.getElementById('side');
function sideList() {
  let h = `<div class="anbox"><b>Слой «Аналитика»</b>
    <div class="lg"><span class="dot" style="background:#4cd38a"></span>уже отправляется</div>
    <div class="lg"><span class="dot" style="background:#2dd4bf"></span>готово в коде, ждёт сборки</div>
    <div class="lg"><span class="dot" style="background:#ffb547"></span>есть, но нужно поправить</div>
    <div class="lg"><span class="dot" style="background:#7aa7ff"></span>добавляем</div>
    <div class="lg"><span class="dot" style="background:#c69cff"></span>с сервера (RevenueCat / база)</div>
    <div style="margin-top:6px">Внизу каждого экрана — его просмотр и события; клик по событию — описание. Воронки и словарь — на странице <a href="analytics/">Аналитика</a>.</div></div>`;
  if (NOTES.title) h += `<div class="notes"><b>${NOTES.title}</b>${NOTES.body || ''}</div>`;
  for (const s of ['motion', 'common', 'parent', 'child']) {
    h += `<h2>${({ motion: 'Анимации', common: 'Общее', parent: 'Родитель', child: 'Ребёнок' })[s]}</h2>`;
    for (const sec of DATA.filter(x => x.side === s)) {
      const n = sec.rows.reduce((a, r) => a + r.cards.length, 0);
      h += `<a href="#${sec.id}" data-id="${sec.id}"><span>${sec.title}</span><span class="n">${n}</span></a>`;
    }
  }
  side.innerHTML = h;
  side.querySelectorAll('a[data-id]').forEach(a => a.onclick = e => { e.preventDefault(); goSec(a.dataset.id); });
}

// Lightbox with the Figma comparison.
const lb = document.getElementById('lb');
let cur = null, figIdx = {};
function figmaOf(s) { return (s.rows.find(r => r.kind === 'figma') || { cards: [] }).cards; }
function openLb(s, r, i) { cur = { s, r, i }; lb.classList.add('on'); showLb(); }
function showLb() {
  const { s, r, i } = cur, c = r.cards[i], figs = figmaOf(s);
  document.getElementById('lbT').textContent = `${c.label} — ${s.title}`;
  document.getElementById('lbS').textContent = `${r.title} · ${i + 1} из ${r.cards.length} · ${c.w}×${c.h}`;
  document.getElementById('imgL').src = `img/${c.key}.webp`;
  document.getElementById('pLl').innerHTML = `<span class="dot" style="background:${COLORS[r.kind]}"></span>${r.title}: ${c.label}`;
  const an = CARD_AN[c.key];
  document.getElementById('lbAn').innerHTML = an ? planUi.chipsHtml(an.screens, an.events) : '<span style="color:#889">Для этого кадра событий нет</span>';
  const canCmp = r.kind !== 'figma' && figs.length > 0;
  document.getElementById('lbCmp').style.display = canCmp ? '' : 'none';
  if (!canCmp) lb.classList.remove('cmp');
  if (canCmp) {
    const k = Math.min(figIdx[s.id] || 0, figs.length - 1);
    document.getElementById('imgR').src = `img/${figs[k].key}.webp`;
    document.getElementById('pRl').textContent = 'Figma: ' + figs[k].label;
    const strip = document.getElementById('strip');
    strip.innerHTML = figs.map((f, j) => `<img src="img/${f.key}_t.webp" data-j="${j}" class="${j === k ? 'on' : ''}" title="${f.label}">`).join('');
    strip.querySelectorAll('img').forEach(im => im.onclick = () => { figIdx[s.id] = +im.dataset.j; showLb(); });
  }
}
document.getElementById('lbAn').addEventListener('click', e => { const chip = e.target.closest('[data-ev],[data-scr]'); if (chip) planUi.openFromChip(chip); });
function step(d) { if (!cur) return; const n = cur.r.cards.length; cur.i = (cur.i + d + n) % n; showLb(); }
document.getElementById('lbPrev').onclick = () => step(-1);
document.getElementById('lbNext').onclick = () => step(1);
document.getElementById('lbX').onclick = () => lb.classList.remove('on');
document.getElementById('lbCmp').onclick = () => { lb.classList.toggle('cmp'); showLb(); };
document.getElementById('lbFit').onclick = () => {
  const on = document.getElementById('pL').classList.toggle('fit');
  document.getElementById('pR').classList.toggle('fit', on);
  document.getElementById('lbFit').textContent = on ? 'Целиком' : 'Вписать';
};
lb.addEventListener('click', e => { if (e.target === lb || e.target.classList.contains('panes')) lb.classList.remove('on'); });
window.addEventListener('keydown', e => {
  if (planUi.isOpen()) { if (e.key === 'Escape') planUi.close(); return; }
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') lb.classList.remove('on');
  if (e.key === 'ArrowLeft') step(-1);
  if (e.key === 'ArrowRight') step(1);
});

sideList();
if (new URLSearchParams(location.search).get('an') === '1') setAn(true);
const startSec = location.hash.slice(1);
if (!cam.restoreHash()) {
  if (secPos[startSec]) goSec(startSec);
  else cam.flyTo(0, 0, 0.5, 30, 24);
}
updateLod(cam.state(), true);
spy(cam.state());
</script>
</body>
</html>
