function term(word, hint) { return `<span class="term" title="${esc(hint)}">${esc(word)}</span>`; }
const shot = (key, cls) => {
  const c = CARDS[key];
  return c ? `<button class="shot ${cls || ''}" data-pic="${esc(key)}" title="${esc(c.label)} — открыть крупно"><img loading="lazy" decoding="async" src="../img/${esc(key)}_t.webp" alt="${esc(c.label)}"></button>` : '';
};
const today = s => ST[s] && ST[s].today === true;
const stepEvents = s => s.external ? [] : [s.event, ...(s.alt || [])];
const evStatus = n => n === '$screen' ? EV['$screen'].status : (EV[n] || {}).status;

// ── 1. The two-minute brief ─────────────────────────────────────────────
(() => {
  const counts = {}; PLAN.events.forEach(e => { counts[e.status] = (counts[e.status] || 0) + 1; });
  const total = PLAN.events.length, now = PLAN.events.filter(e => today(e.status)).length;
  const order = ['live', 'improved', 'fix', 'ready', 'new', 'server'];
  const bar = order.map(k => `<i class="sw-${k}" style="width:${((counts[k] || 0) / total * 100).toFixed(2)}%" title="${esc(ST[k].label)}: ${counts[k] || 0}"></i>`).join('');
  const leg = order.map(k => `<span>${esc(ST[k].icon)} ${esc(ST[k].label)}: <b>${counts[k] || 0}</b></span>`).join('');
  const B = PLAN.brief;
  const points = B.points.map(p => {
    let text = esc(p.text);
    if (p.counts) text = `<b>${now} из ${total}</b> событий плана. ` + text;
    const warn = p.status_of && !today(EV[p.status_of].status);
    if (p.status_of && !warn) return '';
    return `<div class="box${warn ? ' warn' : ''}"><div class="ic">${esc(p.icon)}</div><b class="t">${esc(p.title)}</b><p>${text}</p><a href="#${esc(p.go)}" data-nav="${esc(p.go)}">Подробнее →</a></div>`;
  }).join('');
  const roles = B.roles.map(r => `<div><b>${esc(r.who)}:</b> ${r.path.map(([t, id]) => `<a href="#${esc(id)}" data-nav="${esc(id)}">${esc(t)}</a>`).join(' → ')}</div>`).join('');
  NAV.push(['Начало', 'top-hero', 'Коротко, за 2 минуты']);
  doc.insertAdjacentHTML('beforeend', `<section id="top-hero">
    <div class="ver">${esc(PLAN.meta.subtitle)}</div><h1>${esc(PLAN.meta.title)}</h1><p class="lead">${esc(PLAN.meta.lead)}</p>
    <div class="today"><b class="big">Сегодня в PostHog приходят ${now} из ${total} событий плана</b><div class="sbar">${bar}</div><div class="sleg">${leg}</div>
      <div class="note">«Со следующей сборкой» — код готов в ветке analytics-tracking-plan; цифры появятся, когда эту сборку выпустят в магазины.</div></div>
    <h3>${esc(B.title)}</h3><div class="grid g4 brief">${points}</div>
    <h3>С чего начать</h3><div class="roles">${roles}</div></section>`);
})();

// ── 2. Primer and glossary ──────────────────────────────────────────────
(() => {
  const P = PLAN.primer;
  const html = P.cards.map(c => {
    let h = `<div class="ic">${c.icon}</div><h3>${esc(c.title)}</h3><p>${esc(c.text)}</p>`;
    if (c.feed) h += `<div class="feed">${c.feed.map(([t, who, ev, what]) => `<div class="row"><span class="tm">${esc(t)}</span><span class="who">${esc(who)}</span>${ui.chip(ev)}<span class="what">${esc(what)}</span></div>`).join('')}</div>`;
    if (c.example) h += `<div class="sample"><div class="sn">${esc(c.example[0])}</div>${c.example[1].map(([k, v, d]) => `<div class="kv"><code>${esc(k)}</code> = ${esc(v)}<span>${esc(d)}</span></div>`).join('')}</div>`;
    if (c.bars) {
      const max = c.bars[0][1];
      h += `<div class="bars"><span class="ex">ПРИМЕР, НЕ НАСТОЯЩИЕ ЦИФРЫ</span>${c.bars.map(([l, v], j) => `<div class="bar"><div class="bl">${j + 1}. ${esc(l)}</div>
        <div class="bt"><i style="width:${(v / max * 80).toFixed(1)}%"></i><b>${v}</b></div>${j ? `<div class="drop">ушли ${c.bars[j - 1][1] - v} · дошли ${Math.round(v / c.bars[j - 1][1] * 100)} % от прошлого шага</div>` : ''}</div>`).join('')}
        <div style="font-size:13.5px;color:#5f646d;margin-top:6px">Конверсия всей воронки: ${Math.round(c.bars[c.bars.length - 1][1] / max * 100)} %.</div></div>`;
    }
    if (c.where) h += `<div class="where">${c.where.map(([a, b]) => `<div><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}</div>`;
    return `<div class="box primer">${h}</div>`;
  }).join('');
  doc.insertAdjacentHTML('beforeend', section('start-here', 'Начало', 'Азбука', 'Начните здесь', P.title, esc(P.sub), `<div class="grid g2">${html}</div>`));
  const G = PLAN.glossary, SHOWN = 9;
  const terms = G.terms.map(([t, d], i) => `<div class="gl${i >= SHOWN ? ' more' : ''}"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join('');
  doc.insertAdjacentHTML('beforeend', section('glossary', 'Начало', 'Словарь', 'Словарь', G.title, esc(G.sub),
    `<div class="grid g3">${terms}</div><p style="margin:14px 0 0"><button class="btn" id="glAll">Показать все ${G.terms.length} слов</button></p>`));
  document.getElementById('glAll').onclick = e => { const s = document.getElementById('glossary'); s.classList.toggle('all'); e.target.textContent = s.classList.contains('all') ? 'Свернуть' : `Показать все ${G.terms.length} слов`; };
})();

// ── 3. One family's week ────────────────────────────────────────────────
(() => {
  const S = PLAN.story;
  const steps = S.steps.map(s => {
    const props = Object.entries(s.props || {}).map(([k, v]) => `${esc(k)} = ${esc(String(v))}`).join('<br>');
    const chip = s.ev === '$screen' ? ui.scrChip(s.screen) : ui.chip(s.ev);
    return `<div class="sstep" data-find="${esc((s.ev + ' ' + s.text).toLowerCase())}"><div class="tm">${esc(s.t)}</div><span class="who ${s.who}">${s.who === 'parent' ? 'Мама' : 'Алина'}</span>
      <div class="txt">${esc(s.text)}</div>${shot(s.card)}<div class="phl">в PostHog появится:</div>${chip}<div>${ui.statusWord(s.ev === '$screen' ? '$screen' : s.ev, true)}</div><div class="sp">${props}</div></div>`;
  }).join('');
  doc.insertAdjacentHTML('beforeend', section('story', 'Начало', 'История одной семьи', 'Пример', S.title, esc(S.sub),
    `<div class="story">${steps}</div><p class="after">${esc(S.after)}</p>`));
})();

// ── 4. North star and the metric tree ───────────────────────────────────
(() => {
  const M = PLAN.metrics, N = M.northStar, nev = EV[N.event];
  const now = today(nev.status) ? '' : `<div class="now">${esc(ST[nev.status].icon)} <b>Сейчас не считается:</b> событие ${esc(N.event)} — ${esc(ST[nev.status].label)}. До этого график будет 0.</div>`;
  const defs = M.definitions.map(([a, b]) => `<div><b>${esc(a)}</b> — ${esc(b)}</div>`).join('');
  const pillars = M.pillars.map(p => `<div class="pillar"><h3>${esc(p.title)}</h3><small>${esc(p.sub)}</small>${p.items.map(m => {
    const src = (m.events || []).map(n => n === '$screen' ? ui.scrChip('parent_home') : EV[n] ? ui.chip(n) : `<span class="ext">${esc(n)}</span>`).join('') + (m.ext ? `<span class="ext">${esc(m.ext)}</span>` : '');
    return `<div class="met"><div class="nm">${esc(m.name)}</div><div class="fm">${m.formula}</div><div class="src">${src}</div>${m.go ? `<a class="go" href="#${esc(m.go)}" data-nav="${esc(m.go)}">Смотреть →</a>` : ''}</div>`;
  }).join('')}</div>`).join('');
  doc.insertAdjacentHTML('beforeend', section('metrics', 'Цифры', 'Главная метрика', 'Что считаем', M.title, esc(M.sub),
    `<div class="nsm"><div class="k">Главная метрика (North Star)</div><div class="v">${esc(N.name)}</div><div class="d">${N.text}</div>${now}<div class="rec">Как построить: ${N.recipe}</div></div>
     <div class="defs">${defs}</div><div class="pillars">${pillars}</div>`));
})();

// ── 5. Funnels ──────────────────────────────────────────────────────────
(() => {
  const legend = `<div class="legend">
    <div><span class="who parent">Родитель</span><span>Цвет полоски у шага — кто его делает: родитель, ребёнок или магазин приложений.</span></div>
    <div><span style="font-weight:800">→</span><span>Следующий шаг. Серая стрелка с подписью «другой человек» — шаг делает уже не тот, кто предыдущий: так работают воронки по семьям.</span></div>
    <div>${ui.chip('questApproved')}<span>Чёрная плашка — имя события в PostHog, по которому считается шаг. Клик — что это, какие данные несёт и есть ли оно уже.</span></div>
    <div>${ui.scrChip('parent_home')}<span>Белая плашка 👁 — шаг считается по просмотру экрана: событие $screen с этим именем. ▤ — лист поверх экрана, ○ — не приходит.</span></div>
  </div><h3>Значки статуса</h3>${ui.legendHtml()}`;
  doc.insertAdjacentHTML('beforeend', section('funnels', 'Цифры', 'Как читать воронки', 'Воронки', 'Как читать воронки',
    'Воронка — шаги по порядку. Берём всех, кто сделал шаг 1, и смотрим, сколько из них дошли до каждого следующего. '
    + 'Под каждым шагом — настоящий экран приложения и событие, по которому PostHog считает этот шаг. Сверху у каждой воронки сказано, можно ли построить её уже сегодня.', legend));

  PLAN.funnels.forEach((f, i) => {
    const inApp = f.steps.filter(s => !s.external);
    const waiting = [], partial = [];
    inApp.forEach((s, j) => {
      const n = f.steps.indexOf(s) + 1;
      const sts = stepEvents(s).map(evStatus);
      if (!sts.some(today)) waiting.push([n, sts.find(x => x) || 'new']);
      else if (sts.includes('fix')) partial.push(n);
    });
    let ready;
    if (!waiting.length) ready = `<div class="ready ${partial.length ? 'part' : 'yes'}"><b>${partial.length ? '⚠ Можно строить, с оговоркой' : '✓ Можно строить уже сегодня'}</b>${partial.length ? `Шаг ${partial.join(', ')} приходит с недочётом — см. описание события.` : 'Все шаги уже приходят в PostHog.'}</div>`;
    else {
      const by = {}; waiting.forEach(([n, s]) => { (by[s] = by[s] || []).push(n); });
      const why = Object.entries(by).map(([s, ns]) => `${ns.length > 1 ? 'шаги' : 'шаг'} ${ns.join(', ')} — ${ST[s].label}`).join('; ');
      ready = `<div class="ready no"><b>⏳ Сегодня не построить</b>${esc(why)}${partial.length ? `; шаг ${partial.join(', ')} приходит с недочётом` : ''}.</div>`;
    }
    const by = f.by === 'family' ? term('Считаем семьи: мама и ребёнок — один путь', 'Шаги делают разные люди одной семьи. В PostHog: Aggregating by → family (группы)') : term('Считаем людей', 'Каждый человек проходит воронку сам. В PostHog: Aggregating by → Unique users');
    const pills = `<div class="pills"><span class="pill">${by}</span><span class="pill">${term('На путь даём ' + f.window, 'Сколько времени даём пройти все шаги (conversion window). Шаг позже не засчитается.')}</span>${f.breakdowns.length ? `<span class="pill">${term('Можно разбить по', 'Breakdown: та же воронка отдельно для каждой страны, способа входа…')}: ${esc(f.breakdowns.join(', '))}</span>` : ''}</div>`;
    let steps = '';
    f.steps.forEach((s, j) => {
      if (j) {
        const other = f.steps[j - 1].who !== s.who;
        steps += `<div class="conn${other ? ' other' : ''}"><span>→</span>${other ? '<small>другой человек</small>' : ''}</div>`;
      }
      const chips = s.external ? '' : `<div class="inph">Событие в PostHog${s.alt.length ? ' (любое из)' : ''}:</div><div class="chips">${
        stepEvents(s).map((n, k) => (k ? '<span class="or">или</span>' : '') + (n === '$screen' ? ui.scrChip(s.screen) : ui.chip(n)) + `<div>${ui.statusWord(n, true)}</div>`).join('')}</div>`;
      const picture = s.card ? shot(s.card) : `<div class="shot ext">${esc(s.extLabel || 'вне приложения')}</div>`;
      steps += `<div class="step ${s.who}" data-find="${esc(stepEvents(s).join(' ').toLowerCase() + ' ' + s.label.toLowerCase())}">
        <div class="sh"><span class="no">${j + 1}</span><span class="who ${s.who}">${esc(WHO[s.who] || s.who)}</span></div>
        <div class="lbl">${esc(s.label)}</div>${picture}${chips}
        ${s.where ? `<div class="whr">фильтр: <code>${esc(s.where)}</code></div>` : ''}${s.hint ? `<div class="hint">${esc(s.hint)}</div>` : ''}</div>`;
    });
    const stepLine = s => {
      const flt = [s.event === '$screen' ? `$screen_name = ${s.screen}` : '', s.where].filter(Boolean);
      const name = s.alt.length ? `Action из событий ${[s.event, ...s.alt].map(n => `<code>${esc(n)}</code>`).join(', ')}` : `<code>${esc(s.event)}</code>`;
      return `<li>${name}${flt.length ? ` с фильтром ${flt.map(x => `<code>${esc(x)}</code>`).join(' и ')}` : ''} — ${esc(s.label)}</li>`;
    };
    const ru = PLAN.realUsers;
    const recipe = f.recipe
      ? `<details class="recipe"><summary>Как посчитать — по шагам</summary><ol>${f.recipe.map(r => `<li>${r}</li>`).join('')}</ol></details>`
      : `<details class="recipe"><summary>Как построить эту воронку в PostHog — по шагам</summary><ol>
          <li>PostHog → Product analytics → New insight → <b>Funnels</b>.</li>
          <li>Шаги по порядку:<ol>${inApp.map(stepLine).join('')}</ol></li>
          <li>Aggregating by (считать по): <b>${f.by === 'family' ? 'family — группы' : 'Unique users — люди'}</b>; Conversion window (сколько ждём): <b>${esc(f.window)}</b>.</li>
          <li>Только настоящие пользователи: галочка «Filter out internal and test users» или фильтр <code>${esc(ru.today)}</code> (со следующей сборки ещё <code>${esc(ru.later)}</code>).</li>
          ${f.breakdowns.length ? `<li>По желанию Breakdown (разбить по): ${esc(f.breakdowns.join(', '))}.</li>` : ''}</ol>
          ${f.by === 'family' ? '<div class="muted">Считать по семьям можно, только если в PostHog включены группы (Group analytics). Если нет — постройте по людям: шаги родителя и ребёнка тогда не склеятся.</div>' : ''}</details>`;
    doc.insertAdjacentHTML('beforeend', section(f.id, 'Цифры', `${i + 1}. ${f.title}`, `Воронка ${i + 1} из ${PLAN.funnels.length}`, f.title, esc(f.question),
      ready + pills + `<div class="steps">${steps}</div>` + (f.note ? `<p class="fnote">${esc(f.note)}</p>` : '') +
      (f.if_low ? `<div class="iflow"><b>Если проседает</b>${esc(f.if_low)}</div>` : '') + recipe));
  });
})();

// ── 6. Docs: retention, then what to do, then the reference ─────────────
function docs(d, group, nav) {
  const cols = d.cols === 3 ? 'g3' : 'g2';
  return section(d.id, group, nav || d.title, d.kicker, d.title, d.sub,
    `<div class="grid ${cols}">${d.cards.map(c => `<div class="doc${c.full ? ' full' : ''}"><div class="tw">${c.html}</div></div>`).join('')}</div>`);
}
PLAN.docsBefore.forEach(d => doc.insertAdjacentHTML('beforeend', docs(d, 'Цифры')));
PLAN.docsAfter.forEach(d => doc.insertAdjacentHTML('beforeend', docs(d, d.id === 'status' ? 'Что делать' : 'Справочник',
  ({ status: 'Что нужно от владельцев', rules: 'Как отбирать данные и приватность', dashboards: 'Дашборды', marketing: 'Ссылки, UTM, реклама' })[d.id])));

// ── 7. Where the data comes from ────────────────────────────────────────
(() => {
  const A = PLAN.architecture, box = {}; A.boxes.forEach(b => { box[b.id] = b; });
  const boxes = A.boxes.map(b => `<div class="abox ${b.kind}"><span class="em">${b.icon}</span><b>${esc(b.title)}</b>${esc(b.text)}${b.small ? `<small>${esc(b.small)}</small>` : ''}</div>`).join('');
  const flows = A.flows.map(f => `<div class="flow${f.solid ? '' : ' dashed'}"><span class="tg">${box[f.a].icon} ${esc(box[f.a].title)}</span><span class="ar">${f.solid ? '→' : '⇢'}</span>
    <span class="tg">${box[f.b].icon} ${esc(box[f.b].title)}</span><span class="lb">${esc(f.label)}</span></div>`).join('');
  doc.insertAdjacentHTML('beforeend', section('how', 'Справочник', 'Откуда берутся данные', 'Как устроено', A.title, esc(A.sub),
    `<div class="arch">${boxes}</div><h3>Куда что уходит</h3><div class="flows">${flows}</div><p style="font-size:14px;color:#5f646d">⇢ — связь не настроена или не проверена.</p>
     <div class="doc" style="margin-top:16px"><div class="tw">${A.identityHtml}</div></div>`));
})();

// ── 8. Every event, every screen name ───────────────────────────────────
const ROWS = [], TILES = [];
(() => {
  let h = '';
  PLAN.domains.forEach(d => {
    const list = PLAN.events.filter(e => e.domain === d.id); if (!list.length) return;
    h += `<div class="dom"><h3>${esc(d.title)}</h3>${d.note ? `<p class="dn">${esc(d.note)}</p>` : ''}${list.map(e =>
      `<button class="evrow" data-ev-row="${esc(e.name)}" data-find="${esc((e.name + ' ' + e.title + ' ' + e.props.map(p => p.n).join(' ')).toLowerCase())}">
        <span class="nm">${esc(e.name)}</span><span class="ti">${esc(e.title)}<small>${esc(ui.whoOf(e))}</small></span>
        <span class="stw st-${e.status}">${esc(ST[e.status].icon)} ${esc(ST[e.status].label)}</span></button>`).join('')}</div>`;
  });
  doc.insertAdjacentHTML('beforeend', section('events', 'Справочник', 'Все события', 'Словарь событий', 'Все события',
    `Имя события — так оно называется в PostHog. Клик — когда отправляется, какие данные несёт, на каких экранах и в каких воронках. Всего ${PLAN.events.length}.`, h));
  let s = '';
  for (const side of ['common', 'parent', 'child']) {
    const list = PLAN.screens.filter(x => x.group === side); if (!list.length) continue;
    s += `<h3>${side === 'parent' ? 'Родитель' : side === 'child' ? 'Ребёнок' : 'Первый запуск'} <span style="color:#5f646d;font-weight:500;font-size:15px">· ${list.length}</span></h3><div class="scrs">${list.map(x => {
      const k = x.cards[0];
      const thumb = k && CARDS[k] ? `<img loading="lazy" decoding="async" src="../img/${esc(k)}_t.webp" alt="">` : 'картинки нет в CJM';
      const how = x.sheet ? '▤ лист — без просмотра' : x.untracked ? '○ не приходит (до согласия)' : '👁 приходит как $screen';
      return `<button class="stile" data-scr-tile="${esc(x.id)}" data-find="${esc((x.id + ' ' + x.title + ' ' + x.events.join(' ')).toLowerCase())}"><div class="thumb">${thumb}</div>
        <div class="nm">${esc(x.id)}</div><div class="ti">${esc(x.title)}</div><div class="how">${how}</div></button>`;
    }).join('')}</div>`;
  }
  const tracked = PLAN.screens.filter(x => x.route && !x.sheet && !x.untracked).length;
  doc.insertAdjacentHTML('beforeend', section('screens', 'Справочник', 'Экраны', 'Экраны', 'Экраны: постоянные имена',
    `Просмотр экрана приходит сам — событием <code>$screen</code> с этим именем в <code>$screen_name</code> (${tracked} экранов). Листы поверх экрана и экраны до согласия так не приходят — их видно по своим событиям.`, s));
})();

// ── Sidebar, search, downloads, panel and pictures ──────────────────────
const side = document.getElementById('side');
(() => {
  let h = `<div class="sbox"><b>Как пользоваться</b>Читайте сверху вниз: «Коротко», «Азбука», «История семьи». Чёрная плашка с английским словом — имя события в PostHog: клик — что оно значит, какие данные несёт и приходит ли уже.</div>
    <div class="dl"><button class="btn" id="dlCsv" title="Таблица событий для Excel или Google Sheets">⬇ CSV</button><button class="btn" id="dlJson" title="Весь план в JSON">⬇ JSON</button></div><div id="hits"></div>`;
  let group = '';
  for (const [g, id, title] of NAV) {
    if (g !== group) { h += `<h2>${esc(g)}</h2>`; group = g; }
    h += `<a class="nav" href="#${esc(id)}" data-nav="${esc(id)}">${esc(title)}</a>`;
  }
  side.innerHTML = h;
  const dl = (name, type, text) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  document.getElementById('dlCsv').onclick = () => dl('oyna-tracking-plan.csv', 'text/csv;charset=utf-8',
    '﻿' + ['event,title,domain,who,status,priority,when,properties,screens,funnels,caveat'].concat(PLAN.events.map(e => [e.name, e.title,
      (PLAN.domains.find(d => d.id === e.domain) || {}).title, e.side, ST[e.status].label, e.prio || '', e.when,
      e.props.map(p => `${p.n}: ${p.t || ''} — ${p.d}`).join('; '), PLAN.screens.filter(s => s.events.includes(e.name)).map(s => s.id).join(' '),
      PLAN.funnels.filter(f => f.steps.some(s => s.event === e.name || (s.alt || []).includes(e.name))).map(f => f.title).join('; '), e.fix || ''].map(q).join(','))).join('\n'));
  document.getElementById('dlJson').onclick = () => dl('oyna-tracking-plan.json', 'application/json', JSON.stringify(PLAN, null, 2));
})();
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const pic = e.target.closest('[data-pic]');
  if (pic) { openPic(pic.dataset.pic); return; }
  const row = e.target.closest('[data-ev-row]');
  if (row) { ui.openEvent(row.dataset.evRow); return; }
  const tile = e.target.closest('[data-scr-tile]');
  if (tile) { ui.openScreen(tile.dataset.scrTile); return; }
  const chip = e.target.closest('#doc [data-ev], #doc [data-scr]');
  if (chip) { e.preventDefault(); ui.openFromChip(chip); }
});
document.addEventListener('keydown', e => {
  const chip = e.target.closest && e.target.closest('[data-ev],[data-scr]');
  if (chip && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ui.openFromChip(chip); }
});
document.getElementById('menu').onclick = () => document.body.classList.toggle('side-open');
const FINDABLE = [...document.querySelectorAll('[data-find]')];
document.getElementById('q').addEventListener('input', e => {
  const v = e.target.value.trim().toLowerCase();
  for (const el of FINDABLE) el.classList.toggle('dim', !!v && !el.dataset.find.includes(v));
  const hits = v ? PLAN.events.filter(x => (x.name + ' ' + x.title).toLowerCase().includes(v)).slice(0, 12) : [];
  const box = document.getElementById('hits');
  box.innerHTML = hits.map(x => `<a href="#" data-n="${esc(x.name)}">${esc(x.name)} <span>${esc(x.title)}</span></a>`).join('');
  box.querySelectorAll('a').forEach(a => a.onclick = ev => { ev.preventDefault(); ui.openEvent(a.dataset.n); });
});
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const a = document.querySelector('#hits a'); if (a) a.click(); } });
const lbx = document.getElementById('lbx');
function openPic(key) {
  const c = CARDS[key];
  document.getElementById('lbxT').textContent = c ? c.label : key;
  document.getElementById('lbxI').src = `../img/${key}.webp`;
  document.getElementById('lbxA').href = `../?an=1#${key.replace(/-(figma|app|motion|device)-\d+$/, '')}`;
  lbx.classList.add('on');
}
const closePic = () => { lbx.classList.remove('on'); document.getElementById('lbxI').removeAttribute('src'); };
document.getElementById('lbxX').onclick = closePic;
lbx.addEventListener('click', e => { if (e.target === lbx) closePic(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') { closePic(); document.body.classList.remove('side-open'); } });
// The sidebar follows the reading position: the first section in the top
// part of the window.
const navLinks = {}; side.querySelectorAll('a.nav').forEach(a => { navLinks[a.dataset.nav] = a; });
const inView = new Set();
const io = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting) inView.add(en.target.id); else inView.delete(en.target.id); });
  const cur = NAV.map(n => n[1]).find(id => inView.has(id));
  if (!cur) return;
  Object.values(navLinks).forEach(a => a.classList.toggle('on', a.dataset.nav === cur));
  navLinks[cur]?.scrollIntoView({ block: 'nearest' });
}, { rootMargin: '-60px 0px -60% 0px' });
document.querySelectorAll('main section').forEach(s => io.observe(s));
const evParam = new URLSearchParams(location.search).get('event');
if (evParam) ui.openEvent(evParam);
</script>
</body>
</html>
