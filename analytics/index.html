<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>OYNA — аналитика: события, воронки, метрики</title>
<style>
  :root {
    --bg: #e9e9ec; --ink: #16181d; --muted: #6b7078; --line: #d5d6db; --card: #fff;
    --parent: #ff8a1f; --parent-bg: #fff4e8; --child: #19a3c4; --child-bg: #e6f7fb; --sys: #8a8f99; --sys-bg: #f1f1f4;
    --live: #1f8a4c; --fix: #c77700; --new: #2f6fde; --server: #7444c4; --side-w: 280px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); overscroll-behavior: none;
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; color: var(--ink); touch-action: manipulation; }
  #top { position: fixed; inset: 0 0 auto 0; height: 58px; background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; padding: 0 14px; z-index: 20; overflow-x: auto; scrollbar-width: none; }

  .tabs { display: flex; gap: 2px; background: #f1f1f4; border-radius: 10px; padding: 3px; flex: none; }
  .tabs a { text-decoration: none; color: var(--ink); font-size: 13px; padding: 6px 11px; border-radius: 8px; white-space: nowrap; }
  .tabs a.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .tabs a:not(.on):hover { background: #e6e6ea; }
  .grow { flex: 1; min-width: 12px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; height: 32px; min-width: 32px; padding: 0 10px;
    cursor: pointer; font: inherit; font-size: 13px; color: var(--ink); white-space: nowrap; flex: none; text-decoration: none; display: inline-flex; align-items: center; }
  .btn:hover { background: #f4f4f6; }
  .zoom { display: flex; align-items: center; gap: 4px; flex: none; }
  #zoomv { min-width: 58px; justify-content: center; font-variant-numeric: tabular-nums; }

  #menu { display: none; }
  .meta { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #side { position: fixed; left: 0; top: 58px; bottom: 0; width: var(--side-w); background: #fff; border-right: 1px solid var(--line);
    overflow: auto; z-index: 15; padding: 10px 0 30px; overscroll-behavior: contain; }
  #side h2 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 16px 16px 6px; }
  #side a { display: flex; justify-content: space-between; gap: 8px; padding: 6px 16px; color: var(--ink); text-decoration: none; font-size: 13px; border-left: 3px solid transparent; }
  #side a:hover { background: #f4f4f6; }
  #side a.on { background: #f1f1f4; border-left-color: #16181d; font-weight: 600; }

  #side .sbox b { display: block; margin-bottom: 5px; }
  #side .sbox .lg { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  #side .sbox a { display: inline; padding: 0; border: 0; color: #2f6fde; font-weight: 600; }
  #side .dl { display: flex; gap: 6px; margin: 8px 12px; }
  #side .dl .btn { flex: 1; justify-content: center; }
  #hits { margin: 0 12px; }
  #hits a { padding: 4px 6px; border-left: 0; font: 600 12.5px/1.3 ui-monospace, "SF Mono", Menlo, monospace; }
  #hits a span { font: 400 12px -apple-system, system-ui, sans-serif; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
  #view { position: fixed; left: var(--side-w); top: 58px; right: 0; bottom: 0; overflow: hidden; cursor: grab; touch-action: none; }
  #view.drag { cursor: grabbing; }
  #board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #board.moving { will-change: transform; }
  .abs { position: absolute; }
  .panel { position: absolute; background: rgba(255,255,255,.62); border: 1px solid rgba(0,0,0,.05); border-radius: 30px; }
  .ph { position: absolute; }
  .ph .k { font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
  .ph .t { font-size: 38px; font-weight: 800; letter-spacing: -.015em; line-height: 1.15; transform-origin: 0 0; display: inline-block; }
  .ph .s { font-size: 18px; color: #4a4f57; margin-top: 8px; max-width: 1700px; line-height: 1.45; }
  #board.far .ph .t { background: rgba(255,255,255,.93); border-radius: 12px; padding: 2px 12px; box-shadow: 0 2px 10px rgba(0,0,0,.12); }
  #board.far .hero { visibility: hidden; }
  #board.far .ph .s, #board.far .ph .k, #board.far .txt { visibility: hidden; }
  .hero .t { font-size: 76px; font-weight: 850; letter-spacing: -.025em; }
  .hero .s { font-size: 24px; color: #4a4f57; margin-top: 10px; max-width: 2100px; line-height: 1.4; }
  .tiles { position: absolute; display: flex; gap: 18px; flex-wrap: wrap; }
  .tile { background: #fff; border-radius: 22px; padding: 18px 22px; min-width: 250px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
  .tile .k { font-size: 14px; color: var(--muted); }
  .tile .v { font-size: 40px; font-weight: 780; margin-top: 2px; line-height: 1.1; }
  .tile .r { font-size: 14px; margin-top: 6px; color: #3b3f46; }
  .tile .r b { font-weight: 650; }
  .card { position: absolute; background: #fff; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,.07), 0 6px 22px rgba(0,0,0,.06); }
  .doc { padding: 24px 28px; font-size: 16px; line-height: 1.5; overflow: hidden; }
  .doc h3 { font-size: 22px; margin: 0 0 10px; letter-spacing: -.01em; }
  .doc h4 { font-size: 13px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 16px 0 6px; }
  .doc p { margin: 0 0 8px; } .doc ul { margin: 4px 0 8px 20px; padding: 0; } .doc li { margin: 4px 0; }
  .doc table { width: 100%; border-collapse: collapse; font-size: 15px; margin-top: 4px; }
  .doc th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid #e3e3e8; }
  .doc td { padding: 8px 10px 8px 0; border-bottom: 1px solid #efeff2; vertical-align: top; }

  .chip { display: inline-flex; align-items: center; gap: 6px; font: 650 14px/1 ui-monospace, "SF Mono", Menlo, monospace; color: #fff;

  .chip.live i { background: #4cd38a; } .chip.ready i { background: #2dd4bf; } .chip.fix i { background: #ffb547; } .chip.new i { background: #7aa7ff; } .chip.server i { background: #c69cff; }
  .lane { position: absolute; border-radius: 22px; }
  .lane.parent { background: var(--parent-bg); } .lane.child { background: var(--child-bg); } .lane.system { background: var(--sys-bg); }
  .lane-l { position: absolute; font-size: 18px; font-weight: 800; writing-mode: vertical-rl; transform: rotate(180deg); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
  .lane-l.parent { color: #c46400; } .lane-l.child { color: #0e7f9a; } .lane-l.system { color: #6b7078; }
  .step { position: absolute; }
  .step .no { display: inline-flex; width: 30px; height: 30px; border-radius: 50%; background: #16181d; color: #fff; font-weight: 750; font-size: 15px; align-items: center; justify-content: center; margin-right: 8px; vertical-align: middle; }

  .step .shot { position: relative; width: 200px; border-radius: 18px; overflow: hidden; background: #e4e4e9 center top / cover no-repeat; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.1); margin: 8px 0 10px; cursor: zoom-in; }

  .step .shot.ext { display: flex; align-items: center; justify-content: center; text-align: center; padding: 18px; font-size: 16px; font-weight: 650; color: #3b3f46; cursor: default;
    background: repeating-linear-gradient(-45deg, #f5f5f8, #f5f5f8 12px, #ececf1 12px, #ececf1 24px); }

  svg.arrows { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .ev { position: absolute; width: 380px; padding: 14px 16px 14px; cursor: pointer; }
  .ev:hover { box-shadow: 0 0 0 3px #16181d, 0 8px 26px rgba(0,0,0,.12); }
  .ev .nm { font: 700 16px/1.25 ui-monospace, "SF Mono", Menlo, monospace; word-break: break-all; }
  .ev .ti { font-size: 14px; color: #3b3f46; margin-top: 3px; }
  .ev .wh { font-size: 13px; color: var(--muted); margin-top: 6px; line-height: 1.4; max-height: 3.9em; overflow: hidden; }
  .ev .tg { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }

  .ev.dim, .step.dim, .stile.dim { opacity: .14; }
  .col-h { position: absolute; font-size: 20px; font-weight: 780; }
  .col-h small { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 2px; }
  .box { position: absolute; background: #fff; border-radius: 18px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(0,0,0,.07), 0 6px 22px rgba(0,0,0,.06); font-size: 15px; line-height: 1.4; }
  .box b { display: block; font-size: 18px; margin-bottom: 6px; }
  .box .em { font-size: 26px; margin-bottom: 6px; display: block; }
  .box small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .box.parent { border-top: 6px solid var(--parent); } .box.child { border-top: 6px solid var(--child); } .box.tool { border-top: 6px solid #16181d; }
  .box.store { border-top: 6px solid #7b61ff; } .box.server { border-top: 6px solid var(--server); }
  .nsm { position: absolute; background: #16181d; color: #fff; border-radius: 26px; padding: 26px 30px; }
  .nsm .k { font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: #9ea4ae; }
  .nsm .v { font-size: 34px; font-weight: 800; margin-top: 6px; line-height: 1.2; }
  .nsm .d { font-size: 17px; color: #d5d8de; margin-top: 10px; line-height: 1.45; }
  .met { position: absolute; padding: 14px 16px; }
  .met .nm { font-size: 17px; font-weight: 720; }
  .met .fm { font-size: 14px; color: #3b3f46; margin-top: 5px; line-height: 1.4; }
  .met .src { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; }
  .met .src .chip { font-size: 12px; padding: 5px 8px; }
  .stile { position: absolute; width: 230px; }
  .stile .shot { width: 230px; height: 400px; border-radius: 18px; overflow: hidden; background: #e4e4e9 center top / cover no-repeat; position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 20px rgba(0,0,0,.1); cursor: pointer; }
  .stile .shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .stile .nm { font: 700 15px/1.3 ui-monospace, "SF Mono", Menlo, monospace; margin-top: 10px; word-break: break-all; }
  .stile .ti { font-size: 14px; color: #3b3f46; margin-top: 2px; }
  .stile .cnt { font-size: 13px; color: var(--muted); margin-top: 3px; }
  #board.lod0 .shot { background-image: none !important; } #board.lod0 .shot img { display: none; }
  #lbx { position: fixed; inset: 0; background: rgba(12,13,16,.95); z-index: 55; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: #fff; }
  #lbx.on { display: flex; }
  #lbx img { max-height: calc(100vh - 110px); max-width: 92vw; border-radius: 16px; }
  #lbx .bar { display: flex; gap: 10px; align-items: center; }
  #lbx .bar .btn { background: #26282e; color: #fff; border-color: #3a3d45; }
  #help { position: fixed; left: calc(var(--side-w) + 12px); bottom: 12px; background: rgba(255,255,255,.94); border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 11px; font-size: 12px; color: var(--muted); z-index: 18; max-width: calc(100vw - var(--side-w) - 220px); }
  #help b { color: var(--ink); font-weight: 600; }
  #help #helpX { float: right; border: 0; background: none; color: var(--muted); cursor: pointer; margin: -2px -4px 0 8px; font-size: 13px; }
  body.nohelp #help { display: none; }
  @media (max-width: 760px) {
    :root { --side-w: 0px; }
    #menu { display: inline-flex; }
    #side { width: 84vw; max-width: 330px; transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.2); }
    body.side-open #side { transform: none; }
    #q, .meta { display: none; }
    #help { display: none; }
  }
</style>

<body>
<div id="top">
  <button class="btn" id="menu" title="Разделы">☰</button>

    <button class="btn" id="zOut" title="Отдалить (−)">−</button>

    <button class="btn" id="zIn" title="Приблизить (+)">+</button>
    <button class="btn" id="fit" title="Показать всё (0)">Вписать</button>
    <button class="btn" id="helpB" title="Как двигаться">?</button>
  </div>
</div>

<div id="view"><div id="board"></div></div>
<div id="map"></div>
<div id="help"><button id="helpX" title="Скрыть">✕</button><b>Двигать:</b> тащить мышью, колесо, два пальца, стрелки, PgUp/PgDn · <b>Масштаб:</b> щипок, ⌘/Ctrl + колесо, + −, двойной клик · <b>0</b> — всё, <b>1</b> — 100 % · клик по событию — описание</div>
<div id="lbx"><div class="bar"><b id="lbxT"></b><button class="btn" id="lbxX">✕</button></div><img id="lbxI" alt=""></div>
<script>
/* OYNA canvas engine — one way to move around every canvas page.
 *
 * Mouse and trackpad: drag or scroll to move (Shift + wheel moves sideways),
 * pinch or ⌘/Ctrl + wheel to zoom at the cursor, double-click to zoom in
 * (Alt — out). Phone/tablet: one finger moves (with a glide), two fingers
 * pinch and move, double tap zooms in. Keys: arrows, PgUp/PgDn/Space,
 * Home/End, + − (also with ⌘), 0 fits the board, 1 is 100 %.
 *
 * The board can't be thrown away: at least half the view (or the whole
 * board when it is smaller) always stays on it. While the board moves it is
 * one composited layer; once it settles the page gets a "settle" call so it
 * can swap pictures for the zoom (level of detail) and the URL keeps the
 * place (#@x,y,z — a link opens the same spot).
 */
(function (global) {
  'use strict';

  const CSS = `
  .cv-map { position: fixed; right: 12px; bottom: 46px; z-index: 18; background: rgba(255,255,255,.9); transition: background .15s;
    border: 1px solid #d5d6db; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.08); padding: 8px;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  .cv-map .cv-head { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font: 600 11px/1 -apple-system, system-ui, sans-serif; color: #6b7078; letter-spacing: .06em;
    text-transform: uppercase; margin: 0 0 6px; }
  .cv-map .cv-head button { border: 0; background: none; color: #6b7078; cursor: pointer; font: inherit; padding: 2px 4px; }
  .cv-map.min .cv-body { display: none; } .cv-map.min .cv-head { margin: 0; }
  .cv-body { position: relative; display: flex; gap: 6px; cursor: pointer; }
  .cv-map:hover { background: rgba(255,255,255,.98); }
  .cv-labels { position: relative; width: 96px; flex: none; }
  .cv-labels div { position: absolute; right: 0; max-width: 96px; font: 500 10px/1.15 -apple-system, system-ui, sans-serif; cursor: pointer;
    color: #3b3f46; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform: translateY(-50%); }
  .cv-labels div.on { color: #000; font-weight: 700; }
  .cv-mapbox { position: relative; flex: none; background: #f1f1f4; border-radius: 6px; overflow: hidden; }
  .cv-mapbox i { position: absolute; display: block; border-radius: 2px; opacity: .85; }
  .cv-vp { position: absolute; border: 2px solid #16181d; border-radius: 3px; background: rgba(22,24,29,.08);
    box-shadow: 0 0 0 9999px rgba(255,255,255,.0); pointer-events: none; }
  @media (max-width: 760px) { .cv-map { display: none; } }
  `;

  function createCanvas(opts) {
    const view = opts.view, board = opts.board;
    const Z_MAX = opts.zMax || 3;
    const zMinFixed = opts.zMin || 0;
    let z = 1, tx = 0, ty = 0, W = 1, H = 1;
    let frame = 0, settleTimer = 0;
    let moved = false;
    const on = { change: [], settle: [] };

    if (!document.getElementById('cv-style')) {
      const st = document.createElement('style'); st.id = 'cv-style'; st.textContent = CSS; document.head.appendChild(st);
    }

    const vw = () => view.clientWidth, vh = () => view.clientHeight;
    function measure() { W = Math.max(1, board.offsetWidth); H = Math.max(1, board.offsetHeight); }
    function fitZoom() { return Math.min((vw() - 48) / W, (vh() - 48) / H); }
    function zMin() { return zMinFixed || Math.min(0.1, fitZoom() * 0.9); }
    const clampZ = v => Math.min(Z_MAX, Math.max(zMin(), v));

    // Half the view (or the whole board, when it is smaller) stays on the board.
    function clampXY() {
      const bw = W * z, bh = H * z, w = vw(), h = vh();
      const kx = Math.min(bw, w * 0.5), ky = Math.min(bh, h * 0.5);
      tx = Math.min(Math.max(tx, kx - bw), w - kx);
      ty = Math.min(Math.max(ty, ky - bh), h - ky);
    }

    function render() {
      clampXY();
      board.classList.add('moving');
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => { board.classList.remove('moving'); emit('settle'); saveHash(); }, 170);
      if (!frame) frame = requestAnimationFrame(flush);
    }
    function flush() {
      frame = 0;
      board.style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;
      emit('change');
    }
    function state() {
      const w = vw(), h = vh();
      return { z, tx, ty, w, h, W, H, left: -tx / z, top: -ty / z, right: (w - tx) / z, bottom: (h - ty) / z };
    }
    function emit(kind) { const s = state(); on[kind].forEach(fn => fn(s)); }

    // ── Zoom ────────────────────────────────────────────────────────────
    function zoomAt(f, cx, cy) {
      const nz = clampZ(z * f);
      tx = cx - (cx - tx) * (nz / z); ty = cy - (cy - ty) * (nz / z); z = nz; render();
    }
    // Wheel notches, buttons and keys ease toward one target (≈ 0.15 s); a
    // pinch feeds zoomAt directly so the board follows the fingers.
    let zTarget = null, zAnchor = [0, 0], zLoop = 0;
    function zoomSmooth(f, cx, cy) {
      stopTween();
      zTarget = clampZ((zTarget ?? z) * f); zAnchor = [cx, cy];
      if (zLoop) return;
      const step = () => {
        const d = zTarget / z;
        if (Math.abs(d - 1) < 0.003) { zoomAt(d, zAnchor[0], zAnchor[1]); zTarget = null; zLoop = 0; return; }
        zoomAt(Math.pow(d, 0.33), zAnchor[0], zAnchor[1]);

, установки — по источникам и кампаниям.", "small": "App Store Connect · Play Console"}, {"id": "parent", "col": 2, "row": 0, "kind": "parent", "icon": "👩", "title": "Телефон родителя", "text": "События родителя + режим ребёнка на этом же телефоне.", "small": "id = аккаунт родителя"}, {"id": "child", "col": 3, "row": 0, "kind": "child", "icon": "🧒", "title": "Телефон ребёнка", "text": "События ребёнка: только обезличенный id, без текста и имени.", "small": "id = child_<uuid>"}, {"id": "meta", "col": 0, "row": 1, "kind": "store", "icon": "🎯", "title": "Meta Ads (только родитель)", "text": "Активация приложения и покупки — для рекламы в Facebook и Instagram.", "small": "Meta App Events: после согласия и разрешения iOS; у ребёнка выключено"}, {"id": "rc", "col": 1, "row": 1, "kind": "server", "icon": "💳", "title": "RevenueCat", "text": "Покупки, пробный период, продления, отмены, выручка.", "small": "интеграция с PostHog — настройка в кабинете"}, {"id": "ph", "col": 2, "row": 1, "kind": "tool", "icon": "📊", "title": "PostHog", "text": "Все события, люди и семьи. Воронки, удержание, пути, когорты.", "small": "один проект; DEV отделяем свойством environment"}, {"id": "db", "col": 3, "row": 1, "kind": "server", "icon": "🗄", "title": "Supabase (база)", "text": "Правда о заданиях, монетах и семьях.", "small": "можно подключить к PostHog как склад данных"}, {"id": "dash", "col": 2, "row": 2, "kind": "tool", "icon": "🧭", "title": "Дашборды и отчёты", "text": "Привлечение, ядро, награды, деньги, удержание, Фоксик.", "small": "список — в разделе «Дашборды»"}], "links": [["ads", "stores", "переходы"], ["stores", "parent", "установки"], ["parent", "ph", "события"], ["child", "ph", "события"], ["rc", "ph", "покупки"], ["rc", "meta", "покупки"], ["db", "ph", "склад"], ["ph", "dash", ""]], "identityHtml": "<h3>Кто есть кто в PostHog</h3>\n<table><tr><th>Кто</th><th>id в PostHog</th><th>Что ещё знаем</th></tr>\n<tr><td>Родитель</td><td><code>uuid аккаунта</code></td><td>role = parent, страна, язык, тариф, семья</td></tr>\n<tr><td>Ребёнок на своём телефоне</td><td><code>child_&lt;uuid&gt;</code></td><td>role = child, семья, уровень. Никаких имён, дат рождения, фото и текстов</td></tr>\n<tr><td>Ребёнок на телефоне родителя</td><td>id родителя</td><td>role = child и active_child_id — пока открыт режим ребёнка</td></tr>\n<tr><td>Семья</td><td>группа <code>family</code> = id семьи</td><td>тариф, страна, число детей. Воронки «по семьям» считают шаги родителя и ребёнка вместе</td></tr></table>\n<p style=\"margin-top:12px\"><b>До согласия родителя приложение не отправляет ничего.</b> Поэтому сплэш и выбор языка в аналитике не видны — первое событие <code>coppaConsentGiven</code>.\nНа каждом событии: <code>environment</code> (dev / prod — DEV-сборки сейчас пишут в тот же проект), <code>coppa_strict</code>, роль, семья, тариф, страна, язык, версия приложения.</p>"}, "metrics": {"title": "Главная метрика и дерево метрик", "sub": "Одна цифра, по которой понятно, жив ли продукт, и пять групп метрик, которые её двигают. Под каждой — события, из которых она считается.", "northStar": {"name": "Семьи с закрытым циклом за неделю", "text": "Сколько семей за последние 7 дней прошли цикл: ребёнок сделал задание → родитель одобрил. Считается как уникальные семьи (группа <b>family</b>) с событием <b>questApproved</b> за неделю. Растёт — продукт работает: родители ставят задания, дети их делают, монеты что-то значат."}, "pillars": [{"title": "Привлечение", "sub": "сколько и откуда приходят", "items": [{"name": "Установки по источникам", "formula": "Загрузки в магазинах по кампаниям (ct=, utm_*).", "events": ["магазины"]}, {"name": "Конверсия страницы магазина", "formula": "Установки ÷ просмотры страницы. Рычаг — иконка, скриншоты, отзывы.", "events": ["магазины"]}, {"name": "Новые семьи", "formula": "Уникальные семьи с <b>onboardingCompleted</b> за период.", "events": ["onboardingCompleted"]}, {"name": "Цена семьи", "formula": "Расход канала ÷ новые семьи из этого канала.", "events": ["onboardingCompleted", "магазины"]}]}, {"title": "Активация", "sub": "дошли ли до ценности", "items": [{"name": "Семья создана в первый день", "formula": "Воронка «Родитель»: согласие → главная за 1 день.", "events": ["coppaConsentGiven", "$screen"]}, {"name": "Ребёнок подключён за 7 дней", "formula": "Воронка «Подключение»: ребёнок добавлен → ребёнок вошёл (или режим ребёнка).", "events": ["childAdded", "logIn", "childModeOpened"]}, {"name": "«Ага-момент»: первое одобрение", "formula": "Доля новых семей с первым <b>questApproved</b> за 7 дней.", "events": ["questApproved"]}]}, {"title": "Вовлечённость", "sub": "как часто и глубоко", "items": [{"name": "Задания на семью в неделю", "formula": "questCreated ÷ активные семьи.", "events": ["questCreated"]}, {"name": "Отправки на ребёнка в неделю", "formula": "questSubmitted ÷ активные дети.", "events": ["questSubmitted"]}, {"name": "Время проверки", "formula": "Медиана time_to_approve_minutes.", "events": ["questApproved"]}, {"name": "Доля возвратов", "formula": "questRejected ÷ (questApproved + questRejected).", "events": ["questRejected"]}, {"name": "Награды на семью", "formula": "rewardApproved ÷ активные семьи.", "events": ["rewardApproved"]}]}, {"title": "Монетизация", "sub": "кто и за что платит", "items": [{"name": "Конверсия подписки", "formula": "subscriptionStarted ÷ paywallViewed, по trigger, стране, тарифу.", "events": ["paywallViewed", "subscriptionStarted"]}, {"name": "Платящие семьи", "formula": "Семьи с тарифом premium / premium_ai.", "events": ["subscriptionStarted", "rc_initial_purchase"]}, {"name": "Пробный → платный, выручка, отток", "formula": "Из RevenueCat (кабинет или интеграция с PostHog).", "events": ["rc_initial_purchase"]}]}, {"title": "Удержание", "sub": "возвращаются ли", "items": [{"name": "Родитель D1 / D7 / D30", "formula": "Возврат: Application Opened; «ключевой» возврат — questApproved или questCreated.", "events": ["Application Opened", "questApproved"]}, {"name": "Ребёнок неделя 1 / 4", "formula": "Отправил задание на 2-й и 5-й неделе после входа.", "events": ["questSubmitted"]}, {"name": "Удержание семьи", "formula": "Семьи с questApproved на неделе N и N+k (по группе family).", "events": ["questApproved"]}, {"name": "Серии и возвраты", "formula": "streakMilestone; возвраты после 48 ч (паутинка).", "events": ["streakMilestone", "childReturnedAfterBreak"]}]}]}, "docsBefore": [{"id": "retention", "kicker": "Удержание", "title": "Удержание и когорты", "sub": "Не воронка, а «возвращаются ли». Строится в PostHog как Retention.", "cols": 3, "cards": [{"html": "<h3>Родитель</h3><p><b>Старт:</b> <code>onboardingCompleted</code>. <b>Возврат:</b> <code>Application Opened</code>.</p><p><b>D1, D7, D30.</b> Строже — возврат с действием: <code>questCreated</code> или <code>questApproved</code>.</p><p>Разрезы: страна, способ входа, тариф, есть ли телефон у ребёнка.</p>"}, {"html": "<h3>Ребёнок</h3><p><b>Старт:</b> <code>logIn</code> (role = child). <b>Возврат:</b> <code>questSubmitted</code>.</p><p><b>По неделям:</b> 1, 2, 4, 8. Разрез: малыш / подросток — у них разные экраны.</p><p>Возвраты после перерыва 48 ч+ — <code>childReturnedAfterBreak</code>.</p>"}, {"html": "<h3>Семья (главное)</h3><p><b>Старт и возврат:</b> <code>questApproved</code>, считаем по группе <b>family</b>.</p><p>Это удержание главной метрики: какая доля семей, закрывших цикл на первой неделе, закрывает его и на 4-й.</p><p>Платящие и бесплатные — отдельными когортами.</p>"}]}], "docsAfter": [{"id": "dashboards", "kicker": "PostHog", "title": "Дашборды", "sub": "Что собрать в PostHog. Каждый пункт — один график (insight). Везде фильтр <code>environment = prod</code>.", "cols": 3, "cards": [{"html": "<h3>1. Привлечение и активация</h3><ul><li>Новые семьи по дням (onboardingCompleted, по семьям)</li><li>Воронка «Магазин → согласие» — вместе с отчётом магазинов</li><li>Воронка «Родитель»: разрез по способу входа и стране</li><li>Воронка «Подключение ребёнка»</li><li>Таблица UTM: источник → семьи → оплаты</li></ul>"}, {"html": "<h3>2. Ядро продукта</h3><ul><li><b>Главная метрика:</b> уникальные семьи с questApproved, по неделям</li><li>Воронка «Ядро» по семьям</li><li>Медиана времени проверки</li><li>Доля возвратов на доработку</li><li>Задания по источнику: вручную, шаблон, ИИ, Фоксик</li></ul>"}, {"html": "<h3>3. Награды и монеты</h3><ul><li>Воронка «Награды»</li><li>Запросы и выдачи по неделям</li><li>Ожидание ответа родителя (wait_minutes)</li><li>Свои награды против каталога</li></ul>"}, {"html": "<h3>4. Деньги</h3><ul><li>Воронка «Подписка» с разрезом trigger</li><li>Открытия подписки по источникам</li><li>Неудачные покупки по причинам</li><li>Магазин против Paylov (Узбекистан)</li><li>Выручка, пробный → платный, отток — RevenueCat</li></ul>"}, {"html": "<h3>5. Удержание</h3><ul><li>Родитель D1/D7/D30</li><li>Ребёнок по неделям, малыш / подросток</li><li>Удержание семьи по questApproved</li><li>Стикинесс: дней в неделю с открытием</li></ul>"}, {"html": "<h3>6. Фоксик AI</h3><ul><li>Родители: вопросы, применённые советы, лимиты</li><li>Воронка «Фоксик → Premium + ИИ»</li><li>Дети: открытия чата, сообщения, лимиты</li><li>Отказы «не по теме»</li></ul>"}, {"html": "<h3>7. Качество</h3><ul><li>Неудачные входы ребёнка по причинам (childCodeFailed)</li><li>Ошибки оплаты (purchaseFailed)</li><li>Открытия пушей по типам</li><li>Экраны, где чаще всего закрывают приложение (пути)</li></ul>"}]}, {"id": "marketing", "kicker": "Маркетинг", "title": "Ссылки, UTM и что можно измерить", "sub": "Как размечать кампании, где смотреть установки и что в детском приложении измерить нельзя.", "cols": 2, "cards": [{"full": true, "html": "<h3>Что где смотреть</h3><table>\n<tr><th>Вопрос</th><th>Где ответ</th><th>Как</th></tr>\n<tr><td>Сколько установок и откуда</td><td>App Store Connect, Google Play Console</td><td>Источники, кампании по ссылкам с ct= / utm_*</td></tr>\n<tr><td>Что люди делают в приложении</td><td>PostHog</td><td>События, воронки этой страницы, удержание</td></tr>\n<tr><td>Сколько заплатили и продлили</td><td>RevenueCat (+ PostHog через интеграцию)</td><td>Выручка, пробный → платный, отток</td></tr>\n<tr><td>Сколько стоила установка / семья</td><td>Кабинеты рекламы + магазины + PostHog</td><td>Расход ÷ установки (магазин) ÷ новые семьи (PostHog)</td></tr>\n<tr><td>Работают ли пуши</td><td>PostHog</td><td>pushOpened ÷ отправлено (журнал рассылок)</td></tr></table>"}, {"html": "<h3>Ссылки для кампаний</h3>\n<h4>App Store</h4><pre>https://apps.apple.com/app/apple-store/id6762140001?pt=&lt;provider-token&gt;&amp;ct=202610_uz_instagram_launch&amp;mt=8</pre>\n<p><code>pt</code> выдаёт App Store Connect (App Analytics → Campaigns). Установки по <code>ct</code> видны там же.</p>\n<h4>Google Play</h4><pre>https://play.google.com/store/apps/details?id=com.oynaplatform.app&amp;referrer=utm_source%3Dinstagram%26utm_medium%3Dpaid_social%26utm_campaign%3D202610_uz_launch</pre>\n<p>Play Console показывает установки по кампаниям. Приложение может прочитать эти метки при первом запуске (Install Referrer) и записать родителю — следующий шаг.</p>\n<h4>Сайт</h4><pre>https://oynaplatform.com/?utm_source=telegram&amp;utm_medium=post&amp;utm_campaign=202610_kz_school</pre>\n<p>Кнопки магазинов на сайте должны передавать метки дальше — в <code>ct</code> и <code>referrer</code>.</p>"}, {"html": "<h3>Правила UTM</h3><table>\n<tr><th>Метка</th><th>Значения</th></tr>\n<tr><td><code>utm_source</code></td><td>instagram, tiktok, telegram, facebook, google, youtube, blogger_&lt;имя&gt;, school_&lt;имя&gt;, partner_&lt;имя&gt;</td></tr>\n<tr><td><code>utm_medium</code></td><td>paid_social, organic_social, influencer, cpc, referral, email, push, offline</td></tr>\n<tr><td><code>utm_campaign</code></td><td><code>ГГГГММ_страна_цель</code>: 202610_uz_launch, 202611_kz_school</td></tr>\n<tr><td><code>utm_content</code></td><td>креатив: video_fox_15s, static_market_v2</td></tr></table>\n<p>Только латиница в нижнем регистре и подчёркивания. Без пробелов и кириллицы — иначе одна кампания распадается на несколько строк.</p>"}, {"html": "<h3>Реклама и атрибуция</h3>\n<ul><li><b>Meta (Facebook, Instagram)</b> — в боевой сборке есть Meta App Events, но <b>только у родителя</b>: после согласия, входа родителя и (на iOS) разрешения на отслеживание. В режиме ребёнка и на телефоне ребёнка выключено. Отправляет только «приложение активировано»; покупки в Meta приходят из RevenueCat.</li>\n<li><b>Следующий шаг для Meta:</b> событие «Регистрация завершена» (= семья создана) — чтобы реклама училась на семьях, а не на установках. Только родитель, без данных ребёнка.</li>\n<li><b>Остальные каналы</b> (TikTok, Google, блогеры, Telegram) — ссылки кампаний магазинов, UTM на сайте и Install Referrer Google Play. Других рекламных SDK нет и не ставим: в приложении есть детский режим (правила Apple Kids и Google Families).</li>\n<li><b>Ничего о ребёнке</b> в рекламные системы не уходит; ретаргетинг по действиям ребёнка — нельзя.</li>\n<li><b>Предложение продукту:</b> вопрос «Откуда вы узнали про OYNA?» в конце регистрации — сарафан и Telegram ссылками не меряются.</li></ul>"}, {"html": "<h3>Пуши и ссылки внутрь приложения</h3>\n<ul><li><b>Пуши-рассылки</b> уже несут <code>campaign_id</code> и <code>push_id</code> — нужно событие <code>pushOpened</code> (план, P1), тогда CTR и возвраты по кампании будут в PostHog.</li>\n<li><b>Ссылки внутрь приложения:</b> сейчас работают <code>oyna://…</code> и приглашения ребёнка. Обычные https-ссылки вида <code>oynaplatform.com/app/…</code> пока не открывают приложение — для кампаний «вернись в приложение» их нужно добавить.</li>\n<li>Метки <code>utm_*</code> в ссылке приложения — свойства <code>deepLinkOpened</code> (план, P2).</li></ul>"}]}, {"id": "rules", "kicker": "Правила", "title": "Приватность, названия и проверка", "sub": "Чтобы данные были законными, понятными и не врали.", "cols": 3, "cards": [{"html": "<h3>Детские данные (COPPA)</h3><ul>\n<li>До согласия родителя — ничего.</li><li>Ребёнок — только <code>child_&lt;uuid&gt;</code>; ни имени, ни даты рождения, ни фото.</li>\n<li>Никакого свободного текста: названия заданий и наград, сообщения, комментарии — только признаки (<code>is_custom</code>, <code>has_reason</code>, длина).</li>\n<li>Возраст — только диапазон (малыш / подросток).</li><li>Никаких рекламных id и рекламных SDK.</li>\n<li><code>coppa_strict</code> на каждом событии.</li><li>Удалил аккаунт — удаляем человека и в PostHog.</li></ul>"}, {"html": "<h3>Как называем</h3><ul>\n<li>Событие: <b>объект + действие в прошедшем</b>, camelCase, как уже в данных: <code>questCreated</code>, <code>rewardApproved</code>.</li>\n<li>Свойства — snake_case: <code>time_to_approve_minutes</code>.</li><li>Экраны — <code>роль_экран</code>: <code>parent_home</code>, <code>child_market</code>.</li>\n<li>Старые имена не трогаем — на них отчёты: <code>parent_profile_*</code> (snake_case), <code>jey*</code> = Фоксик.</li>\n<li>Один факт — одно событие, после успеха на сервере, не по нажатию. Действия через карточки Фоксика — тем же событием с <code>source = foksik_card</code>.</li></ul>"}, {"html": "<h3>Как проверить событие</h3><ol style=\"margin:4px 0 8px 20px;padding:0\">\n<li>Сборка OYNA Dev → сделать действие.</li><li>PostHog → Activity → Live events, фильтр <code>environment = dev</code>.</li>\n<li>Сверить имя и свойства с этой страницей (клик по событию).</li><li>В отчётах всегда <code>environment = prod</code>.</li></ol>\n<p>Старые DEV-события без <code>environment</code> лежат в том же проекте — отсекаем по версии сборки.</p>"}]}, {"id": "status", "kicker": "Статус", "title": "Что работает, что сделано, что нужно от владельцев", "sub": "Аудит кода 02.10.2026 (redesign-parent-flow @6889d1fd) и доработка в ветке analytics-tracking-plan.", "cols": 2, "cards": [{"html": "<h3>Нашли при аудите</h3><ul><li><b>Покупка подписки не отправлялась вообще</b> — метод был, вызова не было. <i>Исправлено.</i></li><li><b>Источник подписки всегда «trial_banner»</b> — такой плашки нет. <i>Исправлено (кроме входов через Фоксика).</i></li><li><b>Ядро «задание → проверка → награда» у родителя не было размечено</b> — ни одного события. <i>Исправлено.</i></li><li><b>DEV-сборки пишут в боевой проект PostHog</b> без пометки. <i>Исправлено: environment.</i></li><li><b>Просмотров экранов не было.</b> <i>Исправлено: $screen с постоянными именами.</i></li><li><b>Mixpanel мёртв:</b> в сборках нет токена.</li><li>У родителя после перезапуска <code>coppa_strict = true</code> (должно быть false).</li><li>Тариф в PostHog у плативших картой Paylov — free; при входе тариф затирается на free.</li><li><code>questSubmitted</code> отправляет название задания (текст родителя) — исправление готовится в соседней работе.</li></ul>"}, {"html": "<h3>Сделано в коде — ждёт сборки</h3><p>Ветка <code>analytics-tracking-plan</code> (от redesign-parent-flow), ещё не закоммичено:</p><ul><li>Просмотры всех экранов (<code>$screen</code>) и метка <code>environment</code> на каждом событии.</li><li>Согласие родителя — первое событие.</li><li>Задания: создано, открыто, одобрено, возвращено — и через карточки Фоксика.</li><li>Награды: создана, попросили (в магазине и в чате), выдана, отказ/перенос.</li><li>Подписка: настоящий источник, способ оплаты, покупка, неудачная покупка, правильное premium_ai.</li><li>Неудачный вход ребёнка по коду; лимит Фоксика у родителя.</li><li>Тесты на каждое событие; план в репозитории: docs/analytics/TRACKING_PLAN.md.</li></ul>"}, {"html": "<h3>Нужно от владельцев</h3><ul><li><b>PostHog:</b> один проект и фильтр <code>environment = prod</code> (так и сделано) — или ключ отдельного DEV-проекта.</li><li><b>Mixpanel:</b> дать токен или отказаться (рекомендация — отказаться, всё есть в PostHog).</li><li><b>RevenueCat:</b> проверить, что включены интеграции с PostHog и Meta.</li><li><b>App Store Connect:</b> завести ссылки кампаний (provider token).</li><li><b>Продукт:</b> решить про вопрос «Откуда узнали».</li><li><b>Замороженная зона:</b> согласие на событие <code>pushOpened</code> в сервисе ссылок.</li></ul>"}, {"html": "<h3>Дальше</h3><ul><li><b>После слияния текущей работы над Фоксиком и приглашениями:</b> отправка приглашения, вход ребёнка по ссылке/QR, лимит Фоксика у ребёнка, источник подписки из Фоксика, сдача задания из чата.</li><li><b>P1:</b> пуши, PIN, режим ребёнка, лимит детей, выход и удаление, оценка, бонусы, голос у Фоксика, событие «Регистрация завершена» для Meta.</li><li><b>P2:</b> ссылки с UTM, Install Referrer, уровень с сервера, возвраты после перерыва, мелкие поправки старых событий.</li></ul>"}]}]};

function add(cls, x, y, w, h, html, parent) {
  const e = document.createElement('div'); e.className = cls;
  e.style.left = x + 'px'; e.style.top = y + 'px';
  if (w != null) e.style.width = w + 'px'; if (h != null) e.style.height = h + 'px';
  if (html != null) e.innerHTML = html;
  (parent || board).appendChild(e); return e;
}
function shotEl(parent, key, w, h, cls) {
  const c = CARDS[key];
  const e = document.createElement('div'); e.className = cls || 'shot';
  e.style.width = w + 'px'; e.style.height = h + 'px';
  e.title = c ? c.label : key;
  e.addEventListener('click', ev => { if (cam.moved) return; ev.stopPropagation(); openPic(key); });
  parent.appendChild(e);
  return e;
}
const head = id => board.querySelector(`[data-sec="${id}"]`);
// A panel: white backdrop + kicker + title + subtitle; returns the content top.
function panel(id, x, y, w, h, kicker, title, sub, color) {
  add('panel', x, y, w, h);
  const ph = add('ph', x + 40, y + 34, w - 80, null, `${kicker ? `<div class="k">${esc(kicker)}</div>` : ''}<div class="t">${esc(title)}</div>${sub ? `<div class="s">${sub}</div>` : ''}`);
  // Not an id: a #hash would make the browser scroll the clipped view to it.
  ph.dataset.sec = id;
  SECTIONS.push({ id, title, x, y, w, h, color: color || '#b9bcc4' });
  return ph;
}

// 2. How it works — boxes and arrows.
(() => {
  const A = PLAN.architecture;
  const top = Y;
  panel('how', X0, Y, PW, 1, 'Как устроено', A.title, A.sub);
  let y = Y + 190;
  const bw = 430, gap = 120;
  const pos = {};
  A.boxes.forEach(b => {
    const x = X0 + 60 + b.col * (bw + gap), yy = y + b.row * 230;
    const e = add('box ' + (b.kind || ''), x, yy, bw, null, `<span class="em">${b.icon || ''}</span><b>${esc(b.title)}</b>${esc(b.text)}${b.small ? `<small>${esc(b.small)}</small>` : ''}`);
    pos[b.id] = { x, y: yy, w: bw, el: e };
  });
  const maxRow = Math.max(...A.boxes.map(b => b.row));
  const h0 = y + (maxRow + 1) * 230 - Y + 20;
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'arrows'); svg.setAttribute('width', PW); svg.setAttribute('height', h0 + 400);
  svg.style.left = X0 + 'px'; svg.style.top = Y + 'px';
  board.appendChild(svg);
  const Y0 = Y;   // the panel's top: Y moves on before the arrows are drawn
  requestAnimationFrame(() => {
    let d = `<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker></defs>`;
    A.links.forEach(([a, b, label]) => {
      const p = pos[a], q = pos[b]; if (!p || !q) return;
      const ph = p.el.offsetHeight, qh = q.el.offsetHeight;
      let x1, y1, x2, y2;
      if (Math.abs(p.y - q.y) < 10) { x1 = p.x + p.w; y1 = p.y + ph / 2; x2 = q.x; y2 = q.y + qh / 2; if (q.x < p.x) { x1 = p.x; x2 = q.x + q.w; } }
      else if (q.y > p.y) { x1 = p.x + p.w / 2; y1 = p.y + ph; x2 = q.x + q.w / 2; y2 = q.y; }
      else { x1 = p.x + p.w / 2; y1 = p.y; x2 = q.x + q.w / 2; y2 = q.y + qh; }
      x1 -= X0; x2 -= X0; y1 -= Y0; y2 -= Y0;
      const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
      const path = Math.abs(y1 - y2) < 10 ? `M${x1 + 6},${y1} L${x2 - 8},${y2}` : `M${x1},${y1 + 6} C${x1},${my} ${x2},${my} ${x2},${y2 - 8}`;
      d += `<path d="${path}" fill="none" stroke="#16181d" stroke-width="3" marker-end="url(#ah)"/>`;
      if (label) d += `<g><rect x="${mx - label.length * 4.6 - 10}" y="${my - 16}" width="${label.length * 9.2 + 20}" height="30" rx="15" fill="#fff" stroke="#d5d6db"/><text x="${mx}" y="${my + 5}" text-anchor="middle" font-size="15" font-family="-apple-system, system-ui, sans-serif" fill="#3b3f46">${esc(label)}</text></g>`;
    });
    svg.innerHTML = d;
  });
  // Identity notes under the diagram.
  const id = add('card doc', X0 + 60, y + (maxRow + 1) * 230 + 10, PW - 120, null, A.identityHtml);
  const h = y + (maxRow + 1) * 230 + 10 + id.offsetHeight + 50 - top;

  document.querySelectorAll('.panel')[document.querySelectorAll('.panel').length - 1].style.height = h + 'px';

    (f.breakdowns || []).map(b => `<span class="pill">Разрез: ${esc(b)}</span>`).join('') +

      SHOTS.push({ el: s, key: st.card, x, y: sy + 60, w: STEP_W, h: sh, lod: -1 });
    } else {
      const s = document.createElement('div'); s.className = 'shot ext'; s.style.height = '300px'; s.style.width = STEP_W + 'px';
      s.textContent = st.extLabel || 'вне приложения'; e.appendChild(s);
    }
    const chips = document.createElement('div');
    chips.style.display = 'flex'; chips.style.flexWrap = 'wrap'; chips.style.gap = '6px';
    chips.innerHTML = st.external ? '' : st.event.startsWith('$') ? (st.screen ? ui.scrChip(st.screen) : `<span class="chip scr">${esc(st.event)}</span>`) : (EV[st.event] ? ui.chip(st.event) : `<span class="chip scr">${esc(st.event)}</span>`);
    (st.alt || []).forEach(a => chips.insertAdjacentHTML('beforeend', ui.chip(a)));
    e.appendChild(chips);
    if (st.filter) e.insertAdjacentHTML('beforeend', `<div class="flt">${st.filter}</div>`);
    STEP_EL.push(e);
    boxes.push({ x, y: sy, ln, e });
  });
  // Arrows between consecutive steps.
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'arrows');
  const lanesH = lanes.length * (laneH + 18);
  svg.setAttribute('width', w); svg.setAttribute('height', lanesH + 40);
  svg.style.left = X0 + 'px'; svg.style.top = y + 'px';
  let d = `<defs><marker id="ah-${f.id}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16181d"/></marker></defs>`;
  for (let i = 0; i + 1 < boxes.length; i++) {
    const a = boxes[i], b = boxes[i + 1];
    const ax = a.x + STEP_W + 8 - X0, bx = b.x - 10 - X0;
    const ay = a.y - y + 60 + 150, by = b.y - y + 60 + 150;
    const mx = (ax + bx) / 2;
    d += `<path d="M${ax},${ay} C${mx},${ay} ${mx},${by} ${bx},${by}" fill="none" stroke="#16181d" stroke-width="3" stroke-dasharray="${a.ln === b.ln ? '' : '9 7'}" marker-end="url(#ah-${f.id})"/>`;
  }
  svg.innerHTML = d;
  board.appendChild(svg);
  y += lanesH + 10;
  const note = add('fnote', X0 + 60, y, w - 140, null, f.note || '');
  const h = y + note.offsetHeight + 50 - top;
  document.querySelectorAll('.panel')[document.querySelectorAll('.panel').length - 1].style.height = h + 'px';
  SECTIONS[SECTIONS.length - 1].h = h; SECTIONS[SECTIONS.length - 1].w = w;
  SECTIONS[SECTIONS.length - 1].group = 'Воронки';
  Y = top + h + 70;
}
PLAN.funnels.forEach((f, i) => funnel(f, i + 1));

// 5. Docs block helper (retention, properties, dashboards, marketing, privacy, status).
function docSection(s) {
  const top = Y;
  panel(s.id, X0, Y, PW, 1, s.kicker, s.title, s.sub);
  let y = Y + 34 + head(s.id).offsetHeight + 30;
  const cols = s.cols || 2, cw = (PW - 120 - (cols - 1) * 26) / cols;
  const colY = Array(cols).fill(y);
  s.cards.forEach(c => {
    let i = colY.indexOf(Math.min(...colY));
    if (c.full) { const m = Math.max(...colY); colY.fill(m); i = 0; }
    const x = X0 + 60 + i * (cw + 26), width = c.full ? PW - 120 : cw;
    const e = add('card doc', x, colY[i], width, null, c.html);
    if (c.full) colY.fill(colY[0] + e.offsetHeight + 24); else colY[i] += e.offsetHeight + 24;
  });
  const h = Math.max(...colY) + 26 - top;
  document.querySelectorAll('.panel')[document.querySelectorAll('.panel').length - 1].style.height = h + 'px';
  SECTIONS[SECTIONS.length - 1].h = h;
  Y = top + h + 80;
}

// 6. Event dictionary by domain.
function dictionary() {
  const top = Y;
  const doms = PLAN.domains;
  const cw = 380, gap = 26;
  const w = Math.max(PW, 120 + doms.length * (cw + gap));
  panel('events', X0, Y, w, 1, 'Словарь', PLAN.dictionary.title, PLAN.dictionary.sub);
  let y0 = Y + 34 + head('events').offsetHeight + 30;
  let maxY = y0;
  doms.forEach((d, i) => {
    const x = X0 + 60 + i * (cw + gap);
    const list = PLAN.events.filter(e => e.domain === d.id);
    add('col-h', x, y0, cw, null, `${esc(d.title)}<small>${list.length} событий</small>`);
    let y = y0 + 64;
    list.forEach(e => {
      const el = add('card ev', x, y, cw, null,
        `<div class="nm">${esc(e.name)}</div><div class="ti">${esc(e.title)}</div><div class="wh">${esc(e.when)}</div>
         <div class="tg"><span class="pill ${e.status}">${STATUS[e.status]}</span><span class="pill ${e.side}">${SIDE[e.side]}</span>${e.prio ? `<span class="pill">${esc(e.prio)}</span>` : ''}</div>`);
      el.onclick = () => { if (!cam.moved) ui.openEvent(e.name); };
      el.dataset.ev = (e.name + ' ' + e.title + ' ' + (e.props || []).map(p => p.n).join(' ')).toLowerCase();
      EV_EL.push(el);
      y += el.offsetHeight + 14;
    });
    maxY = Math.max(maxY, y);
  });
  const h = maxY + 30 - top;
  document.querySelectorAll('.panel')[document.querySelectorAll('.panel').length - 1].style.height = h + 'px';
  SECTIONS[SECTIONS.length - 1].h = h; SECTIONS[SECTIONS.length - 1].w = w;
  Y = top + h + 80;
}

// 7. Screens — every screen view and what it sends.
function screens() {
  const top = Y;
  panel('screens', X0, Y, PW, 1, 'Экраны', PLAN.screensSection.title, PLAN.screensSection.sub);
  let y = Y + 34 + head('screens').offsetHeight + 30;
  const per = Math.floor((PW - 120 + 26) / (230 + 26));
  for (const side of ['common', 'parent', 'child']) {
    const list = PLAN.screens.filter(s => (s.group || s.side) === side);
    if (!list.length) continue;
    add('col-h', X0 + 60, y, 900, null, `${side === 'parent' ? 'Родитель' : side === 'child' ? 'Ребёнок' : 'Первый запуск'}<small>${list.length} экранов</small>`);
    y += 64;
    list.forEach((s, i) => {
      const x = X0 + 60 + (i % per) * (230 + 26), yy = y + Math.floor(i / per) * 540;
      const e = add('stile', x, yy, 230, null);
      e.dataset.ev = (s.id + ' ' + s.title + ' ' + (s.events || []).join(' ')).toLowerCase();
      const k = (s.cards || [])[0];
      if (k && CARDS[k]) { const sh = shotEl(e, k, 230, 400); SHOTS.push({ el: sh, key: k, x, y: yy, w: 230, h: 400, lod: -1 }); sh.onclick = ev => { if (!cam.moved) { ev.stopPropagation(); ui.openScreen(s.id); } }; }
      else { const ph = document.createElement('div'); ph.className = 'shot'; ph.style.cssText = 'display:flex;align-items:center;justify-content:center;color:#6b7078;font-size:14px;padding:16px;text-align:center'; ph.textContent = 'кадра нет'; ph.onclick = () => ui.openScreen(s.id); e.appendChild(ph); }
      e.insertAdjacentHTML('beforeend', `<div class="nm">${esc(s.id)}</div><div class="ti">${esc(s.title)}</div><div class="cnt">${(s.events || []).length ? (s.events || []).length + ' событ.' : 'только просмотр'}${s.route ? ' · ' + esc(s.route) : ''}</div>`);
      SCR_EL.push(e);
    });
    y += Math.ceil(list.length / per) * 540 + 20;
  }
  const h = y + 10 - top;
  document.querySelectorAll('.panel')[document.querySelectorAll('.panel').length - 1].style.height = h + 'px';
  SECTIONS[SECTIONS.length - 1].h = h;
  Y = top + h + 80;
}

PLAN.docsBefore.forEach(docSection);
dictionary();
screens();
PLAN.docsAfter.forEach(docSection);
let maxW = Math.max(...SECTIONS.map(s => s.x + s.w));
board.style.width = maxW + 'px'; board.style.height = Y + 'px';

// ── Camera, pictures by zoom, minimap, sidebar ──────────────────────────
const lbx = document.getElementById('lbx');
const cam = OynaCanvas.createCanvas({
  view, board, zMax: 3,
  keysBlocked: () => ui.isOpen() || lbx.classList.contains('on'),
  ignoreDblClick: e => !!e.target.closest('.card, .chip, .shot, .ev, .step'),
});
function openPic(key) { const c = CARDS[key]; document.getElementById('lbxT').textContent = c ? c.label : key; document.getElementById('lbxI').src = `../img/${key}.webp`; lbx.classList.add('on'); }
document.getElementById('lbxX').onclick = () => lbx.classList.remove('on');
lbx.addEventListener('click', e => { if (e.target === lbx) lbx.classList.remove('on'); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') lbx.classList.remove('on'); });
board.addEventListener('click', e => { const chip = e.target.closest('[data-ev].chip, [data-scr].chip'); if (chip && !cam.moved) { e.stopPropagation(); ui.openFromChip(chip); } });

function want(rec, lod) {
  if (lod === rec.lod) return;
  if (lod <= 0) { rec.el.style.backgroundImage = ''; rec.el.querySelector('img')?.remove(); rec.lod = lod; return; }
  if (rec.lod < 1) rec.el.style.backgroundImage = `url(../img/${rec.key}_s.webp)`;
  rec.lod = lod;
  if (lod === 1) { rec.el.querySelector('img')?.remove(); return; }
  const src = `../img/${rec.key}${lod === 3 ? '' : '_t'}.webp`;
  const img = new Image(); img.decoding = 'async'; img.alt = '';
  img.onload = () => { if (rec.lod !== lod) return; rec.el.querySelector('img')?.remove(); rec.el.appendChild(img); };
  img.src = src;
}
// Far out, each section title grows to stay readable (≈16 px on screen) but
// never past three quarters of its own section, so titles don't overlap.
function farLabels(s) {
  const far = s.z < 0.28;
  for (const sec of SECTIONS) {
    const t = sec.labelEl || (sec.labelEl = head(sec.id)?.querySelector('.t'));
    if (!t) continue;
    if (!far) { t.style.transform = ''; continue; }
    const px = Math.min(17, 0.7 * sec.h * s.z), k = Math.max(1, px / (38 * s.z));
    t.style.transform = `scale(${k.toFixed(3)})`;
  }
}
let lastLod = 0;
function updateLod(s, force) {
  const now = performance.now(); if (!force && now - lastLod < 110) return; lastLod = now;
  const lod = s.z < 0.12 ? 0 : s.z < 0.36 ? 1 : s.z < 1.25 ? 2 : 3;
  board.classList.toggle('lod0', lod === 0);
  board.classList.toggle('far', s.z < 0.28);
  farLabels(s);
  const mw = (s.right - s.left) * 0.5, mh = (s.bottom - s.top) * 0.6;
  for (const r of SHOTS) {
    const near = r.x < s.right + mw && r.x + r.w > s.left - mw && r.y < s.bottom + mh && r.y + r.h > s.top - mh;
    if (near) want(r, lod); else if (r.lod >= 2) want(r, 1);
  }
  document.getElementById('zoomv').textContent = Math.round(s.z * 100) + '%';
}
cam.on('change', s => updateLod(s, false));
cam.on('settle', s => { updateLod(s, true); spy(s); });
cam.minimap(document.getElementById('map'),
  SECTIONS.map(s => ({ x: s.x, y: s.y, w: s.w, h: s.h, color: s.color })),
  SECTIONS.map(s => ({ x: s.x, y: s.y, h: s.h, title: s.title, onClick: () => goSec(s.id) })));
function goSec(id) {
  const s = SECTIONS.find(x => x.id === id); if (!s) return;
  cam.goTo(s.x, s.y, Math.max(cam.z, 0.42));
  document.body.classList.remove('side-open');
}
function spy(s) {
  const cy = (s.top + s.bottom) / 2; let cur = null;
  for (const sec of SECTIONS) if (sec.y <= cy) cur = sec;
  document.querySelectorAll('#side a[data-id]').forEach(a => a.classList.toggle('on', !!cur && a.dataset.id === cur.id));
}
const side = document.getElementById('side');
(() => {
  let h = `<div class="sbox"><b>Как читать</b>
    <div class="lg"><span class="dot" style="background:#4cd38a"></span>уже отправляется</div>
    <div class="lg"><span class="dot" style="background:#2dd4bf"></span>готово в коде, ждёт сборки</div>
    <div class="lg"><span class="dot" style="background:#ffb547"></span>есть, нужно поправить</div>
    <div class="lg"><span class="dot" style="background:#7aa7ff"></span>добавляем в приложение</div>
    <div class="lg"><span class="dot" style="background:#c69cff"></span>приходит с сервера</div>
    <div style="margin-top:6px">Клик по событию — что это, когда, свойства, где в приложении. <a href="../?an=1">События прямо на экранах →</a></div></div>
    <div class="dl"><button class="btn" id="dlCsv" title="Таблица событий для Excel/Google Sheets">⬇ CSV</button><button class="btn" id="dlJson" title="Весь план в JSON">⬇ JSON</button></div>
    <div id="hits"></div>`;
  const groups = [['Обзор', SECTIONS.filter(s => !s.group && ['top-hero', 'how', 'metrics'].includes(s.id))],
    ['Воронки', SECTIONS.filter(s => s.group === 'Воронки')],
    ['Справочник', SECTIONS.filter(s => !s.group && !['top-hero', 'how', 'metrics'].includes(s.id))]];
  for (const [title, list] of groups) {
    h += `<h2>${title}</h2>`;
    list.forEach(s => { h += `<a href="#${s.id}" data-id="${s.id}"><span>${esc(s.title)}</span></a>`; });
  }
  side.innerHTML = h;
  side.querySelectorAll('a[data-id]').forEach(a => a.onclick = e => { e.preventDefault(); goSec(a.dataset.id); });
  const dl = (name, type, text) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  document.getElementById('dlCsv').onclick = () => dl('oyna-tracking-plan.csv', 'text/csv;charset=utf-8',
    '﻿' + ['event,title,domain,side,status,priority,when,properties,screens,funnels,code,fix'].concat(PLAN.events.map(e => [e.name, e.title, e.domainTitle, SIDE[e.side], STATUS[e.status], e.prio || '', e.when,
      (e.props || []).map(p => `${p.n}: ${p.t || ''} — ${p.d}`).join('; '), PLAN.screens.filter(s => (s.events || []).includes(e.name)).map(s => s.id).join(' '),
      PLAN.funnels.filter(f => f.steps.some(st => st.event === e.name || (st.alt || []).includes(e.name))).map(f => f.title).join('; '), e.code || '', e.fix || ''].map(q).join(','))).join('\n'));
  document.getElementById('dlJson').onclick = () => dl('oyna-tracking-plan.json', 'application/json', JSON.stringify(PLAN, null, 2));
})();
document.getElementById('q').oninput = e => {
  const v = e.target.value.trim().toLowerCase();
  for (const el of [...EV_EL, ...STEP_EL, ...SCR_EL]) el.classList.toggle('dim', !!v && !el.dataset.ev.includes(v));
  const hits = v ? PLAN.events.filter(x => (x.name + ' ' + x.title).toLowerCase().includes(v)).slice(0, 12) : [];
  const box = document.getElementById('hits');
  box.innerHTML = hits.map(x => `<a href="#" data-n="${esc(x.name)}">${esc(x.name)} <span>${esc(x.title)}</span></a>`).join('');
  box.querySelectorAll('a').forEach(a => a.onclick = ev => { ev.preventDefault(); ui.openEvent(a.dataset.n); });
};
document.getElementById('q').addEventListener('keydown', e => { if (e.key === 'Enter') { const a = document.querySelector('#hits a'); if (a) a.click(); } });
document.getElementById('zIn').onclick = () => cam.zoomBy(1.4);
document.getElementById('zOut').onclick = () => cam.zoomBy(1 / 1.4);
document.getElementById('zoomv').onclick = () => cam.zoomTo(1);
document.getElementById('fit').onclick = () => cam.fit(360);
document.getElementById('menu').onclick = () => document.body.classList.toggle('side-open');
if (localStorage.getItem('cv-nohelp')) document.body.classList.add('nohelp');
const hideHelp = () => { document.body.classList.add('nohelp'); localStorage.setItem('cv-nohelp', '1'); };
document.getElementById('helpX').onclick = hideHelp;
document.getElementById('helpB').onclick = () => { document.body.classList.toggle('nohelp'); if (document.body.classList.contains('nohelp')) localStorage.setItem('cv-nohelp', '1'); else localStorage.removeItem('cv-nohelp'); };
let helpTimer = 0;
cam.on('settle', () => { if (!helpTimer && !document.body.classList.contains('nohelp')) helpTimer = setTimeout(hideHelp, 12000); });

cam.measure();
const start = location.hash.slice(1);
if (!cam.restoreHash()) {
  if (SECTIONS.find(s => s.id === start)) goSec(start);
  else cam.flyTo(0, 0, Math.min(0.62, (view.clientWidth - 60) / PW * 1.6), 30, 24);
}
const evParam = new URLSearchParams(location.search).get('event');
if (evParam) ui.openEvent(evParam);
updateLod(cam.state(), true); spy(cam.state());
</script>
</body>
