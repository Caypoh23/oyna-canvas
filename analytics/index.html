<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OYNA — аналитика: события, воронки, метрики</title>
<style>
  :root {
    --bg: #eeeef1; --ink: #16181d; --muted: #5f646d; --line: #dcdde2; --card: #fff;
    --parent: #ff8a1f; --parent-bg: #fff4e8; --parent-ink: #a35200; --child: #19a3c4; --child-bg: #e6f7fb; --child-ink: #0d6a82;
    --store: #7b61ff; --store-bg: #f1edff; --store-ink: #5a3fd6; --sys: #8a8f99; --sys-bg: #f1f1f4;
    --top: 56px; --side: 248px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(var(--top) + 14px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  a { color: #2f6fde; }
  code, .mono { font: 14px/1.45 ui-monospace, "SF Mono", Menlo, monospace; background: #f1f1f4; border-radius: 6px; padding: 1px 6px; word-break: break-word; }
  #top { position: sticky; top: 0; z-index: 30; height: var(--top); background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .tabs { display: flex; gap: 2px; background: #f1f1f4; border-radius: 10px; padding: 3px; flex: none; }
  .tabs a { text-decoration: none; color: var(--ink); font-size: 13.5px; padding: 6px 11px; border-radius: 8px; white-space: nowrap; }
  .tabs a.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .grow { flex: 1; min-width: 8px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; height: 34px; min-width: 34px; padding: 0 11px; cursor: pointer;
    font: inherit; font-size: 13.5px; color: var(--ink); white-space: nowrap; flex: none; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .btn:hover { background: #f4f4f6; }
  #menu { display: none; }
  #q { height: 34px; border: 1px solid var(--line); border-radius: 9px; padding: 0 11px; width: 300px; font: inherit; font-size: 14px; min-width: 0; }
  #wrap { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); }
  #side { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow: auto; background: #fff; border-right: 1px solid var(--line);
    padding: 10px 0 48px; overscroll-behavior: contain; }
  #side h2 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 16px 6px; }

  #side .sbox { margin: 8px 12px 4px; padding: 11px 12px; border-radius: 12px; background: #f6f6f8; font-size: 13px; }

  #hits { margin: 6px 12px 0; }

  #hits a { display: block; padding: 5px 6px; border-radius: 8px; text-decoration: none; color: var(--ink); font: 600 13px/1.3 ui-monospace, "SF Mono", Menlo, monospace; }
  #hits a:hover { background: #f1f1f4; }
  #hits a span { display: block; font: 400 12.5px -apple-system, system-ui, sans-serif; color: var(--muted); }
  main { padding: 26px clamp(14px, 3.2vw, 44px) 140px; min-width: 0; }
  .col { max-width: 1180px; margin: 0 auto; }
  section { background: #fff; border-radius: 24px; padding: 28px clamp(16px, 3vw, 36px) 30px; margin: 0 0 26px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .k { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; }
  h1 { font-size: clamp(34px, 5vw, 52px); line-height: 1.08; margin: 6px 0 10px; letter-spacing: -.02em; }
  h2 { font-size: clamp(25px, 3vw, 32px); line-height: 1.15; margin: 4px 0 8px; letter-spacing: -.01em; }
  h3 { font-size: 20px; margin: 22px 0 10px; }

  .lead { font-size: 18.5px; color: #2b2f36; max-width: 900px; margin: 0 0 18px; }
  .ver { font-size: 14px; color: var(--muted); }
  .grid { display: grid; gap: 16px; }

  .term { border-bottom: 1px dashed #9ea4ae; cursor: help; }
  /* Today strip */

  .today b.big { font-size: 20px; display: block; margin-bottom: 10px; }

  .sw-ready { background: #8a8f99; } .sw-new { background: #4a4f57; } .sw-server { background: #a07be8; }

  .feed .row:first-child { border-top: 0; }

  .sample { margin-top: 12px; background: #16181d; color: #e8eaf0; border-radius: 14px; padding: 14px 16px; }
  .sample .sn { font: 700 16px/1.2 ui-monospace, "SF Mono", Menlo, monospace; margin-bottom: 8px; color: #fff; }
  .sample .kv { font: 14px/1.7 ui-monospace, "SF Mono", Menlo, monospace; }
  .sample .kv code { background: none; color: #9ec5ff; padding: 0; }
  .sample .kv span { font: 13px -apple-system, system-ui, sans-serif; color: #9ea4ae; margin-left: 8px; }
  .bars .bar { margin: 8px 0; }
  .bars .bl { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .bars .bt { display: flex; align-items: center; gap: 8px; }
  .bars .bt i { display: block; height: 22px; background: #2f6fde; border-radius: 6px; }
  .bars .drop { font-size: 13px; color: #b3261e; margin-top: 2px; }

  .where div { margin: 10px 0; } .where b { display: block; font-size: 15px; } .where span { font-size: 14.5px; color: #4a4f57; }
  /* Glossary */

  .who { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 99px; margin: 4px 0; }

  .who.store { background: var(--store-bg); color: var(--store-ink); } .who.system, .who.both { background: var(--sys-bg); color: #4a4f57; }
  .sstep .txt { font-size: 14.5px; line-height: 1.35; font-weight: 600; min-height: 3.9em; overflow-wrap: break-word; hyphens: auto; }

  .iflow, .fnote { overflow-wrap: anywhere; }

  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .shot.ext { cursor: default; display: flex; align-items: center; justify-content: center; text-align: center; padding: 14px; font-size: 14px; font-weight: 650; color: #3b3f46;
    background: repeating-linear-gradient(-45deg, #f5f5f8, #f5f5f8 12px, #ececf1 12px, #ececf1 24px); box-shadow: none; }
  .sstep .phl { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .sstep .sp { font: 12.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: #3b3f46; margin-top: 4px; word-break: break-word; }
  .after { font-size: 16.5px; margin: 20px 0 0; color: #2b2f36; }
  /* Metrics */

  .nsm .d { font-size: 16px; color: #d5d8de; margin-top: 8px; }
  .nsm .d b { color: #fff; }
  .nsm .now { margin-top: 14px; background: #2b2e35; border-radius: 12px; padding: 10px 12px; font-size: 15px; }
  .nsm .rec { margin-top: 10px; font-size: 14.5px; color: #c9ccd2; }
  .nsm code { background: #2b2e35; color: #e8eaf0; }
  .defs { margin: 16px 0 6px; font-size: 15px; } .defs div { margin: 4px 0; }
  .pillars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
  .pillar h3 { margin: 0 0 2px; font-size: 18px; } .pillar small { display: block; color: var(--muted); font-size: 13.5px; margin-bottom: 8px; }

  .met .fm { font-size: 14px; color: #3b3f46; margin-top: 4px; }

  .met .src .chip { font-size: 11.5px; padding: 4px 7px; }
  .met .src .ext { font-size: 12.5px; color: var(--muted); }
  .met a.go { display: inline-block; margin-top: 6px; font-size: 13.5px; font-weight: 600; text-decoration: none; }
  /* Funnels */

  .ready { border-radius: 14px; padding: 12px 14px; font-size: 15.5px; margin: 0 0 14px; }

  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }

  .steps { display: flex; align-items: stretch; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; }
  .step { flex: 1 1 0; min-width: 132px; max-width: 220px; background: #fff; border: 1px solid #e3e3e8; border-radius: 18px; padding: 10px 10px 12px;
    border-top: 6px solid var(--sys); scroll-snap-align: start; display: flex; flex-direction: column; }
  .step.parent { border-top-color: var(--parent); } .step.child { border-top-color: var(--child); } .step.store { border-top-color: var(--store); }
  .step .sh { display: flex; align-items: center; gap: 6px; }
  .step .no { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: #16181d; color: #fff; font-weight: 750; font-size: 13.5px; align-items: center; justify-content: center; flex: none; }
  .step .lbl { font-size: 15px; font-weight: 700; line-height: 1.3; margin-top: 8px; min-height: 3.9em; }
  .step .inph { font-size: 12.5px; color: var(--muted); margin: 0 0 4px; }
  .step .chips { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .step .chips .or { font-size: 12px; color: var(--muted); }
  .step .whr { font-size: 13px; margin-top: 6px; }
  .step .hint { font-size: 13px; color: #4a4f57; margin-top: 4px; line-height: 1.35; }
  .step .capture-note { font-size: 11px; color: #5f646d; margin: 4px 0; }
  .measure { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }

  .measure b { display: block; margin-bottom: 3px; }
  .catalog a { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
  .catalog a b, .catalog a small { display: block; }
  .catalog a small { color: var(--muted); line-height: 1.45; margin-top: 3px; }
  :focus-visible { outline: 3px solid #2f6fde; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }
  .step .chip, .sstep .chip { white-space: normal; overflow-wrap: anywhere; font-size: 12px; text-align: left; }
  .legend .chip { flex: none; }
  .conn { flex: 0 0 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #16181d; font-size: 22px; font-weight: 700; }
  .conn small { font-size: 10.5px; color: var(--muted); font-weight: 600; text-align: center; line-height: 1.15; margin-top: 2px; }
  .conn.other { color: #8a8f99; }
  .fnote { font-size: 15.5px; color: #2b2f36; margin: 6px 0 12px; }
  .iflow { background: #f1f5ff; border: 1px solid #cfdcff; border-radius: 14px; padding: 12px 15px; font-size: 15.5px; margin: 0 0 12px; }
  .iflow b { display: block; margin-bottom: 2px; }
  details.recipe { background: #f7f7f9; border-radius: 14px; padding: 12px 15px; font-size: 15px; }
  details.recipe summary { cursor: pointer; font-weight: 700; }

  details.recipe .muted { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .legend { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); font-size: 15px; }
  .legend div { display: flex; gap: 10px; align-items: flex-start; }
  /* Docs */
  .doc { background: #f7f7f9; border-radius: 18px; padding: 18px 20px; font-size: 15.5px; overflow: hidden; }
  .doc.full { grid-column: 1 / -1; }
  .doc h3 { margin: 0 0 8px; } .doc h4 { font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }

  .doc table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .doc th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid #e3e3e8; }
  .doc td { padding: 7px 10px 7px 0; border-bottom: 1px solid #ececf0; vertical-align: top; }

  .tw { overflow-x: auto; }

  /* Lightbox */

  'use strict';

  const CSS = `

  .pd-now.st-new { background: #f4f4f6; } .pd-now.st-server { background: #f2e9ff; }

  .pd .props td .ty { color: #6b7078; font-size: 12.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  `;

  const SIDE = { parent: 'родитель', child: 'ребёнок', both: 'родитель и ребёнок', system: 'присылает PostHog', store: 'магазин приложений' };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // An event or screen name that may wrap only between its words:
  // quest|Approved, parent_|child_|invite.
  const breakable = name => esc(name).replace(/([a-z])(?=[A-Z])|_/g, m => m + '<wbr>');
  const show = v => String(v);   // true / false as PostHog stores them
  // A sample value for a property from its documented values, when the plan
  // gives none: the first allowed value, a number, true, an id. Unknown —
  // no row rather than a made-up one.
  const IDS = { quest_id: '5b1e…', child_id: '8f2c…', reward_id: 'c47a…', family_id: '71d0…', user_id: '3fa9…' };
  const guess = (t, name) => {
    t = String(t || '');
    if (t.includes('|')) return t.split('|')[0].trim();
    if (/true \/ false/.test(t)) return true;
    if (/числ|1–5/.test(t)) return 42;
    if (/uuid/.test(t)) return IDS[name] || '9d3b…';
    return undefined;
  };

  function create(plan, opts) {
    opts = opts || {};
    const imgBase = opts.imgBase || 'img/';
    const canvasBase = opts.canvasBase || './';
    const analyticsBase = opts.analyticsBase || 'analytics/';
    const STATUS = plan.statuses || {};
    const evByName = {}, scrById = {};
    (plan.events || []).forEach(e => {
      evByName[e.name] = e;
      for (const alias of [...(e.legacy_names || []), e.previous_name].filter(Boolean)) evByName[alias] = e;
    });
    (plan.screens || []).forEach(s => { scrById[s.id] = s; });
    const domains = {};
    (plan.domains || []).forEach(d => { domains[d.id] = d; });
    const funnelsOf = name => (plan.funnels || []).filter(f => f.steps.some(st => st.event === name || (st.alt || []).includes(name)));
    const screensOf = name => (plan.screens || []).filter(s => (s.events || []).includes(name));
    const st = name => STATUS[name] || { icon: '?', label: name, text: '' };
    // Who sends it, in words: RevenueCat's server events are no one's phone.
    const whoOf = e => e.source === 'revenuecat' ? 'служебное · RevenueCat' : e.source === 'posthog' ? 'служебное · PostHog' : SIDE[e.side] || e.side;

    if (!document.getElementById('pd-style')) {
      const style = document.createElement('style'); style.id = 'pd-style'; style.textContent = CSS; document.head.appendChild(style);
    }
    const scrim = document.createElement('div'); scrim.className = 'pd-scrim';
    const pd = document.createElement('aside'); pd.className = 'pd'; pd.setAttribute('aria-hidden', 'true');
    pd.setAttribute('role', 'dialog'); pd.setAttribute('aria-modal', 'true'); pd.setAttribute('aria-label', 'Описание события или экрана');
    pd.innerHTML = '<div class="pd-h"><div class="pd-hd"></div><button class="x" title="Закрыть (Esc)" aria-label="Закрыть описание">✕</button></div><div class="pd-b"></div>';
    document.body.append(scrim, pd);
    const hd = pd.querySelector('.pd-hd'), body = pd.querySelector('.pd-b');
    let returnFocus;
    const close = () => { pd.classList.remove('on'); scrim.classList.remove('on'); pd.setAttribute('aria-hidden', 'true'); if (returnFocus?.isConnected) returnFocus.focus({ preventScroll: true }); };
    pd.querySelector('.x').onclick = close; scrim.onclick = close;
    // Capture: one Esc closes the panel and nothing behind it.
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && pd.classList.contains('on')) { e.stopImmediatePropagation(); e.preventDefault(); close(); }
      if (e.key === 'Tab' && pd.classList.contains('on')) {
        const focusable = [...pd.querySelectorAll('button, a[href], [tabindex="0"]')].filter(el => el.getClientRects().length);
        const first = focusable[0], last = focusable.at(-1);
        if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last?.focus(); }
        else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first?.focus(); }
      }
    }, true);
    body.addEventListener('click', e => {
      const go = e.target.closest('[data-go]');
      if (go && opts.onGo) { e.preventDefault(); close(); opts.onGo(go.dataset.go); return; }
      const chip = e.target.closest('[data-ev],[data-scr]');
      if (chip) { e.preventDefault(); openFromChip(chip); }
    });

    function statusLabel(name) { const s = st(name); return `${s.icon} ${s.label}`; }
    // The status in words; [short] for tight spots (a funnel step, a story card).
    function statusWord(name, short) {
      const e = evByName[name];
      if (!e) return '';
      const s = st(e.status);
      return `<span class="stw st-${e.status}" title="${esc(s.label)}">${esc(s.icon)} ${esc(short && s.short ? s.short : s.label)}</span>`;
    }
    function chip(name) {
      const e = evByName[name];
      const status = e ? e.status : 'new';
      name = e ? e.name : name;
      return `<span class="chip st-${status}" data-ev="${esc(name)}" role="button" tabindex="0" title="${esc((e ? e.title + ' — ' : '') + statusLabel(status))}"><i class="si">${esc(st(status).icon)}</i><span>${breakable(name)}</span></span>`;
    }
    function scrChip(id) {
      const s = scrById[id];
      const icon = s && s.sheet ? '▤' : s && s.untracked ? '○' : '👁';
      const what = s && s.sheet ? 'Лист поверх экрана — без просмотра' : s && s.untracked ? 'Не приходит (до согласия)' : 'Просмотр экрана: $screen';
      return `<span class="chip scr" data-scr="${esc(id)}" role="button" tabindex="0" title="${esc(what)}: ${esc(s ? s.title : id)}">${icon} <span>${breakable(id)}</span></span>`;
    }
    function chipsHtml(screens, events) {
      return (screens || []).map(scrChip).join('') + (events || []).map(chip).join('');
    }
    function legendHtml() {
      return `<div class="stlegend">${Object.entries(STATUS).map(([k, s]) =>
        `<div><span class="chip st-${k}" style="cursor:default"><i class="si">${esc(s.icon)}</i>event</span><span>${esc(s.label)}</span></div>`).join('')}</div>`;
    }
    function shots(keys) {
      return `<div class="shots">` + keys.slice(0, 8).map(k =>
        `<a class="shot" href="${canvasBase}?an=1#${esc(k.replace(/-(figma|app|motion|device)-\d+$/, ''))}" title="Открыть на холсте «Экраны»"><img loading="lazy" src="${imgBase}${esc(k)}_t.webp" alt=""></a>`).join('') +
        `</div><div class="shotcap">Клик по картинке — этот раздел на холсте «Экраны» ↗</div>`;
    }
    function present() { if (!pd.classList.contains('on')) returnFocus = document.activeElement; pd.classList.add('on'); scrim.classList.add('on'); pd.setAttribute('aria-hidden', 'false'); body.scrollTop = 0; pd.querySelector('.x').focus({ preventScroll: true }); }

    // One line as PostHog lists it, with example values: the event's own
    // properties, then (grey) the ones every event of the app carries.
    function sampleRow(e) {
      const ex = e.example || {}, rows = [];
      (e.props || []).forEach(p => String(p.n).split(/,\s*|\s+\/\s+/).forEach(n => {
        n = n.trim();
        if (!/^[$a-z_][a-z0-9_]*$/i.test(n) || rows.some(r => r[0] === n)) return;
        const v = n in ex ? ex[n] : guess(p.t, n);
        if (v !== undefined) rows.push([n, v]);
      }));
      Object.keys(ex).forEach(k => { if (!rows.some(r => r[0] === k)) rows.push([k, ex[k]]); });
      const own = new Set(rows.map(r => r[0]));
      let who, common = [];
      if (e.status === 'server') who = 'присылает сервер RevenueCat · покупатель — семья 71d0…';
      else if (e.side === 'system') {
        who = 'присылает сам PostHog · родитель 3fa9…';
        common = [['$app_version', '1.0.8']];
      } else {
        who = e.side === 'child' ? 'ребёнок child_8f2c…' : 'родитель 3fa9…';
        const where = (screensOf(e.name)[0] || {}).id || 'parent_home';
        common = [['$app_namespace', 'com.oynaplatform.app'], ['environment', 'prod'], ['role', e.side === 'child' ? 'child' : 'parent'],
          ['tier', 'free'], ['country', 'UZ'], ['language', 'ru'], ['coppa_strict', e.side === 'child'], ['$screen_name', where]];
      }
      common = common.filter(([k]) => !own.has(k));
      return `<div class="pd-sample"><div class="h"><span class="ex">ПРИМЕР</span><b>${esc(e.name)}</b><span>День 2, 18:34 · ${who}</span></div>
        <table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(show(v))}</td></tr>`).join('')}
        ${common.map(([k, v]) => `<tr class="common"><td>${esc(k)}</td><td>${esc(show(v))}</td></tr>`).join('')}</table>
        <div class="note">Значения выдуманы, это не запись из PostHog. ${common.length ? 'Серые строки показывают ожидаемый контекст; наличие каждого поля нужно проверить на конкретной сборке. coppa_strict — технический режим приватности, а не способ определить возраст или роль. ' : ''}Да и нет хранятся как true и false.</div></div>`;
    }

    function openEvent(name) {
      const e = evByName[name];
      if (!e) return;
      name = e.name;
      const s = st(e.status);
      const dom = domains[e.domain];
      hd.innerHTML = `<div class="pd-pills"><span class="pd-pill ${esc(e.side)}">${esc(whoOf(e))}</span>${dom ? `<span class="pd-pill">${esc(dom.title)}</span>` : ''}${e.prio ? `<span class="pd-pill" title="Очередь работ: P0 — нужно для главных воронок, P1 — следующий шаг, P2 — потом">${esc(e.prio)}</span>` : ''}</div>
        <div class="pd-big">${esc(e.title)}</div><div class="pd-nameline">${e.source === 'oyna' ? 'единое имя OYNA (snake_case)' : 'служебное имя интеграции'}: <span class="pd-name">${breakable(e.name)}</span></div>`;
      const find = e.name === '$screen' ? 'Activity → Live events → событие «$screen», свойство $screen_name — имя экрана.'
        : e.status === 'server' ? 'Activity → Live events → поиск «rc_» (если интеграция RevenueCat включена).'
        : `Activity → Live events → поиск «${esc((e.current_names || [])[0] || e.name)}».`;
      let h = `<div class="pd-now st-${esc(e.status)}"><b>Состояние реализации: ${esc(s.icon)} ${esc(s.label)}</b>${esc(s.text)} Получение события в рабочем PostHog не проверено.</div>`;
      if (e.name === 'analytics_consent_enabled') h += '<h4>Простыми словами</h4><p>В приложении включился разрешающий флаг для аналитики. Новое имя analytics_consent_enabled описывает именно этот технический факт. В старом имени COPPA — сокращение названия американского закона о защите детских данных: <a href="https://www.ftc.gov/legal-library/browse/statutes/childrens-online-privacy-protection-act" target="_blank" rel="noopener noreferrer">Children’s Online Privacy Protection Act</a>. Событие фиксирует технический флаг; само по себе оно не доказывает юридическую достаточность согласия.</p>';
      if (e.source === 'oyna') {
        const history = e.legacy_names || [];
        h += `<div class="pd-now st-ready"><b>${history.length ? 'Новое имя — после выпуска приложения' : 'Единый формат: snake_case'}</b>${history.length
          ? `Прежние имена из кода или плана: <code>${history.map(breakable).join(', ')}</code>. Наличие в списке не доказывает, что они выпускались или получались. Новое имя: <code>${breakable(e.name)}</code>. Для истории объединяйте подтверждённые варианты в одну Action: ${(e.report_names || []).map(n => `<code>${breakable(n)}</code>`).join(' ИЛИ ')}. Приложение отправляет только одно новое имя.`

lytics_only"}, {"name": "paywall_dismissed", "previous_name": "paywallDismissed", "legacy_names": ["paywallDismissed"], "title": "Закрыл подписку без покупки", "domain": "money", "side": "parent", "status": "improved", "when": "Закрыл экран подписки, ничего не купив. После покупки на этом экране не приходит.", "props": [], "production_verified": false, "source": "oyna", "report_names": ["paywall_dismissed", "paywallDismissed"], "current_names": ["paywallDismissed"], "code_scope": "implemented_in_parent_source"}, {"name": "rc_initial_purchase_event", "title": "RevenueCat: первая покупка", "domain": "money", "side": "system", "status": "server", "prio": "P1", "when": "RevenueCat сообщает о первоначальной покупке через интеграцию с PostHog, если она подключена. Продления и отмены имеют другие имена.", "why": "Деньги и продления — правда магазина; с телефона их не увидеть.", "note": "Другие события того же источника: rc_trial_started_event, rc_trial_converted_event, rc_renewal_event, rc_cancellation_event, rc_expiration_event, rc_billing_issue_event; цену, валюту и магазин в них пишет RevenueCat. Покупателя RevenueCat знает по id семьи, поэтому в PostHog эти события приходят отдельному «человеку» с id семьи, а не родителю. Чтобы они шли тому же родителю, приложению нужно передавать в RevenueCat атрибут $posthogUserId — это задача.", "props": [], "production_verified": false, "source": "revenuecat", "legacy_names": [], "report_names": ["rc_initial_purchase_event"], "current_names": [], "code_scope": "external_unverified"}, {"name": "push_opened", "previous_name": "pushOpened", "legacy_names": [], "title": "Нажал на пуш", "domain": "system", "side": "both", "status": "ready", "prio": "P1", "when": "Обработано нажатие на уведомление: из фона, при закрытом приложении или на баннер внутри. Только при разрешённой аналитике. Нажатие ещё не подтверждает, что нужный экран открылся: вход или PIN могут остановить переход.", "why": "Нажатия на уведомления. Долю открытий кампании сч ebook и Instagram.", "small": "по коду — после согласия и входа родителя; кабинет и получение не проверены"}, {"id": "db", "kind": "server", "icon": "🗄", "title": "Supabase (база)", "text": "Задания, монеты, семьи и подписки, включая Paylov. Для денег нужны подтверждённые записи платежей.", "small": "к PostHog не подключена; можно подключить как склад данных"}], "flows": [{"a": "ads", "b": "stores", "label": "переходы по ссылкам", "solid": true}, {"a": "stores", "b": "parent", "label": "установки", "solid": true}, {"a": "stores", "b": "child", "label": "установки", "solid": true}, {"a": "parent", "b": "ph", "label": "события", "solid": true}, {"a": "child", "b": "ph", "label": "события", "solid": true}, {"a": "parent", "b": "meta", "label": "активация (боевая сборка)", "solid": true}, {"a": "rc", "b": "ph", "label": "покупки — если включено", "solid": false}, {"a": "db", "b": "ph", "label": "склад данных — не подключено", "solid": false}], "identityHtml": "<h3>Кто есть кто в PostHog</h3>\n<table><tr><th>Кто</th><th>Номер в PostHog</th><th>Что ещё знаем</th></tr>\n<tr><td>Родитель</td><td><code>номер аккаунта</code></td><td>role = parent, страна, язык, тариф семьи (tier), семья</td></tr>\n<tr><td>Ребёнок на своём телефоне</td><td><code>child_&lt;номер&gt;</code></td><td>role = child, семья. Требование — без имён, фото и свободного текста; полноту нужно проверить</td></tr>\n<tr><td>Ребёнок на телефоне родителя</td><td>номер родителя</td><td>role = child и active_child_id — пока открыт режим ребёнка</td></tr>\n<tr><td>Семья</td><td>группа <code>family</code> = номер семьи</td><td>тариф, страна, число детей. Воронки «по семьям» считают шаги родителя и ребёнка вместе</td></tr>\n<tr><td>Покупки из RevenueCat</td><td>номер семьи</td><td>отдельный «человек», не родитель (пока приложение не передаёт RevenueCat номер PostHog)</td></tr></table>\n<p style=\"margin-top:12px\">По коду запуск аналитических SDK отложен до разрешённого флага согласия. <code>analytics_consent_enabled</code>\nфиксирует изменение этого флага в текущем запуске; это не доказательство юридической достаточности согласия.</p>\n<p><code>coppa_strict</code> — технический режим приватности, а не роль: false может быть у родителя или ребёнка с другой возрастной категорией.\nРоль берите из <code>role</code>. Свойства семьи появляются после входа; первые события могут их не знать.\nНа общем телефоне номер человека остаётся родительским: по нему нельзя посчитать отдельных детей.</p>"}, "metrics": {"title": "Что измеряем: привлечение, польза, оплата и возврат", "sub": "У каждого числа — свой источник, единица подсчёта и период. Получение production-данных отдельно не проверено.", "northStar": {"name": "Семьи с одобрением задания за 7 дней", "event": "quest_approved", "text": "Уникальные семьи с хотя бы одним quest_approved за последние 7 завершённых дней в часовом поясе проекта. Это показатель основного сценария: в семье есть одобрение. Он не требует создания нового задания в тот же период и не доказывает получение награды. Пока получение события не проверено, значение неизвестно, а не равно нулю.", "recipe": "Trends → Action, объединяющая <code>quest_approved</code> и только его подтверждённые исторические имена из словаря → Unique family → последние 7 завершённых дней. Для недельного тренда отдельно выберите календарные недели и подпишите часовой пояс. Без групп нужен SQL с тем же фильтром и <code>count(distinct properties.family_id)</code>; пустые family_id исключить и отдельно проверить долю пропусков."}, "definitions": [["Активная семья", "уникальный непустой family_id с quest_created или quest_submitted за те же 7 завершённых дней. Это выбранное определение, не все возможные действия."], ["Активный ребёнок для отправок", "уникальный child_id с quest_submitted за тот же период; идентификатор родителя на общем телефоне ребёнка не заменяет."], ["Общее правило отчёта", "одни фильтры сборки, когорты и часовой пояс; старые и новые имена одного события объединяем в одну Action. Дубликаты людей и события не смешиваем."]], "pillars": [{"title": "Маркетинг: привлечение", "sub": "откуда приходят", "items": [{"name": "Установки по источникам", "formula": "Отчёты каждого магазина отдельно, с его определением установки и кампании.", "events": [], "ext": "кабинеты магазинов", "go": "marketing"}, {"name": "Конверсия страницы магазина", "formula": "Связанные установки ÷ посетители той же страницы и когорты по определению магазина. Не смешивать разные отчёты.", "events": [], "ext": "кабинет выбранного магазина", "go": "f-store"}, {"name": "Новые семьи", "formula": "Уникальные family_id с первым family_setup_completed в периоде. Нужна проверка полноты family_id.", "events": ["family_setup_completed"]}, {"name": "Цена привлечённой семьи", "formula": "Расход канала ÷ приписанные этому каналу новые семьи. Пока перенос источника в семейные события не подключён — метрика недоступна.", "events": ["family_setup_completed"], "ext": "расходы + атрибуция"}]}, {"title": "Продукт: активация", "sub": "первый результат", "items": [{"name": "Создание семьи за сутки", "formula": "Новые участники родительского пути → family_setup_completed за 24 часа. Вход на главную — следующий отдельный результат.", "events": ["family_setup_completed", "$screen"], "go": "f-parent"}, {"name": "Подключение отдельного телефона ребёнка", "formula": "Семьи с child_added → log_in с role=child за 7 дней. Общий телефон — другой способ использования.", "events": ["child_added", "log_in"], "go": "f-connect"}, {"name": "Первое одобрение новой семьи", "formula": "Новые семьи с первым quest_approved в течение 7 дней после family_setup_completed ÷ новые семьи с полными 7 днями наблюдения.", "events": ["family_setup_completed", "quest_approved"], "go": "f-core"}]}, {"title": "Продукт: вовлечённость", "sub": "основные действия", "items": [{"name": "Создания заданий на активную семью", "formula": "Число quest_created ÷ активные семьи за тот же период. Создание не равно выполнению.", "events": ["quest_created"]}, {"name": "Отправки на отправлявшего ребёнка", "formula": "Число quest_submitted ÷ уникальные child_id с этим событием в том же периоде. Сдачи из чата покрыты не полностью.", "events": ["quest_submitted"]}, {"name": "Время проверки", "formula": "Медиана непустых time_to_approve_minutes с source=review. Вместе показывать число измеренных одобрений и долю без времени; Фоксик не покрыт.", "events": ["quest_approved"]}, {"name": "Доля решений о доработке", "formula": "Количество quest_returned_for_rework ÷ (quest_approved + quest_returned_for_rework) за тот же период. Это доля решений, не уникальных заданий; одна сдача может возвращаться.", "events": ["quest_returned_for_rework", "quest_approved"]}, {"name": "Одобрения наград на активную семью", "formula": "reward_approved ÷ активные семьи за тот же период. Физическая передача подарка не измеряется.", "events": ["reward_approved"], "go": "f-rewards"}]}, {"title": "Продукт: монетизация", "sub": "покупка и финансовые записи", "items": [{"name": "Конверсия посетителя подписки", "formula": "Уникальные родители с подтверждённой покупкой за 24 часа после просмотра ÷ уникальные родители этой когорты просмотров. Не отношение сырых чисел событий.", "events": ["paywall_viewed", "subscription_purchase_confirmed"], "go": "f-paywall"}, {"name": "Платящие семьи", "formula": "Состояние платной подписки по family_id на выбранную дату: Store в RevenueCat, Paylov в backend/Paylov. Исключить пробные, истёкшие и неоплаченные по подтверждённым статусам.", "events": ["subscription_purchase_confirmed", "rc_initial_purchase_event"]}, {"name": "Выручка, продления и отмены", "formula": "Store — финансовые данные RevenueCat/магазинов; Paylov — его платежные записи. Согласовать валюту, возвраты и период. Цена из события приложения не заменяет выручку.", "events": ["rc_initial_purchase_event"]}]}, {"title": "Продукт: удержание", "sub": "повторная польза", "items": [{"name": "Возврат родителя D1 / D7 / D30", "formula": "Первое family_setup_completed → действие родителя quest_created или quest_approved в конкретный день 1, 7, 30. Открытие приложения — отдельный более слабый сигнал.", "events": ["family_setup_completed", "quest_approved"], "go": "retention"}, {"name": "Ребёнок через 1 и 4 недели", "formula": "Первый log_in с role=child → quest_submitted в неделе 1 или 4; одна детская идентичность и завершённое окно наблюдения.", "events": ["log_in", "quest_submitted"], "go": "retention"}, {"name": "Удержание семьи", "formula": "Первое семейное quest_approved → одобрение той же семьи на последующих календарных неделях; считать family, фиксировать часовой пояс.", "events": ["quest_approved"], "go": "retention"}, {"name": "Возврат к Фоксику ребёнка", "formula": "Первый успешный child_ai_reply_received → успешный child_ai_reply_received на следующей неделе. На общем телефоне нужны детские идентификаторы.", "events": ["child_ai_reply_received"], "go": "retention"}]}]}, "docsBefore": [{"id": "retention", "kicker": "Удержание", "title": "Возвращаются ли после первого результата", "sub": "Отдельные Retention-отчёты. Открыть → написать в один день не означает вернуться через неделю.", "cols": 3, "cards": [{"html": "<h3>Родитель</h3><p>Старт — первое <code>family_setup_completed</code>. Возврат — <code>quest_created</code> или <code>quest_approved</code> с <code>role=parent</code>.</p><p>D1 / D7 / D30 — действие в конкретный день 1, 7 или 30, а не в любой день до него. Один часовой пояс и только завершённые окна наблюдения.</p><p>Application Opened — отдельный показатель открытия аккаунта/устройства: на общем телефоне приложение мог открыть ребёнок.</p>"}, {"html": "<h3>Ребёнок</h3><p>Старт — первый <code>log_in</code>, <code>role=child</code>; возврат — <code>quest_submitted</code> на неделе 1 или 4. Укажите границы недель и часовой пояс.</p><p>Это дети с отдельным входом. На общем телефоне person принадлежит родителю; для детского отчёта нужен child_id, а не число таких person.</p><p>Для Фоксика отдельно: первый <code>child_ai_reply_received</code> → тот же успешный ответ на следующей неделе. Отправка при закрытом экране покрыта не полностью.</p>"}, {"html": "<h3>Семья</h3><p>Первое <code>quest_approved</code> → <code>quest_approved</code> в последующие календарные недели, по группе <code>family</code>.</p><p>Без групп — SQL по family_id с теми же окнами; люди не заменяют семьи. Старые и новые имена объединить в Action для каждого отчёта.</p><p>Платящих определять по подписке в момент старта когорты, сверяя Store и Paylov; текущее tier не годится как исторический статус.</p>"}]}], "docsAfter": [{"id": "status", "kicker": "Статус", "title": "Что проверено и чего пока не хватает", "sub": "Проверен локальный код на 2 октября 2026. Выпуск приложения, приём production-событий и настройки кабинетов не подтверждены.", "cols": 2, "cards": [{"html": "<h3>В локальной доработке</h3><p>Единые snake_case-имена, просмотры маршрутов, environment, отправка заданий/наград у родителя, сигналы оплаты и family_id первых событий.</p><p>Соседние рабочие копии отличаются: исправления нужно объединить без потери актуального интерфейса и проверить в выпущенной сборке.</p>"}, {"html": "<h3>Перед использованием отчётов</h3><ul><li>Проверить получение событий, роли, family_id и дубликаты на действующей сборке.</li><li>Проверить доступность Group analytics; без групп — SQL по семье.</li><li>Настроить исключение реальных тестовых аккаунтов, а не production-приложения.</li><li>В каждом отчёте объединить подтверждённые старые и новые имена.</li><li>Проверить интеграцию RevenueCat → PostHog и её идентификаторы; состояние Meta-интеграции неизвестно.</li></ul>"}, {"html": "<h3>Пробелы измерения</h3><ul><li>Передача приглашения, часть входов по ссылке/QR и режим общего телефона.</li><li>Сдача задания из чата, лимит ребёнка и точный источник подписки из Фоксика.</li><li>Открытие пуша и связь с его целью; маркетинговая кампания → родитель → семья.</li><li>Общие идентификаторы задания/сдачи и запроса награды для точных циклов.</li></ul>"}, {"html": "<h3>Отдельные проверки</h3><ul><li>Store-платежи и Paylov сверять отдельно, затем объединять по семье.</li><li>Убрать свободный текст из всех путей событий, проверить удаление данных после удаления аккаунта.</li><li>Уточнить финансовые статусы, валюты и роль текущего tier; не выдавать его за историю оплаты.</li><li>Собрать отчёты, дать нужный доступ и записать дату проверки. Этот план не утверждает, что кабинеты уже настроены.</li></ul>"}]}, {"id": "rules", "kicker": "Правила", "title": "Как не получить неверные цифры", "sub": "Единица подсчёта, фильтры, история имён и границы данных.", "cols": 3, "cards": [{"html": "<h3>Сборки и тесты</h3><p>В отчёте <b>включаем</b> события <code>$app_namespace = com.oynaplatform.app</code>: это отделяет OYNA Dev, но само по себе не исключает тестировщиков и debug-сборки с тем же именем приложения. После выпуска новой отправки дополнительно включаем <code>environment = prod</code>. <code>dev</code>, <code>debug</code> и <code>qa</code> исключаем. <b>В настройку «Filter out internal and test users» заносят именно тестовые аккаунты и сборки; равенство production-приложению туда ставить нельзя — оно исключит нужных пользователей.</b> Старые события и первые служебные события запуска могут не иметь <code>environment</code>: показывайте их отдельным историческим сегментом с оговоркой, иначе новый фильтр их удалит. События RevenueCat фильтруйте по подтверждённому признаку магазина/sandbox: мобильных свойств у них может не быть.</p>"}, {"html": "<h3>Согласие и детские данные</h3><p><code>analytics_consent_enabled</code> простыми словами — приложение увидело разрешённый флаг согласия в этом запуске. COPPA — название закона США о детских данных; событие само по себе не подтверждает законность согласия.</p><p><code>coppa_strict</code> — технический режим приватности; false не означает обязательно взрослого. Для роли используйте role.</p><p>Требование: не отправлять имена, фото, даты рождения и свободный текст. Полнота ещё не подтверждена: в проверяемой аналитической ветке у quest_submitted остаётся текст задания; в соседней работе есть исправление, которое нужно объединить и проверить.</p><p>SDK аналитики запускаются после разрешённого флага; другие службы приложения имеют свой запуск. Удаление данных PostHog после удаления аккаунта требует отдельной проверки.</p>"}, {"html": "<h3>Имена и история</h3><p>События OYNA: snake_case, например quest_approved. Свойства тоже snake_case. Служебные имена PostHog/RevenueCat сохраняются.</p><p>В каждом отчёте — воронке, Trends и Retention — объедините новое имя и указанные исторические имена одной Action. Новое имя не переименовывает старые записи.</p><p>plan_tier — выбранный или купленный тариф; tier — контекст семьи, который может быть неточным. Не использовать его как финансовый реестр.</p>"}, {"html": "<h3>Люди, дети и семьи</h3><p>Unique users считает идентификаторы PostHog. На отдельном телефоне ребёнок имеет child_…; на общем телефоне остаётся номер родителя.</p><p>Family соединяет родителя и детей. Шаги могут относиться к разным заданиям, детям и наградам; точный цикл одного объекта требует его идентификатора на всех шагах.</p><p>Без групп — SQL по family_id с порядком и окном. Заменять семейную воронку людьми нельзя.</p>"}, {"html": "<h3>Период и готовность</h3><p>Выберите часовой пояс, когорту и полное окно наблюдения. Последние 7 дней и календарная неделя — разные периоды.</p><p>Проверка кода не означает получение в production. Нет события или поля — «нет данных», не 0 %. Указывайте дату проверки и версию сборки.</p>"}, {"html": "<h3>Как проверить отправку</h3><ol><li>В OYNA Dev выполните действие.</li><li>В PostHog Live events отберите DEV-приложение.</li><li>Сверьте имя, свойства, роль и family_id; повторите общий телефон и отдельный детский вход.</li><li>Отдельно проверьте выпущенную production-сборку и сохранённый отчёт.</li></ol>"}]}, {"id": "dashboards", "kicker": "PostHog", "title": "Какие отчёты собрать", "sub": "План отчётов. Они не объявлены созданными или проверенными. Для каждого: источник, фильтры, период, часовой пояс и полнота.", "cols": 3, "cards": [{"html": "<h3>1. Маркетинг</h3><ul><li>Страница и установки — отдельно по магазинам и источникам.</li><li>Расход на связанную установку (CPI).</li><li>UTM → новая семья → покупка: пока недоступно, нужна атрибуция родительского пути.</li></ul>"}, {"html": "<h3>2. Активация</h3><ul><li>Родитель → созданная семья → главная.</li><li>Семья → отдельный вход ребёнка; общий телефон отдельно.</li><li>Первое одобрение в течение 7 дней от создания семьи.</li></ul>"}, {"html": "<h3>3. Основной сценарий</h3><ul><li>Семьи с одобрением за 7 завершённых дней.</li><li>Отправка → одобрение; доля решений о доработке.</li><li>Запрос награды → одобрение; магазин и чат как разные входы.</li></ul>"}, {"html": "<h3>4. Подписка и деньги</h3><ul><li>Просмотр → начало оплаты → подтверждение, по источнику.</li><li>Ошибки, отмены и pending отдельно.</li><li>Store — RevenueCat; Paylov — backend/Paylov; сверка семей и валют.</li></ul>"}, {"html": "<h3>5. Возврат</h3><ul><li>Удержание родителей, детей и семей — отдельные единицы подсчёта.</li><li>Пуш: отправка → открытие, затем открытие → цель; пока нужны события и ключи связи.</li></ul>"}, {"html": "<h3>6. Фоксик и качество данных</h3><ul><li>Открытие → успешный ответ; ошибки и отказы отдельно.</li><li>Полезные действия карточками и советы недели отдельно.</li><li>Возврат через неделю; лимит → атрибутированная покупка пока с пробелом источника.</li><li>Получение событий, дубликаты, пропуски family_id и старые/новые имена.</li></ul>"}]}, {"id": "marketing", "kicker": "Маркетинг", "title": "Какие маркетинговые вопросы уже описаны, а где нужны данные", "sub": "Метки ссылки сами по себе не связывают установку с новой семьёй. Настройки кабинетов здесь не проверены.", "cols": 2, "cards": [{"full": true, "html": "<h3>Источник и граница измерения</h3><table><tr><th>Вопрос</th><th>Источник</th><th>Ограничение</th></tr><tr><td>Кто увидел и установил</td><td>App Store Connect / Play Console</td><td>Разные определения; сравнивать внутри отчёта.</td></tr><tr><td>Создание семьи и действия</td><td>PostHog</td><td>Получение и идентификаторы нужно проверить.</td></tr><tr><td>Цена установки</td><td>Расход канала ÷ связанные установки</td><td>Один канал, период и модель атрибуции.</td></tr><tr><td>Цена новой семьи</td><td>Расход ÷ связанные новые семьи</td><td>Связь кампании с семьёй ещё не подключена.</td></tr><tr><td>Покупки и продления</td><td>Store: RevenueCat; Paylov: backend/Paylov</td><td>Единая сверка по семье, валюте и периоду.</td></tr><tr><td>Возврат по пушу</td><td>Журнал отправок + push_opened + целевое действие</td><td>Нужны выпуск локальных исправлений и проверка связи с целью.</td></tr></table>"}, {"html": "<h3>Шаблоны ссылок кампаний</h3><p>App Store: provider-token выдаётся в кабинете; пример нужно заменить данными кампании.</p><pre>https://apps.apple.com/app/apple-store/id6762140001?pt=&lt;provider-token&gt;&amp;ct=202610_uz_instagram_launch&amp;mt=8</pre><p>Google Play: передать метки в referrer.</p><pre>https://play.google.com/store/apps/details?id=com.oynaplatform.app&amp;referrer=utm_source%3Dinstagram%26utm_medium%3Dpaid_social%26utm_campaign%3D202610_uz_launch</pre><p>Сайт: <code>utm_source=telegram&amp;utm_medium=post&amp;utm_campaign=202610_kz_school</code>. Переходы в магазин должны сохранять метки.</p><p>Чтение Install Referrer для приглашений есть в коде, но перенос маркетинговой кампании в события родителя/семьи не подтверждён.</p>"}, {"html": "<h3>Единые UTM</h3><p><code>utm_source</code> — instagram, telegram, google, school_…; <code>utm_medium</code> — paid_social, organic_social, referral, push; <code>utm_campaign</code> — 202610_uz_launch; <code>utm_content</code> — video_fox_15s.</p><p>Для новых меток — латиница, нижний регистр, подчёркивания; старые значения сохраняем таблицей соответствий.</p><p>До отчёта о цене семьи нужно выбрать first-touch или last-touch, окно атрибуции, правила нескольких устройств и семьи. Сейчас такая сквозная атрибуция не заявлена готовой.</p>"}, {"html": "<h3>Реклама, ссылки и следующие шаги</h3><p>По коду Meta App Events ограничен родительским путём после согласия; реальное получение и интеграция RevenueCat → Meta не проверены.</p><p>Планируемое <code>deep_link_opened</code> может фиксировать разрешённые UTM, но не решает само по себе перенос источника через установку. Детские действия не следует использовать как родительскую рекламную аудиторию.</p><p>Пуши: <code>campaign_id</code> и <code>push_id</code> нужно связать с адресатом, открытием и конкретной целью. Само <code>?source=push</code> сообщает источник экрана, а не причинный эффект рассылки.</p><p>Ответ «Откуда узнали?» может дополнить источники, но не заменяет техническую атрибуцию.</p>"}]}, {"id": "push-truth", "kicker": "Как работают пуши", "title": "Доставка, открытие и результат — три разные проверки", "sub": "Проверено 2 октября 2026: серверные записи — только чтение; маршруты — код и тесты. Полный проход на физическом телефоне не подтверждён.", "cols": 2, "cards": [{"html": "<h3>1. Уведомление отправляется</h3><p>Сервер выбирает получателя и отправляет сообщение в FCM. Есть реальные подтверждения приёма для родителей и детей. Но приём FCM ещё не означает, что телефон показал уведомление.</p><p>Отдельно учитываются отсутствие активного токена, ограничения запросов и отказ FCM. Нельзя сводить эти причины в одну «нет токенов».</p>"}, {"html": "<h3>2. Нажатие открывает экран</h3><p>В приложении используется <b>GoRouter</b>. Адрес из уведомления проходит те же проверки роли, входа и PIN, что обычный переход.</p><p>Локально исправлены потеря адреса во время входа/PIN и открытие каталога вместо заявок на награды. Исправления нужны в следующей сборке. Проверки маршрутов не заменяют проверку доставки на телефон.</p>"}, {"html": "<h3>3. Открытие попадает в журнал</h3><p>Операционная запись <code>opened_at</code> существует. Отдельное <code>push_opened</code> для PostHog добавлено локально и требует согласия на аналитику. Нажатие не доказывает прохождение входа/PIN и показ экрана.</p><p>Отправки считайте по факту приёма и времени <code>sent_at</code>, открытия — по <code>opened_at</code>. Один текущий статус записи не описывает всю её историю. Серверная доработка проверяет получателя, принятую отправку, цель и срок; её выпуск ещё нужен.</p>"}, {"html": "<h3>4. Пользователь выполнил цель</h3><p>Для «открыть задание» учитывается показ карточки. Для «выполнить задание» подготовлен серверный учёт после одобрения: сдача ребёнком сама по себе не считается выполнением. Цель оплаты использует подтверждение покупки, а не нажатие кнопки.</p><p>Это локальные исправления, а не проверенные данные production. Сначала нужны выпуск и контрольный проход «пуш → нажатие → экран → действие». Старые нулевые конверсии по заданиям не доказывают отсутствие результата.</p>"}]}], "primer": {"title": "Азбука: три слова и где их смотреть", "sub": "Прочитайте это первым. Дальше на странице — те же вещи на настоящих экранах OYNA.", "cards": [{"icon": "📍", "title": "Событие", "text": "Запись о факте в приложении. После успешного одобрения код отправляет quest_approved; получение сервером проверяют отдельно. Все строчки по порядку — это лента событий.", "feed": [["День 1, 10:02", "Мама", "analytics_consent_enabled", "дала согласие"], ["День 1, 10:05", "Мама", "parent_registration_started", "начала регистрацию"], ["День 1, 18:40", "Алина", "log_in", "вошла по коду"], ["День 2, 18:34", "Мама", "quest_approved", "одобрила задание"]]}, {"icon": "🏷", "title": "Имя события и свойства", "text": "Имя — короткое английское слово: что случилось (quest_approved — «задание одобрено»). Свойства — подробности этой строчки: сколько монет, было ли фото, сколько ждал ребёнок.", "example": ["quest_approved", [["coins", "250", "сколько монет начислено"], ["had_photo", "true", "было ли фото (true — да, false — нет)"], ["time_to_approve_minutes", "42", "сколько ребёнок ждал проверки"]]]}, {"icon": "🔻", "title": "Воронка", "text": "Несколько событий по порядку. Берём всех, кто сделал шаг 1, и смотрим, сколько из них дошли до шага 2, 3, 4. Где следующий шаг встречается реже — там ищем причину: другой путь, ошибка, пробел данных или уход. Пример ниже выдуман, это не показатели OYNA.", "bars": [["Создали задание", 100], ["Ребёнок открыл", 80], ["Ребёнок сделал", 60], ["Родитель одобрил", 45]]}, {"icon": "🔎", "title": "Где это смотреть", "text": "События приложения проверяют в PostHog (us.posthog.com, проект OYNA); статистику магазинов и деньги — в своих источниках.", "where": [["Activity → Live events", "лента событий в реальном времени — проверить, что событие пришло"], ["Product analytics → New insight → Funnels", "построить воронку с этой страницы"], ["Persons / Groups → family", "идентификатор пользователя или семья; общий телефон не разделяет детей по person"], ["Фильтры сборки и тестовых аккаунтов", "выбираем production в отчёте; в исключения добавляем тесты — см. «Правила»"]]}]}, "story": {"title": "История одной семьи: какие события появляются", "sub": "Выдуманный пример недели семьи. Под каждым действием — предусмотренное событие и статус кода, а не доказательство получения в production. Значения свойств — пример.", "steps": [{"t": "День 1, 10:02", "who": "parent", "text": "Мама скачала OYNA и подтвердила согласие", "ev": "analytics_consent_enabled", "card": "start-app-02", "props": {"language": "ru", "source": "first_run"}}, {"t": "10:03", "who": "parent", "text": "Выбрала «Я родитель» — открылся экран региона", "ev": "$screen", "screen": "parent_region", "card": "p-auth-app-00", "props": {"$screen_name": "parent_region"}}, {"t": "10:05", "who": "parent", "text": "Зарегистрировалась по номеру телефона (семьи ещё нет)", "ev": "parent_registration_started", "card": "p-auth-app-03", "props": {"method": "phone"}}, {"t": "10:09", "who": "parent", "text": "Сохранила анкету семьи с Алиной", "ev": "family_setup_completed", "card": "p-auth-app-13", "props": {"skipped": false, "country": "UZ", "language": "ru"}}, {"t": "10:10", "who": "parent", "text": "Открыла приглашение для Алины", "ev": "$screen", "screen": "parent_child_invite", "card": "p-family-app-02", "props": {"$screen_name": "parent_child_invite"}}, {"t": "18:40", "who": "child", "text": "Алина вошла по коду на своём телефоне", "ev": "log_in", "card": "c-onboarding-app-05", "props": {"role": "child", "method": "code"}}, {"t": "День 2, 08:15", "who": "parent", "text": "Мама создала задание из готовых", "ev": "quest_created", "card": "p-tasks-app-04", "props": {"source": "template", "kind": "daily", "coins": 250}}, {"t": "17:30", "who": "child", "text": "Алина открыла задание", "ev": "quest_opened", "card": "c-tasks-app-01", "props": {"review_state": "new", "is_custom": false}}, {"t": "17:52", "who": "child", "text": "Сфотографировала и отправила", "ev": "quest_submitted", "card": "c-tasks-app-05", "props": {"had_photo": true}}, {"t": "18:34", "who": "parent", "text": "Мама одобрила — Алине 250 монет", "ev": "quest_approved", "card": "p-review-app-01", "props": {"coins": 250, "time_to_approve_minutes": 42}}, {"t": "День 5, 16:00", "who": "child", "text": "Алина попросила награду — монеты отложены", "ev": "reward_requested", "card": "c-market-app-01", "props": {"price": 3000, "from": "market"}}, {"t": "16:20", "who": "parent", "text": "Мама одобрила запрос награды", "ev": "reward_approved", "card": "p-requests-app-01", "props": {"price": 3000, "wait_minutes": 20}}, {"t": "День 6, 21:10", "who": "parent", "text": "Хотела добавить второго ребёнка — бесплатно можно одного", "ev": "paywall_viewed", "card": "p-paywall-app-00", "props": {"trigger": "child_limit"}}, {"t": "21:12", "who": "parent", "text": "Приложение подтвердило покупку Premium на год", "ev": "subscription_purchase_confirmed", "card": "p-paywall-app-02", "props": {"plan_tier": "premium", "period": "annual", "method": "store"}}], "after": "После проверки получения по таким событиям строят отчёты: «семья создана в первый день» (шаги 1–4), «ребёнок подключён» (5–6), главная метрика — одобренное задание за неделю (10), подписка и её источник (13–14)."}, "glossary": {"title": "Словарь: слова с этой страницы и из PostHog", "sub": "Наведите на слово с пунктиром на странице — подсказка оттуда же.", "terms": [["Событие (event)", "Одна запись о том, что случилось: «родитель одобрил задание». В PostHog — одна строка ленты."], ["Имя события", "Как событие называется в PostHog, латиницей: quest_approved. По имени ищут и строят графики."], ["Свойство (property)", "Подробность события: coins = 250, had_photo = true. По свойствам фильтруют и делят на группы."], ["true / false", "Да и нет в PostHog: had_photo = true — фото было. Фильтр так и пишут: had_photo = true."], ["Просмотр экрана ($screen)", "Особое событие «открылся экран». Какой — в свойстве $screen_name: parent_home, child_market."], ["Человек (person)", "Идентификатор PostHog, не всегда отдельный человек: родитель и дети на общем телефоне используют номер родителя; на отдельном детском телефоне — child_<номер>."], ["Технический номер (uuid)", "Номер вроде 8f2c41d0-… связывает записи. Он не содержит имя, но может связываться с аккаунтом; это не гарантия анонимности."], ["Семья (группа family)", "Родитель и его дети вместе. Воронки «по семьям» считают шаги мамы и ребёнка как один путь."], ["Воронка (Funnel)", "Шаги в заданном порядке и окне. Меньше событий на следующем шаге может означать уход, другой путь или пробел измерения."], ["Конверсия", "Доля дошедших: 45 из 100 одобрили задание — конверсия 45 %."], ["Сколько ждём (conversion window)", "Сколько времени даём пройти воронку: «7 дней» — шаг через 8 дней уже не засчитается."], ["Разбить по (Breakdown)", "Та же воронка или график, разделённые по свойству: по стране, способу входа, источнику задания."], ["Тренд (Trends)", "График: сколько событий или людей по дням и неделям."], ["Удержание (Retention)", "Возвращаются ли люди: сколько из пришедших на неделе 1 вернулись на неделе 2, 4…"], ["D1 / D7 / D30", "Доля вернувшихся через 1, 7 и 30 дней после первого дня."], ["Когорта", "Группа людей с общим признаком: «пришли в октябре», «платящие семьи»."], ["Главная метрика (North Star)", "Выбранный показатель основного сценария: уникальные семьи с одобрением задания за 7 завершённых дней. Не доказательство всей пользы продукта."], ["Медиана", "Середина: половина быстрее, половина медленнее. Честнее среднего, которое портит одно очень долгое ожидание."], ["trigger", "Откуда человек попал на экран подписки: из профиля, из лимита детей, из пуша…"], ["tier и plan_tier", "Тариф: free, premium, premium_ai. tier — тариф семьи сейчас; plan_tier — тариф, который выбирают или покупают на экране подписки."], ["$app_namespace", "Какое приложение прислало событие: com.oynaplatform.app — магазинное, com.oynaplatform.app.dev — OYNA Dev для тестов."], ["environment", "Какая сборка прислала событие: prod — магазинная, qa — внутренняя для тестов, debug и dev — у разработчиков. Со следующей сборки."], ["UTM, ct=, referrer", "Подписи в рекламной ссылке: по ним видно, откуда пришёл человек (Instagram, блогер, школа)."], ["ASO", "Работа над страницей приложения в магазине: иконка, скриншоты, описание, отзывы."], ["CTR / доля открытий", "Связанные уникальные открытия ÷ соответствующие отправки. Для пушей нужны push_id и одинаковый знаменатель; отправка не означает доставку."], ["P0 / P1 / P2", "Очередь работ: P0 — нужно для главных воронок, P1 — следующий шаг, P2 — потом."], ["COPPA", "Название закона США о конфиденциальности детских данных. В имени события OYNA означает техническое подтверждение флага согласия, а не проверку его юридической достаточности."], ["Фоксик в именах событий", "Фоксик — ИИ-помощник OYNA. parent_ai_… — родитель, child_ai_… — ребёнок. copilot_… и jey_… — прежние варианты для истории."], ["Магазин приложений и магазин наград", "Магазин приложений — App Store и Goo function section(id, group, nav, kicker, title, sub, html) {

          ${f.breakdowns.length ? `<li>По желанию Breakdown (разбить по): ${esc(f.breakdowns.join(', '))}.</li>` : ''}</ol>
          ${f.by === 'family' ? '<div class="muted">Нужны группы family с подтверждённой привязкой событий. Без них — запрос по family_id с тем же порядком и окном или статус «не измерено». Подсчёт людей не заменяет подсчёт семей.</div>' : ''}</details>`;
    const measure = `<div class="measure"><div><b>Кого берём в начале</b>${esc(f.denominator || 'Уникальные профили или семьи, выполнившие первый шаг.')}</div><div><b>Что считаем успехом</b>${esc(f.numerator || 'Те же участники, выполнившие все обязательные шаги по порядку в заданное окно.')}</div></div>`;
    const limitations = f.limitations ? `<div class="doc" style="margin:12px 0"><b>Граница этого измерения</b><p>${esc(Array.isArray(f.limitations) ? f.limitations.join(' ') : f.limitations)}</p></div>` : '';
    doc.insertAdjacentHTML('beforeend', section(f.id, f.category === 'marketing' ? 'Маркетинговые пути' : 'Продуктовые пути', `${i + 1}. ${f.title}`, `${f.category === 'marketing' ? 'Маркетинг' : 'Продукт'} · путь ${i + 1} из ${PLAN.funnels.length}`, f.title, esc(f.question),
      ready + pills + measure + `<div class="steps">${steps}</div>` + (f.note ? `<p class="fnote">${esc(f.note)}</p>` : '') + limitations +
      (f.if_low ? `<div class="iflow"><b>Что проверить при низкой конверсии</b>${esc(f.if_low)}</div>` : '') + recipe));
  });
})();

// ── 6. Docs: retention, then what to do, then the reference ─────────────
function docs(d, group, nav) {
  const cols = d.cols === 3 ? 'g3' : 'g2';
  return section(d.id, group, nav || d.title, d.kicker, d.title, d.sub,
    `<div class="grid ${cols}">${d.cards.map(c => `<div class="doc${c.full ? ' full' : ''}"><div class="tw">${c.html}</div></div>`).join('')}</div>`);
}
PLAN.docsBefore.forEach(d => doc.insertAdjacentHTML('beforeend', docs(d, 'Цифры')));
PLAN.docsAfter.forEach(d => doc.insertAdjacentHTML('beforeend', docs(d, d.id === 'status' ? 'Что делать' : 'Справочник',
  ({ status: 'Что нужно от владельцев', rules: 'Как отбирать данные и приватность', dashboards: 'Дашборды', marketing: 'Ссылки, UTM, реклама' })[d.id])));

// ── 7. Where the data comes from ────────────────────────────────────────
(() => {
  const A = PLAN.architecture, box = {}; A.boxes.forEach(b => { box[b.id] = b; });
  const boxes = A.boxes.map(b => `<div class="abox ${b.kind}"><span class="em">${b.icon}</span><b>${esc(b.title)}</b>${esc(b.text)}${b.small ? `<small>${esc(b.small)}</small>` : ''}</div>`).join('');
  const flows = A.flows.map(f => `<div class="flow${f.solid ? '' : ' dashed'}"><span class="tg">${box[f.a].icon} ${esc(box[f.a].title)}</span><span class="ar">${f.solid ? '→' : '⇢'}</span>
    <span class="tg">${box[f.b].icon} ${esc(box[f.b].title)}</span><span class="lb">${esc(f.label)}</span></div>`).join('');
  doc.insertAdjacentHTML('beforeend', section('how', 'Справочник', 'Откуда берутся данные', 'Как устроено', A.title, esc(A.sub),
    `<div class="arch">${boxes}</div><h3>Куда что уходит</h3><div class="flows">${flows}</div><p style="font-size:14px;color:#5f646d">⇢ — связь не настроена или не проверена.</p>
     <div class="doc" style="margin-top:16px"><div class="tw">${A.identityHtml}</div></div>`));
})();

// ── 8. Every event, every screen name ───────────────────────────────────
const ROWS = [], TILES = [];
(() => {
  const renderDomains = events => PLAN.domains.map(d => {
    const list = events.filter(e => e.domain === d.id); if (!list.length) return '';
    return `<div class="dom"><h3>${esc(d.title)}</h3>${d.note ? `<p class="dn">${esc(d.note)}</p>` : ''}${list.map(e =>
      `<button class="evrow" data-ev-row="${esc(e.name)}" data-find="${esc((e.name + ' ' + (e.previous_name || '') + ' ' + (e.legacy_names || []).join(' ') + ' ' + e.title + ' ' + e.props.map(p => p.n).join(' ')).toLowerCase())}">
        <span class="nm">${esc(e.name)}</span><span class="ti">${esc(e.title)}<small>${esc(ui.whoOf(e))}</small></span>
        <span class="stw st-${e.status}">${esc(ST[e.status].icon)} ${esc(ST[e.status].label)}</span></button>`).join('')}</div>`;
  }).join('');
  const current = PLAN.events.filter(e => e.status !== 'new' && e.code_scope !== 'external_unverified');
  const external = PLAN.events.filter(e => e.code_scope === 'external_unverified');
  const planned = PLAN.events.filter(e => e.status === 'new');
  const h = `<p><b>${current.length} событий с отправкой в коде</b> — см. статус: актуальная ветка и локальная доработка различаются. Получение PostHog не подтверждено.</p>${renderDomains(current)}
    <h3>Внешние источники · ${external.length}</h3><p>Имена задаёт SDK или интеграция. Нужна отдельная проверка получения.</p>${renderDomains(external)}
    <details id="planned-events"><summary style="cursor:pointer;padding:18px 0;font-weight:700">План: ещё не подключено · ${planned.length}</summary><p>Эти записи не означают, что функция или её измерение уже реализованы. Не используйте их как работающие шаги воронки.</p>${renderDomains(planned)}</details>`;
  doc.insertAdjacentHTML('beforeend', section('events', 'Справочник', 'Все события', 'Словарь событий', 'Все события',
    `Имя описывает зафиксированное действие. Клик — точный момент отправки, свойства и ограничения. Обучающего онбординга сейчас нет: family_setup_completed означает сохранение анкеты семьи.`, h));
  let s = '';
  for (const side of ['common', 'parent', 'child']) {
    const list = PLAN.screens.filter(x => x.group === side); if (!list.length) continue;
    s += `<h3>${side === 'parent' ? 'Родитель' : side === 'child' ? 'Ребёнок' : 'Первый запуск'} <span style="color:#5f646d;font-weight:500;font-size:15px">· ${list.length}</span></h3><div class="scrs">${list.map(x => {
      const k = x.cards[0];
      const thumb = k && CARDS[k] ? `<img loading="lazy" decoding="async" src="../img/${esc(k)}_t.webp" alt="">` : 'картинки нет в CJM';
      const how = x.sheet ? '▤ лист — без просмотра' : x.untracked ? '○ не приходит (до согласия)' : '👁 событие $screen в коде';
      return `<button class="stile" data-scr-tile="${esc(x.id)}" data-find="${esc((x.id + ' ' + x.title + ' ' + x.events.join(' ')).toLowerCase())}"><div class="thumb">${thumb}</div>
        <div class="nm">${esc(x.id)}</div><div class="ti">${esc(x.title)}</div><div class="how">${how}</div></button>`;
    }).join('')}</div>`;
  }
  const tracked = PLAN.screens.filter(x => x.route && !x.sheet && !x.untracked).length;
  doc.insertAdjacentHTML('beforeend', section('screens', 'Справочник', 'Экраны', 'Экраны', 'Экраны: постоянные имена',
    `Просмотр экрана предусмотрен событием <code>$screen</code> с этим именем в <code>$screen_name</code> (${tracked} экранов). Листы поверх экрана описываются отдельными действиями. Просмотры до включения флага согласия не записываются.`, s));
})();

// ── Sidebar, search, downloads, panel and pictures ──────────────────────
const side = document.getElementById('side');
(() => {
  let h = `<input id="q2" class="mq" type="search" placeholder="Найти событие: одобрил, подписка…" aria-label="Найти событие">
    <div class="sbox"><b>Как пользоваться</b>Читайте сверху вниз: «Коротко», «Азбука», «История семьи». Чёрная плашка с английским словом — имя события в PostHog: клик — что оно значит, какие данные несёт и как реализовано.</div>
    <div class="dl"><button class="btn" id="dlCsv" title="Таблица событий для Excel или Google Sheets">⬇ CSV</button><button class="btn" id="dlJson" title="Весь план в JSON">⬇ JSON</button></div><div id="hits"></div>`;
  let group = '';
  for (const [g, id, title] of NAV) {
    if (g !== group) { h += `<h2>${esc(g)}</h2>`; group = g; }
    h += `<a class="nav" href="#${esc(id)}" data-nav="${esc(id)}">${esc(title)}</a>`;
  }
  side.innerHTML = h;
  const dl = (name, type, text) => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); };
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  document.getElementById('dlCsv').onclick = () => dl('oyna-tracking-plan.csv', 'text/csv;charset=utf-8',
    '﻿' + ['event,previous_name,current_names,report_names,source,title,domain,who,status,priority,when,properties,screens,funnels,caveat'].concat(PLAN.events.map(e => [e.name, e.previous_name || '', (e.current_names || []).join(' OR '), (e.report_names || [e.name]).join(' OR '), e.source, e.title,
      (PLAN.domains.find(d => d.id === e.domain) || {}).title, e.side, ST[e.status].label, e.prio || '', e.when,
      e.props.map(p => `${p.n}: ${p.t || ''} — ${p.d}`).join('; '), PLAN.screens.filter(s => s.events.includes(e.name)).map(s => s.id).join(' '),
      PLAN.funnels.filter(f => f.steps.some(s => s.event === e.name || (s.alt || []).includes(e.name))).map(f => f.title).join('; '), e.fix || ''].map(q).join(','))).join('\n'));
  document.getElementById('dlJson').onclick = () => dl('oyna-tracking-plan.json', 'application/json', JSON.stringify(PLAN, null, 2));
})();
document.addEventListener('click', e => {
  const nav = e.target.closest('[data-nav]');
  if (nav) { e.preventDefault(); go(nav.dataset.nav); return; }
  const pic = e.target.closest('[data-pic]');
  if (pic) { openPic(pic.dataset.pic); return; }
  const row = e.target.closest('[data-ev-row]');
  if (row) { ui.openEvent(row.dataset.evRow); return; }
  const tile = e.target.closest('[data-scr-tile]');
  if (tile) { ui.openScreen(tile.dataset.scrTile); return; }
  const chip = e.target.closest('#doc [data-ev], #doc [data-scr]');
  if (chip) { e.preventDefault(); ui.openFromChip(chip); }
});
document.addEventListener('keydown', e => {
  const chip = e.target.closest && e.target.closest('[data-ev],[data-scr]');
  if (chip && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ui.openFromChip(chip); }
});
document.getElementById('menu').onclick = e => { const open = document.body.classList.toggle('side-open'); e.currentTarget.setAttribute('aria-expanded', String(open)); };
const FINDABLE = [...document.querySelectorAll('[data-find]')];
function search(value) {
  const v = value.trim().toLowerCase();
  for (const el of FINDABLE) el.classList.toggle('dim', !!v && !el.dataset.find.includes(v));
  const hits = v ? PLAN.events.filter(x => (x.name + ' ' + (x.previous_name || '') + ' ' + (x.legacy_names || []).join(' ') + ' ' + x.title).toLowerCase().includes(v)).slice(0, 12) : [];
  const box = document.getElementById('hits');
  box.innerHTML = hits.map(x => `<a href="#" data-n="${esc(x.name)}">${esc(x.name)} <span>${esc(x.title)}</span></a>`).join('');
  box.querySelectorAll('a').forEach(a => a.onclick = ev => { ev.preventDefault(); document.body.classList.remove('side-open'); ui.openEvent(a.dataset.n); });
}
// The top bar's search on a computer, the menu's on a phone.
for (const id of ['q', 'q2']) {
  const input = document.getElementById(id);
  input.addEventListener('input', e => search(e.target.value));
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); const a = document.querySelector('#hits a'); if (a) a.click(); } });
}
const lbx = document.getElementById('lbx');
function openPic(key) {
  const c = CARDS[key];
  document.getElementById('lbxT').textContent = (c ? c.label : key) + ' · ' + captureLabel(key);
  document.getElementById('lbxI').src = `../img/${key}.webp`;
  document.getElementById('lbxI').alt = c ? c.label : key;
  document.getElementById('lbxA').href = `../?an=1#${key.replace(/-(figma|app|motion|device)-\d+$/, '')}`;
  lbx.classList.add('on');
}
const closePic = () => { lbx.classList.remove('on'); document.getElementById('lbxI').removeAttribute('src'); };
document.getElementById('lbxX').onclick = closePic;
lbx.addEventListener('click', e => { if (e.target === lbx) closePic(); });
window.addEventListener('keydown', e => { if (e.key === 'Escape') { closePic(); document.body.classList.remove('side-open'); } });
// The section at the reading line owns the highlight, not a previous
// section whose trailing margin still intersects the viewport.
const navLinks = {}; side.querySelectorAll('a.nav').forEach(a => { navLinks[a.dataset.nav] = a; });
const observedSections = [...document.querySelectorAll('main section')];
let spyPending = false, activeSection;
function updateReadingPosition() {
  spyPending = false;
  const readingLine = document.getElementById('top').getBoundingClientRect().bottom + 48;
  const reached = observedSections.filter(s => s.getBoundingClientRect().top <= readingLine);
  const cur = (reached.at(-1) || observedSections[0])?.id;
  if (!cur || cur === activeSection) return;
  activeSection = cur;
  Object.values(navLinks).forEach(a => { const active = a.dataset.nav === cur; a.classList.toggle('on', active); if (active) a.setAttribute('aria-current', 'location'); else a.removeAttribute('aria-current'); });
  const link = navLinks[cur], bounds = side.getBoundingClientRect(), rect = link?.getBoundingClientRect();
  if (rect && (rect.top < bounds.top || rect.bottom > bounds.bottom)) side.scrollTop += rect.top - bounds.top - 80;
}
window.addEventListener('scroll', () => { if (!spyPending) { spyPending = true; requestAnimationFrame(updateReadingPosition); } }, {passive:true});
window.addEventListener('resize', updateReadingPosition);
updateReadingPosition();
const evParam = new URLSearchParams(location.search).get('event');
if (evParam) ui.openEvent(evParam);
</script>
</body>
</html>
