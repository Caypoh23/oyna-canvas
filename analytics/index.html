<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OYNA — аналитика: события, воронки, метрики</title>
<style>
  :root {
    --bg: #eeeef1; --ink: #16181d; --muted: #5f646d; --line: #dcdde2; --card: #fff;
    --parent: #ff8a1f; --parent-bg: #fff4e8; --parent-ink: #a35200; --child: #19a3c4; --child-bg: #e6f7fb; --child-ink: #0d6a82;
    --store: #7b61ff; --store-bg: #f1edff; --store-ink: #5a3fd6; --sys: #8a8f99; --sys-bg: #f1f1f4;
    --top: 56px; --side: 248px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: calc(var(--top) + 14px); }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
  a { color: #2f6fde; }
  code, .mono { font: 14px/1.45 ui-monospace, "SF Mono", Menlo, monospace; background: #f1f1f4; border-radius: 6px; padding: 1px 6px; word-break: break-word; }
  #top { position: sticky; top: 0; z-index: 30; height: var(--top); background: #fff; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; padding: 0 14px; }
  .tabs { display: flex; gap: 2px; background: #f1f1f4; border-radius: 10px; padding: 3px; flex: none; }
  .tabs a { text-decoration: none; color: var(--ink); font-size: 13.5px; padding: 6px 11px; border-radius: 8px; white-space: nowrap; }
  .tabs a.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }
  .grow { flex: 1; min-width: 8px; }
  .btn { border: 1px solid var(--line); background: #fff; border-radius: 9px; height: 34px; min-width: 34px; padding: 0 11px; cursor: pointer;
    font: inherit; font-size: 13.5px; color: var(--ink); white-space: nowrap; flex: none; display: inline-flex; align-items: center; justify-content: center; text-decoration: none; }
  .btn:hover { background: #f4f4f6; }
  #menu { display: none; }
  #q { height: 34px; border: 1px solid var(--line); border-radius: 9px; padding: 0 11px; width: 300px; font: inherit; font-size: 14px; min-width: 0; }
  #wrap { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); }
  #side { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow: auto; background: #fff; border-right: 1px solid var(--line);
    padding: 10px 0 48px; overscroll-behavior: contain; }
  #side h2 { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 16px 6px; }
  #side a.nav { display: block; padding: 6px 16px; color: var(--ink); text-decoration: none; font-size: 14px; border-left: 3px solid transparent; line-height: 1.35; }
  #side a.nav:hover { background: #f4f4f6; }
  #side a.nav.on { background: #f1f1f4; border-left-color: #16181d; font-weight: 600; }
  #side .sbox { margin: 8px 12px 4px; padding: 11px 12px; border-radius: 12px; background: #f6f6f8; font-size: 13px; }
  #side .sbox b { display: block; margin-bottom: 6px; }
  #side .dl { display: flex; gap: 6px; margin: 8px 12px; }
  #side .dl .btn { flex: 1; }
  #hits { margin: 6px 12px 0; }
  #hits a { display: block; padding: 5px 6px; border-radius: 8px; text-decoration: none; color: var(--ink); font: 600 13px/1.3 ui-monospace, "SF Mono", Menlo, monospace; }
  #hits a:hover { background: #f1f1f4; }
  #hits a span { display: block; font: 400 12.5px -apple-system, system-ui, sans-serif; color: var(--muted); }
  main { padding: 26px clamp(14px, 3.2vw, 44px) 140px; min-width: 0; }
  .col { max-width: 1180px; margin: 0 auto; }
  section { background: #fff; border-radius: 24px; padding: 28px clamp(16px, 3vw, 36px) 30px; margin: 0 0 26px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
  .k { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .07em; text-transform: uppercase; }
  h1 { font-size: clamp(34px, 5vw, 52px); line-height: 1.08; margin: 6px 0 10px; letter-spacing: -.02em; }
  h2 { font-size: clamp(25px, 3vw, 32px); line-height: 1.15; margin: 4px 0 8px; letter-spacing: -.01em; }
  h3 { font-size: 20px; margin: 22px 0 10px; }
  .sub { color: #3b3f46; font-size: 17px; margin: 0 0 16px; max-width: 900px; }
  .lead { font-size: 18.5px; color: #2b2f36; max-width: 900px; margin: 0 0 18px; }
  .ver { font-size: 14px; color: var(--muted); }
  .grid { display: grid; gap: 16px; }
  .g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .box { background: #f7f7f9; border-radius: 18px; padding: 18px 20px; }
  .box h3 { margin: 0 0 8px; font-size: 19px; }
  .box p { margin: 0 0 8px; }
  .term { border-bottom: 1px dashed #9ea4ae; cursor: help; }
  /* Today strip */
  .today { background: #16181d; color: #fff; border-radius: 18px; padding: 18px 20px; margin: 4px 0 6px; }
  .today b.big { font-size: 20px; display: block; margin-bottom: 10px; }
  .sbar { display: flex; height: 16px; border-radius: 99px; overflow: hidden; background: #2b2e35; }
  .sbar i { display: block; height: 100%; }
  .sleg { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 14px; color: #d5d8de; }
  .sleg span b { color: #fff; }
  .sw-live, .sw-improved { background: #2fbf71; } .sw-improved { background: #7fd6a4; } .sw-fix { background: #ffb02e; }
  .sw-ready { background: #8a8f99; } .sw-new { background: #4a4f57; } .sw-server { background: #a07be8; }
  .today .note { font-size: 13.5px; color: #b8bcc4; margin-top: 10px; }
  .brief .box .ic { font-size: 22px; }
  .brief .box b.t { display: block; font-size: 17px; margin: 4px 0 4px; }
  .brief .box p { font-size: 15px; color: #2b2f36; }
  .brief .box.warn { background: #fff1db; }
  .roles { display: grid; gap: 8px; margin-top: 16px; }
  .roles div { font-size: 15px; } .roles b { display: inline-block; min-width: 130px; }
  .roles a { text-decoration: none; font-weight: 600; }
  /* Primer */
  .primer .ic { font-size: 30px; }
  .primer h3 { margin: 4px 0 6px; font-size: 21px; }
  .feed { margin-top: 12px; border: 1px solid #e3e3e8; border-radius: 12px; overflow: hidden; font-size: 14px; background: #fff; }
  .feed .row { display: grid; grid-template-columns: 112px 58px minmax(0, auto) 1fr; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid #efeff2; }
  .feed .row:first-child { border-top: 0; }
  .feed .tm { color: var(--muted); font-variant-numeric: tabular-nums; }
  .feed .who { font-weight: 650; }
  .feed .what { color: #4a4f57; }
  .sample { margin-top: 12px; background: #16181d; color: #e8eaf0; border-radius: 14px; padding: 14px 16px; }
  .sample .sn { font: 700 16px/1.2 ui-monospace, "SF Mono", Menlo, monospace; margin-bottom: 8px; color: #fff; }
  .sample .kv { font: 14px/1.7 ui-monospace, "SF Mono", Menlo, monospace; }
  .sample .kv code { background: none; color: #9ec5ff; padding: 0; }
  .sample .kv span { font: 13px -apple-system, system-ui, sans-serif; color: #9ea4ae; margin-left: 8px; }
  .bars .bar { margin: 8px 0; }
  .bars .bl { font-size: 14px; font-weight: 600; margin-bottom: 3px; }
  .bars .bt { display: flex; align-items: center; gap: 8px; }
  .bars .bt i { display: block; height: 22px; background: #2f6fde; border-radius: 6px; }
  .bars .drop { font-size: 13px; color: #b3261e; margin-top: 2px; }
  .ex { display: inline-block; font: 700 11px/1 -apple-system, system-ui, sans-serif; letter-spacing: .08em; background: #ffb02e; color: #2b1d00; border-radius: 5px; padding: 4px 7px; }
  .where div { margin: 10px 0; } .where b { display: block; font-size: 15px; } .where span { font-size: 14.5px; color: #4a4f57; }
  /* Glossary */
  .gl { background: #f7f7f9; border-radius: 14px; padding: 12px 14px; }
  .gl b { display: block; font-size: 16px; margin-bottom: 2px; }
  .gl span { font-size: 14.5px; color: #2b2f36; }
  .gl.more { display: none; } #glossary.all .gl.more { display: block; }
  /* Story */
  .story { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 22px 14px; }
  .sstep { position: relative; min-width: 0; }
  .sstep .tm { font-size: 14px; font-weight: 750; font-variant-numeric: tabular-nums; }
  .who { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 99px; margin: 4px 0; }
  .who.parent { background: var(--parent-bg); color: var(--parent-ink); } .who.child { background: var(--child-bg); color: var(--child-ink); }
  .who.store { background: var(--store-bg); color: var(--store-ink); } .who.system { background: var(--sys-bg); color: #4a4f57; }
  .sstep .txt { font-size: 14.5px; line-height: 1.35; font-weight: 600; min-height: 3.9em; overflow-wrap: break-word; hyphens: auto; }
  .step .lbl, .met .nm { overflow-wrap: break-word; }
  .shot { display: block; width: 100%; aspect-ratio: 360 / 780; border-radius: 14px; overflow: hidden; background: #e4e4e9; border: 0; padding: 0; cursor: zoom-in;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 6px 18px rgba(0,0,0,.09); margin: 8px 0 10px; }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .shot.ext { cursor: default; display: flex; align-items: center; justify-content: center; text-align: center; padding: 14px; font-size: 14px; font-weight: 650; color: #3b3f46;
    background: repeating-linear-gradient(-45deg, #f5f5f8, #f5f5f8 12px, #ececf1 12px, #ececf1 24px); box-shadow: none; }
  .sstep .phl { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .sstep .sp { font: 12.5px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: #3b3f46; margin-top: 4px; word-break: break-word; }
  .after { font-size: 16.5px; margin: 20px 0 0; color: #2b2f36; }
  /* Metrics */
  .nsm { background: #16181d; color: #fff; border-radius: 20px; padding: 22px 24px; }
  .nsm .k { color: #9ea4ae; }
  .nsm .v { font-size: clamp(24px, 3vw, 30px); font-weight: 800; margin-top: 4px; line-height: 1.2; }
  .nsm .d { font-size: 16px; color: #d5d8de; margin-top: 8px; }
  .nsm .d b { color: #fff; }
  .nsm .now { margin-top: 14px; background: #2b2e35; border-radius: 12px; padding: 10px 12px; font-size: 15px; }
  .nsm .rec { margin-top: 10px; font-size: 14.5px; color: #c9ccd2; }
  .nsm code { background: #2b2e35; color: #e8eaf0; }
  .defs { margin: 16px 0 6px; font-size: 15px; } .defs div { margin: 4px 0; }
  .pillars { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; margin-top: 16px; }
  .pillar h3 { margin: 0 0 2px; font-size: 18px; } .pillar small { display: block; color: var(--muted); font-size: 13.5px; margin-bottom: 8px; }
  .met { background: #f7f7f9; border-radius: 14px; padding: 12px 13px; margin: 0 0 10px; }
  .met .nm { font-weight: 700; font-size: 15px; line-height: 1.3; }
  .met .fm { font-size: 14px; color: #3b3f46; margin-top: 4px; }
  .met .src { margin-top: 8px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .met .src .chip { font-size: 11.5px; padding: 4px 7px; }
  .met .src .ext { font-size: 12.5px; color: var(--muted); }
  .met a.go { display: inline-block; margin-top: 6px; font-size: 13.5px; font-weight: 600; text-decoration: none; }
  /* Funnels */
  .howread { font-size: 16px; }
  .ready { border-radius: 14px; padding: 12px 14px; font-size: 15.5px; margin: 0 0 14px; }
  .ready.yes { background: #e3f6ea; } .ready.part { background: #fff1db; } .ready.no { background: #eeeef1; }
  .ready b { display: block; font-size: 16px; margin-bottom: 2px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 16px; }
  .pill { display: inline-block; font-size: 14px; font-weight: 600; padding: 5px 12px; border-radius: 99px; background: #f1f1f4; color: #3b3f46; }
  .steps { display: flex; align-items: stretch; overflow-x: auto; padding: 4px 2px 12px; scroll-snap-type: x proximity; }
  .step { flex: 1 1 0; min-width: 132px; max-width: 220px; background: #fff; border: 1px solid #e3e3e8; border-radius: 18px; padding: 10px 10px 12px;
    border-top: 6px solid var(--sys); scroll-snap-align: start; display: flex; flex-direction: column; }
  .step.parent { border-top-color: var(--parent); } .step.child { border-top-color: var(--child); } .step.store { border-top-color: var(--store); }
  .step .sh { display: flex; align-items: center; gap: 6px; }
  .step .no { display: inline-flex; width: 26px; height: 26px; border-radius: 50%; background: #16181d; color: #fff; font-weight: 750; font-size: 13.5px; align-items: center; justify-content: center; flex: none; }
  .step .lbl { font-size: 15px; font-weight: 700; line-height: 1.3; margin-top: 8px; min-height: 3.9em; }
  .step .inph { font-size: 12.5px; color: var(--muted); margin: 0 0 4px; }
  .step .chips { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
  .step .chips .or { font-size: 12px; color: var(--muted); }
  .step .whr { font-size: 13px; margin-top: 6px; }
  .step .hint { font-size: 13px; color: #4a4f57; margin-top: 4px; line-height: 1.35; }
  .step .chip, .sstep .chip { white-space: normal; overflow-wrap: anywhere; font-size: 12px; text-align: left; }
  .legend .chip { flex: none; }
  .conn { flex: 0 0 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #16181d; font-size: 22px; font-weight: 700; }
  .conn small { font-size: 10.5px; color: var(--muted); font-weight: 600; text-align: center; line-height: 1.15; margin-top: 2px; }
  .conn.other { color: #8a8f99; }
  .fnote { font-size: 15.5px; color: #2b2f36; margin: 6px 0 12px; }
  .iflow { background: #f1f5ff; border: 1px solid #cfdcff; border-radius: 14px; padding: 12px 15px; font-size: 15.5px; margin: 0 0 12px; }
  .iflow b { display: block; margin-bottom: 2px; }
  details.recipe { background: #f7f7f9; border-radius: 14px; padding: 12px 15px; font-size: 15px; }
  details.recipe summary { cursor: pointer; font-weight: 700; }
  details.recipe ol { margin: 10px 0 2px 20px; padding: 0; } details.recipe li { margin: 4px 0; }
  details.recipe .muted { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .legend { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); font-size: 15px; }
  .legend div { display: flex; gap: 10px; align-items: flex-start; }
  /* Docs */
  .doc { background: #f7f7f9; border-radius: 18px; padding: 18px 20px; font-size: 15.5px; overflow: hidden; }
  .doc.full { grid-column: 1 / -1; }
  .doc h3 { margin: 0 0 8px; } .doc h4 { font-size: 12.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .doc p { margin: 0 0 8px; } .doc ul, .doc ol { margin: 4px 0 8px 20px; padding: 0; } .doc li { margin: 4px 0; }
  .doc table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
  .doc th { text-align: left; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid #e3e3e8; }
  .doc td { padding: 7px 10px 7px 0; border-bottom: 1px solid #ececf0; vertical-align: top; }
  .doc pre { font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background: #16181d; color: #e8eaf0; border-radius: 12px; padding: 12px 14px; white-space: pre-wrap; word-break: break-all; }
  .tw { overflow-x: auto; }
  /* Data flow */
  .arch { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  .abox { background: #f7f7f9; border-radius: 16px; padding: 14px 16px; border-top: 6px solid #16181d; font-size: 15px; }
  .abox.parent { border-top-color: var(--parent); } .abox.child { border-top-color: var(--child); } .abox.store { border-top-color: var(--store); } .abox.server { border-top-color: #7444c4; }
  .abox .em { font-size: 24px; } .abox b { display: block; font-size: 17px; margin: 2px 0 4px; } .abox small { display: block; color: var(--muted); font-size: 13.5px; margin-top: 6px; }
  .flows { margin: 16px 0 0; display: grid; gap: 8px; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 15px; }
  .flow .ar { font-size: 15px; font-weight: 700; padding: 0 2px; }
  .flow.dashed .ar { color: #8a8f99; }
  .flow .lb { color: var(--muted); }
  .flow .tg { font-weight: 650; background: #f1f1f4; border-radius: 9px; padding: 3px 9px; }
  /* Dictionary + screens */
  .dom h3 { margin: 22px 0 4px; } .dom .dn { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
  .evrow { display: grid; grid-template-columns: 236px minmax(0, 1fr) 220px; gap: 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0;
    border-top: 1px solid #ececf0; padding: 10px 6px; font: inherit; color: inherit; cursor: pointer; border-radius: 10px; }
  .evrow:hover { background: #f6f6f8; }
  .evrow .nm { font: 650 14px/1.3 ui-monospace, "SF Mono", Menlo, monospace; word-break: break-all; }
  .evrow .ti { font-size: 15px; } .evrow .ti small { display: block; color: var(--muted); font-size: 13px; }
  .evrow.dim { opacity: .25; }
  .scrs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .stile { background: #f7f7f9; border-radius: 14px; padding: 10px; border: 0; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .stile:hover { background: #f0f0f3; }
  .stile .thumb { width: 100%; aspect-ratio: 360 / 560; border-radius: 10px; overflow: hidden; background: #e4e4e9; display: flex; align-items: center; justify-content: center;
    color: #8a8f99; font-size: 13px; text-align: center; }
  .stile .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .stile .nm { font: 650 13px/1.3 ui-monospace, "SF Mono", Menlo, monospace; margin-top: 8px; word-break: break-all; }
  .stile .ti { font-size: 13.5px; } .stile .how { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .stile.dim { opacity: .25; }
  /* Lightbox */
  #lbx { position: fixed; inset: 0; background: rgba(12,13,16,.95); z-index: 55; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 10px; color: #fff; padding: 10px; }
  #lbx.on { display: flex; }
  #lbx img { max-height: calc(100vh - 120px); max-width: 94vw; border-radius: 16px; }
  #lbx .bar { display: flex; gap: 10px; align-items: center; max-width: 94vw; }
  #lbx .bar b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #lbx .bar .btn { background: #26282e; color: #fff; border-color: #3a3d45; }
  #lbx a { color: #9ec5ff; font-size: 14px; }
  @media (max-width: 1180px) {
    .story { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
    .pillars { grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); }
    .g4, .arch { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 1000px) {
    #wrap { grid-template-columns: minmax(0, 1fr); }
    #menu { display: inline-flex; }
    #side { position: fixed; left: 0; top: var(--top); width: 86vw; max-width: 340px; z-index: 40; transform: translateX(-102%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.2); }
    body.side-open #side { transform: none; }
    #q { width: 220px; }
  }
  @media (max-width: 700px) {
    body { font-size: 15.5px; }
    #top { gap: 6px; padding: 0 8px; } #q { display: none; } .tabs a { padding: 6px 8px; font-size: 13px; }
    section { border-radius: 18px; padding: 20px 15px 22px; }
    .g2, .g3, .g4, .arch, .legend { grid-template-columns: minmax(0, 1fr); }
    .feed .row { grid-template-columns: 112px 1fr; } .feed .row .chip { grid-column: 1 / -1; justify-self: start; } .feed .row .what { grid-column: 1 / -1; }
    .roles b { display: block; }
    .steps { flex-direction: column; overflow: visible; }
    .step { max-width: none; display: grid; grid-template-columns: 92px minmax(0, 1fr); column-gap: 12px; border-top-width: 1px; border-left: 6px solid var(--sys); }
    .step.parent { border-left-color: var(--parent); } .step.child { border-left-color: var(--child); } .step.store { border-left-color: var(--store); }
    .step > * { grid-column: 2; } .step .shot { grid-column: 1; grid-row: 1 / span 6; margin: 0; }
    .step .lbl { min-height: 0; margin-top: 4px; }
    .conn { flex-direction: row; gap: 6px; padding: 2px 0; } .conn span { transform: rotate(90deg); }

  }
</style>

<script>
/* OYNA tracking plan UI — event chips, the status vocabulary and the side
 * panel that explains an event or a screen view. Shared by the screens
 * canvas (its «Аналитика» layer) and the analytics page. Reads the public
 * plan (scripts/analytics/tracking_plan.py --public) the builders inline. */
(function (global) {
  'use strict';

  const CSS = `
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 650 13px/1.2 ui-monospace, "SF Mono", Menlo, monospace; color: #fff;
    background: #16181d; border-radius: 9px; padding: 6px 9px; cursor: pointer; white-space: nowrap; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; border: 0; text-decoration: none; vertical-align: middle; }
  .chip:hover { background: #33363d; }
  .chip .si { font: 700 11px/1 -apple-system, system-ui, sans-serif; width: 17px; height: 17px; border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center; flex: none; font-style: normal; }
  .chip.st-live .si, .chip.st-improved .si { background: #2fbf71; color: #fff; }
  .chip.st-fix .si { background: #ffb02e; color: #3b2600; }
  .chip.st-ready .si { background: transparent; color: #fff; box-shadow: inset 0 0 0 1.5px #9ea4ae; }
  .chip.st-new .si { background: transparent; color: #c9ccd2; box-shadow: inset 0 0 0 1.5px #6b7078; }
  .chip.st-server .si { background: #a07be8; color: #fff; }
  .chip.scr { background: #fff; color: #3b3f46; box-shadow: inset 0 0 0 1px #c9cbd1; font-family: inherit; font-weight: 600; }
  .chip.scr:hover { background: #f4f4f6; }
  .stw { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .stw.st-live, .stw.st-improved { color: #1f7a45; } .stw.st-fix { color: #9a5800; } .stw.st-ready { color: #4a4f57; }
  .stw.st-new { color: #8a8f99; } .stw.st-server { color: #6a3fb8; }
  .pd-scrim { position: fixed; inset: 0; background: rgba(10,12,16,.32); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .15s; }
  .pd-scrim.on { opacity: 1; pointer-events: auto; }
  .pd { position: fixed; top: 0; right: 0; bottom: 0; width: min(500px, 100vw); background: #fff; z-index: 61;
    box-shadow: -10px 0 40px rgba(0,0,0,.18); transform: translateX(104%); transition: transform .18s ease-out;
    display: flex; flex-direction: column; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; color: #16181d; }
  .pd.on { transform: none; }
  .pd-h { display: flex; align-items: flex-start; gap: 10px; padding: 18px 20px 12px; border-bottom: 1px solid #ececf0; }
  .pd-h .x { margin-left: auto; border: 1px solid #d5d6db; background: #fff; border-radius: 9px; width: 36px; height: 36px; cursor: pointer; font-size: 15px; flex: none; }
  .pd-b { overflow: auto; padding: 14px 20px 48px; overscroll-behavior: contain; }
  .pd-name { font: 700 17px/1.2 ui-monospace, "SF Mono", Menlo, monospace; overflow-wrap: anywhere; color: #16181d; }
  .pd-big { font-size: 22px; font-weight: 750; line-height: 1.25; }
  .pd-nameline { margin-top: 6px; font-size: 13.5px; color: #5f646d; }
  .pd-now { margin: 12px 0 0; border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  .pd-now b { display: block; font-size: 15px; }
  .pd-now.st-live, .pd-now.st-improved { background: #e3f6ea; } .pd-now.st-fix { background: #fff1db; } .pd-now.st-ready { background: #eeeef1; }
  .pd-now.st-new { background: #f4f4f6; } .pd-now.st-server { background: #f2e9ff; }
  .pd-find { font-size: 13px; color: #5f646d; margin-top: 6px; }
  .pd-sample { background: #16181d; color: #e8eaf0; border-radius: 14px; padding: 12px 14px; }
  .pd-sample .h { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .pd-sample .h b { font: 700 15px/1.3 ui-monospace, "SF Mono", Menlo, monospace; color: #fff; }
  .pd-sample .h .ex { font: 700 10.5px/1 -apple-system, system-ui, sans-serif; letter-spacing: .08em; background: #ffb02e; color: #2b1d00; border-radius: 5px; padding: 3px 6px; }
  .pd-sample .h span { font-size: 12.5px; color: #9ea4ae; }
  .pd-sample table { margin-top: 8px; table-layout: fixed; width: 100%; border-collapse: collapse; font-size: 13px; }
  .pd-sample td { border-top: 1px solid #2c2f36; color: #e8eaf0; padding: 5px 6px 5px 0; vertical-align: top; word-break: break-all; }
  .pd-sample td:first-child { width: 52%; color: #9ec5ff; font: 12.5px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
  .pd-sample td:last-child { font: 12.5px/1.4 ui-monospace, "SF Mono", Menlo, monospace; }
  .pd-sample tr.common td { color: #8b919c; }
  .pd-sample .note { font-size: 12.5px; color: #9ea4ae; margin-top: 8px; }
  .pd-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .pd-pill { font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: #f1f1f4; color: #3b3f46; white-space: nowrap; }
  .pd-pill.parent { background: #fff0e0; color: #b25a00; } .pd-pill.child { background: #e0f4fa; color: #13708a; }
  .pd h4 { font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: #5f646d; margin: 20px 0 6px; }
  .pd p { margin: 0 0 6px; }
  .pd .fixbox { background: #fff6e8; border: 1px solid #ffd9a0; border-radius: 10px; padding: 9px 11px; }
  .pd .props { width: 100%; border-collapse: collapse; font-size: 14px; }
  .pd .props td { border-top: 1px solid #ececf0; padding: 7px 6px 7px 0; vertical-align: top; }
  .pd .props td:first-child { font: 600 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; padding-right: 10px; width: 40%; word-break: break-all; }
  .pd .props td .ty { color: #6b7078; font-size: 12.5px; font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .pd code { font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace; background: #f4f4f6; border-radius: 5px; padding: 1px 5px; word-break: break-all; }
  .pd .shots { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
  .pd .shot { flex: none; width: 92px; text-align: center; font-size: 11.5px; color: #3b3f46; text-decoration: none; }
  .pd .shot img { width: 92px; height: 170px; object-fit: cover; object-position: top; border-radius: 10px; display: block; background: #f1f1f4; margin-bottom: 4px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  .pd .shotcap { font-size: 12.5px; color: #5f646d; margin-top: 2px; }
  .pd .lnk { display: block; color: #2f6fde; text-decoration: none; margin: 4px 0; font-weight: 600; }
  .pd .lnk:hover { text-decoration: underline; }
  .pd .evs { display: flex; flex-wrap: wrap; gap: 6px; }
  .pd .muted { color: #6b7078; font-size: 13px; }
  .stlegend { display: grid; gap: 6px; font-size: 13.5px; }
  .stlegend div { display: flex; align-items: center; gap: 8px; }
  .stlegend .chip { flex: none; }
  `;

  const SIDE = { parent: 'родитель', child: 'ребёнок', both: 'родитель и ребёнок', system: 'присылает PostHog', store: 'магазин приложений' };
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  // An event or screen name that may wrap only between its words:
  // quest|Approved, parent_|child_|invite.
  const breakable = name => esc(name).replace(/([a-z])(?=[A-Z])|_/g, m => m + '<wbr>');
  const show = v => String(v);   // true / false as PostHog stores them
  // A sample value for a property from its documented values, when the plan
  // gives none: the first allowed value, a number, true, an id. Unknown —
  // no row rather than a made-up one.
  const guess = t => {
    t = String(t || '');
    if (t.includes('|')) return t.split('|')[0].trim();
    if (/true \/ false/.test(t)) return true;
    if (/числ|1–5/.test(t)) return 42;
    if (/uuid/.test(t)) return '8f2c41d0-…';
    return undefined;
  };

  function create(plan, opts) {
    opts = opts || {};
    const imgBase = opts.imgBase || 'img/';
    const canvasBase = opts.canvasBase || './';
    const analyticsBase = opts.analyticsBase || 'analytics/';
    const STATUS = plan.statuses || {};
    const evByName = {}, scrById = {};
    (plan.events || []).forEach(e => { evByName[e.name] = e; });
    (plan.screens || []).forEach(s => { scrById[s.id] = s; });
    const domains = {};
    (plan.domains || []).forEach(d => { domains[d.id] = d; });
    const funnelsOf = name => (plan.funnels || []).filter(f => f.steps.some(st => st.event === name || (st.alt || []).includes(name)));
    const screensOf = name => (plan.screens || []).filter(s => (s.events || []).includes(name));
    const st = name => STATUS[name] || { icon: '?', label: name, text: '' };
    // Who sends it, in words: RevenueCat's server events are no one's phone.
    const whoOf = e => e.status === 'server' ? 'присылает RevenueCat' : SIDE[e.side] || e.side;

    if (!document.getElementById('pd-style')) {
      const style = document.createElement('style'); style.id = 'pd-style'; style.textContent = CSS; document.head.appendChild(style);
    }
    const scrim = document.createElement('div'); scrim.className = 'pd-scrim';
    const pd = document.createElement('aside'); pd.className = 'pd'; pd.setAttribute('aria-hidden', 'true');
    pd.innerHTML = '<div class="pd-h"><div class="pd-hd"></div><button class="x" title="Закрыть (Esc)">✕</button></div><div class="pd-b"></div>';
    document.body.append(scrim, pd);
    const hd = pd.querySelector('.pd-hd'), body = pd.querySelector('.pd-b');
    const close = () => { pd.classList.remove('on'); scrim.classList.remove('on'); pd.setAttribute('aria-hidden', 'true'); };
    pd.querySelector('.x').onclick = close; scrim.onclick = close;
    // Capture: one Esc closes the panel and nothing behind it.
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape' && pd.classList.contains('on')) { e.stopImmediatePropagation(); e.preventDefault(); close(); }
    }, true);
    body.addEventListener('click', e => {
      const go = e.target.closest('[data-go]');
      if (go && opts.onGo) { e.preventDefault(); close(); opts.onGo(go.dataset.go); return; }
      const chip = e.target.closest('[data-ev],[data-scr]');
      if (chip) { e.preventDefault(); openFromChip(chip); }
    });

    function statusLabel(name) { const s = st(name); return `${s.icon} ${s.label}`; }
    // The status in words; [short] for tight spots (a funnel step, a story card).
    function statusWord(name, short) {
      const e = evByName[name];
      if (!e) return '';
      const s = st(e.status);
      return `<span class="stw st-${e.status}" title="${esc(s.label)}">${esc(s.icon)} ${esc(short && s.short ? s.short : s.label)}</span>`;
    }
    function chip(name) {
      const e = evByName[name];
      const status = e ? e.status : 'new';
      return `<span class="chip st-${status}" data-ev="${esc(name)}" role="button" tabindex="0" title="${esc((e ? e.title + ' — ' : '') + statusLabel(status))}"><i class="si">${esc(st(status).icon)}</i><span>${breakable(name)}</span></span>`;
    }
    function scrChip(id) {
      const s = scrById[id];
      const icon = s && s.sheet ? '▤' : s && s.untracked ? '○' : '👁';
      const what = s && s.sheet ? 'Лист поверх экрана — без просмотра' : s && s.untracked ? 'Не приходит (до согласия)' : 'Просмотр экрана: $screen';
      return `<span class="chip scr" data-scr="${esc(id)}" role="button" tabindex="0" title="${esc(what)}: ${esc(s ? s.title : id)}">${icon} <span>${breakable(id)}</span></span>`;
    }
    function chipsHtml(screens, events) {
      return (screens || []).map(scrChip).join('') + (events || []).map(chip).join('');
    }
    function legendHtml() {
      return `<div class="stlegend">${Object.entries(STATUS).map(([k, s]) =>
        `<div><span class="chip st-${k}" style="cursor:default"><i class="si">${esc(s.icon)}</i>event</span><span>${esc(s.label)}</span></div>`).join('')}</div>`;
    }
    function shots(keys) {
      return `<div class="shots">` + keys.slice(0, 8).map(k =>
        `<a class="shot" href="${canvasBase}?an=1#${esc(k.replace(/-(figma|app|motion|device)-\d+$/, ''))}" title="Открыть на холсте «Экраны»"><img loading="lazy" src="${imgBase}${esc(k)}_t.webp" alt=""></a>`).join('') +
        `</div><div class="shotcap">Клик по картинке — этот раздел на холсте «Экраны» ↗</div>`;
    }
    function present() { pd.classList.add('on'); scrim.classList.add('on'); pd.setAttribute('aria-hidden', 'false'); body.scrollTop = 0; }

    // One line as PostHog lists it, with example values: the event's own
    // properties, then (grey) the ones every event of the app carries.
    function sampleRow(e) {
      const ex = e.example || {}, rows = [];
      (e.props || []).forEach(p => String(p.n).split(/,\s*|\s+\/\s+/).forEach(n => {
        n = n.trim();
        if (!/^[$a-z_][a-z0-9_]*$/i.test(n) || rows.some(r => r[0] === n)) return;
        const v = n in ex ? ex[n] : guess(p.t);
        if (v !== undefined) rows.push([n, v]);
      }));
      Object.keys(ex).forEach(k => { if (!rows.some(r => r[0] === k)) rows.push([k, ex[k]]); });
      const own = new Set(rows.map(r => r[0]));
      let who, common = [];
      if (e.status === 'server') who = 'присылает сервер RevenueCat · покупатель — семья 71d0…';
      else if (e.side === 'system') {
        who = 'присылает сам PostHog · родитель 3fa9…';
        common = [['$app_version', '1.0.8']];
      } else {
        who = e.side === 'child' ? 'ребёнок child_8f2c…' : 'родитель 3fa9…';
        const where = (screensOf(e.name)[0] || {}).id || 'parent_home';
        common = [['$app_namespace', 'com.oynaplatform.app'], ['environment', 'prod'], ['role', e.side === 'child' ? 'child' : 'parent'],
          ['tier', 'free'], ['country', 'UZ'], ['language', 'ru'], ['coppa_strict', e.side === 'child'], ['$screen_name', where]];
      }
      common = common.filter(([k]) => !own.has(k));
      return `<div class="pd-sample"><div class="h"><span class="ex">ПРИМЕР</span><b>${esc(e.name)}</b><span>День 2, 18:34 · ${who}</span></div>
        <table>${rows.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(show(v))}</td></tr>`).join('')}
        ${common.map(([k, v]) => `<tr class="common"><td>${esc(k)}</td><td>${esc(show(v))}</td></tr>`).join('')}</table>
        <div class="note">Значения выдуманы. ${common.length ? 'Серые строки приходят с каждым событием сами: какое приложение и сборка, кто, тариф семьи, страна, язык и экран, на котором это случилось. ' : ''}Да и нет хранятся как true и false.</div></div>`;
    }

    function openEvent(name) {
      const e = evByName[name];
      if (!e) return;
      const s = st(e.status);
      const dom = domains[e.domain];
      hd.innerHTML = `<div class="pd-pills"><span class="pd-pill ${esc(e.side)}">${esc(whoOf(e))}</span>${dom ? `<span class="pd-pill">${esc(dom.title)}</span>` : ''}${e.prio ? `<span class="pd-pill" title="Очередь работ: P0 — нужно для главных воронок, P1 — следующий шаг, P2 — потом">${esc(e.prio)}</span>` : ''}</div>
        <div class="pd-big">${esc(e.title)}</div><div class="pd-nameline">имя события в PostHog: <span class="pd-name">${breakable(e.name)}</span></div>`;
      const find = e.name === '$screen' ? 'Activity → Live events → событие «$screen», свойство $screen_name — имя экрана.'
        : e.status === 'server' ? 'Activity → Live events → поиск «rc_» (если интеграция RevenueCat включена).'
        : `Activity → Live events → поиск «${esc(e.name)}».`;
      let h = `<div class="pd-now st-${esc(e.status)}"><b>Сейчас в PostHog: ${esc(s.icon)} ${esc(s.label)}</b>${esc(s.text)}</div>`;
      if (s.today !== false) h += `<div class="pd-find">Как найти: ${find}</div>`;
      h += `<h4>Когда отправляется</h4><p>${esc(e.when)}</p>`;
      h += `<h4>Как это выглядит в PostHog</h4>${sampleRow(e)}`;
      if (e.why) h += `<h4>Зачем</h4><p>${esc(e.why)}</p>`;
      if (e.fix) h += `<h4>${e.status === 'improved' ? 'Что исправлено' : e.status === 'fix' ? 'Недочёт — как читать' : 'Важно'}</h4><p class="fixbox">${esc(e.fix)}</p>`;
      if ((e.props || []).length) {
        h += `<h4>Свойства — подробности события</h4><table class="props">` + e.props.map(p =>
          `<tr><td>${esc(p.n)}</td><td><div>${esc(p.d)}</div>${p.t ? `<div class="ty">${esc(p.t)}</div>` : ''}</td></tr>`).join('') + `</table>`;
      }
      if (e.side !== 'system' && e.status !== 'server') h += `<p class="muted" style="margin-top:8px">Плюс общие свойства на каждом событии: приложение и сборка, роль, семья, тариф семьи, страна, язык, версия.</p>`;
      const scr = screensOf(name);
      if (scr.length) {
        h += `<h4>Где в приложении</h4><div class="evs">${scr.map(x => scrChip(x.id)).join('')}</div>`;
        const keys = [...new Set(scr.flatMap(x => x.cards || []))];
        if (keys.length) h += shots(keys);
      }
      const fs = funnelsOf(name);
      if (fs.length) h += `<h4>В воронках</h4>` + fs.map(f => `<a class="lnk" href="${analyticsBase}#${esc(f.id)}" data-go="${esc(f.id)}">${esc(f.title)} →</a>`).join('');
      if (e.note) h += `<h4>Заметка</h4><p>${esc(e.note)}</p>`;
      if (dom && dom.note) h += `<p class="muted">${esc(dom.note)}</p>`;
      if (e.code) h += `<h4>Для разработчиков</h4><p><code>${esc(e.code)}</code></p>`;
      body.innerHTML = h; present();
    }
    function openScreen(id) {
      const s = scrById[id];
      if (!s) return;
      hd.innerHTML = `<div class="pd-pills"><span class="pd-pill">${s.sheet ? 'лист поверх экрана' : s.untracked ? 'не приходит' : 'просмотр экрана'}</span><span class="pd-pill ${esc(s.side)}">${esc(SIDE[s.side] || 'все')}</span></div>
        <div class="pd-big">${esc(s.title)}</div><div class="pd-nameline">${s.sheet || s.untracked ? 'имя в плане' : 'имя экрана в PostHog ($screen_name)'}: <span class="pd-name">${esc(s.id)}</span></div>`;
      let h = s.sheet ? `<h4>Как приходит</h4><p>Это лист поверх другого экрана, а не отдельный экран: просмотра нет, его открытие видно по событиям ниже.</p>`
        : s.untracked ? `<h4>Как приходит</h4><p>Никак: экран показывается до согласия родителя, а до согласия приложение ничего не отправляет.</p>`
        : `<h4>Как приходит</h4><p>Событие <code>$screen</code> со свойством <code>$screen_name = ${esc(s.id)}</code> — отправляется само, когда экран открылся (маршрут <code>${esc(s.route || '')}</code>). ${statusWord('$screen')}</p>`;
      if (s.note) h += `<p>${esc(s.note)}</p>`;
      if ((s.events || []).length) h += `<h4>События на этом экране</h4><div class="evs">${s.events.map(chip).join('')}</div>`;
      if ((s.cards || []).length) h += `<h4>Как выглядит</h4>` + shots(s.cards);
      body.innerHTML = h; present();
    }
    function openFromChip(el) {
      if (el.dataset.ev) openEvent(el.dataset.ev); else if (el.dataset.scr) openScreen(el.dataset.scr);
    }
    return { chip, scrChip, chipsHtml, legendHtml, statusLabel, statusWord, whoOf, openEvent, openScreen, openFromChip, close,
      isOpen: () => pd.classList.contains('on'), evByName, scrById };
  }

  global.OynaPlanUi = { create };
})(window);

разбить по channel", "alt": [], "card": "p-family-device-02"}, {"label": "Ребёнок вошёл на своём телефоне", "event": "logIn", "who": "child", "where": "role = child", "hint": "можно разбить по method: код, ссылка, QR", "alt": [], "card": "c-onboarding-app-05"}], "breakdowns": ["способ входа ребёнка (method)", "страна", "платформа ($os)"], "note": "Часть семей живёт на одном телефоне: родитель открывает режим ребёнка (childModeOpened — ещё не сделано). Это не отвал. Неудачные входы — childCodeFailed по reason. Экран ввода кода (child_code) до входа ещё не знает семью — его смотрим отдельной воронкой по людям: $screen child_code → logIn (role = child).", "if_low": "Застревают между приглашением и входом — крупнее QR, кнопка «Отправить в Telegram / WhatsApp», напоминание родителю через сутки. Много childCodeFailed с wrong_code — код плохо читается или путают буквы.", "recipe": null, "color": "#19a3c4"}, {"id": "f-core", "title": "Ядро: задание → проверка → награда", "question": "Проходит ли семья весь цикл, ради которого существует продукт, и где он рвётся? Шаг 4 за неделю — это главная метрика.", "by": "family", "window": "7 дней", "steps": [{"label": "Родитель создал задание", "event": "questCreated", "who": "parent", "where": "", "hint": "можно разбить по source", "alt": [], "card": "p-tasks-app-03"}, {"label": "Ребёнок открыл задание", "event": "questOpened", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-tasks-app-01"}, {"label": "Ребёнок сделал и отправил", "event": "questSubmitted", "who": "child", "where": "", "hint": "можно разбить по had_photo", "alt": [], "card": "c-tasks-app-05"}, {"label": "Родитель одобрил — монеты начислены ★", "event": "questApproved", "who": "parent", "where": "", "hint": "★ главная метрика; медиана time_to_approve_minutes", "alt": [], "card": "p-review-app-01"}, {"label": "Ребёнок попросил награду", "event": "rewardRedeemed", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-market-app-01"}, {"label": "Родитель выдал награду", "event": "rewardApproved", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-requests-app-01"}], "breakdowns": ["источник задания (source)", "сложность (difficulty)", "страна"], "note": "Вместо шага 4 бывает возврат на доработку (questRejected) — смотрим долю и срок. Время проверки важнее конверсии: если родитель отвечает через сутки, ребёнок остывает.", "if_low": "Мало открытий (1→2) — видно ли задание на главной ребёнка. Мало отправок (2→3) — задания сложные или непонятно, что фотографировать: разбить по difficulty. Мало одобрений или долгое time_to_approve_minutes (3→4) — пуш родителю «Алина ждёт проверки». Мало запросов наград (4→5) — пустой магазин наград, см. воронку «Награды».", "recipe": null, "color": "#16181d"}, {"id": "f-child", "title": "Первая сессия ребёнка", "question": "Понимает ли ребёнок, что делать, в первый же день?", "by": "people", "window": "1 день", "steps": [{"label": "Вошёл на своём телефоне", "event": "logIn", "who": "child", "where": "role = child", "hint": "", "alt": [], "card": "c-onboarding-app-05"}, {"label": "Увидел главную", "event": "$screen", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-home-app-00", "screen": "child_home"}, {"label": "Открыл задание", "event": "questOpened", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-tasks-app-01"}, {"label": "Сфотографировал и отправил", "event": "questSubmitted", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-tasks-app-05"}], "breakdowns": ["способ входа (method)", "платформа ($os)"], "note": "Считает только детей со своим телефоном: в режиме ребёнка на телефоне родителя события logIn нет.", "if_low": "Видят главную, но не открывают задание — задание не бросается в глаза. Открывают, но не отправляют — камера, разрешения или задание непонятно.", "recipe": null, "color": "#19a3c4"}, {"id": "f-rewards", "title": "Награды: монеты превращаются в желание", "question": "Есть ли в магазине наград то, что ребёнок хочет, и отвечает ли родитель на запросы?", "by": "family", "window": "14 дней", "steps": [{"label": "Родитель создал награду", "event": "rewardCreated", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-rewards-app-02"}, {"label": "Ребёнок открыл магазин наград", "event": "$screen", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-market-app-00", "screen": "child_market"}, {"label": "Попросил награду (монеты отложены)", "event": "rewardRedeemed", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-market-app-04"}, {"label": "Родитель выдал", "event": "rewardApproved", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-requests-app-01"}], "breakdowns": ["своя или из каталога (is_custom)", "цена (price)", "страна"], "note": "Отказ — rewardDeclined, перенос — rewardPostponed (запрос остаётся, монеты отложены). Долгое ожидание ответа (wait_minutes) убивает мотивацию так же, как отказ.", "if_low": "Открывают магазин наград, но не просят — награды неинтересные или дорогие: разбить по price и is_custom. Просят, но родитель не выдаёт — пуш родителю о запросе, напоминание.", "recipe": null, "color": "#e0457b"}, {"id": "f-paywall", "title": "Подписка", "question": "Откуда люди приходят на экран подписки и сколько из них платят?", "by": "people", "window": "1 день", "steps": [{"label": "Открыл экран подписки", "event": "paywallViewed", "who": "parent", "where": "", "hint": "можно разбить по trigger", "alt": [], "card": "p-paywall-app-00"}, {"label": "Нажал «Оформить»", "event": "paywallCtaTapped", "who": "parent", "where": "", "hint": "можно разбить по plan_tier, period, method", "alt": [], "card": "p-paywall-app-01"}, {"label": "Оплатил", "event": "subscriptionStarted", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-paywall-app-02"}], "breakdowns": ["источник (trigger)", "тариф (plan_tier)", "период (period)", "способ оплаты (method)", "страна"], "note": "Неудачи — purchaseFailed по reason (отмена, сеть, магазин, Paylov). Деньги и продления — в RevenueCat (и в PostHog, если включена интеграция): пробный → платный, отток, выручка.", "if_low": "Открывают, но не нажимают — цена, тарифы или текст экрана: сравнить по trigger. Нажимают, но не платят — purchaseFailed по reason: cancelled — передумали на оплате, network и store — технические сбои, paylov_error — оплата картой.", "recipe": null, "color": "#7444c4"}, {"id": "f-foksik-parent", "title": "Фоксик AI для родителя → Premium + ИИ", "question": "Помогает ли ИИ-помощник родителю и продаёт ли он тариф с ИИ?", "by": "people", "window": "30 дней", "steps": [{"label": "Открыл Фоксика", "event": "$screen", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-assistant-app-00", "screen": "parent_assistant"}, {"label": "Спросил", "event": "copilotChatMessageSent", "who": "parent", "where": "", "hint": "", "alt": [], "card": "p-assistant-app-01"}, {"label": "Применил совет из итогов недели", "event": "copilotRecommendationApplied", "who": "parent", "where": "", "hint": "карточки в чате считаются своими событиями с source = foksik_card — см. ниже", "alt": [], "card": "p-assistant-app-03"}, {"label": "Упёрся в лимит", "event": "aiBuddyLimitReached", "who": "parent", "where": "who = parent", "hint": "", "alt": [], "card": "p-assistant-app-04"}, {"label": "Купил Premium + ИИ", "event": "subscriptionStarted", "who": "parent", "where": "plan_tier = premium_ai", "hint": "", "alt": [], "card": "p-paywall-app-04"}], "breakdowns": ["страна", "язык"], "note": "В именах событий Фоксик называется по-старому: copilot… у родителя, aiBuddyLimitReached — лимит. Чтобы считать и советы, и карточки, заведите в PostHog действие (Action) «Фоксик помог»: copilotRecommendationApplied или любое событие с source = foksik_card — и поставьте его шагом 3.", "if_low": "Открывают, но не спрашивают — пустой экран не подсказывает, что спросить. Спрашивают, но не применяют — советы не к месту. Упираются в лимит, но не покупают — экран подписки после лимита не объясняет пользу.", "recipe": null, "color": "#ff8a1f"}, {"id": "f-foksik-child", "title": "Ребёнок и Фоксик", "question": "Возвращается ли ребёнок к Фоксику?", "by": "people", "window": "7 дней", "steps": [{"label": "Открыл чат с Фоксиком", "event": "$screen", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-chat-app-00", "screen": "child_foksik"}, {"label": "Написал или сказал", "event": "jeyMessageSent", "who": "child", "where": "", "hint": "", "alt": [], "card": "c-chat-app-01"}], "breakdowns": ["язык", "платформа ($os)"], "note": "jey… — старое имя Фоксика. Шаг «сделал задание из чата» добавим, когда сдачи заданий из чата начнут отправляться.", "if_low": "Открывают, но не пишут — подсказки-кнопки в пустом чате.", "recipe": null, "color": "#19a3c4"}, {"id": "f-push", "title": "Возврат по пушу", "question": "Сколько людей возвращаются по уведомлению и делают то, ради чего оно пришло?", "by": "people", "window": "1 день", "steps": [{"label": "Пуш отправлен", "event": "push_sent", "who": "system", "where": "", "hint": "", "alt": [], "external": true, "extLabel": "Сервер записывает каждую отправку — число из журнала рассылок"}, {"label": "Открыл пуш", "event": "pushOpened", "who": "parent", "where": "", "hint": "можно разбить по type и campaign_id", "alt": [], "card": "p-feed-app-00"}, {"label": "Сделал то, ради чего пуш", "event": "questApproved", "who": "parent", "where": "", "hint": "действие зависит от вида пуша", "alt": ["rewardApproved", "questCreated"], "card": "p-review-app-01"}], "breakdowns": ["вид пуша (type)", "кампания", "роль"], "note": "Пока нельзя: нет события pushOpened. Число отправленных — из журнала рассылок на сервере, не из PostHog.", "if_low": "Мало открытий — текст и время отправки. Открывают, но не делают — пуш ведёт не на тот экран.", "recipe": null, "color": "#8a8f99"}], "brief": {"title": "Коротко, за 2 минуты", "points": [{"icon": "★", "title": "Главная метрика", "text": "Семьи, где за неделю родитель одобрил хотя бы одно задание ребёнка (событие questApproved). Растёт — продукт работает.", "go": "metrics"}, {"icon": "⏳", "title": "Сейчас она не считается", "status_of": "questApproved", "text": "Событие questApproved сделано в коде и появится со следующей сборкой. До неё график главной метрики — 0.", "go": "metrics"}, {"icon": "👁", "title": "Что видно в PostHog уже сегодня", "counts": true, "text": "Установки и открытия, регистрация и вход родителя, экран подписки, Фоксик у родителя, серии дней. Задания, награды, покупки и просмотры экранов — со следующей сборкой.", "go": "events"}, {"icon": "✋", "title": "Что нужно от владельцев", "text": "Включить группы (семьи) в PostHog, решить с Mixpanel, включить интеграцию RevenueCat → PostHog, завести ссылки кампаний в App Store, решить про вопрос «Откуда вы узнали».", "go": "status"}], "roles": [{"who": "Руководителю", "path": [["Коротко", "top-hero"], ["Главная метрика", "metrics"], ["Что нужно от владельцев", "status"]]}, {"who": "Маркетологу", "path": [["Азбука", "start-here"], ["Воронка «Магазин»", "f-store"], ["Ссылки и UTM", "marketing"]]}, {"who": "Аналитику", "path": [["Правила отбора", "rules"], ["Рецепты в воронках", "f-core"], ["Все события", "events"]]}]}, "architecture": {"title": "Откуда берутся данные", "sub": "Приложение отправляет события в PostHog; деньги — из RevenueCat; установки и источники — из магазинов приложений. Родитель и ребёнок — разные люди, но одна семья: воронки «по семьям» склеивают их действия.", "boxes": [{"id": "ads", "kind": "store", "icon": "📣", "title": "Реклама, блогеры, сайт", "text": "Ссылки с метками кампаний (UTM, ct=).", "small": "Instagram, TikTok, Telegram, Google, блогеры, школы"}, {"id": "stores", "kind": "store", "icon": "🏪", "title": "App Store и Google Play", "text": "Показы, просмотры страницы, установки — по источникам и кампаниям.", "small": "App Store Connect · Play Console"}, {"id": "parent", "kind": "parent", "icon": "👩", "title": "Телефон родителя", "text": "События родителя и режима ребёнка на этом же телефоне.", "small": "в PostHog — номер аккаунта родителя"}, {"id": "child", "kind": "child", "icon": "🧒", "title": "Телефон ребёнка", "text": "События ребёнка: только обезличенный номер, без имени и текстов.", "small": "в PostHog — child_<номер>"}, {"id": "ph", "kind": "tool", "icon": "📊", "title": "PostHog", "text": "Все события, люди и семьи. Воронки, удержание, пути, когорты.", "small": "один проект на все сборки — см. «Только настоящие пользователи»"}, {"id": "rc", "kind": "server", "icon": "💳", "title": "RevenueCat", "text": "Покупки, пробный период, продления, отмены, выручка.", "small": "в PostHog — только если включена интеграция (не проверено)"}, {"id": "meta", "kind": "store", "icon": "🎯", "title": "Meta Ads (только родитель)", "text": "Только «приложение активировано» — для рекламы в Facebook и Instagram.", "small": "после согласия и входа родителя; у ребёнка выключено. Покупки в Meta сейчас не передаются"}, {"id": "db", "kind": "server", "icon": "🗄", "title": "Supabase (база)", "text": "Правда о заданиях, монетах и семьях.", "small": "к PostHog не подключена; можно подключить как склад данных"}], "flows": [{"a": "ads", "b": "stores", "label": "переходы по ссылкам", "solid": true}, {"a": "stores", "b": "parent", "label": "установки", "solid": true}, {"a": "stores", "b": "child", "label": "установки", "solid": true}, {"a": "parent", "b": "ph", "label": "события", "solid": true}, {"a": "child", "b": "ph", "label": "события", "solid": true}, {"a": "parent", "b": "meta", "label": "активация (боевая сборка)", "solid": true}, {"a": "rc", "b": "ph", "label": "покупки — если включено", "solid": false}, {"a": "db", "b": "ph", "label": "склад данных — не подключено", "solid": false}], "identityHtml": "<h3>Кто есть кто в PostHog</h3>\n<table><tr><th>Кто</th><th>Номер в PostHog</th><th>Что ещё знаем</th></tr>\n<tr><td>Родитель</td><td><code>номер аккаунта</code></td><td>role = parent, страна, язык, тариф семьи (tier), семья</td></tr>\n<tr><td>Ребёнок на своём телефоне</td><td><code>child_&lt;номер&gt;</code></td><td>role = child, семья. Никаких имён, дат рождения, фото и текстов</td></tr>\n<tr><td>Ребёнок на телефоне родителя</td><td>номер родителя</td><td>role = child и active_child_id — пока открыт режим ребёнка</td></tr>\n<tr><td>Семья</td><td>группа <code>family</code> = номер семьи</td><td>тариф, страна, число детей. Воронки «по семьям» считают шаги родителя и ребёнка вместе</td></tr>\n<tr><td>Покупки из RevenueCat</td><td>номер семьи</td><td>отдельный «человек», не родитель (пока приложение не передаёт RevenueCat номер PostHog)</td></tr></table>\n<p style=\"margin-top:12px\"><b>До согласия родителя приложение не отправляет ничего.</b> Поэтому заставка и выбор языка в аналитике не видны:\nпервое наше событие — <code>coppaConsentGiven</code> (перед ним только служебное Application Installed от PostHog).</p>\n<p>На каждом нашем событии: <code>coppa_strict</code> (детский режим приватности), <code>$app_namespace</code> (какое приложение), версия\nи — со следующей сборки — <code>environment</code> (какая сборка). После входа к ним добавляются роль, семья, тариф, страна и язык;\nдо входа (согласие, регистрация, ввод кода ребёнком) их ещё нет — поэтому события, которые называют семью, несут её сами (<code>family_id</code>).</p>"}, "metrics": {"title": "Главная метрика и дерево метрик", "sub": "Одна цифра, по которой понятно, жив ли продукт, и пять групп метрик, которые её двигают. Под каждой — события, из которых она считается.", "northStar": {"name": "Семьи с закрытым циклом за неделю", "event": "questApproved", "text": "Сколько семей за последние 7 дней прошли цикл: ребёнок сделал задание → родитель одобрил. Считается как уникальные семьи (группа <b>family</b>) с событием <b>questApproved</b> за неделю. Растёт — продукт работает: родители ставят задания, дети их делают, монеты что-то значат.", "recipe": "PostHog → New insight → <b>Trends</b> → событие <code>questApproved</code> → считать «Unique family» (группы) → интервал «Week». Если группы не включены: SQL (HogQL) — <code>count(distinct properties.family_id)</code> по questApproved за неделю."}, "definitions": [["Активная семья за неделю", "за 7 дней было хотя бы одно questCreated или questSubmitted."], ["Активный ребёнок", "за 7 дней открыл приложение на своём телефоне (Application Opened у child_…) или отправил задание."]], "pillars": [{"title": "Привлечение", "sub": "сколько и откуда приходят", "items": [{"name": "Установки по источникам", "formula": "Загрузки в App Store и Google Play по кампаниям (ct=, utm_*).", "events": [], "ext": "магазины приложений", "go": "marketing"}, {"name": "Конверсия страницы в магазине", "formula": "Установки ÷ просмотры страницы. Рычаги — иконка, скриншоты, отзывы.", "events": [], "ext": "магазины приложений", "go": "f-store"}, {"name": "Новые семьи", "formula": "Уникальные семьи с <b>onboardingCompleted</b> за период.", "events": ["onboardingCompleted"]}, {"name": "Цена семьи", "formula": "Расход на канал (из кабинетов рекламы — в PostHog его нет) ÷ новые семьи из этого канала.", "events": ["onboardingCompleted"], "ext": "кабинеты рекламы"}]}, {"title": "Активация", "sub": "дошли ли до пользы", "items": [{"name": "Семья создана в первый день", "formula": "Воронка «Родитель»: согласие → главная за 1 день.", "events": ["coppaConsentGiven", "$screen"], "go": "f-parent"}, {"name": "Ребёнок подключён за 7 дней", "formula": "Воронка «Подключение ребёнка»: добавлен → вошёл со своего телефона.", "events": ["childAdded", "logIn"], "go": "f-connect"}, {"name": "«Ага-момент»: первое одобрение", "formula": "Доля новых семей с первым <b>questApproved</b> за 7 дней.", "events": ["questApproved"], "go": "f-core"}]}, {"title": "Вовлечённость", "sub": "как часто и глубоко", "items": [{"name": "Задания на семью в неделю", "formula": "questCreated ÷ активные семьи.", "events": ["questCreated"]}, {"name": "Отправки на ребёнка в неделю", "formula": "questSubmitted ÷ активные дети.", "events": ["questSubmitted"]}, {"name": "Время проверки", "formula": "Медиана time_to_approve_minutes — по одобрениям с экрана проверки (у карточек Фоксика времени нет).", "events": ["questApproved"]}, {"name": "Доля возвратов", "formula": "questRejected ÷ (questApproved + questRejected).", "events": ["questRejected", "questApproved"]}, {"name": "Награды на семью", "formula": "rewardApproved ÷ активные семьи.", "events": ["rewardApproved"], "go": "f-rewards"}]}, {"title": "Монетизация", "sub": "кто и за что платит", "items": [{"name": "Конверсия подписки", "formula": "subscriptionStarted ÷ paywallViewed — по trigger, стране, тарифу (plan_tier).", "events": ["paywallViewed", "subscriptionStarted"], "go": "f-paywall"}, {"name": "Платящие семьи", "formula": "Семьи с оплаченной подпиской — по RevenueCat. Свойство tier в PostHog для этого не годится: у оплативших картой Paylov оно пока free.", "events": ["subscriptionStarted", "rc_initial_purchase_event"]}, {"name": "Пробный → платный, выручка, отток", "formula": "Из RevenueCat (кабинет или интеграция с PostHog).", "events": ["rc_initial_purchase_event"]}]}, {"title": "Удержание", "sub": "возвращаются ли", "items": [{"name": "Родитель D1 / D7 / D30", "formula": "Возврат — Application Opened; строже — с действием: questCreated или questApproved.", "events": ["Application Opened", "questApproved"], "go": "retention"}, {"name": "Ребёнок вернулся через 1 и 4 недели", "formula": "Отправил задание через 1 и через 4 недели после первого входа.", "events": ["questSubmitted"], "go": "retention"}, {"name": "Удержание семьи", "formula": "Семьи с questApproved на неделе N и через k недель (по группе family).", "events": ["questApproved"], "go": "retention"}, {"name": "Серии и возвраты", "formula": "streakMilestone; возвраты после 48 ч (паутинка).", "events": ["streakMilestone", "childReturnedAfterBreak"]}]}]}, "docsBefore": [{"id": "retention", "kicker": "Удержание", "title": "Удержание и когорты", "sub": "Не воронка, а «возвращаются ли». В PostHog — тип графика Retention.", "cols": 3, "cards": [{"html": "<h3>Родитель</h3><p><b>Старт:</b> <code>onboardingCompleted</code>. <b>Возврат:</b> <code>Application Opened</code>.</p><p><b>D1, D7, D30</b> — доля вернувшихся через 1, 7 и 30 дней. Строже — возврат с действием: <code>questCreated</code> или <code>questApproved</code>.</p><p><b>Как построить:</b> New insight → Retention → стартовое событие onboardingCompleted → возврат Application Opened → по дням.</p><p>Разбить по: страна, способ входа, тариф.</p>"}, {"html": "<h3>Ребёнок</h3><p><b>Старт:</b> <code>logIn</code> с <code>role = child</code>. <b>Возврат:</b> <code>questSubmitted</code>.</p><p><b>По неделям:</b> 1, 2, 4, 8.</p><p>Возвраты после перерыва 48 ч и дольше — <code>childReturnedAfterBreak</code> (ещё не сделано).</p>"}, {"html": "<h3>Семья (главное)</h3><p><b>Старт и возврат:</b> <code>questApproved</code>, считаем по группе <b>family</b>.</p><p>Это удержание главной метрики: какая доля семей, закрывших цикл на первой неделе, закрывает его и на 4-й.</p><p>Платящие и бесплатные — отдельными когортами.</p>"}]}], "docsAfter": [{"id": "status", "kicker": "Статус", "title": "Что сделано и что нужно от владельцев", "sub": "Аудит кода 2 октября 2026 и доработка в ветке analytics-tracking-plan.", "cols": 2, "cards": [{"html": "<h3>Сделано в коде — появится со следующей сборкой</h3><p>Ветка <code>analytics-tracking-plan</code>:</p><ul><li>Просмотры всех экранов (<code>$screen</code>) и метка сборки <code>environment</code> на каждом событии.</li><li>Согласие родителя — первое наше событие.</li><li>Задания: создано, открыто, одобрено, возвращено — и карточками Фоксика.</li><li>Награды: создана, попросили (в магазине и в чате), выдана, отказ, перенос.</li><li>Подписка: настоящий источник, способ оплаты, покупка, неудачная покупка, тариф в <code>plan_tier</code>.</li><li>Неудачный вход ребёнка по коду; лимит Фоксика у родителя.</li><li>Регистрация и вход ребёнка — в воронках по семьям.</li><li>Тесты на каждое событие; план в репозитории: docs/analytics/TRACKING_PLAN.md.</li></ul>"}, {"html": "<h3>Нужно от владельцев</h3><ul><li><b>PostHog — группы:</b> включить Group analytics (группа family; может быть платной). Без неё воронки «по семьям» не построить; запасной путь — SQL по <code>family_id</code>.</li><li><b>PostHog — фильтр тестовых:</b> один раз настроить «Filter out internal and test users» (см. «Правила»).</li><li><b>PostHog — дашборды:</b> собрать по разделу «Дашборды».</li><li><b>PostHog — доступ:</b> пригласить маркетологов (роль только для чтения).</li><li><b>Mixpanel:</b> отказаться (рекомендация — всё есть в PostHog) или дать токен.</li><li><b>RevenueCat:</b> включить интеграцию с PostHog; интеграция с Meta не настроена.</li><li><b>App Store Connect:</b> завести ссылки кампаний (provider token).</li><li><b>Рассылки:</b> добавить <code>?source=push</code> в ссылки пушей, которые открывают подписку, — тогда trigger = push.</li><li><b>Продукт:</b> решить про вопрос «Откуда вы узнали».</li><li><b>Разрешить доработку обработки пушей</b> — без неё не будет события <code>pushOpened</code>.</li></ul>"}, {"html": "<h3>Дальше</h3><ul><li><b>После соседней работы над Фоксиком и приглашениями:</b> отправка приглашения, вход ребёнка по ссылке и QR, лимит Фоксика у ребёнка, источник подписки из Фоксика, сдача задания из чата.</li><li><b>P1:</b> пуши, PIN, режим ребёнка, лимит детей, выход и удаление аккаунта, оценка, бонусы, голос у Фоксика, событие «Регистрация завершена» для Meta, номер PostHog в RevenueCat.</li><li><b>P1:</b> тариф семьи в PostHog для оплативших картой Paylov (сейчас free), удаление человека из PostHog при удалении аккаунта.</li><li><b>P2:</b> ссылки с UTM, Install Referrer, уровень с сервера, возвраты после перерыва, валюта у subscriptionStarted, свойство возраста (малыш / подросток) для разрезов, мелкие поправки старых событий.</li></ul>"}]}, {"id": "rules", "kicker": "Правила", "title": "Как отбирать данные, приватность и названия", "sub": "Чтобы цифры не врали и данные были законными.", "cols": 3, "cards": [{"html": "<h3>Только настоящие пользователи</h3><p>Тестовые сборки пишут в тот же проект PostHog. <b>Сегодня</b> настоящих пользователей отделяет <code>$app_namespace = com.oynaplatform.app</code> — так называется магазинное приложение (у OYNA Dev — <code>com.oynaplatform.app.dev</code>). <b>Со следующей сборки</b> на событиях будет ещё <code>environment</code>: <code>prod</code> — магазинная сборка, <code>qa</code>, <code>debug</code>, <code>dev</code> — тестовые; тогда добавьте <code>environment = prod</code>. Удобнее всего настроить один раз: Settings → Project → <b>Filter out internal and test users</b> → условие <code>$app_namespace = com.oynaplatform.app</code>, и в каждом графике ставить эту галочку. Первые Application Installed / Opened приходят без <code>environment</code> — для них хватает <code>$app_namespace</code>.</p>"}, {"html": "<h3>Детские данные (COPPA)</h3><ul>\n<li>COPPA — закон США о данных детей. До согласия родителя в аналитику (PostHog, Mixpanel, Meta) не уходит ничего. Службы, без которых приложение не работает, — покупки (RevenueCat), пуши и настройки (Firebase) — запускаются сразу.</li><li>Ребёнок — только <code>child_&lt;номер&gt;</code>; ни имени, ни даты рождения, ни фото.</li>\n<li>Никакого свободного текста: названия заданий и наград, сообщения, комментарии — только признаки (<code>is_custom</code>, <code>has_reason</code>, длина).</li>\n<li>Рекламных SDK у ребёнка нет. У родителя в боевой сборке — только Meta App Events («приложение активировано»): на Android — с рекламным номером устройства, на iPhone — если родитель разрешил отслеживание.</li>\n<li><code>coppa_strict</code> на каждом событии: true — строгий детский режим, false — взрослый (родитель).</li>\n<li>Удалил аккаунт — человека нужно удалить и в PostHog. Сейчас этого нет — задача.</li></ul>"}, {"html": "<h3>Как называем</h3><ul>\n<li>Событие — <b>объект + действие в прошедшем</b>, camelCase: <code>questCreated</code>, <code>rewardApproved</code>.</li>\n<li>Свойства — snake_case: <code>time_to_approve_minutes</code>. Да/нет хранится как <code>true</code>/<code>false</code>.</li>\n<li>Экраны — <code>роль_экран</code>: <code>parent_home</code>, <code>child_market</code>.</li>\n<li>Старые имена не трогаем — на них отчёты: <code>parent_profile_*</code>, <code>jey*</code> и <code>copilot*</code> = Фоксик.</li>\n<li>Один факт — одно событие, после ответа сервера, а не по нажатию. Действия карточками Фоксика — тем же событием с <code>source = foksik_card</code>.</li>\n<li>Тариф, который выбирают или покупают, — <code>plan_tier</code>: на iPhone событие с <code>tier</code> получает тариф семьи вместо выбранного.</li></ul>"}, {"html": "<h3>Как проверить событие</h3><ol style=\"margin:4px 0 8px 20px;padding:0\">\n<li>Сборка OYNA Dev → сделать действие.</li><li>PostHog → Activity → Live events, фильтр <code>$app_namespace = com.oynaplatform.app.dev</code>.</li>\n<li>Сверить имя и свойства с этой страницей (клик по событию).</li><li>В отчётах — «Только настоящие пользователи».</li></ol>"}]}, {"id": "dashboards", "kicker": "PostHog", "title": "Дашборды", "sub": "Что собрать в PostHog — это план, в PostHog их ещё нужно создать. Каждый пункт — один график (insight). Везде — «Только настоящие пользователи» (см. «Правила»).", "cols": 3, "cards": [{"html": "<h3>1. Привлечение и активация</h3><ul><li>Новые семьи по дням (onboardingCompleted, по семьям)</li><li>Воронка «Магазин → согласие» — вместе с отчётами магазинов</li><li>Воронка «Родитель»: по способу входа и стране</li><li>Воронка «Подключение ребёнка»</li><li>Таблица UTM: источник → семьи → оплаты</li></ul>"}, {"html": "<h3>2. Ядро продукта</h3><ul><li><b>Главная метрика:</b> уникальные семьи с questApproved по неделям</li><li>Воронка «Ядро» по семьям</li><li>Медиана времени проверки</li><li>Доля возвратов на доработку</li><li>Задания по источнику: вручную, из готовых, ИИ, Фоксик</li></ul>"}, {"html": "<h3>3. Награды и монеты</h3><ul><li>Воронка «Награды»</li><li>Запросы, выдачи, отказы и переносы по неделям</li><li>Ожидание ответа родителя (wait_minutes)</li><li>Свои награды против каталога</li></ul>"}, {"html": "<h3>4. Деньги</h3><ul><li>Воронка «Подписка» по trigger</li><li>Открытия экрана подписки по источникам</li><li>Неудачные покупки по причинам</li><li>Оплата через App Store / Google Play против Paylov (Узбекистан)</li><li>Выручка, пробный → платный, отток — RevenueCat</li></ul>"}, {"html": "<h3>5. Удержание</h3><ul><li>Родитель D1 / D7 / D30</li><li>Ребёнок по неделям</li><li>Удержание семьи по questApproved</li><li>Дней в неделю с открытием (stickiness)</li></ul>"}, {"html": "<h3>6. Фоксик AI</h3><ul><li>Родители: вопросы, применённые советы, лимиты</li><li>Воронка «Фоксик → Premium + ИИ»</li><li>Дети: открытия чата, сообщения</li><li>Отказы «не по теме»</li></ul>"}, {"html": "<h3>7. Качество</h3><ul><li>Неудачные входы ребёнка по причинам (childCodeFailed)</li><li>Ошибки оплаты (purchaseFailed)</li><li>Экраны, где чаще всего закрывают приложение (пути, Paths)</li></ul>"}]}, {"id": "marketing", "kicker": "Маркетинг", "title": "Ссылки, UTM и что можно измерить", "sub": "Как размечать кампании, где смотреть установки и что в детском приложении измерить нельзя.", "cols": 2, "cards": [{"full": true, "html": "<h3>Что где смотреть</h3><table>\n<tr><th>Вопрос</th><th>Где ответ</th><th>Как</th></tr>\n<tr><td>Сколько установок и откуда</td><td>App Store Connect, Google Play Console</td><td>Источники и кампании по ссылкам с ct= и utm_*</td></tr>\n<tr><td>Что люди делают в приложении</td><td>PostHog</td><td>События, воронки этой страницы, удержание</td></tr>\n<tr><td>Сколько заплатили и продлили</td><td>RevenueCat (и PostHog, если включена интеграция)</td><td>Выручка, пробный → платный, отток</td></tr>\n<tr><td>Сколько стоила установка или семья</td><td>Кабинеты рекламы + магазины + PostHog</td><td>Расход ÷ установки (магазин) ÷ новые семьи (PostHog)</td></tr>\n<tr><td>Работают ли пуши</td><td>PostHog</td><td>Открытия пушей ÷ отправленные — когда появится pushOpened</td></tr></table>"}, {"html": "<h3>Ссылки для кампаний</h3>\n<h4>App Store</h4><pre>https://apps.apple.com/app/apple-store/id6762140001?pt=&lt;provider-token&gt;&amp;ct=202610_uz_instagram_launch&amp;mt=8</pre>\n<p><code>pt</code> выдаёт App Store Connect (App Analytics → Campaigns). Установки по <code>ct</code> видны там же.</p>\n<h4>Google Play</h4><pre>https://play.google.com/store/apps/details?id=com.oynaplatform.app&amp;referrer=utm_source%3Dinstagram%26utm_medium%3Dpaid_social%26utm_campaign%3D202610_uz_launch</pre>\n<p>Play Console показывает установки по кампаниям. Приложение может прочитать эти метки при первом запуске (Install Referrer) и записать родителю — следующий шаг.</p>\n<h4>Сайт</h4><pre>https://oynaplatform.com/?utm_source=telegram&amp;utm_medium=post&amp;utm_campaign=202610_kz_school</pre>\n<p>Кнопки магазинов на сайте должны передавать метки дальше — в <code>ct</code> и <code>referrer</code>.</p>"}, {"html": "<h3>Правила UTM</h3><table>\n<tr><th>Метка</th><th>Значения</th></tr>\n<tr><td><code>utm_source</code></td><td>instagram, tiktok, telegram, facebook, google, youtube, blogger_&lt;имя&gt;, school_&lt;имя&gt;, partner_&lt;имя&gt;</td></tr>\n<tr><td><code>utm_medium</code></td><td>paid_social, organic_social, influencer, cpc, referral, email, push, offline</td></tr>\n<tr><td><code>utm_campaign</code></td><td><code>ГГГГММ_страна_цель</code>: 202610_uz_launch, 202611_kz_school</td></tr>\n<tr><td><code>utm_content</code></td><td>креатив: video_fox_15s, static_market_v2</td></tr></table>\n<p>Только латиница в нижнем регистре и подчёркивания. Без пробелов и кириллицы — иначе одна кампания распадается на несколько строк.</p>"}, {"html": "<h3>Реклама и атрибуция</h3>\n<ul><li><b>Meta (Facebook, Instagram)</b> — в боевой сборке есть Meta App Events, но <b>только у родителя</b>: после согласия и входа родителя. На iPhone приложение спрашивает разрешение на отслеживание; если его не дали, «приложение активировано» всё равно уходит, но без рекламного номера. На Android рекламный номер уходит всегда. В режиме ребёнка и на телефоне ребёнка выключено.</li>\n<li><b>Покупки в Meta сейчас не передаются:</b> интеграция RevenueCat → Meta не настроена.</li>\n<li><b>Следующий шаг для Meta:</b> событие «Регистрация завершена» (семья создана) — чтобы реклама училась на семьях, а не на установках. Только родитель, без данных ребёнка.</li>\n<li><b>Остальные каналы</b> (TikTok, Google, блогеры, Telegram) — ссылки кампаний магазинов, UTM на сайте и Install Referrer Google Play. Других рекламных SDK нет и не ставим: в приложении есть детский режим (правила Apple Kids и Google Families).</li>\n<li><b>Ничего о ребёнке</b> в рекламные системы не уходит; ретаргетинг по действиям ребёнка — нельзя.</li>\n<li><b>Предложение продукту:</b> вопрос «Откуда вы узнали про OYNA?» в конце регистрации — сарафан и Telegram ссылками не измерить.</li></ul>"}, {"html": "<h3>Пуши и ссылки в приложение</h3>\n<ul><li><b>Пуши-рассылки</b> уже несут <code>campaign_id</code> и <code>push_id</code> — нужно событие <code>pushOpened</code> (план, P1), тогда открытия и возвраты по кампании будут в PostHog.</li>\n<li><b>Ссылки в приложение:</b> сейчас открывают приложение <code>oyna://…</code> и приглашения ребёнка. Другие https-ссылки на oynaplatform.com приложение пока не открывают — для кампаний «вернись в приложение» их нужно добавить.</li>\n<li>Метки <code>utm_*</code> в ссылке в приложение — свойства <code>deepLinkOpened</code> (план, P2).</li></ul>"}]}], "primer": {"title": "Азбука: три слова и где их смотреть", "sub": "Прочитайте это первым. Дальше на странице — те же вещи на настоящих экранах OYNA.", "cards": [{"icon": "📍", "title": "Событие", "text": "Запись о том, что случилось в приложении. Мама нажала «Одобрить» — в PostHog появилась одна строчка. Все строчки по порядку — это лента событий.", "feed": [["День 1, 10:02", "Мама", "coppaConsentGiven", "дала согласие"], ["День 1,
